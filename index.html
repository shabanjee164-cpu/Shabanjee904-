<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🏥 Smart Manager & Health Tracker</title>
<style>
:root{
--primary:#1e293b;
--accent:#2563eb;
--teal:#0d9488;
--success:#10b981;
--danger:#ef4444;
--golden:#d97706;
--safe-top:env(safe-area-inset-top,0px);
--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#f1f5f9;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;direction:rtl;color:#334155}
.app-shell{max-width:480px;margin:0 auto;height:100vh;height:-webkit-fill-available;display:flex;flex-direction:column;background:#f8fafc;position:relative;overflow:hidden}

/* HEADER — App name SIRF YAHAN (1 baar) */
.app-header{padding:calc(var(--safe-top) + 12px) 14px 12px;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:50;border-bottom:3px solid #0d9488;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.menu-btn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;flex-shrink:0;transition:.2s}
.menu-btn:active{background:rgba(255,255,255,.2);transform:scale(.95)}
.menu-btn span{display:block;width:16px;height:2px;background:#fff;border-radius:2px}
.brand{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;min-width:0}
.brand-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0d9488,#0891b2,#2563eb);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;box-shadow:0 4px 10px rgba(13,148,136,.35)}
.brand-text{display:flex;flex-direction:column;align-items:center;min-width:0}
.brand-title{font-size:13px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;line-height:1.1;background:linear-gradient(135deg,#fff,#cbd5e1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:8.5px;font-weight:700;color:#94a3b8;letter-spacing:.4px;margin-top:1px;white-space:nowrap}
.status-pill{display:flex;align-items:center;gap:4px;padding:5px 8px;border-radius:20px;background:rgba(255,255,255,.1);font-size:8px;font-weight:700;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
.status-dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981}
.status-pill.offline .status-dot{background:#ef4444;box-shadow:0 0 8px #ef4444}

/* MAIN — Dashboard iframe */
.main-content{flex:1;overflow:hidden;position:relative}
#dashFrame{width:100%;height:100%;border:none;display:block;background:#f8fafc}

/* LOADING */
.loading-overlay{position:absolute;inset:0;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;transition:opacity .4s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:44px;height:44px;border:4px solid #e2e8f0;border-top-color:#0d9488;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;font-weight:700;color:#94a3b8}

/* BOTTOM NAV — Full size, space barabar */
.bottom-nav{padding:10px 12px calc(var(--safe-bottom) + 10px);background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-shrink:0;position:sticky;bottom:0;z-index:50;box-shadow:0 -4px 12px rgba(0,0,0,.05)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;cursor:pointer;padding:10px 4px;border-radius:12px;color:#94a3b8;font-family:inherit;transition:.2s;flex:1;text-decoration:none;min-width:0}
.nav-item:active{background:#f1f5f9;transform:scale(.96)}
.nav-item.active{color:#0d9488}
.nav-icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-label{font-size:10px;font-weight:800;white-space:nowrap}

/* SIDE MENU */
.side-menu{position:fixed;top:0;left:-320px;width:300px;height:100vh;background:#fff;box-shadow:10px 0 30px rgba(0,0,0,.15);transition:left .3s cubic-bezier(.4,0,.2,1);z-index:999;display:flex;flex-direction:column;overflow-y:auto}
.side-menu.open{left:0}
.side-header{padding:18px;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;display:flex;justify-content:space-between;align-items:center}
.side-title{font-size:14px;font-weight:800}
.side-close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:14px;cursor:pointer}
.side-list{padding:10px;flex:1;display:flex;flex-direction:column;gap:10px}
.side-item{display:flex;align-items:center;justify-content:center;padding:13px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;color:#334155;width:100%;text-align:center;font-family:inherit;text-decoration:none;transition:.2s}
.side-item:hover{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
.side-item.coming-soon{opacity:.6;cursor:not-allowed;pointer-events:none;flex-direction:column;gap:2px}
.side-item.coming-soon .sub{font-size:9px;color:#94a3b8;font-weight:600}
.side-footer{padding:14px;border-top:1px solid #e2e8f0;text-align:center;color:#94a3b8;font-size:10px;font-weight:700}
.menu-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:998;opacity:0;visibility:hidden;transition:.3s}
.menu-overlay.active{opacity:1;visibility:visible}
</style>
</head>
<body>

<div class="app-shell">
    <!-- HEADER -->
    <header class="app-header">
        <button class="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
        <div class="brand">
            <div class="brand-icon">🏥</div>
            <div class="brand-text">
                <div class="brand-title">Smart Manager</div>
                <div class="brand-sub">& Health Tracker</div>
            </div>
        </div>
        <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">آن لائن</span>
        </div>
    </header>

    <!-- MAIN — Dashboard iframe -->
    <main class="main-content">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text">ڈیش بورڈ لوڈ ہو رہا ہے...</div>
        </div>
        <iframe id="dashFrame" src="dashboard.html" onload="hideLoading()"></iframe>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="nav-label">ڈیش بورڈ</span>
        </a>
        <a href="entry.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span class="nav-label">انٹری</span>
        </a>
        <a href="history.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="nav-label">ہسٹری</span>
        </a>
        <a href="manager.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="nav-label">مینیجر</span>
        </a>
    </nav>
</div>

<!-- SIDE MENU -->
<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="sideMenu">
    <div class="side-header">
        <div class="side-title"><span>📑</span> کنٹرول پینل</div>
        <button class="side-close" onclick="toggleMenu()">✕</button>
    </div>
    <div class="side-list">
        <a class="side-item" href="index.html"><span>🏠 ڈیش بورڈ</span></a>
        <a class="side-item" href="entry.html"><span>➕ ڈیٹا انٹری</span></a>
        <a class="side-item" href="history.html"><span>📜 ہسٹری</span></a>
        <div class="side-item coming-soon">
            <span>👥 مینیجر</span>
            <span class="sub">⏳ Coming Soon</span>
        </div>
    </div>
    <div class="side-footer">Smart Manager & Health Tracker v1.0</div>
</div>

<script>
// ========== ONLINE/OFFLINE ==========
function updateOnline() {
    var p = document.getElementById('statusPill');
    var t = document.getElementById('statusText');
    if (navigator.onLine) {
        p.classList.remove('offline');
        t.textContent = 'آن لائن';
    } else {
        p.classList.add('offline');
        t.textContent = 'آف لائن';
    }
}
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);
updateOnline();

// ========== SIDE MENU ==========
function toggleMenu() {
    var m = document.getElementById('sideMenu');
    var o = document.getElementById('menuOverlay');
    m.classList.toggle('open');
    o.classList.toggle('active');
}

// ========== LOADING HIDE ==========
function hideLoading() {
    var el = document.getElementById('loadingOverlay');
    if (el) el.classList.add('hidden');
}
</script>
</body>
</html>
