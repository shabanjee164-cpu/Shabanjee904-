<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مکمل ڈیش بورڈ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,sans-serif;direction:rtl;background:#eef2f6;display:flex;flex-direction:column}
.app-header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.15);flex-shrink:0;z-index:50}
.app-header .hamburger{background:rgba(255,255,255,.2);border:none;color:#fff;width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.app-header .app-title{font-size:17px;font-weight:800}
.app-header .coming-btn{background:rgba(251,191,36,.95);border:none;color:#78350f;height:40px;padding:0 14px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.app-main{flex:1;position:relative;overflow:hidden}
.app-main iframe{width:100%;height:100%;border:none;display:block;background:#eef2f6}
.bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #e2e8f0;box-shadow:0 -2px 12px rgba(0,0,0,.06);flex-shrink:0;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{background:transparent;border:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#94a3b8;font-family:inherit;position:relative}
.bottom-nav button .nav-icon{font-size:20px;line-height:1}
.bottom-nav button .nav-label{font-size:10px;font-weight:700}
.bottom-nav button.active{color:#2563eb}
.bottom-nav button.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;background:#2563eb;border-radius:0 0 4px 4px}
.side-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);opacity:0;visibility:hidden;transition:.28s;z-index:100}
.side-overlay.open{opacity:1;visibility:visible}
.side-menu{position:fixed;top:0;right:0;height:100%;width:290px;max-width:85vw;background:#fff;z-index:110;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
.side-menu.open{transform:translateX(0)}
.side-header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:18px 16px;display:flex;justify-content:space-between;align-items:center}
.side-header .side-title{font-size:16px;font-weight:800}
.side-header .close-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer}
.side-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 20px;text-align:center}
.side-body .ic{font-size:70px}
.side-body .ttl{font-size:22px;font-weight:900;color:#2563eb}
.side-body .sub{font-size:12px;color:#94a3b8;font-weight:600}
.side-footer{padding:12px 18px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;text-align:center;background:#f8fafc}
</style>
</head>
<body>

<header class="app-header">
  <button class="hamburger" onclick="openSideMenu()">☰</button>
  <div class="app-title" id="headerTitle">📊 ڈیش بورڈ</div>
  <button class="coming-btn" onclick="alert('Coming Soon')">✨ Coming Soon</button>
</header>

<main class="app-main">
  <iframe id="contentFrame"></iframe>
</main>

<div class="side-overlay" id="sideOverlay" onclick="closeSideMenu()"></div>
<aside class="side-menu" id="sideMenu">
  <div class="side-header">
    <div class="side-title">📋 مینو</div>
    <button class="close-btn" onclick="closeSideMenu()">✕</button>
  </div>
  <div class="side-body">
    <div class="ic">🚧</div>
    <div class="ttl">Coming Soon</div>
    <div class="sub">یہ سیکشن جلد دستیاب ہو گا</div>
  </div>
  <div class="side-footer">ورژن 1.0</div>
</aside>

<nav class="bottom-nav">
  <button class="active" data-n="dashboard" onclick="go('dashboard','dashboard.html','📊 ڈیش بورڈ')">
    <span class="nav-icon">📊</span><span class="nav-label">ڈیش بورڈ</span>
  </button>
  <button data-n="manager" onclick="go('manager','entry.html','👔 مینیجر')">
    <span class="nav-icon">👔</span><span class="nav-label">مینیجر</span>
  </button>
  <button data-n="dataentry" onclick="go('dataentry','entry.html','📝 ڈیٹا انٹری')">
    <span class="nav-icon">📝</span><span class="nav-label">ڈیٹا انٹری</span>
  </button>
  <button data-n="history" onclick="go('history','history.html','📜 ہسٹری')">
    <span class="nav-icon">📜</span><span class="nav-label">ہسٹری</span>
  </button>
</nav>

<script>
var $ = function(id){return document.getElementById(id);};
function openSideMenu(){$('sideMenu').classList.add('open');$('sideOverlay').classList.add('open');}
function closeSideMenu(){$('sideMenu').classList.remove('open');$('sideOverlay').classList.remove('open');}
function go(id, file, title){
  $('headerTitle').textContent = title;
  document.querySelectorAll('.bottom-nav button').forEach(function(b){
    b.classList.toggle('active', b.dataset.n === id);
  });
  closeSideMenu();
  $('contentFrame').src = file + '?t=' + Date.now();
}
document.addEventListener('keydown', function(e){if(e.key === 'Escape') closeSideMenu();});
window.addEventListener('load', function(){ go('dashboard','dashboard.html','📊 ڈیش بورڈ'); });
</script>
</body>
</html>
