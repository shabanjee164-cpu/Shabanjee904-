<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفیشنل فیملی ٹاسک اینڈ پوائنٹس ڈیش بورڈ</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --danger: #ef4444;
            --success: #10b981;
            --success-gradient: linear-gradient(135deg, #10b981, #059669);
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #e2e8f0;
            --radius: 18px;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 25px; line-height: 1.6; }

        .container { max-width: 850px; margin: 0 auto; }

        /* شاندار ایپ ہیডার */
        .app-header {
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            color: white; text-align: center;
            padding: 24px; border-radius: var(--radius); font-size: 24px; font-weight: bold;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.2); margin-bottom: 24px;
            border-bottom: 4px solid var(--accent);
            letter-spacing: 0.5px;
        }

        /* مین کارڈ اسٹائل */
        .card {
            background: var(--card-bg); padding: 28px; border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 24px; 
            border: 2px solid var(--border);
            position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; right: 0; width: 6px; height: 100%;
            background: var(--success-gradient);
        }

        .card-header-flex {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f1f5f9; padding-bottom: 14px; margin-bottom: 20px;
        }
        .card h3 { margin: 0; color: var(--primary); font-size: 20px; font-weight: 700; }

        /* خوبصورت سیٹنگ پرو بٹن */
        .setting-btn-pro {
            background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8;
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold;
            transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(59, 130, 246, 0.1);
        }
        .setting-btn-pro:hover { background: #dbeafe; transform: translateY(-1px); }

        /* نیو انٹری ایڈ کرنے کا سیکشن */
        .add-task-box {
            background: #f8fafc; border: 1px solid var(--border); padding: 16px;
            border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        .add-task-box input {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; background: #fff;
        }
        .btn-add {
            background: var(--success-gradient); color: white; border: none; padding: 10px 18px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .btn-add:hover { filter: brightness(1.05); }

        /* کنٹرولز سیکشن (ڈراپ ڈاؤن اور ڈیٹس) */
        .controls-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            background: #f8fafc; padding: 18px; border-radius: 14px; border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        /* پروفیشنل کلر فل ڈراپ ڈاؤن */
        .dropdown-center {
            width: 250px; padding: 10px 14px; border-radius: 10px; 
            border: 2px solid #93c5fd;
            font-size: 14px; font-weight: bold; text-align: center; 
            background: linear-gradient(135deg, #ffffff, #f0fdf4); 
            color: var(--primary); outline: none; cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.08);
            transition: all 0.3s;
        }
        .dropdown-center:hover, .dropdown-center:focus { border-color: var(--accent); background: #ffffff; }

        .date-filter-group {
            display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%;
            font-size: 13px; font-weight: 600; color: var(--primary);
        }
        .date-input {
            padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; background: #fff; color: var(--primary); font-weight: 600;
        }

        /* شاندار ٹیبل اسٹائل */
        .clean-result-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 14px; }
        .clean-result-table th { background: #f1f5f9; color: var(--primary); padding: 12px; text-align: center; font-weight: 700; border-bottom: 2px solid var(--border); }
        .clean-result-table td { padding: 14px 12px; text-align: center; background: #ffffff; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; box-shadow: 0 2px 5px rgba(0,0,0,0.01); }
        .clean-result-table tr td:first-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        .clean-result-table tr td:last-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }

        /* گرینڈ ٹوٹل باکس */
        .grand-total-box {
            margin-top: 20px; background: linear-gradient(135deg, #ecfdf5, #d1fae5); 
            border: 2px solid #a7f3d0; padding: 16px 20px;
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 16px; color: #065f46;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ایپ ہیڈر -->
        <div class="app-header">🌟 فیملی اسمارٹ ٹاسک اینڈ پوائنٹس ڈیش بورڈ</div>

        <!-- ریکارڈ کارڈ -->
        <div class="card">
            
            <div class="card-header-flex">
                <h3>⭐ ممبر کا کارکردگی اور پوائنٹس رکارڈ</h3>
                <!-- سیٹنگز کا بٹن -->
                <button class="setting-btn-pro" onclick="openEasySettings()">⚙️ سیٹنگز (ترتیب، نام، ڈیلیٹ)</button>
            </div>

            <!-- نئی انٹری اور پوائنٹس ایڈ کرنے کا باکس -->
            <div class="add-task-box">
                <span style="font-weight: bold; font-size: 13px; color: var(--primary);">➕ نئی انٹری کریں:</span>
                <select id="newEntryMember" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-weight: bold;">
                    <option value="علی">علی</option>
                    <option value="احمد">احمد</option>
                </select>
                <input type="text" id="newEntryTaskName" placeholder="کام کا نام (مثلاً: صفائی)" style="flex: 2; min-width: 150px;">
                <input type="number" id="newEntryPoints" placeholder="فی کام پوائنٹس" style="width: 110px;" value="10">
                <input type="date" id="newEntryDate" style="width: 130px;" value="2026-09-07">
                <button class="btn-add" onclick="addNewTaskRecord()">انٹری شامل کریں</button>
            </div>

            <!-- ڈراپ لائن اور ڈیٹ فلٹرز -->
            <div class="controls-wrapper">
                <div>
                    <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 6px; text-align: center; color: var(--primary);">🔍 ممبر منتخب کریں (ڈراپ ڈاؤن):</label>
                    <select id="selectedMember" class="dropdown-center" onchange="renderMemberRecord()">
                        <option value="علی">👨‍✈️ علی (سینئر)</option>
                        <option value="احمد">🧑‍ ہیلپر: احمد</option>
                    </select>
                </div>

                <div class="date-filter-group">
                    <span>فرسٹ ڈیٹ: <input type="date" id="startDate" class="date-input" value="2026-09-01" onchange="renderMemberRecord()"></span>
                    <span>لاسٹ ڈیٹ: <input type="date" id="endDate" class="date-input" value="2026-09-10" onchange="renderMemberRecord()"></span>
                </div>
            </div>

            <!-- رکارڈ ٹیبل -->
            <table class="clean-result-table">
                <thead>
                    <tr>
                        <th>کام کا نام (Task)</th>
                        <th>فی کام پوائنٹ</th>
                        <th>کتنی بار ہوا (Count)</th>
                        <th>کل پوائنٹس (Total)</th>
                    </tr>
                </thead>
                <tbody id="memberRecordTableBody">
                    <!-- ڈیٹا یہاں شو ہوگا -->
                </tbody>
            </table>

            <!-- کل ٹوٹل پوائنٹس باکس -->
            <div class="grand-total-box">
                <span>🎯 تمام کاموں کے مجموعی پوائنٹس (Grand Total):</span>
                <span id="grandTotalPointsDisplay" style="font-size: 20px;">0 ⭐</span>
            </div>

        </div>

    </div>

    <script>
        // ماسٹر ڈیٹا بیس
        let masterTaskRecords = [
            { member: "علی", taskName: "کمرے کی مکمل صفائی", pointsPerUnit: 15, frequency: 3, date: "2026-09-02" },
            { member: "علی", taskName: "راشن انوینٹری چیک", pointsPerUnit: 10, frequency: 2, date: "2026-09-05" },
            { member: "احمد", taskName: "شام کی چائے بنانا", pointsPerUnit: 10, frequency: 4, date: "2026-09-03" },
            { member: "احمد", taskName: "کچن کاؤنٹر صفائی", pointsPerUnit: 5, frequency: 5, date: "2026-09-06" }
        ];

        // نئی انٹری مع پوائنٹس ایڈ کرنے کا فنکشن
        function addNewTaskRecord() {
            let member = document.getElementById('newEntryMember').value;
            let taskName = document.getElementById('newEntryTaskName').value.trim();
            let points = parseInt(document.getElementById('newEntryPoints').value) || 0;
            let date = document.getElementById('newEntryDate').value;

            if(!taskName) {
                alert("⚠️ براہ کرم کام کا نام درج کریں!");
                return;
            }

            // چیک کریں کہ کیا یہ کام پہلے سے موجود ہے؟ اگر ہے تو فریکوئینسی بڑھا دیں ورنہ نئی قطار بنائیں
            let existing = masterTaskRecords.find(x => x.member === member && x.taskName === taskName && x.date === date);
            if(existing) {
                existing.frequency += 1;
                existing.pointsPerUnit = points;
            } else {
                masterTaskRecords.push({ member: member, taskName: taskName, pointsPerUnit: points, frequency: 1, date: date });
            }

            document.getElementById('newEntryTaskName').value = '';
            renderMemberRecord();
            alert("✅ نئی انٹری اور پوائنٹس کامیابی سے شامل ہو گئے!");
        }

        // ریکارڈ رینڈر کرنے کا فنکشن
        function renderMemberRecord() {
            let currentMember = document.getElementById('selectedMember').value;
            let start = document.getElementById('startDate').value;
            let end = document.getElementById('endDate').value;
            
            let tbody = document.getElementById('memberRecordTableBody');
            let grandTotal = 0;

            let filteredData = masterTaskRecords.filter(item => {
                return item.member === currentMember && item.date >= start && item.date <= end;
            });

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color: #64748b; padding: 25px;">اس تاریخ اور ممبر کا کوئی ریکارڈ موجود نہیں۔</td></tr>`;
                document.getElementById('grandTotalPointsDisplay').innerText = "0 ⭐";
                return;
            }

            tbody.innerHTML = filteredData.map((item, index) => {
                let totalTaskPoints = item.pointsPerUnit * item.frequency;
                grandTotal += totalTaskPoints;
                return `
                    <tr>
                        <td><b style="color: var(--primary);">${item.taskName}</b></td>
                        <td><span style="background: #f1f5f9; padding: 4px 10px; border-radius: 6px;">${item.pointsPerUnit}</span></td>
                        <td><span style="background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 6px; font-weight: bold;">${item.frequency} بار</span></td>
                        <td><span style="color: var(--success); font-weight: bold; font-size: 15px;">${totalTaskPoints} ⭐</span></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('grandTotalPointsDisplay').innerText = grandTotal + " ⭐";
        }

        // انتہائی آسان اور واضح سیٹنگز مینو
        function openEasySettings() {
            let choice = prompt("⚙️ [آسان سیٹنگز مینو]\n\n1. کام کا نام تبدیل کریں (Rename)\n2. ایک خاص کام ڈیلیٹ کریں (Delete One)\n3. تمام رکارڈ صاف کریں (Delete All)\n\nنمبر درج کریں (1، 2 یا 3):");

            if(choice === "1") {
                let oldName = prompt("جس کام کا نام تبدیل کرنا ہے وہ ہو بہو لکھیں:");
                let record = masterTaskRecords.find(x => x.taskName === oldName);
                if(record) {
                    let newName = prompt("نیا نام درج کریں:", record.taskName);
                    if(newName) {
                        record.taskName = newName;
                        renderMemberRecord();
                        alert("✅ کام کا نام کامیابی سے تبدیل ہو گیا!");
                    }
                } else {
                    alert("❌ اس نام کا کوئی کام نہیں ملا!");
                }
            } 
            else if(choice === "2") {
                let targetName = prompt("جس کام کو ڈیلیٹ کرنا ہے اس کا نام لکھیں:");
                let index = masterTaskRecords.findIndex(x => x.taskName === targetName);
                if(index !== -1) {
                    masterTaskRecords.splice(index, 1);
                    renderMemberRecord();
                    alert("🗑️ منتخب کردہ کام رکارڈ سے ہٹا دیا گیا!");
                } else {
                    alert("❌ کام نہیں ملا!");
                }
            } 
            else if(choice === "3") {
                if(confirm("⚠️ کیا آپ واقعی تمام رکارڈ کو کلیئر کرنا چاہتے ہیں؟")) {
                    masterTaskRecords = [];
                    renderMemberRecord();
                    alert("🧹 تمام رکارڈ صاف کر دیا گیا ہے!");
                }
            }
        }

        // پیج لوڈ ہونے پر ڈیٹا شو ہو
        window.onload = function() {
            renderMemberRecord();
        }
    </script>
</body>
</html>
