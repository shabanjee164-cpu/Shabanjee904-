<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفیشنل فیملی ہسٹری اینڈ پوائنٹس سسٹم</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --danger: #ef4444;
            --success: #059669;
            --success-gradient: linear-gradient(135deg, #10b981, #059669);
            --card-bg: #ffffff;
            --text: #334155;
            --border: #cbd5e1;
            --radius: 16px;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: var(--text); margin: 0; padding: 25px; line-height: 1.6; }

        .container { max-width: 850px; margin: 0 auto; }

        /* شاندار ایپ ہیڈر */
        .app-header {
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            color: white; text-align: center;
            padding: 22px; border-radius: var(--radius); font-size: 22px; font-weight: bold;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15); margin-bottom: 24px;
            border-bottom: 4px solid var(--accent);
        }

        /* مین ہسٹری کارڈ (پروفیشنل کلر اور بارڈر کے ساتھ) */
        .card {
            background: var(--card-bg); padding: 26px; border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.08); margin-bottom: 24px; 
            border: 2px solid #93c5fd;
            position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; right: 0; width: 6px; height: 100%;
            background: var(--accent-gradient);
        }

        .card-header-flex {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 18px;
        }
        .card h3 { margin: 0; color: var(--primary); font-size: 19px; font-weight: 700; }

        /* سیٹنگز ڈراپ ڈاؤن یا بٹن گروپ */
        .settings-dropdown-wrapper {
            position: relative; display: inline-block;
        }
        .setting-btn-pro {
            background: #eff6ff; border: 2px solid #3b82f6; color: #1d4ed8;
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold;
            transition: all 0.2s ease; box-shadow: 0 2px 5px rgba(59, 130, 246, 0.15);
        }
        .setting-btn-pro:hover { background: #dbeafe; }

        /* سیٹنگز مینو کے اندر والے آپشنز کی لسٹ (بغیر نمبر کے ڈائریکٹ کلک) */
        .settings-menu-box {
            display: none; position: absolute; left: 0; top: 45px; background: #ffffff;
            min-width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 12px;
            border: 2px solid #cbd5e1; z-index: 100; overflow: hidden;
        }
        .settings-menu-box button {
            width: 100%; padding: 10px 14px; text-align: right; background: none; border: none;
            border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: bold; color: var(--primary);
            cursor: pointer; transition: background 0.2s;
        }
        .settings-menu-box button:hover { background: #f8fafc; color: var(--accent); }
        .settings-menu-box button:last-child { border-bottom: none; }

        /* کنٹرولز سیکشن (ڈراپ ڈاؤن اور ڈیٹس) */
        .controls-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            background: #f8fafc; padding: 16px; border-radius: 12px; border: 2px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .dropdown-center {
            width: 240px; padding: 10px 14px; border-radius: 10px; 
            border: 2px solid #60a5fa;
            font-size: 14px; font-weight: bold; text-align: center; 
            background: #ffffff; color: var(--primary); outline: none; cursor: pointer;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.08);
        }
        .dropdown-center:focus { border-color: var(--accent); }

        .date-filter-group {
            display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%;
            font-size: 13px; font-weight: 600; color: var(--primary);
        }
        .date-input {
            padding: 8px 10px; border-radius: 8px; border: 2px solid #cbd5e1; font-size: 13px; background: #fff; font-weight: 600;
        }

        /* شاندار ٹیبل اسٹائل */
        .clean-result-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 14px; }
        .clean-result-table th { background: #e0f2fe; color: #0369a1; padding: 12px; text-align: center; font-weight: 700; border-bottom: 2px solid #bae6fd; }
        .clean-result-table td { padding: 14px 12px; text-align: center; background: #ffffff; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
        .clean-result-table tr td:first-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        .clean-result-table tr td:last-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }

        /* گرینڈ ٹوٹل باکس */
        .grand-total-box {
            margin-top: 20px; background: linear-gradient(135deg, #ecfdf5, #d1fae5); 
            border: 2px solid #6ee7b7; padding: 16px 20px;
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 16px; color: #065f46;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ایپ ہیڈر -->
        <div class="app-header">🌟 فیملی اسمارٹ ہسٹری اینڈ پوائنٹس ڈیش بورڈ</div>

        <!-- ہسٹری کارڈ -->
        <div class="card" id="historyCardSection">
            
            <div class="card-header-flex">
                <h3>⭐ ممبر ہسٹری اور پوائنٹس رکارڈ</h3>
                
                <!-- سیٹنگز بٹن اور ڈائریکٹ مینو -->
                <div class="settings-dropdown-wrapper">
                    <button class="setting-btn-pro" onclick="toggleSettingsMenu()">⚙️ سیٹنگز مینو</button>
                    
                    <div id="settingsMenuBox" class="settings-menu-box">
                        <button onclick="toggleSelectMode()">☑️ سلیکٹ موڈ (باکس کھولیں/بند کریں)</button>
                        <button onclick="selectAllRows()">✅ سب سلیکٹ کریں (All Select)</button>
                        <button onclick="deleteSelectedRows()">🗑️ سلیکٹ شدہ ڈیلیٹ کریں</button>
                        <button onclick="renameTaskPrompt()">✏️ کام کا نام تبدیل کریں (Rename)</button>
                        <button onclick="deleteAllHistory()">🧹 تمام ہسٹری ڈیلیٹ کریں (All Delete)</button>
                        <button onclick="sortRecords()">🔄 ترتیب دیں (Sort / Tarteeb)</button>
                        <button onclick="toggleSectionView()">📂 سیکشن بند/کھولیں</button>
                    </div>
                </div>
            </div>

            <!-- ڈراپ لائن اور ڈیٹ فلٹرز -->
            <div class="controls-wrapper">
                <div>
                    <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 6px; text-align: center; color: var(--primary);">🔍 ممبر منتخب کریں:</label>
                    <select id="selectedMember" class="dropdown-center" onchange="renderMemberRecord()">
                        <option value="علی">👨‍✈️ علی (سینئر)</option>
                        <option value="احمد">🧑‍ ہیلپر: احمد</option>
                    </select>
                </div>

                <div class="date-filter-group">
                    <span>فرسٹ ڈیٹ: <input type="date" id="startDate" class="date-input" value="2026-09-01" onchange="renderMemberRecord()"></span>
                    <span>لاسٹ ڈیٹ: <input type="date" id="endDate" class="date-input" value="2026-09-10" onchange="renderMemberRecord()"></span>
                </div>
            </div>

            <!-- رکارڈ ٹیبل -->
            <table class="clean-result-table">
                <thead>
                    <tr>
                        <th id="selectHeaderTh" style="display: none;">انتخاب</th>
                        <th>کام کا نام (Task)</th>
                        <th>فی کام پوائنٹ</th>
                        <th>کتنی بار ہوا (Count)</th>
                        <th>کل پوائنٹس (Total)</th>
                    </tr>
                </thead>
                <tbody id="memberRecordTableBody">
                    <!-- ڈیٹا یہاں شو ہوگا -->
                </tbody>
            </table>

            <!-- کل ٹوٹل پوائنٹس باکس -->
            <div class="grand-total-box">
                <span>🎯 تمام کاموں کے مجموعی پوائنٹس (Grand Total):</span>
                <span id="grandTotalPointsDisplay" style="font-size: 20px;">0 ⭐</span>
            </div>

        </div>

    </div>

    <script>
        let masterTaskRecords = [
            { id: 1, member: "علی", taskName: "کمرے کی مکمل صفائی", pointsPerUnit: 15, frequency: 3, date: "2026-09-02" },
            { id: 2, member: "علی", taskName: "راشن انوینٹری چیک", pointsPerUnit: 10, frequency: 2, date: "2026-09-05" },
            { id: 3, member: "احمد", taskName: "شام کی چائے بنانا", pointsPerUnit: 10, frequency: 4, date: "2026-09-03" },
            { id: 4, member: "احمد", taskName: "کچن کاؤنٹر صفائی", pointsPerUnit: 5, frequency: 5, date: "2026-09-06" }
        ];

        let isSelectModeActive = false; // بائی ڈیفالٹ باکس چھپے رہیں گے

        // سیٹنگز مینو کھلنے اور بند ہونے کا فنکشن
        function toggleSettingsMenu() {
            let menu = document.getElementById('settingsMenuBox');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }

        // باہر کہیں کلک کرنے پر مینو خود بخود بند ہو جائے
        window.onclick = function(event) {
            if (!event.target.matches('.setting-btn-pro')) {
                let menu = document.getElementById('settingsMenuBox');
                if (menu && menu.style.display === 'block') {
                    menu.style.display = 'none';
                }
            }
        }

        // ڈائنامک سلیکٹ موڈ (جب ضرورت ہو تبھی باکس آئیں)
        function toggleSelectMode() {
            isSelectModeActive = !isSelectModeActive;
            renderMemberRecord();
            alert(isSelectModeActive ? "☑️ سلیکٹ موڈ آن ہو گیا ہے، اب باکس ظاہر ہو رہے ہیں!" : "☑️ سلیکٹ موڈ آف کر دیا گیا ہے!");
        }

        // ریکارڈ رینڈر کرنے کا فنکشن
        function renderMemberRecord() {
            let currentMember = document.getElementById('selectedMember').value;
            let start = document.getElementById('startDate').value;
            let end = document.getElementById('endDate').value;
            
            let tbody = document.getElementById('memberRecordTableBody');
            let selectTh = document.getElementById('selectHeaderTh');
            let grandTotal = 0;

            // اگر سلیکٹ موڈ آن ہو تو کالم ہیڈر شو کریں ورنہ چھپا دیں
            selectTh.style.display = isSelectModeActive ? "" : "none";

            let filteredData = masterTaskRecords.filter(item => {
                return item.member === currentMember && item.date >= start && item.date <= end;
            });

            let colSpanCount = isSelectModeActive ? 5 : 4;

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${colSpanCount}" style="color: #64748b; padding: 25px;">اس تاریخ اور ممبر کا کوئی ریکارڈ موجود نہیں۔</td></tr>`;
                document.getElementById('grandTotalPointsDisplay').innerText = "0 ⭐";
                return;
            }

            tbody.innerHTML = filteredData.map((item) => {
                let totalTaskPoints = item.pointsPerUnit * item.frequency;
                grandTotal += totalTaskPoints;
                
                let checkboxTd = isSelectModeActive ? `<td><input type="checkbox" class="row-select-checkbox" data-id="${item.id}" style="width: 18px; height: 18px; cursor: pointer;"></td>` : '';

                return `
                    <tr>
                        ${checkboxTd}
                        <td><b style="color: var(--primary);">${item.taskName}</b></td>
                        <td><span style="background: #e0f2fe; padding: 4px 10px; border-radius: 6px; color: #0369a1; font-weight: bold;">${item.pointsPerUnit}</span></td>
                        <td><span style="background: #f1f5f9; color: var(--primary); padding: 4px 10px; border-radius: 6px; font-weight: bold;">${item.frequency} بار</span></td>
                        <td><span style="color: var(--success); font-weight: bold; font-size: 15px;">${totalTaskPoints} ⭐</span></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('grandTotalPointsDisplay').innerText = grandTotal + " ⭐";
        }

        // 1. سب سلیکٹ کرنا (All Select)
        function selectAllRows() {
            if (!isSelectModeActive) {
                alert("⚠️ پہلے 'سلیکٹ موڈ' آن کریں تاکہ باکس ظاہر ہوں!");
                return;
            }
            let checkboxes = document.querySelectorAll('.row-select-checkbox');
            checkboxes.forEach(cb => cb.checked = true);
        }

        // 2. سلیکٹ شدہ ریکارڈ ڈیلیٹ کرنا
        function deleteSelectedRows() {
            if (!isSelectModeActive) {
                alert("⚠️ پہلے 'سلیکٹ موڈ' آن کر کے مطلوبہ کاموں کو ٹک (Select) کریں!");
                return;
            }
            let checkboxes = document.querySelectorAll('.row-select-checkbox:checked');
            if(checkboxes.length === 0) {
                alert("⚠️ براہ کرم کم از کم ایک کام سلیکٹ کریں!");
                return;
            }
            if(confirm("کیا آپ واقعی سلیکٹ شدہ ریکارڈ ڈیلیٹ کرنا چاہتے ہیں؟")) {
                checkboxes.forEach(cb => {
                    let id = parseInt(cb.getAttribute('data-id'));
                    masterTaskRecords = masterTaskRecords.filter(x => x.id !== id);
                });
                renderMemberRecord();
                alert("🗑️ سلیکٹ شدہ ریکارڈ کامیابی سے ڈیلیٹ ہو گیا!");
            }
        }

        // 3. نام تبدیل کرنا (Rename)
        function renameTaskPrompt() {
            let oldName = prompt("جس کام کا نام تبدیل کرنا ہے وہ ہو بہو لکھیں:");
            if (!oldName) return;
            let record = masterTaskRecords.find(x => x.taskName === oldName);
            if(record) {
                let newName = prompt("نیا نام درج کریں:", record.taskName);
                if(newName) {
                    record.taskName = newName;
                    renderMemberRecord();
                    alert("✅ کام کا نام کامیابی سے تبدیل ہو گیا!");
                }
            } else {
                alert("❌ اس نام کا کوئی کام نہیں ملا!");
            }
        }

        // 4. تمام ہسٹری ڈیلیٹ کرنا (All Delete)
        function deleteAllHistory() {
            if(confirm("⚠️ کیا آپ واقعی تمام ہسٹری کو ہمیشہ کے لیے صاف کرنا چاہتے ہیں؟")) {
                masterTaskRecords = [];
                renderMemberRecord();
                alert("🧹 تمام ہسٹری صاف کر دی گئی ہے!");
            }
        }

        // 5. ترتیب دینا (Sort / Tarteeb)
        function sortRecords() {
            let sortType = prompt("ترتیب کا طریقہ منتخب کریں:\n1. پوائنٹس کے لحاظ سے (زیادہ سے کم)\n2. کام کے نام کے لحاظ سے (الف ب ج)\n\n1 یا 2 درج کریں:");
            if(sortType === "1") {
                masterTaskRecords.sort((a, b) => (b.pointsPerUnit * b.frequency) - (a.pointsPerUnit * a.frequency));
                renderMemberRecord();
                alert("🔄 پوائنٹس کے حساب سے ترتیب دے دی گئی ہے!");
            } else if(sortType === "2") {
                masterTaskRecords.sort((a, b) => a.taskName.localeCompare(b.taskName));
                renderMemberRecord();
                alert("🔄 نام کے حساب سے ترتیب دے دی گئی ہے!");
            }
        }

        // 6. سیکشن بند کرنا یا کھولنا
        function toggleSectionView() {
            let card = document.getElementById('historyCardSection');
            // صرف ہسٹری کا اندرونی مواد چھپائیں یا دکھائیں تاکہ سیٹنگ بٹن برقرار رہے
            let controls = card.querySelector('.controls-wrapper');
            let table = card.querySelector('.clean-result-table');
            let totalBox = card.querySelector('.grand-total-box');
            
            if(controls.style.display === "none") {
                controls.style.display = "flex";
                table.style.display = "table";
                totalBox.style.display = "flex";
                alert("📂 سیکشن کھول دیا گیا ہے!");
            } else {
                controls.style.display = "none";
                table.style.display = "none";
                totalBox.style.display = "none";
                alert("📁 سیکشن بند کر دیا گیا ہے!");
            }
        }

        // پیج لوڈ ہونے پر ڈیٹا شو ہو
        window.onload = function() {
            renderMemberRecord();
        }
    </script>
</body>
</html>
