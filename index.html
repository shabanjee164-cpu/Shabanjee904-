<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>⚡ Smart Management & Life Tracker</title>
<style>
:root{
--primary:#1e293b;--accent:#2563eb;--teal:#0d9488;
--safe-top:env(safe-area-inset-top,0px);
--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#eef2f6;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;direction:rtl;color:#334155}
.app-shell{max-width:480px;margin:0 auto;height:100vh;height:-webkit-fill-available;display:flex;flex-direction:column;background:#f8fafc;position:relative;overflow:hidden}

/* 1. HEADER: Left (Menu), Center (Fancy App Name), Right (Online/Offline) */
.app-header{padding:calc(var(--safe-top) + 12px) 16px 14px;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:50;border-bottom:2px solid #0d9488}

/* Left Menu Button */
.menu-btn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:.2s}
.menu-btn:hover{background:rgba(255,255,255,.15)}
.menu-btn span{display:block;width:18px;height:2px;background:#fff;border-radius:2px}

/* Center Fancy App Name */
.brand{display:flex;align-items:center;gap:8px}
.brand-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0d9488,#0891b2,#2563eb);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 10px rgba(13,148,136,.3)}
.brand-title{font-size:16px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,#fff,#cbd5e1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 2px 4px rgba(0,0,0,0.2)}

/* Right Online/Offline Status */
.status-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.1);font-size:10px;font-weight:700;border:1px solid rgba(255,255,255,.15)}
.status-dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;transition:all 0.3s}
.status-pill.offline .status-dot{background:#ef4444;box-shadow:0 0 8px #ef4444}
.status-pill.offline{border-color:rgba(239,68,68,.3)}

/* 2. MAIN CONTENT (Khali aur Saaf) */
.main-content{flex:1;padding:20px 16px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}

/* 3. BOTTOM NAV (Furan Kaam karne wale) */
.bottom-nav{padding:10px 15px calc(var(--safe-bottom) + 10px);background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;position:sticky;bottom:0;z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:8px;border-radius:12px;color:#94a3b8;font-family:inherit;transition:.2s;width:23%;text-decoration:none;}
.nav-item:active{background:#f1f5f9}
.nav-item.active{color:var(--teal)}
.nav-icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-label{font-size:9.5px;font-weight:800}

/* 4. SIDE MENU (Left Side Se Khulega) */
.side-menu{position:fixed;top:0;left:-320px;width:300px;height:100vh;background:#fff;box-shadow:10px 0 30px rgba(0,0,0,.15);transition:left .3s cubic-bezier(.4,0,.2,1);z-index:999;display:flex;flex-direction:column;overflow-y:auto}
.side-menu.open{left:0}
.side-header{padding:16px;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;display:flex;justify-content:space-between;align-items:center}
.side-title{font-size:14px;font-weight:800}
.side-close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.side-list{padding:10px;flex:1;display:flex;flex-direction:column;gap:10px}
.side-item{display:flex;align-items:center;justify-content:center;padding:12px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;color:#334155;width:100%;text-align:center;font-family:inherit;text-decoration:none;transition:.2s}
.side-item:hover{background:#eff6ff;color:var(--accent);border-color:#bfdbfe}
.side-footer{padding:12px;border-top:1px solid #e2e8f0;text-align:center;color:#94a3b8;font-size:10px;font-weight:700}

/* OVERLAY */
.menu-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:998;opacity:0;visibility:hidden;transition:.3s}
.menu-overlay.active{opacity:1;visibility:visible}
</style>
</head>
<body>

<div class="app-shell">
    <!-- HEADER -->
    <header class="app-header">
        <!-- Left: Menu Button -->
        <button class="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>

        <!-- Center: Fancy App Name -->
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <div class="brand-title">Smart Tracker</div>
        </div>

        <!-- Right: Online/Offline -->
        <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">آن لائن</span>
        </div>
    </header>

    <!-- MAIN CONTENT (Khali) -->
    <main class="main-content">
        <div style="text-align:center; color:#94a3b8; font-weight:700; font-size:14px;">
            <p>خوش آمدید</p>
            <p style="font-size:12px; margin-top:5px;">نیچے دیے گئے بٹنوں سے اپنا سیکشن کھولیں</p>
        </div>
    </main>

    <!-- BOTTOM NAV (Furan Kaam Karega) -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="nav-label">ڈیش بورڈ</span>
        </a>
        <a href="entry.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span class="nav-label">انٹری</span>
        </a>
        <a href="history.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="nav-label">ہسٹری</span>
        </a>
        <a href="manager.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="nav-label">مینیجر</span>
        </a>
    </nav>
</div>

<!-- SIDE MENU DRAWER (Left Side) -->
<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="sideMenu">
    <div class="side-header">
        <div class="side-title"><span>📑</span> کنٹرول پینل</div>
        <button class="side-close" onclick="toggleMenu()">✕</button>
    </div>
    <div class="side-list">
        <!-- Jab side-menu.html ka code aayega, wo yahan show hoga -->
        <div style="text-align:center; padding:20px; color:#94a3b8; font-size:12px; font-weight:700;">
            سائیڈ مینو یہاں آئے گا<br>
            (side-menu.html)
        </div>
        
        <!-- Abhi ke liye ek button jisse wo page khul jaye -->
        <a href="side-menu.html" class="side-item" style="background:#2563eb; color:#fff; border:none;">
            کھولیں (Open Side Menu)
        </a>
    </div>
    <div class="side-footer">Smart Tracker v1.0</div>
</div>

<script>
/* ONLINE / OFFLINE STATUS */
function updateOnlineStatus() {
    var pill = document.getElementById('statusPill');
    var text = document.getElementById('statusText');
    if (navigator.onLine) {
        pill.classList.remove('offline');
        text.textContent = 'آن لائن';
    } else {
        pill.classList.add('offline');
        text.textContent = 'آف لائن';
    }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

/* SIDE MENU TOGGLE */
function toggleMenu() {
    var menu = document.getElementById('sideMenu');
    var overlay = document.getElementById('menuOverlay');
    var isOpen = menu.classList.contains('open');
    
    if (isOpen) {
        menu.classList.remove('open');
        overlay.classList.remove('active');
    } else {
        menu.classList.add('open');
        overlay.classList.add('active');
    }
}
</script>
</body>
</html>
