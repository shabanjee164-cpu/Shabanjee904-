<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rashan App</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui; }
  body { background:#eef2f6; height:100vh; overflow:hidden; direction:rtl; }

  #topbar { height:52px; background:#fff; border-bottom:2px solid #e2e8f0;
            display:flex; align-items:center; padding:0 14px; gap:10px;
            position:fixed; top:0; left:0; right:0; z-index:10; }
  #hamburger { background:none; border:none; font-size:22px; cursor:pointer; }
  .title { font-weight:800; color:#d97706; font-size:15px; flex:1; }

  #sidebar { position:fixed; top:52px; right:0; bottom:64px; width:220px;
             background:#fff; border-left:2px solid #e2e8f0; padding:12px;
             transform:translateX(100%); transition:.25s; z-index:20; }
  #sidebar.open { transform:translateX(0); }
  .menu-btn { width:100%; padding:12px; text-align:right; background:#f8fafc;
              border:1px solid #e2e8f0; border-radius:8px; margin-bottom:8px;
              cursor:pointer; font-weight:700; font-size:13px; }
  .menu-btn:hover { background:#fef3c7; }

  #content { position:fixed; top:52px; left:0; right:0; bottom:64px; }
  #content iframe { width:100%; height:100%; border:none; }

  #bottomNav { position:fixed; bottom:0; left:0; right:0; height:64px;
               background:#fff; border-top:2px solid #e2e8f0; display:flex; }
  .nav-btn { flex:1; background:none; border:none; color:#64748b;
             cursor:pointer; display:flex; flex-direction:column;
             align-items:center; justify-content:center; gap:3px;
             font-size:11px; font-weight:700; }
  .nav-btn .icon { font-size:22px; }
  .nav-btn.active { color:#d97706; }
</style>
</head>
<body>

<div id="topbar">
  <button id="hamburger" onclick="toggleSidebar()">☰</button>
  <div class="title" id="pageTitle">🛒 راشن مینیجر</div>
</div>

<div id="sidebar">
  <button class="menu-btn" onclick="go('dashboard')">🏠 ڈیش بورڈ</button>
  <button class="menu-btn" onclick="go('history')">🕘 ہسٹری</button>
  <button class="menu-btn" onclick="go('entry')">✏️ انٹری</button>
  <button class="menu-btn" onclick="go('manager')">📋 مینیجر</button>
  <button class="menu-btn" onclick="exportData()">📤 ایکسپورٹ</button>
</div>

<div id="content"></div>

<nav id="bottomNav">
  <button class="nav-btn active" data-tab="dashboard" onclick="go('dashboard')">
    <span class="icon">🏠</span><span>ڈیش بورڈ</span>
  </button>
  <button class="nav-btn" data-tab="history" onclick="go('history')">
    <span class="icon">🕘</span><span>ہسٹری</span>
  </button>
  <button class="nav-btn" data-tab="entry" onclick="go('entry')">
    <span class="icon">✏️</span><span>انٹری</span>
  </button>
  <button class="nav-btn" data-tab="manager" onclick="go('manager')">
    <span class="icon">📋</span><span>مینیجر</span>
  </button>
</nav>

<script>
  const FILES = {
    dashboard: 'dashboard.html',
    history:   'history.html',
    entry:     'data-enter.html',
    manager:   'manager.html',
  };
  const TITLES = {
    dashboard: '🛒 راشن مینیجر',
    history:   '🕘 ہسٹری',
    entry:     '✏️ انٹری',
    manager:   '📋 مینیجر',
  };

  function go(tab) {
    document.getElementById('content').innerHTML =
      '<iframe src="' + FILES[tab] + '"></iframe>';
    document.getElementById('pageTitle').textContent = TITLES[tab];
    document.querySelectorAll('.nav-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.getElementById('sidebar').classList.remove('open');
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  function exportData() {
    const data = {
      items: localStorage.getItem('rashan_manager_items_v5') || '[]',
      records: localStorage.getItem('rashan_manager_data_v5') || '[]',
    };
    const blob = new Blob([JSON.stringify(data, null, 2)],
                          { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rashan-export.json';
    a.click();
  }

  go('dashboard');
</script>

</body>
</html>
