<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ڈیش بورڈ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f6;font-family:system-ui,sans-serif;direction:rtl;padding:10px}
.wrap{max-width:700px;margin:0 auto}

/* NEWS BAR */
.news-bar{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:700;overflow:hidden;margin-bottom:10px;min-height:44px;display:flex;align-items:center}
.news-text{display:inline-block;white-space:nowrap;animation:ticker 60s linear infinite;padding-right:100%}
@keyframes ticker{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ALERT BAR */
.alert-bar{display:none;background:#fef2f2;border:2px solid #fca5a5;color:#dc2626;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:800;justify-content:space-between;align-items:center;gap:10px;transition:all .3s;margin-bottom:10px}
.alert-bar.show{display:flex}
.alert-bar.blink{animation:bl .8s infinite alternate}
@keyframes bl{0%{background:#fef2f2;color:#dc2626}100%{background:#dc2626;color:#fff}}
.alert-bar .txt{flex:1;line-height:1.5}
.alert-bar .skip{background:#dc2626;color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:800;font-family:inherit;white-space:nowrap}
.alert-bar.blink .skip{background:#fff;color:#dc2626}

/* CARD */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:10px}
.card h2{font-size:14px;color:#1e293b;margin-bottom:10px;padding-bottom:8px;border-bottom:2px dashed #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .mini-timer{font-size:11px;font-weight:800;color:#6d28d9;background:#ede9fe;padding:3px 10px;border-radius:20px}

/* DUTY */
.duty-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duty-box{background:#ede9fe;border:1px solid #c4b5fd;border-radius:8px;padding:10px}
.duty-box .lbl{font-size:10px;font-weight:800;color:#6d28d9;margin-bottom:4px}
.duty-box .nm{font-size:15px;font-weight:900;color:#4c1d95;word-break:break-word}

/* LEAVE SUBMIT */
.leave-submit-box{background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:10px;margin-top:12px}
.leave-submit-box label{font-size:11px;font-weight:800;color:#92400e;display:block;margin-bottom:6px}
.leave-submit-box select,.leave-submit-box input{width:100%;padding:9px 10px;border:1px solid #fdba74;border-radius:6px;font-size:12px;font-weight:700;font-family:inherit;background:#fff;outline:none;margin-bottom:6px}
.leave-submit-box button{width:100%;padding:10px;background:#ea580c;color:#fff;font-size:13px;font-weight:800;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
.leave-submit-box button:active{opacity:.85}

/* LEAVE LIST */
.leave-title{font-size:11px;font-weight:800;color:#92400e;margin-top:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.leave-title .cnt{background:#ea580c;color:#fff;font-size:10px;padding:2px 8px;border-radius:20px}
.leave-list{background:#fff;border:1px solid #fdba74;border-radius:6px;padding:6px;max-height:180px;overflow-y:auto;min-height:44px}
.leave-item{background:#fff7ed;border:1px solid #fed7aa;border-radius:5px;padding:7px 10px;margin-bottom:4px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:6px;color:#9a3412}
.leave-item .name{flex:1;min-width:0;word-break:break-word}
.leave-item .reason{color:#dc2626;font-size:10px;background:#fff;padding:1px 6px;border-radius:10px;border:1px solid #fca5a5}
.empty-note{text-align:center;color:#94a3b8;font-size:11px;padding:14px;font-weight:600}
</style>
</head>
<body>

<div class="wrap">

  <!-- NEWS BAR -->
  <div class="news-bar">
    <div class="news-text" id="newsText">📰 لوڈ ہو رہا ہے...</div>
  </div>

  <!-- ALERT BAR -->
  <div class="alert-bar" id="alertBar">
    <span class="txt" id="alertTxt">—</span>
    <button class="skip" onclick="skipAlert()">اسکیپ ❌</button>
  </div>

  <!-- DUTY + CHHUTTI -->
  <div class="card">
    <h2>
      <span>👮 آج کی ڈیوٹی ممبران</span>
      <span class="mini-timer" id="dutyMiniTimer">⏱️ 00:00:00</span>
    </h2>

    <div class="duty-grid">
      <div class="duty-box">
        <div class="lbl">🟢 سینئر ممبر</div>
        <div class="nm" id="seniorNm">—</div>
      </div>
      <div class="duty-box">
        <div class="lbl">🔵 جونیئر ممبر</div>
        <div class="nm" id="juniorNm">—</div>
      </div>
    </div>

    <div class="leave-submit-box">
      <label>🏖️ چھٹی سبمٹ کریں</label>
      <select id="leaveMemberSel">
        <option value="">ممبر منتخب کریں...</option>
      </select>
      <input type="text" id="leaveReason" placeholder="وجہ لکھیں... (بیمار، گھر گیا...)">
      <button onclick="submitLeaveFromDash()">✅ چھٹی سبمٹ کریں</button>
    </div>

    <div class="leave-title">
      <span>📋 آج کی چھٹیاں</span>
      <span class="cnt" id="leaveCount">0</span>
    </div>
    <div class="leave-list" id="todayLeavesList">
      <div class="empty-note">آج کوئی چھٹی نہیں</div>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════
   KEYS
   ═══════════════════════════════════════════ */
var DUTY_KEY = 'sec4_duty_manager_data_v4';
var LEAVE_KEY = 'sec4_duty_leaves_data_v4';
var HIST_KEY = 'sec4_duty_history_data_v4';
var NEWS_KEY = 'sec10_news_alerts_data';
var IDX_KEY = 'sec10_alert_index';
var NEWS_IDX_KEY = 'sec10_news_index';
var LAST_NEWS_KEY = 'sec10_last_news_ids';
var FIRED_KEY = 'sec10_complaint_fired';

function $(id){return document.getElementById(id);}
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function pad(n){return String(n).padStart(2,'0');}
function getDayName(dt){var days=['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];return days[dt.getDay()]||'';}

var bellLoop=null, vibrateLoop=null, voiceToggle=0, newsTimer=null;

/* ═══════════════════════════════════════════
   BELL — Poori Awaaz
   ═══════════════════════════════════════════ */
function playBell(){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    [0,0.35,0.7].forEach(function(delay){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=1000;
      var t=ctx.currentTime+delay;
      g.gain.setValueAtTime(0.001,t);
      g.gain.exponentialRampToValueAtTime(1.0,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      o.start(t);o.stop(t+0.5);
    });
  }catch(e){}
}

/* ═══════════════════════════════════════════
   VOICE — Male / Female Alternate
   ═══════════════════════════════════════════ */
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ur-PK';u.rate=0.9;
    u.pitch=(voiceToggle%2===0)?1.3:0.8;
    u.volume=1.0;
    window.speechSynthesis.speak(u);
    voiceToggle++;
  }catch(e){}
}

/* ═══════════════════════════════════════════
   VIBRATE
   ═══════════════════════════════════════════ */
function startVibrate(){
  if(!navigator.vibrate) return;
  try{navigator.vibrate([400,200,400,200,400]);}catch(e){}
  if(vibrateLoop) clearInterval(vibrateLoop);
  vibrateLoop=setInterval(function(){
    if(navigator.vibrate) try{navigator.vibrate([400,200,400]);}catch(e){}
  },2500);
}

function stopAll(){
  if(bellLoop){clearInterval(bellLoop);bellLoop=null;}
  if(vibrateLoop){clearInterval(vibrateLoop);vibrateLoop=null;}
  if(navigator.vibrate) try{navigator.vibrate(0);}catch(e){}
  if(window.speechSynthesis) try{window.speechSynthesis.cancel();}catch(e){}
}

/* ═══════════════════════════════════════════
   NEWS BAR — Continuous Scrolling
   ═══════════════════════════════════════════ */
function updateNews(){
  var all=ls(NEWS_KEY,[]);
  if(!Array.isArray(all)) all=[];
  var news=all.filter(function(x){return x.type==='news' && x.enabled!==false;});
  var el=$('newsText');
  if(!el) return;
  if(!news.length){
    el.textContent='📰 کوئی نیوز موجود نہیں — ڈیٹا انٹری سے ایڈ کریں';
    return;
  }
  el.textContent = news.map(function(n){return '📰 '+n.content;}).join('   •   ') + '   •   ';
}

function checkNewNews(){
  var all=ls(NEWS_KEY,[]);
  if(!Array.isArray(all)) all=[];
  var news=all.filter(function(x){return x.type==='news';});
  var ids=news.map(function(n){return n.id;}).join(',');
  var last=localStorage.getItem(LAST_NEWS_KEY)||'';
  if(last && ids!==last && news.length){
    playBell();
    speak(news[0].content);
  }
  localStorage.setItem(LAST_NEWS_KEY,ids);
}

/* ═══════════════════════════════════════════
   ALERT BAR — Ek dafa ek alert
   ═══════════════════════════════════════════ */
function showAlert(){
  var all=ls(NEWS_KEY,[]);
  if(!Array.isArray(all)) all=[];
  var alerts=all.filter(function(x){return x.type==='alert' && x.enabled!==false;})
                .sort(function(a,b){return b.timestamp-a.timestamp;});
  var bar=$('alertBar'),txt=$('alertTxt');
  if(!bar) return;
  if(!alerts.length){bar.classList.remove('show');return;}
  var idx=parseInt(localStorage.getItem(IDX_KEY)||'0',10);
  if(idx>=alerts.length) idx=0;
  var a=alerts[idx];
  bar.classList.add('show','blink');
  txt.innerHTML='🚨 '+(idx+1)+'/'+alerts.length+': '+esc(a.content);
  stopAll();
  playBell();
  bellLoop=setInterval(playBell,1200);
  startVibrate();
  speak(a.content);
}

window.skipAlert=function(){
  stopAll();
  var bar=$('alertBar');
  bar.classList.remove('show','blink');
  var all=ls(NEWS_KEY,[]);
  if(!Array.isArray(all)) all=[];
  var alerts=all.filter(function(x){return x.type==='alert';});
  var idx=parseInt(localStorage.getItem(IDX_KEY)||'0',10);
  idx++; if(idx>=alerts.length) idx=0;
  localStorage.setItem(IDX_KEY,String(idx));
};

/* ═══════════════════════════════════════════
   COMPLAINTS (Time-Fixed)
   ═══════════════════════════════════════════ */
function checkComplaints(){
  var all=ls(NEWS_KEY,[]);
  if(!Array.isArray(all)) all=[];
  var comps=all.filter(function(x){return x.type==='complaint' && x.fireTime && x.enabled!==false;});
  if(!comps.length) return;
  var now=new Date();
  var nowStr=pad(now.getHours())+':'+pad(now.getMinutes());
  var today=now.toDateString();
  var fired=ls(FIRED_KEY,{});
  if(typeof fired!=='object'||fired===null) fired={};
  comps.forEach(function(c){
    if(c.fireTime!==nowStr) return;
    var k=c.id+'_'+today;
    var last=fired[k]||0;
    if(Date.now()-last<10*60*1000) return;
    var bar=$('alertBar'),txt=$('alertTxt');
    if(!bar||!txt) return;
    stopAll();
    bar.classList.add('show','blink');
    txt.innerHTML='⏰ '+esc(c.fireTime)+' — '+esc(c.content);
    playBell();
    bellLoop=setInterval(playBell,1200);
    startVibrate();
    speak(c.content);
    fired[k]=Date.now();
  });
  lss(FIRED_KEY,fired);
}

/* ═══════════════════════════════════════════
   DUTY — Live
   ═══════════════════════════════════════════ */
function updateDuty(){
  var m=ls(DUTY_KEY,[]);
  if(!Array.isArray(m)) m=[];
  var s=m.find(function(x){return x.onDuty && x.rank==='Senior';});
  var j=m.find(function(x){return x.onDuty && x.rank==='Junior';});
  if($('seniorNm')) $('seniorNm').textContent=s?s.name:'—';
  if($('juniorNm')) $('juniorNm').textContent=j?j.name:'—';
  var active=s||j;
  if(active && active.dutyStart){
    var el=Math.floor((Date.now()-active.dutyStart)/1000);
    var ts=pad(Math.floor(el/3600))+':'+pad(Math.floor((el%3600)/60))+':'+pad(el%60);
    if($('dutyMiniTimer')) $('dutyMiniTimer').textContent='⏱️ '+ts;
  } else {
    if($('dutyMiniTimer')) $('dutyMiniTimer').textContent='⏱️ 00:00:00';
  }
}

/* ═══════════════════════════════════════════
   CHHUTTI SUBMIT
   ═══════════════════════════════════════════ */
function populateLeaveDropdown(){
  var sel=$('leaveMemberSel');
  if(!sel) return;
  var cur=sel.value;
  var m=ls(DUTY_KEY,[]);
  if(!Array.isArray(m)) m=[];
  sel.innerHTML='<option value="">ممبر منتخب کریں...</option>';
  m.filter(function(x){return !x.onLeave;}).forEach(function(x){
    var lbl=x.name+' ('+(x.rank==='Senior'?'سینئر':'جونیئر')+')';
    sel.appendChild(new Option(lbl,x.id));
  });
  if(cur) sel.value=cur;
}

window.submitLeaveFromDash=function(){
  var id=$('leaveMemberSel').value;
  var reason=$('leaveReason').value.trim();
  if(!id){alert('⚠️ ممبر منتخب کریں');return;}
  if(!reason){alert('⚠️ وجہ لکھیں');return;}

  var m=ls(DUTY_KEY,[]);
  if(!Array.isArray(m)) m=[];
  var t=m.find(function(x){return String(x.id)===String(id);});
  if(!t){alert('⚠️ ممبر نہیں ملا');return;}
  if(t.onLeave){alert('⚠️ یہ ممبر پہلے ہی چھٹی پر ہے');return;}

  t.onLeave=true;
  t.leaveCount=(t.leaveCount||0)+1;

  if(t.onDuty){
    if(t.dutyStart){
      var h=ls(HIST_KEY,[]);
      if(!Array.isArray(h)) h=[];
      var s=new Date(t.dutyStart),e=new Date();
      h.push({name:t.name,rank:t.rank,
        start:pad(s.getHours())+':'+pad(s.getMinutes()),
        end:pad(e.getHours())+':'+pad(e.getMinutes()),
        reason:'leave'});
      if(h.length>100) h=h.slice(-100);
      lss(HIST_KEY,h);
    }
    t.onDuty=false; t.dutyStart=null;
  }

  var l=ls(LEAVE_KEY,[]);
  if(!Array.isArray(l)) l=[];
  var d=new Date();
  l.push({
    id:Date.now(),
    name:t.name, rank:t.rank,
    date:pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes()),
    day:getDayName(d),
    reason:reason,
    status:'leave',
    ts:d.getTime()
  });
  lss(LEAVE_KEY,l);
  lss(DUTY_KEY,m);

  var next=m.filter(function(x){return x.rank==='Junior' && !x.onLeave && !x.onDuty;});
  if(!next.length) next=m.filter(function(x){return x.rank==='Senior' && !x.onLeave && !x.onDuty;});
  if(next.length && t.rank==='Junior'){
    next.sort(function(a,b){return (a.dutyCount||0)-(b.dutyCount||0);});
    var n=next[0];
    n.onDuty=true;n.dutyStart=Date.now();n.dutyCount=(n.dutyCount||0)+1;
    lss(DUTY_KEY,m);
  }

  $('leaveMemberSel').value='';
  $('leaveReason').value='';
  updateDuty();
  populateLeaveDropdown();
  renderTodayLeaves();
  alert('✅ '+t.name+' چھٹی پر چلا گیا');
};

function renderTodayLeaves(){
  var box=$('todayLeavesList');
  if(!box) return;
  var l=ls(LEAVE_KEY,[]);
  if(!Array.isArray(l)) l=[];
  var d=new Date();
  var todayPrefix=pad(d.getDate())+'/'+pad(d.getMonth()+1);
  var todayL=l.filter(function(x){
    var s=String(x.date||'');
    return s.indexOf(todayPrefix)===0;
  });
  if($('leaveCount')) $('leaveCount').textContent=todayL.length;
  if(!todayL.length){
    box.innerHTML='<div class="empty-note">آج کوئی چھٹی نہیں</div>';
    return;
  }
  box.innerHTML=todayL.map(function(x){
    return '<div class="leave-item">'+
      '<span class="name">🏖️ '+esc(x.name)+' <small style="color:#92400e;">('+esc(x.rank==='Senior'?'سینئر':'جونیئر')+')</small></span>'+
      (x.reason?'<span class="reason">'+esc(x.reason)+'</span>':'')+
    '</div>';
  }).join('');
}

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
function boot(){
  updateNews();
  checkNewNews();
  updateDuty();
  populateLeaveDropdown();
  renderTodayLeaves();

  setTimeout(function(){showAlert();},1200);

  window.addEventListener('storage',function(e){
    if(e.key===NEWS_KEY){updateNews();checkNewNews();}
    if(e.key===DUTY_KEY||e.key===LEAVE_KEY){
      updateDuty();populateLeaveDropdown();renderTodayLeaves();
    }
  });

  setInterval(function(){updateNews();checkNewNews();},5000);
  setInterval(updateDuty,1000);
  setInterval(populateLeaveDropdown,5000);
  setInterval(renderTodayLeaves,5000);
  setInterval(checkComplaints,20000);
  checkComplaints();
}

document.addEventListener('click',function unlock(){
  try{var c=new (window.AudioContext||window.webkitAudioContext)();if(c.state==='suspended')c.resume();}catch(e){}
  document.removeEventListener('click',unlock);
},{once:true});

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
</body>
</html>
