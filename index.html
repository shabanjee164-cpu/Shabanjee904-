<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفیشنل فیملی ٹاسک ہسٹری اینڈ پوائنٹس سسٹم</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --danger: #ef4444;
            --success: #10b981;
            --success-gradient: linear-gradient(135deg, #10b981, #059669);
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #e2e8f0;
            --radius: 18px;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 25px; line-height: 1.6; }

        .container { max-width: 850px; margin: 0 auto; }

        /* شاندار ایپ ہیডার */
        .app-header {
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            color: white; text-align: center;
            padding: 24px; border-radius: var(--radius); font-size: 24px; font-weight: bold;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.2); margin-bottom: 24px;
            border-bottom: 4px solid var(--accent);
            letter-spacing: 0.5px;
        }

        /* مین ہسٹری کارڈ (خوبصورت کلر شیڈ کے ساتھ) */
        .card {
            background: linear-gradient(135deg, #ffffff, #fdf4ff); padding: 28px; border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.08); margin-bottom: 24px; 
            border: 2px solid #e9d5ff;
            position: relative; overflow: hidden;
            transition: all 0.3s ease;
        }
        .card::before {
            content: ''; position: absolute; top: 0; right: 0; width: 6px; height: 100%;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }

        .card-header-flex {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f3e8ff; padding-bottom: 14px; margin-bottom: 20px;
        }
        .card h3 { margin: 0; color: #6d28d9; font-size: 20px; font-weight: 700; }

        /* خوبصورت سیٹنگ پرو بٹن */
        .setting-btn-pro {
            background: #faf5ff; border: 1px solid #d8b4fe; color: #7c3aed;
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold;
            transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(124, 58, 237, 0.1);
        }
        .setting-btn-pro:hover { background: #f3e8ff; transform: translateY(-1px); }

        /* کنٹرولز سیکشن (ڈراپ ڈاؤن اور ڈیٹس) */
        .controls-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            background: #ffffff; padding: 18px; border-radius: 14px; border: 1px solid #e9d5ff;
            margin-bottom: 20px; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.03);
        }

        /* پروفیشنل کلر فل ڈراپ ڈاؤن */
        .dropdown-center {
            width: 250px; padding: 10px 14px; border-radius: 10px; 
            border: 2px solid #c084fc;
            font-size: 14px; font-weight: bold; text-align: center; 
            background: linear-gradient(135deg, #ffffff, #faf5ff); 
            color: var(--primary); outline: none; cursor: pointer;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.08);
            transition: all 0.3s;
        }
        .dropdown-center:hover, .dropdown-center:focus { border-color: #7c3aed; background: #ffffff; }

        .date-filter-group {
            display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%;
            font-size: 13px; font-weight: 600; color: var(--primary);
        }
        .date-input {
            padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; background: #fff; color: var(--primary); font-weight: 600;
        }

        /* شاندار ٹیبل اسٹائل */
        .clean-result-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 14px; }
        .clean-result-table th { background: #f3e8ff; color: #6d28d9; padding: 12px; text-align: center; font-weight: 700; border-bottom: 2px solid #e9d5ff; }
        .clean-result-table td { padding: 14px 12px; text-align: center; background: #ffffff; border-top: 1px solid #f3e8ff; border-bottom: 1px solid #f3e8ff; box-shadow: 0 2px 5px rgba(0,0,0,0.01); }
        .clean-result-table tr td:first-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        .clean-result-table tr td:last-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }

        /* گرینڈ ٹوٹل باکس */
        .grand-total-box {
            margin-top: 20px; background: linear-gradient(135deg, #f3e8ff, #ede9fe); 
            border: 2px solid #d8b4fe; padding: 16px 20px;
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 16px; color: #6d28d9;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ایپ ہیڈر -->
        <div class="app-header">🌟 فیملی اسمارٹ ہسٹری اینڈ پوائنٹس سسٹم</div>

        <!-- ہسٹری کارڈ (کلر فل اور خوبصورت) -->
        <div class="card" id="historyCardSection">
            
            <div class="card-header-flex">
                <h3>⭐ ممبر ہسٹری، کارکردگی اور پوائنٹس رکارڈ</h3>
                <!-- سیٹنگز کا بٹن (تمام فیچرز کے ساتھ) -->
                <button class="setting-btn-pro" onclick="openAllFeaturesSettings()">⚙️ سیٹنگز (مینج، سلیکٹ، ڈیلیٹ، ترتیب)</button>
            </div>

            <!-- ڈراپ لائن اور ڈیٹ فلٹرز -->
            <div class="controls-wrapper">
                <div>
                    <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 6px; text-align: center; color: var(--primary);">🔍 ممبر منتخب کریں (ڈراپ ڈاؤن):</label>
                    <select id="selectedMember" class="dropdown-center" onchange="renderMemberRecord()">
                        <option value="علی">👨‍✈️ علی (سینئر)</option>
                        <option value="احمد">🧑‍ ہیلپر: احمد</option>
                    </select>
                </div>

                <div class="date-filter-group">
                    <span>فرسٹ ڈیٹ: <input type="date" id="startDate" class="date-input" value="2026-09-01" onchange="renderMemberRecord()"></span>
                    <span>لاسٹ ڈیٹ: <input type="date" id="endDate" class="date-input" value="2026-09-10" onchange="renderMemberRecord()"></span>
                </div>
            </div>

            <!-- رکارڈ ٹیبل -->
            <table class="clean-result-table">
                <thead>
                    <tr>
                        <th>انتخاب / سلیکٹ</th>
                        <th>کام کا نام (Task)</th>
                        <th>فی کام پوائنٹ</th>
                        <th>کتنی بار ہوا (Count)</th>
                        <th>کل پوائنٹس (Total)</th>
                    </tr>
                </thead>
                <tbody id="memberRecordTableBody">
                    <!-- ڈیٹا یہاں شو ہوگا -->
                </tbody>
            </table>

            <!-- کل ٹوٹل پوائنٹس باکس -->
            <div class="grand-total-box">
                <span>🎯 تمام کاموں کے مجموعی پوائنٹس (Grand Total):</span>
                <span id="grandTotalPointsDisplay" style="font-size: 20px;">0 ⭐</span>
            </div>

        </div>

    </div>

    <script>
        // ماسٹر ڈیٹا بیس
        let masterTaskRecords = [
            { id: 1, member: "علی", taskName: "کمرے کی مکمل صفائی", pointsPerUnit: 15, frequency: 3, date: "2026-09-02" },
            { id: 2, member: "علی", taskName: "راشن انوینٹری چیک", pointsPerUnit: 10, frequency: 2, date: "2026-09-05" },
            { id: 3, member: "احمد", taskName: "شام کی چائے بنانا", pointsPerUnit: 10, frequency: 4, date: "2026-09-03" },
            { id: 4, member: "احمد", taskName: "کچن کاؤنٹر صفائی", pointsPerUnit: 5, frequency: 5, date: "2026-09-06" }
        ];

        // ریکارڈ رینڈر کرنے کا فنکشن (سلیکٹ باکس کے ساتھ)
        function renderMemberRecord() {
            let currentMember = document.getElementById('selectedMember').value;
            let start = document.getElementById('startDate').value;
            let end = document.getElementById('endDate').value;
            
            let tbody = document.getElementById('memberRecordTableBody');
            let grandTotal = 0;

            let filteredData = masterTaskRecords.filter(item => {
                return item.member === currentMember && item.date >= start && item.date <= end;
            });

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="color: #64748b; padding: 25px;">اس تاریخ اور ممبر کا کوئی ریکارڈ موجود نہیں۔</td></tr>`;
                document.getElementById('grandTotalPointsDisplay').innerText = "0 ⭐";
                return;
            }

            tbody.innerHTML = filteredData.map((item) => {
                let totalTaskPoints = item.pointsPerUnit * item.frequency;
                grandTotal += totalTaskPoints;
                return `
                    <tr>
                        <td><input type="checkbox" class="row-select-checkbox" data-id="${item.id}" style="width: 18px; height: 18px; cursor: pointer;"></td>
                        <td><b style="color: var(--primary);">${item.taskName}</b></td>
                        <td><span style="background: #f3e8ff; padding: 4px 10px; border-radius: 6px; color: #6d28d9; font-weight: bold;">${item.pointsPerUnit}</span></td>
                        <td><span style="background: #ede9fe; color: #5b21b6; padding: 4px 10px; border-radius: 6px; font-weight: bold;">${item.frequency} بار</span></td>
                        <td><span style="color: var(--success); font-weight: bold; font-size: 15px;">${totalTaskPoints} ⭐</span></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('grandTotalPointsDisplay').innerText = grandTotal + " ⭐";
        }

        // تمام فیچرز پر مشتمل مکمل اور آسان سیٹنگز مینو
        function openAllFeaturesSettings() {
            let choice = prompt(
                "⚙️ [ماسٹر سیٹنگز مینو]\n\n" +
                "1. سب کو سلیکٹ کریں (Select All)\n" +
                "2. سلیکٹ شدہ آئٹمز ڈیلیٹ کریں (Delete Selected)\n" +
                "3. کام کا نام تبدیل کریں (Rename Task)\n" +
                "4. تمام ہسٹری صاف کریں (Delete All History)\n" +
                "5. ریکارڈ سیکشن بند کریں / کھولें (Toggle Section View)\n" +
                "6. ترتیب سیٹ کریں (Sort Order / Tarteeb)\n\n" +
                "نمبر درج کریں (1 تا 6):"
            );

            if(choice === "1") {
                // سلیکٹ آل
                let checkboxes = document.querySelectorAll('.row-select-checkbox');
                checkboxes.forEach(cb => cb.checked = true);
                alert("✅ تمام ریکارڈ سلیکٹ ہو گئے ہیں!");
            }
            else if(choice === "2") {
                // ایک یا سلیکٹ شدہ ڈیلیٹ کرنا
                let checkboxes = document.querySelectorAll('.row-select-checkbox:checked');
                if(checkboxes.length === 0) {
                    alert("⚠️ براہ کرم پہلے کسی ریکارڈ کے باکس کو ٹک (Select) کریں!");
                    return;
                }
                if(confirm("کیا آپ واقعی سلیکٹ شدہ ریکارڈ ڈیلیٹ کرنا چاہتے ہیں؟")) {
                    checkboxes.forEach(cb => {
                        let id = parseInt(cb.getAttribute('data-id'));
                        masterTaskRecords = masterTaskRecords.filter(x => x.id !== id);
                    });
                    renderMemberRecord();
                    alert("🗑️ سلیکٹ شدہ ریکارڈ ڈیلیٹ کر دیا گیا!");
                }
            }
            else if(choice === "3") {
                // نام تبدیل کرنا (Rename)
                let oldName = prompt("جس کام کا نام تبدیل کرنا ہے وہ ہو بہو لکھیں:");
                let record = masterTaskRecords.find(x => x.taskName === oldName);
                if(record) {
                    let newName = prompt("نیا نام درج کریں:", record.taskName);
                    if(newName) {
                        record.taskName = newName;
                        renderMemberRecord();
                        alert("✅ کام کا نام کامیابی سے تبدیل ہو گیا!");
                    }
                } else {
                    alert("❌ اس نام کا کوئی کام نہیں ملا!");
                }
            }
            else if(choice === "4") {
                // تمام ہسٹری ڈیلیٹ (Delete All)
                if(confirm("⚠️ کیا آپ واقعی تمام ہسٹری کو ہمیشہ کے لیے صاف کرنا چاہتے ہیں؟")) {
                    masterTaskRecords = [];
                    renderMemberRecord();
                    alert("🧹 تمام ہسٹری صاف کر دی گئی ہے!");
                }
            }
            else if(choice === "5") {
                // سیکشن بند کرنا یا کھولنا (Close / Open Section)
                let card = document.getElementById('historyCardSection');
                if(card.style.display === "none") {
                    card.style.display = "block";
                    alert("📂 ہسٹری سیکشن کھول دیا گیا ہے!");
                } else {
                    card.style.display = "none";
                    alert("📁 ہسٹری سیکشن بند کر دیا گیا ہے (دوباره کھولنے کے لیے یہ آپشن دوبارہ سلیکٹ کریں)!");
                }
            }
            else if(choice === "6") {
                // ترتیب سیٹ کرنا (Tarteeb - نام یا پوائنٹس کے لحاظ سے)
                let sortType = prompt("ترتیب کا طریقہ منتخب کریں:\n1. پوائنٹس کے لحاظ سے ترتیب (زیادہ سے کم)\n2. کام کے نام کے لحاظ سے ترتیب (الف ب ج)\n\n1 یا 2 درج کریں:");
                if(sortType === "1") {
                    masterTaskRecords.sort((a, b) => (b.pointsPerUnit * b.frequency) - (a.pointsPerUnit * a.frequency));
                    renderMemberRecord();
                    alert("🔄 پوائنٹس کے حساب سے ترتیب دے دی گئی ہے!");
                } else if(sortType === "2") {
                    masterTaskRecords.sort((a, b) => a.taskName.localeCompare(b.taskName));
                    renderMemberRecord();
                    alert("🔄 نام کے حساب سے ترتیب دے دی گئی ہے!");
                }
            }
        }

        // پیج لوڈ ہونے پر ڈیٹا شو ہو
        window.onload = function() {
            renderMemberRecord();
        }
    </script>
</body>
</html>
