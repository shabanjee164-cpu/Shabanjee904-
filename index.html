<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>مکمل ڈیش بورڈ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Naskh Arabic',sans-serif;
  direction:rtl;background:#eef2f6;color:#1e293b;
  display:flex;flex-direction:column;
}

/* ═══ TOP HEADER ═══ */
.app-header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
  position:sticky;top:0;z-index:50;
  flex-shrink:0;
}
.app-header .hamburger{
  background:rgba(255,255,255,.2);border:none;color:#fff;
  width:40px;height:40px;border-radius:10px;font-size:20px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.2s;
}
.app-header .hamburger:active{background:rgba(255,255,255,.35);transform:scale(.95)}
.app-header .app-title{font-size:17px;font-weight:800;letter-spacing:.3px}
.app-header .coming-btn{
  background:rgba(251,191,36,.95);border:none;color:#78350f;
  height:40px;padding:0 14px;border-radius:10px;font-size:12px;
  font-weight:800;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  transition:.2s;font-family:inherit;
  box-shadow:0 2px 8px rgba(251,191,36,.4);
  white-space:nowrap;
}
.app-header .coming-btn:active{transform:scale(.95);background:rgba(251,191,36,1)}
.app-header .coming-btn .spark{
  font-size:14px;
  animation:sparkle 1.8s infinite;
}
@keyframes sparkle{
  0%,100%{transform:scale(1) rotate(0deg);opacity:1}
  50%{transform:scale(1.2) rotate(15deg);opacity:.8}
}

/* ═══ MAIN CONTENT ═══ */
.app-main{
  flex:1;position:relative;overflow:hidden;background:#eef2f6;
}
.app-main iframe{
  width:100%;height:100%;border:none;display:block;background:#eef2f6;
}

/* ═══ BOTTOM NAV ═══ */
.bottom-nav{
  display:grid;grid-template-columns:repeat(4,1fr);
  background:#fff;border-top:1px solid #e2e8f0;
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
  flex-shrink:0;z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav button{
  background:transparent;border:none;padding:9px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;color:#94a3b8;font-family:inherit;
  transition:.2s;position:relative;
}
.bottom-nav button .nav-icon{font-size:20px;line-height:1}
.bottom-nav button .nav-label{font-size:10px;font-weight:700;letter-spacing:.2px}
.bottom-nav button.active{color:#2563eb}
.bottom-nav button.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:28px;height:3px;background:#2563eb;border-radius:0 0 4px 4px;
}
.bottom-nav button:active{background:#f1f5f9}

/* ═══ SIDE MENU ═══ */
.side-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.5);
  backdrop-filter:blur(2px);
  opacity:0;visibility:hidden;transition:.28s;z-index:100;
}
.side-overlay.open{opacity:1;visibility:visible}

.side-menu{
  position:fixed;top:0;right:0;height:100%;
  width:290px;max-width:85vw;
  background:#fff;z-index:110;
  transform:translateX(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  box-shadow:-6px 0 24px rgba(0,0,0,.18);
}
.side-menu.open{transform:translateX(0)}

.side-header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;padding:18px 16px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.side-header .side-title{font-size:16px;font-weight:800}
.side-header .close-btn{
  background:rgba(255,255,255,.2);border:none;color:#fff;
  width:34px;height:34px;border-radius:8px;font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.side-header .close-btn:active{background:rgba(255,255,255,.35)}

.side-body{
  flex:1;overflow-y:auto;padding:10px 0;
  display:flex;flex-direction:column;
}
.side-coming{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;padding:30px 20px;text-align:center;
}
.side-coming .coming-icon{
  font-size:70px;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
.side-coming .coming-title{
  font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.side-coming .coming-sub{
  font-size:12px;color:#94a3b8;line-height:1.8;
  font-weight:600;max-width:220px;
}

.side-footer{
  padding:12px 18px;border-top:1px solid #e2e8f0;
  font-size:11px;color:#94a3b8;text-align:center;flex-shrink:0;
  background:#f8fafc;
}

/* ═══ TOAST ═══ */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1e293b;color:#fff;padding:10px 20px;border-radius:30px;
  font-size:12px;font-weight:700;z-index:200;
  opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ═══ TOP HEADER ═══ -->
<header class="app-header">
  <button class="hamburger" onclick="openSideMenu()" aria-label="مینو">☰</button>
  <div class="app-title" id="headerTitle">ڈیش بورڈ</div>
  <button class="coming-btn" onclick="showComingSoon('Feature')">
    <span class="spark">✨</span>
    <span>Coming Soon</span>
  </button>
</header>

<!-- ═══ MAIN CONTENT ═══ -->
<main class="app-main" id="appMain">
  <iframe id="contentFrame" title="content"></iframe>
</main>

<!-- ═══ SIDE OVERLAY ═══ -->
<div class="side-overlay" id="sideOverlay" onclick="closeSideMenu()"></div>

<!-- ═══ SIDE MENU ═══ -->
<aside class="side-menu" id="sideMenu" aria-label="سائیڈ مینو">
  <div class="side-header">
    <div class="side-title">📋 مینو</div>
    <button class="close-btn" onclick="closeSideMenu()">✕</button>
  </div>
  <div class="side-body" id="sideBody">
    <div class="side-coming">
      <div class="coming-icon">🚧</div>
      <div class="coming-title">Coming Soon</div>
      <div class="coming-sub">یہ سیکشن جلد ہی دستیاب ہو گا۔</div>
    </div>
  </div>
  <div class="side-footer">ورژن 1.0 — مکمل ڈیش بورڈ</div>
</aside>

<!-- ═══ BOTTOM NAV ═══ -->
<nav class="bottom-nav">
  <button class="active" data-nav="dashboard" onclick="navigateTo('dashboard','dashboard.html','📊 ڈیش بورڈ')">
    <span class="nav-icon">📊</span>
    <span class="nav-label">ڈیش بورڈ</span>
  </button>
  <button data-nav="manager" onclick="navigateTo('manager','manager.html','👔 مینیجر')">
    <span class="nav-icon">👔</span>
    <span class="nav-label">مینیجر</span>
  </button>
  <button data-nav="dataentry" onclick="navigateTo('dataentry','entry.html','📝 ڈیٹا انٹری')">
    <span class="nav-icon">📝</span>
    <span class="nav-label">ڈیٹا انٹری</span>
  </button>
  <button data-nav="history" onclick="navigateTo('history','history.html','📜 ہسٹری')">
    <span class="nav-icon">📜</span>
    <span class="nav-label">ہسٹری</span>
  </button>
</nav>

<!-- ═══ TOAST ═══ -->
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

function openSideMenu(){
  $('sideMenu').classList.add('open');
  $('sideOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSideMenu(){
  $('sideMenu').classList.remove('open');
  $('sideOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeSideMenu();
});

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}
function showComingSoon(name){
  showToast('✨ ' + (name || 'Feature') + ' — Coming Soon');
}

function setActiveBottomNav(target){
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector('.bottom-nav button[data-nav="' + target + '"]');
  if(btn) btn.classList.add('active');
}

function navigateTo(sectionId, file, title){
  $('headerTitle').textContent = title || 'ڈیش بورڈ';
  setActiveBottomNav(sectionId);
  closeSideMenu();

  const iframe = $('contentFrame');
  if(file){
    iframe.src = file + '?t=' + Date.now();
  }
}

// Swipe from right edge
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if(Math.abs(dx) > 60 && Math.abs(dy) < 50){
    if(dx < 0 && $('sideMenu').classList.contains('open')) closeSideMenu();
    else if(dx > 0 && !$('sideMenu').classList.contains('open') && touchStartX < 40) openSideMenu();
  }
}, {passive:true});

// Load dashboard on start
window.addEventListener('load', () => {
  navigateTo('dashboard','dashboard.html','📊 ڈیش بورڈ');
});
</script>
</body>
</html>
