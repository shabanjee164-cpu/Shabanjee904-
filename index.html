<!DOCTYPE html>
<html>
<head>
   <title>VueJS | v-html directive</title>
   <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>
<body>
   <div id="app">
       <div v-html="htmlContent"></div>
   </div>
   <script>
       var app = new Vue({
           el: '#app',
           data: {
               htmlContent: '<h1>Hello <span style="color:blue;">World</span></h1>'
           }
       });
   </script>
</body>
</html>
