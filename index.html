<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کسٹম مینجمنٹ ایپ</title>
    <style>
        body {
            font-family: 'Jameel Noori Nastaleeq', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .box {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            position: relative;
        }
        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .settings-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .settings-btn:hover { background: #5a6268; }
        input, select, button {
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button.primary-btn {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button.primary-btn:hover { background: #0056b3; }
        table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: center;
        }
        th { background: #e9ecef; }
        .small-view { font-size: 12px; }
        .large-view { font-size: 16px; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    
    <!-- پوائنٹ 6: ممبر مینجمنٹ باکس -->
    <div class="box" id="boxMember">
        <div class="box-header">
            <h3>ممبر مینجمنٹ</h3>
            <button class="settings-btn" onclick="toggleSettings('boxMember')">سیٹنگز</button>
        </div>
        <div class="box-content">
            <input type="text" id="newMemberName" placeholder="نیا ممبر نام درج کریں">
            <button class="primary-btn" onclick="addMember()">ممبر محفوظ کریں</button>
            <ul id="memberList"></ul>
        </div>
    </div>

    <!-- پوائنٹس 1 & 2: ٹاسک اور پوائنٹ ٹریکنگ -->
    <div class="box" id="boxTask">
        <div class="box-header">
            <h3>ٹاسک اور پوائنٹ ٹریکنگ</h3>
            <button class="settings-btn" onclick="toggleSettings('boxTask')">سیٹنگز</button>
        </div>
        <div class="box-content">
            <select id="taskMemberSelect"><option value="">ممبر منتخب کریں</option></select>
            <select id="taskType">
                <option value="یومیہ کام">یومیہ کام</option>
                <option value="معمولی کام">معمولی کام</option>
            </select>
            <input type="number" id="taskPoints" placeholder="پوائنٹس درج کریں">
            <button class="primary-btn" onclick="addTask()">محفوظ کریں</button>
            <table id="taskTable">
                <tr><th>ممبر</th><th>کام کی قسم</th><th>پوائنٹس</th></tr>
            </table>
        </div>
    </div>

    <!-- پوائنٹ 3: شاپنگ اور بجٹ لسٹ -->
    <div class="box" id="boxShopping">
        <div class="box-header">
            <h3>شاپنگ اور بجٹ لسٹ</h3>
            <button class="settings-btn" onclick="toggleSettings('boxShopping')">سیٹنگز</button>
        </div>
        <div class="box-content">
            <input type="number" id="totalBudget" placeholder="کل بجٹ (رقم)">
            <input type="text" id="shopItem" placeholder="چیز کا نام">
            <input type="number" id="shopQty" placeholder="مقدار (Quantity)">
            <input type="number" id="shopPrice" placeholder="قیمت (Price)">
            <button class="primary-btn" onclick="addShoppingItem()">بل میں شامل کریں</button>
            <table id="shopTable">
                <tr><th>چیز</th><th>مقدار</th><th>قیمت</th></tr>
            </table>
            <h4>کل بل: <span id="finalBill">0</span></h4>
            <h4>بقیہ بجٹ: <span id="remainingBudget">0</span></h4>
        </div>
    </div>

    <!-- پوائنٹ 5: جھگڑے یا واقعے کا ریکارڈ باکس -->
    <div class="box" id="boxConflict">
        <div class="box-header">
            <h3>جھگڑے / واقعے کا ریکارڈ</h3>
            <button class="settings-btn" onclick="toggleSettings('boxConflict')">سیٹنگز</button>
        </div>
        <div class="box-content">
            <select id="conflictMemberSelect"><option value="">ممبر منتخب کریں</option></select>
            <input type="text" id="conflictReason" placeholder="جھگڑے کی وجہ اور تفصیل">
            <button class="primary-btn" onclick="addConflict()">ریکارڈ محفوظ کریں</button>
            <table id="conflictTable">
                <tr><th>ممبر</th><th>وجہ/تفصیل</th><th>تاریخ</th></tr>
            </table>
            <p id="conflictResult">نتیجہ: اس ماہ کل جھگڑے: 0 | بہتری: 0%</p>
        </div>
    </div>

</div>

<script>
    let members = [];

    function addMember() {
        let name = document.getElementById('newMemberName').value;
        if(name) {
            members.push(name);
            updateMemberDropdowns();
            let ul = document.getElementById('memberList');
            let li = document.createElement('li');
            li.textContent = name;
            ul.appendChild(li);
            document.getElementById('newMemberName').value = '';
        }
    }

    function updateMemberDropdowns() {
        let taskSel = document.getElementById('taskMemberSelect');
        let confSel = document.getElementById('conflictMemberSelect');
        taskSel.innerHTML = '<option value="">ممبر منتخب کریں</option>';
        confSel.innerHTML = '<option value="">ممبر منتخب کریں</option>';
        members.forEach(m => {
            taskSel.innerHTML += `<option value="${m}">${m}</option>`;
            confSel.innerHTML += `<option value="${m}">${m}</option>`;
        });
    }

    function addTask() {
        let member = document.getElementById('taskMemberSelect').value;
        let type = document.getElementById('taskType').value;
        let points = document.getElementById('taskPoints').value;
        if(member && points) {
            let table = document.getElementById('taskTable');
            table.innerHTML += `<tr><td>${member}</td><td>${type}</td><td>${points}</td></tr>`;
        }
    }

    function addShoppingItem() {
        let item = document.getElementById('shopItem').value;
        let qty = parseFloat(document.getElementById('shopQty').value) || 0;
        let price = parseFloat(document.getElementById('shopPrice').value) || 0;
        let budget = parseFloat(document.getElementById('totalBudget').value) || 0;

        if(item && price) {
            let table = document.getElementById('shopTable');
            let itemTotal = qty * price;
            table.innerHTML += `<tr><td>${item}</td><td>${qty}</td><td>${itemTotal}</td></tr>`;
            
            let currentBill = 0;
            let rows = table.rows;
            for(let i=1; i<rows.length; i++) {
                currentBill += parseFloat(rows[i].cells[2].textContent) || 0;
            }
            document.getElementById('finalBill').textContent = currentBill;
            document.getElementById('remainingBudget').textContent = budget - currentBill;
        }
    }

    function addConflict() {
        let member = document.getElementById('conflictMemberSelect').value;
        let reason = document.getElementById('conflictReason').value;
        let date = new Date().toLocaleDateString();
        if(member && reason) {
            let table = document.getElementById('conflictTable');
            table.innerHTML += `<tr><td>${member}</td><td>${reason}</td><td>${date}</td></tr>`;
            
            let rowCount = table.rows.length - 1;
            document.getElementById('conflictResult').textContent = `نتیجہ: اس ماہ کل جھگڑے: ${rowCount} | بہتری کی شرح ٹریک ہو رہی ہے`;
        }
    }

    function toggleSettings(boxId) {
        let box = document.getElementById(boxId);
        let action = prompt("سیٹنگز مینو:\n1. سائز بڑا/چھوٹا کریں (large/small)\n2. باکس بند کریں (close)\n3. ڈیلیٹ کریں (delete)");
        if(action === 'large') {
            box.classList.add('large-view');
            box.classList.remove('small-view');
        } else if(action === 'small') {
            box.classList.add('small-view');
            box.classList.remove('large-view');
        } else if(action === 'close' || action === 'delete') {
            box.style.display = 'none';
        }
    }
</script>

</body>
</html>
