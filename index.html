<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسمارٹ فیملی - ممبر رکارڈ پوائنٹس سسٹم</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --danger: #dc2626;
            --success: #059669;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #334155;
            --border: #cbd5e1;
            --radius: 16px;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }

        .container { max-width: 800px; margin: 0 auto; }

        .app-header {
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            color: white; text-align: center;
            padding: 20px; border-radius: var(--radius); font-size: 22px; font-weight: bold;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15); margin-bottom: 20px;
            border-bottom: 4px solid var(--accent);
        }

        .card {
            background: var(--card); padding: 24px; border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 20px; border: 1px solid var(--border);
            position: relative;
        }

        .card-header-flex {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 16px;
        }
        .card h3 { margin: 0; color: var(--primary); font-size: 18px; }

        /* سیٹنگ پرو بٹن */
        .setting-btn-pro {
            background: #f8fafc; border: 1px solid var(--border); color: var(--primary);
            padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold;
            transition: all 0.2s;
        }
        .setting-btn-pro:hover { background: #e2e8f0; }

        /* کنٹرولز سیکشن (ڈراپ ڈاؤن اور ڈیٹس) */
        .controls-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .dropdown-center {
            width: 220px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
            font-size: 14px; font-weight: bold; text-align: center; background: #fff; color: var(--primary);
            outline: none; cursor: pointer;
        }
        .dropdown-center:focus { border-color: var(--accent); }

        .date-filter-group {
            display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%;
            font-size: 13px; font-weight: 600; color: var(--primary);
        }
        .date-input {
            padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; background: #fff;
        }

        /* ٹیبل اسٹائل */
        .clean-result-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 13px; }
        .clean-result-table th { background: #f1f5f9; color: var(--primary); padding: 10px; text-align: center; font-weight: 700; border-bottom: 2px solid var(--border); }
        .clean-result-table td { padding: 12px 10px; text-align: center; background: #fff; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }

        /* گرینڈ ٹوٹل باکس */
        .grand-total-box {
            margin-top: 16px; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 14px;
            border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 15px; color: #065f46;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ایپ ہیڈر -->
        <div class="app-header">📊 ممبر ٹاسک اینڈ پوائنٹس ریکارڈ سسٹم</div>

        <!-- ریکارڈ کارڈ -->
        <div class="card" style="border-right: 5px solid var(--success);">
            
            <div class="card-header-flex">
                <h3 style="color: var(--success);">⭐ ممبر کا کارکردگی اور پوائنٹس رکارڈ</h3>
                <!-- سیٹنگز کا بٹن -->
                <button class="setting-btn-pro" onclick="openRecordSettings()">⚙️ سیٹنگز (مینج / ڈیلیٹ / ایڈٹ)</button>
            </div>

            <!-- ڈراپ لائن اور ڈیٹ فلٹرز -->
            <div class="controls-wrapper">
                <div>
                    <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px; text-align: center;">ممبر سلیکٹ کریں:</label>
                    <select id="selectedMember" class="dropdown-center" onchange="renderMemberRecord()">
                        <option value="علی">علی (سینئر)</option>
                        <option value="احمد">احمد (ہیلپر)</option>
                    </select>
                </div>

                <div class="date-filter-group">
                    <span>فرسٹ ڈیٹ: <input type="date" id="startDate" class="date-input" value="2026-09-01" onchange="renderMemberRecord()"></span>
                    <span>لاسٹ ڈیٹ: <input type="date" id="endDate" class="date-input" value="2026-09-07" onchange="renderMemberRecord()"></span>
                </div>
            </div>

            <!-- رکارڈ ٹیبل -->
            <table class="clean-result-table">
                <thead>
                    <tr>
                        <th>کام کا نام (Task)</th>
                        <th>فی کام پوائنٹ</th>
                        <th>کتنی بار ہوا (Count)</th>
                        <th>کل پوائنٹس (Total)</th>
                    </tr>
                </thead>
                <tbody id="memberRecordTableBody">
                    <!-- جاویاسکریپٹ کے ذریعے ڈیٹا یہاں آئے گا -->
                </tbody>
            </table>

            <!-- کل ٹوٹل پوائنٹس باکس -->
            <div class="grand-total-box">
                <span>🎯 تمام کاموں کے مجموعی پوائنٹس (Grand Total):</span>
                <span id="grandTotalPointsDisplay">0 ⭐</span>
            </div>

        </div>

    </div>

    <script>
        // فرضی ڈیٹا بیس (جو ممبر کے ریکارڈ کو ہینڈل کرے گا)
        let masterTaskRecords = [
            { member: "علی", taskName: "کمرے کی مکمل صفائی", pointsPerUnit: 15, frequency: 3, date: "2026-09-02" },
            { member: "علی", taskName: "راشن انوینٹری چیک", pointsPerUnit: 10, frequency: 2, date: "2026-09-05" },
            { member: "احمد", taskName: "شام کی چائے بنانا", pointsPerUnit: 10, frequency: 4, date: "2026-09-03" },
            { member: "احمد", taskName: "کچن کاؤنٹر صفائی", pointsPerUnit: 5, frequency: 5, date: "2026-09-06" }
        ];

        function renderMemberRecord() {
            let currentMember = document.getElementById('selectedMember').value;
            let start = document.getElementById('startDate').value;
            let end = document.getElementById('endDate').value;
            
            let tbody = document.getElementById('memberRecordTableBody');
            let grandTotal = 0;

            // ممبر اور ڈیٹ کے حساب سے فلٹر کریں
            let filteredData = masterTaskRecords.filter(item => {
                return item.member === currentMember && item.date >= start && item.date <= end;
            });

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color: #64748b; padding: 20px;">اس تاریخ اور ممبر کا کوئی ریکارڈ موجود نہیں۔</td></tr>`;
                document.getElementById('grandTotalPointsDisplay').innerText = "0 ⭐";
                return;
            }

            tbody.innerHTML = filteredData.map((item, index) => {
                let totalTaskPoints = item.pointsPerUnit * item.frequency;
                grandTotal += totalTaskPoints;
                return `
                    <tr>
                        <td><b>${item.taskName}</b></td>
                        <td>${item.pointsPerUnit}</td>
                        <td><span style="background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 6px; font-weight: bold;">${item.frequency} بار</span></td>
                        <td><span style="color: var(--success); font-weight: bold;">${totalTaskPoints} ⭐</span></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('grandTotalPointsDisplay').innerText = grandTotal + " ⭐";
        }

        // سیٹنگز مینیو (ڈیلیٹ، ایڈٹ، اسکپ)
        function openRecordSettings() {
            let action = prompt("⚙️ [رکارڈ سیٹنگ مینیو]\n1. ایک خاص کام کا نام تبدیل کریں (Rename Task)\n2. ایک انٹری ڈیلیٹ کریں (Delete Record)\n3. تمام رکارڈ صاف کریں (Clear All)\n4. کام کو اسکپ کریں (Skip Task)\n\nنمبر درج کریں (1 تا 4):");
            
            if(action === "1") {
                let oldName = prompt("جس کام کا نام تبدیل کرنا ہے وہ لکھیں:");
                let item = masterTaskRecords.find(x => x.taskName === oldName);
                if(item) {
                    let newName = prompt("نیا نام درج کریں:", item.taskName);
                    if(newName) { item.taskName = newName; renderMemberRecord(); alert("✅ نام تبدیل ہو گیا!"); }
                } else { alert("❌ کام نہیں ملا!"); }
            } 
            else if(action === "2") {
                let taskToDel = prompt("ڈیلیٹ کرنے والے کام کا نام لکھیں:");
                let idx = masterTaskRecords.findIndex(x => x.taskName === taskToDel);
                if(idx !== -1) {
                    masterTaskRecords.splice(idx, 1);
                    renderMemberRecord();
                    alert("🗑️ رکارڈ ڈیلیٹ کر دیا گیا!");
                } else { alert("❌ کام نہیں ملا!"); }
            }
            else if(action === "3") {
                if(confirm("کیا آپ واقعی تمام رکارڈ کلیئر کرنا چاہتے ہیں؟")) {
                    masterTaskRecords = [];
                    renderMemberRecord();
                }
            }
            else if(action === "4") {
                let skipTaskName = prompt("جس کام کو اسکپ (Skip) کرنا ہے اس کا نام لکھیں:");
                if(skipTaskName) {
                    alert(`⚠️ کام '${skipTaskName}' کو کامیابی کے ساتھ اسکپ کر دیا گیا ہے اور ہسٹری میں درج کر دیا گیا!`);
                }
            }
        }

        // جب پیج لوڈ ہو تو رکارڈ دکھائے
        window.onload = function() {
            renderMemberRecord();
        }
    </script>
</body>
</html>
