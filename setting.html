<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Button Only</title>
    <style>
        /* سیٹنگز بٹن کا ڈیزائن */
        .btn-settings {
            background-color: #2e7d32; /* سبز رنگ */
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, transform 0.1s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* ماؤس اوپر لانے پر رنگ تبدیل ہونا */
        .btn-settings:hover {
            background-color: #1b5e20;
        }

        /* کلک کرنے پر تھوڑا نیچے دبنا */
        .btn-settings:active {
            transform: scale(0.98);
        }

        /* بٹن کا آئیکن گھومنے کا اینیمیشن (Hover پر) */
        .btn-settings:hover .icon {
            transform: rotate(45deg);
            transition: transform 0.3s ease;
        }

        .icon {
            font-size: 18px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- صرف سیٹنگز کا بٹن -->
    <button class="btn-settings" onclick="openSettings()">
        <span class="icon">⚙️</span>
        <span>سیٹنگز (Settings)</span>
    </button>

    <script>
        // بٹن پر کلک کرنے کا کام
        function openSettings() {
            // یہاں آپ اپنے سیٹنگز پیج کا لنک لگا سکتے ہیں
            window.location.href = "setting.html";
        }
    </script>

</body>
</html>
