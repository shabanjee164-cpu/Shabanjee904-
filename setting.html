<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f6;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:10px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;direction:rtl}
#sec11MainCard{background:#fff;border:1px solid #cbd5e1;border-right:5px solid #0891b2;border-radius:14px;padding:14px 12px;box-shadow:0 8px 18px rgba(0,0,0,.06);width:100%;max-width:600px}
.sec11-header-bar{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f1f5f9;padding-bottom:8px;margin-bottom:12px;gap:6px}
.sec11-title{font-size:16px;font-weight:700;color:#1e293b}
.sec11-settings-btn{padding:5px 12px;font-size:11px;font-weight:700;border-radius:30px;border:1px solid #94a3b8;background:#f1f5f9;color:#0f172a;cursor:pointer}
.sec11-settings-panel{display:none;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:8px;margin-bottom:12px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:5px}
.sec11-settings-panel.active{display:grid}
.sec11-tool-btn{padding:6px 3px;font-size:10px;font-weight:700;border-radius:6px;border:1px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec11-tool-btn.danger{color:#ef4444;border-color:#fca5a5;background:#fef2f2}
.sec11-tool-btn.close-btn{color:#d97706;border-color:#fcd34d;background:#fffbeb}
.sec11-tool-btn.active-tool{background:#0891b2;color:#fff;border-color:#0891b2}
.sec11-tool-btn.save-live{background:#16a34a;color:#fff;border-color:#16a34a}
.sec11-subtitle{font-size:13px;font-weight:700;color:#0891b2;margin:12px 0 6px 0;padding-bottom:4px;border-bottom:2px dashed #a5f3fc}
.sec11-form-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
.sec11-input{padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-weight:600;outline:none;width:100%;background:#fff;height:42px;font-size:13px}
.sec11-save-btn{width:100%;padding:11px;background:#0891b2;color:#fff;font-size:14px;font-weight:700;border:none;border-radius:8px;cursor:pointer;margin-bottom:12px}
.sec11-save-btn.live{background:#16a34a}
.sec11-save-btn.budget{background:#7c3aed}
.sec11-list-container{max-height:280px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:10px;padding:5px;background:#fafafa;min-height:60px}
.sec11-list-item{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:9px 10px;margin-bottom:5px;font-size:13px;font-weight:600}
.selection-mode .sec11-list-item{cursor:pointer;border-color:#cbd5e1}
.selection-mode .sec11-list-item.selected-item{background:#cffafe;border-color:#0891b2}
.sec11-checkbox{width:15px;height:15px;cursor:pointer;accent-color:#0891b2;flex-shrink:0;display:none}
.selection-mode .sec11-checkbox{display:inline-block}
.sec11-num{background:#0891b2;color:#fff;font-size:10px;font-weight:700;min-width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
.sec11-name{color:#1e293b;font-weight:700;flex:1;word-break:break-word}
.sec11-edit-input{padding:5px 8px;border:1px solid #0891b2;border-radius:6px;font-size:12px;font-weight:600;outline:none;flex:1;min-width:80px}
.sec11-edit-btn{padding:4px 8px;font-size:11px;font-weight:700;border-radius:6px;border:none;cursor:pointer}
.sec11-edit-btn.save{background:#16a34a;color:#fff}
.sec11-edit-btn.cancel{background:#e2e8f0;color:#475569}
.sec11-budget-box{background:linear-gradient(135deg,#7c3aed,#6d28d9);border-radius:12px;padding:14px;color:#fff;margin-top:12px;margin-bottom:8px}
.sec11-budget-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px;font-weight:700;gap:8px}
.sec11-budget-row .val{font-size:18px}
.sec11-budget-edit-input{padding:4px 10px;border:2px solid #fff;border-radius:8px;font-size:16px;font-weight:700;outline:none;background:rgba(255,255,255,.15);color:#fff;width:140px;text-align:center}
.sec11-budget-ctrl{padding:5px 10px;font-size:11px;font-weight:700;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff;cursor:pointer;white-space:nowrap}
.sec11-budget-ctrl.save{background:#16a34a;border-color:#16a34a}
.sec11-budget-ctrl.reset{background:#dc2626;border-color:#dc2626}
.sec11-total-footer{margin-top:10px;padding:10px 12px;background:linear-gradient(135deg,#ecfeff,#cffafe);border:1px solid #67e8f9;border-radius:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.sec11-total-item{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#0e7490}
.sec11-total-item .num{background:#0891b2;color:#fff;padding:3px 14px;border-radius:20px;font-size:13px;min-width:36px;text-align:center}
.sec11-empty-msg{text-align:center;color:#94a3b8;font-size:12px;padding:20px 10px}
</style>
</head>
<body>

<div id="sec11MainCard">
  <div class="sec11-header-bar">
    <div class="sec11-title">⚙️ Settings</div>
    <button class="sec11-settings-btn" onclick="toggleSec11Settings()">⚙️ سیٹنگز</button>
  </div>

  <div class="sec11-settings-panel" id="sec11SettingsPanel">
    <button class="sec11-tool-btn" id="btnSec11SelectMode" onclick="sec11ToggleSelectMode()">☑️ سلیکٹ موڈ</button>
    <button class="sec11-tool-btn" onclick="sec11SelectAll(true)">✅ تمام سلیکٹ</button>
    <button class="sec11-tool-btn" onclick="sec11SelectAll(false)">⬜ سلیکشن ہٹائیں</button>
    <button class="sec11-tool-btn" onclick="sec11EditSelected()">✏️ ایڈٹ</button>
    <button class="sec11-tool-btn" onclick="sec11MoveOrder('up')">🔼 اوپر</button>
    <button class="sec11-tool-btn" onclick="sec11MoveOrder('down')">🔽 نیچے</button>
    <button class="sec11-tool-btn danger" onclick="sec11DeleteSelected()">🗑️ منتخب ڈیلیٹ</button>
    <button class="sec11-tool-btn danger" onclick="sec11DeleteAll(this)">❌ سب صاف کریں</button>
    <button class="sec11-tool-btn save-live" onclick="sec11SaveToRecords()">📤 سیو ٹو ریکارڈ</button>
    <button class="sec11-tool-btn close-btn" onclick="sec11CloseSection()">🚪 بند/کھولیں</button>
  </div>

  <div id="sec11ContentBody">
    <div class="sec11-subtitle">➕ نیا آٹم شامل کریں</div>
    <div class="sec11-form-grid">
      <input type="text" id="sec11NameInput" class="sec11-input" placeholder="آٹم کا نام...">
    </div>
    <button class="sec11-save-btn" onclick="sec11SaveItem()">💾 سیو کریں</button>

    <button class="sec11-save-btn live" onclick="sec11SaveToRecords()">📤 منتخب آٹم ریکارڈ میں سیو کریں</button>

    <div class="sec11-subtitle">📋 راشن لسٹ</div>
    <div class="sec11-list-container" id="sec11ListBody"></div>

    <div class="sec11-subtitle">💰 بجٹ شامل کریں</div>
    <div class="sec11-form-grid">
      <input type="number" id="sec11BudgetInput" class="sec11-input" placeholder="بجٹ رقم..." min="0">
    </div>
    <button class="sec11-save-btn budget" onclick="sec11SaveBudget()">💾 بجٹ سیو کریں</button>

    <div class="sec11-budget-box">
      <div class="sec11-budget-row" id="sec11BudgetDisplayRow">
        <span>💰 کل بجٹ</span>
        <span class="val" id="sec11BudgetVal">0</span>
        <div style="display:flex;gap:4px;">
          <button class="sec11-budget-ctrl" onclick="sec11EditBudget()">✏️ ایڈٹ</button>
          <button class="sec11-budget-ctrl reset" onclick="sec11ResetBudget(this)">🔄 ری سیٹ</button>
        </div>
      </div>
      <div class="sec11-budget-row" id="sec11BudgetEditRow" style="display:none;">
        <input type="number" id="sec11BudgetEditInput" class="sec11-budget-edit-input" min="0" placeholder="نیا بجٹ">
        <div style="display:flex;gap:4px;">
          <button class="sec11-budget-ctrl save" onclick="sec11SaveBudgetEdit()">✓ سیو</button>
          <button class="sec11-budget-ctrl" onclick="sec11CancelBudgetEdit()">✗</button>
        </div>
      </div>
    </div>

    <div class="sec11-total-footer">
      <div class="sec11-total-item">📋 کل آٹمز: <span class="num" id="sec11TotalItems">0</span></div>
    </div>
  </div>
</div>

<script>
(function(){
const KEY  = 'sec11_rashan_data_v2';
const BKEY = 'sec11_rashan_budget_v2';
const LIVE_KEY = 'rashan_live_records';

let items = [];
let budget = 0;
let selectMode = false;
let editingId = null;
let delPending = false;
let resetPending = false;

const $ = id => document.getElementById(id);

function load() {
  try {
    const d = localStorage.getItem(KEY);
    items = d ? JSON.parse(d) : [];
    if (!Array.isArray(items)) items = [];
    items.forEach(it => { if (typeof it.selected === 'undefined') it.selected = false; });
    budget = parseFloat(localStorage.getItem(BKEY)) || 0;
  } catch(e) { items = []; budget = 0; }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(items));
    localStorage.setItem(BKEY, String(budget));
  } catch(e) {}
}

function fmt(n) {
  if (isNaN(n)) return '0';
  return Number(n).toLocaleString('en-PK', { maximumFractionDigits: 2 });
}

function esc(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

window.toggleSec11Settings = function() {
  $('sec11SettingsPanel').classList.toggle('active');
};

window.sec11ToggleSelectMode = function() {
  selectMode = !selectMode;
  const b = $('btnSec11SelectMode');
  const c = $('sec11ListBody');
  if (selectMode) {
    b.classList.add('active-tool');
    b.textContent = '✅ سلیکٹ موڈ آن';
    c.classList.add('selection-mode');
  } else {
    b.classList.remove('active-tool');
    b.textContent = '☑️ سلیکٹ موڈ';
    c.classList.remove('selection-mode');
    items.forEach(it => it.selected = false);
    save();
  }
  renderAll();
};

function renderList() {
  const c = $('sec11ListBody');
  if (!c) return;
  c.innerHTML = '';
  c.classList.toggle('selection-mode', selectMode);

  if (!items.length) {
    c.innerHTML = '<div class="sec11-empty-msg">📭 کوئی آٹم موجود نہیں۔</div>';
    return;
  }

  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'sec11-list-item' + (it.selected ? ' selected-item' : '');

    if (editingId === it.id) {
      d.innerHTML =
        '<input type="text" class="sec11-edit-input" id="eN_' + it.id + '" value="' + esc(it.name) + '">' +
        '<button class="sec11-edit-btn save" onclick="sec11SaveInlineEdit(' + it.id + ')">✓</button>' +
        '<button class="sec11-edit-btn cancel" onclick="sec11CancelEdit()">✗</button>';
    } else {
      d.innerHTML =
        '<input type="checkbox" class="sec11-checkbox" ' + (it.selected ? 'checked' : '') +
        ' onchange="sec11ToggleSelect(' + it.id + ')">' +
        '<span class="sec11-num">' + (i + 1) + '</span>' +
        '<span class="sec11-name">' + esc(it.name) + '</span>';

      d.addEventListener('click', e => {
        if (!selectMode) return;
        if (e.target.type === 'checkbox') return;
        sec11ToggleSelect(it.id);
      });
    }
    c.appendChild(d);
  });

  if (editingId !== null) {
    const el = $('eN_' + editingId);
    if (el) { el.focus(); el.select(); }
  }
}

function renderAll() {
  renderList();
  $('sec11TotalItems').textContent = items.length;
  $('sec11BudgetVal').textContent = fmt(budget);
}

window.sec11ToggleSelect = function(id) {
  const it = items.find(x => x.id === id);
  if (it) { it.selected = !it.selected; save(); renderAll(); }
};

window.sec11SelectAll = function(st) {
  if (!items.length) return;
  if (st && !selectMode) sec11ToggleSelectMode();
  items.forEach(it => it.selected = st);
  save();
  renderAll();
};

window.sec11SaveItem = function() {
  const inp = $('sec11NameInput');
  const name = inp.value.trim();
  if (!name) {
    inp.style.borderColor = '#ef4444';
    inp.focus();
    setTimeout(() => { inp.style.borderColor = '#cbd5e1'; }, 1500);
    return;
  }
  items.unshift({ id: Date.now(), name: name, selected: false });
  save();
  inp.value = '';
  inp.focus();
  renderAll();
};

window.sec11SaveToRecords = function() {
  var selected = items.filter(function(it) { return it.selected; });

  if (!selected.length) {
    alert('⚠️ پہلے کوئی آٹم سلیکٹ کریں\n(سلیکٹ موڈ آن کریں، پھر آٹم کو دبائیں)');
    return;
  }

  var list = selected.map(function(it) {
    return { name: it.name, qty: '1', icon: '🛒' };
  });

  try {
    var recs = JSON.parse(localStorage.getItem(LIVE_KEY) || '[]');
    if (!Array.isArray(recs)) recs = [];
    recs.unshift({
      id: Date.now(),
      items: list,
      timestamp: Date.now()
    });
    localStorage.setItem(LIVE_KEY, JSON.stringify(recs));

    items.forEach(function(it) { it.selected = false; });
    save();
    renderAll();

    alert('✅ ' + list.length + ' آٹم ریکارڈ میں سیو ہو گئے!\nDashboard اور History میں دیکھیں۔');
  } catch(e) {
    alert('❌ Error: ' + e.message);
  }
};

window.sec11SaveBudget = function() {
  const inp = $('sec11BudgetInput');
  const val = parseFloat(inp.value);
  if (isNaN(val) || val < 0) {
    inp.style.borderColor = '#ef4444';
    setTimeout(() => { inp.style.borderColor = '#cbd5e1'; }, 1500);
    return;
  }
  budget += val;
  save();
  inp.value = '';
  inp.focus();
  renderAll();
};

window.sec11EditBudget = function() {
  $('sec11BudgetDisplayRow').style.display = 'none';
  $('sec11BudgetEditRow').style.display = 'flex';
  const inp = $('sec11BudgetEditInput');
  inp.value = budget;
  setTimeout(() => { inp.focus(); inp.select(); }, 50);
};

window.sec11SaveBudgetEdit = function() {
  const inp = $('sec11BudgetEditInput');
  const val = parseFloat(inp.value);
  if (isNaN(val) || val < 0) {
    inp.style.borderColor = '#ef4444';
    setTimeout(() => { inp.style.borderColor = '#fff'; }, 1200);
    return;
  }
  budget = val;
  save();
  sec11CancelBudgetEdit();
  renderAll();
};

window.sec11CancelBudgetEdit = function() {
  $('sec11BudgetDisplayRow').style.display = 'flex';
  $('sec11BudgetEditRow').style.display = 'none';
};

window.sec11ResetBudget = function(btn) {
  if (budget === 0) return;
  if (!resetPending) {
    resetPending = true;
    btn.textContent = '⚠️ دوبارہ';
    btn.style.background = '#b91c1c';
    setTimeout(() => {
      resetPending = false;
      btn.textContent = '🔄 ری سیٹ';
      btn.style.background = '';
    }, 2500);
    return;
  }
  budget = 0;
  save();
  renderAll();
  resetPending = false;
  btn.textContent = '🔄 ری سیٹ';
  btn.style.background = '';
};

window.sec11EditSelected = function() {
  const s = items.filter(it => it.selected);
  if (s.length !== 1) { flash(); return; }
  editingId = s[0].id;
  renderAll();
};

window.sec11SaveInlineEdit = function(id) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  const inp = $('eN_' + id);
  const nv = inp.value.trim();
  if (!nv) { inp.style.borderColor = '#ef4444'; return; }
  it.name = nv;
  it.selected = false;
  editingId = null;
  save();
  renderAll();
};

window.sec11CancelEdit = function() {
  editingId = null;
  renderAll();
};

window.sec11MoveOrder = function(dir) {
  const s = items.filter(it => it.selected);
  if (s.length !== 1) { flash(); return; }
  const i = items.findIndex(x => x.id === s[0].id);
  if (dir === 'up' && i > 0) {
    [items[i], items[i-1]] = [items[i-1], items[i]];
  } else if (dir === 'down' && i < items.length - 1) {
    [items[i], items[i+1]] = [items[i+1], items[i]];
  } else return;
  save();
  renderAll();
};

window.sec11DeleteSelected = function() {
  const s = items.filter(it => it.selected);
  if (!s.length) { flash(); return; }
  const ids = s.map(x => x.id);
  items = items.filter(it => !ids.includes(it.id));
  save();
  renderAll();
};

window.sec11DeleteAll = function(btn) {
  if (!items.length) return;
  if (!delPending) {
    delPending = true;
    btn.textContent = '⚠️ دوبارہ دبائیں';
    btn.style.background = '#dc2626';
    btn.style.color = '#fff';
    setTimeout(() => {
      delPending = false;
      btn.textContent = '❌ سب صاف کریں';
      btn.style.background = '';
      btn.style.color = '';
    }, 2500);
    return;
  }
  items = [];
  save();
  renderAll();
  delPending = false;
  btn.textContent = '❌ سب صاف کریں';
  btn.style.background = '';
  btn.style.color = '';
};

function flash() {
  const c = $('sec11ListBody');
  c.style.borderColor = '#ef4444';
  setTimeout(() => { c.style.borderColor = '#e2e8f0'; }, 1200);
}

window.sec11CloseSection = function() {
  const b = $('sec11ContentBody');
  const p = $('sec11SettingsPanel');
  const btn = document.querySelector('#sec11MainCard .sec11-settings-btn');
  if (b.style.display === 'none') {
    b.style.display = 'block';
    btn.textContent = '⚙️ سیٹنگز';
  } else {
    b.style.display = 'none';
    p.classList.remove('active');
    btn.textContent = '📂 سیکشن کھولیں';
  }
};

load();
renderAll();

})();
</script>

</body>
</html>
