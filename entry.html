<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entry - Duty</title>
<style>
:root{--primary:#1e293b;--accent:#7c3aed;--success:#10b981;--danger:#ef4444;--bg:#eef2f6;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:system-ui,sans-serif;padding:12px;direction:rtl;color:#334155;padding-bottom:80px;}
.container{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.app-header{background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;text-align:center;padding:16px;border-radius:12px;font-size:16px;font-weight:800;}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.05);}
.form-label{font-size:12px;font-weight:800;color:#334155;display:block;margin-bottom:6px;margin-top:10px;}
.form-row{display:flex;gap:6px;margin-bottom:10px;align-items:center;}
.form-row input,.form-row select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;font-weight:700;outline:none;}
.form-row button{padding:10px 14px;background:var(--success);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;}
.list-box{max-height:200px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:6px;background:#fafafa;}
.list-item{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:800;}
.badge.senior{background:#dbeafe;color:#1e40af;}
.badge.junior{background:#fce7f3;color:#9d174d;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;padding:10px;z-index:1000;}
.nav-item{text-decoration:none;color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:5px;width:23%;}
.nav-item.active{color:var(--accent);}
.nav-icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<div class="container">
    <div class="app-header">⚡ ڈیٹا انٹری (Duty)</div>
    <div class="card">
        <label class="form-label">👤 ممبر شامل کریں / ایڈٹ کریں:</label>
        <div class="form-row" style="flex-wrap:wrap;">
            <input type="text" id="memName" placeholder="نیا نام..." style="flex:1;min-width:120px;">
            <select id="memRank" style="width:90px;"><option value="Senior">🟢 سینئر</option><option value="Junior">🔵 جونیئر</option></select>
            <button onclick="addMember()">➕</button>
        </div>
        
        <div class="form-row">
            <select id="editMemberSelect" style="flex:1;" onchange="toggleEditDeleteBtns()"><option value="">-- ممبر منتخب کریں --</option></select>
            <button id="btnEditMem" onclick="editSelectedMember()" style="display:none;background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;border-radius:6px;padding:0 10px;font-weight:800;cursor:pointer;font-size:12px;">✏️</button>
            <button id="btnDelMem" onclick="deleteSelectedMember()" style="display:none;background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:6px;padding:0 10px;font-weight:800;cursor:pointer;font-size:12px;">🗑️</button>
        </div>

        <label class="form-label">⚡ ڈیوٹی تفویض کریں:</label>
        <div class="form-row">
            <select id="assignSenior" style="flex:1;"><option value="">🟢 سینئر...</option></select>
            <select id="assignJunior" style="flex:1;"><option value="">🔵 جونیئر...</option></select>
            <button onclick="assignDuty()" style="background:var(--accent);">✅</button>
        </div>

        <label class="form-label">👥 ممبرز لسٹ:</label>
        <div class="list-box" id="memberList"></div>
    </div>
</div>

<!-- Fixed Bottom Nav -->
<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>ڈیش بورڈ</a>
    <a href="entry.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>انٹری</a>
    <a href="history.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>ہسٹری</a>
    <a href="manager.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>مینیجر</a>
</nav>

<script>
function getMembers() { return JSON.parse(localStorage.getItem('sec4_duty_manager_data_v4') || '[]'); }
function saveMembers(m) { localStorage.setItem('sec4_duty_manager_data_v4', JSON.stringify(m)); }

function addMember() {
    var name = document.getElementById('memName').value.trim();
    var rank = document.getElementById('memRank').value;
    if (!name) { alert('نام لکھیں'); return; }
    var m = getMembers();
    if (m.some(x => x.name.toLowerCase() === name.toLowerCase())) { alert('ممبر موجود ہے!'); return; }
    m.push({ id: Date.now(), name: name, rank: rank, onDuty: false, dutyStart: null });
    saveMembers(m);
    document.getElementById('memName').value = '';
    renderEntry();
    alert('✅ ممبر شامل');
}

function toggleEditDeleteBtns() {
    var sel = document.getElementById('editMemberSelect');
    document.getElementById('btnEditMem').style.display = sel.value ? 'block' : 'none';
    document.getElementById('btnDelMem').style.display = sel.value ? 'block' : 'none';
}

function editSelectedMember() {
    var id = document.getElementById('editMemberSelect').value;
    var m = getMembers();
    var member = m.find(x => String(x.id) === String(id));
    if (!member) return;
    var newName = prompt('نیا نام:', member.name);
    if (newName && newName.trim()) {
        member.name = newName.trim();
        saveMembers(m);
        renderEntry();
        alert('✅ نام تبدیل');
    }
}

function deleteSelectedMember() {
    var id = document.getElementById('editMemberSelect').value;
    if (!confirm('ڈیلیٹ کریں؟')) return;
    var m = getMembers().filter(x => String(x.id) !== String(id));
    saveMembers(m);
    renderEntry();
    alert('✅ ڈیلیٹ');
}

function assignDuty() {
    var sid = document.getElementById('assignSenior').value;
    var jid = document.getElementById('assignJunior').value;
    var m = getMembers();
    var now = Date.now();
    if (sid) { var s = m.find(x => String(x.id) === sid); if (s) { s.onDuty = true; s.dutyStart = now; } }
    if (jid) { var j = m.find(x => String(x.id) === jid); if (j) { j.onDuty = true; j.dutyStart = now; } }
    saveMembers(m);
    renderEntry();
    alert('✅ ڈیوٹی تفویض');
}

function renderEntry() {
    var m = getMembers();
    var eSel = document.getElementById('editMemberSelect');
    eSel.innerHTML = '<option value="">-- ممبر منتخب کریں --</option>';
    m.forEach(x => { eSel.innerHTML += `<option value="${x.id}">${x.name}</option>`; });
    
    var sSel = document.getElementById('assignSenior');
    var jSel = document.getElementById('assignJunior');
    sSel.innerHTML = '<option value="">🟢 سینئر...</option>';
    jSel.innerHTML = '<option value="">🔵 جونیئر...</option>';
    m.filter(x => !x.onLeave).forEach(x => {
        if (x.rank === 'Senior') sSel.innerHTML += `<option value="${x.id}">${x.name}</option>`;
        if (x.rank === 'Junior') jSel.innerHTML += `<option value="${x.id}">${x.name}</option>`;
    });

    var list = document.getElementById('memberList');
    if (m.length === 0) { list.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:11px;padding:10px;">کوئی ممبر نہیں</div>'; return; }
    list.innerHTML = m.map(x => {
        var bc = x.rank === 'Senior' ? 'senior' : 'junior';
        return `<div class="list-item"><div><span>${x.name}</span> <span class="badge ${bc}">${x.rank}</span></div><div style="font-size:10px;color:${x.onDuty ? '#16a34a' : '#64748b'}">${x.onDuty ? '🟢 ڈیوٹی پر' : '⚪'}</div></div>`;
    }).join('');
}

document.addEventListener('DOMContentLoaded', renderEntry);
</script>
</body>
</html>
