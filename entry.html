<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ڈیٹا انٹری</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f6;font-family:system-ui,sans-serif;direction:rtl;padding:14px}
.card{background:#fff;max-width:600px;margin:0 auto;border-radius:14px;padding:16px;border-right:5px solid #ea580c;box-shadow:0 8px 18px rgba(0,0,0,.08)}
h1{font-size:18px;color:#ea580c;margin-bottom:14px;padding-bottom:10px;border-bottom:2px dashed #fed7aa}
label{display:block;font-size:12px;font-weight:700;color:#334155;margin-top:10px;margin-bottom:4px}
select,input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;outline:none;background:#fff}
select:focus,input:focus{border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,.12)}
button{width:100%;padding:12px;background:#ea580c;color:#fff;font-size:15px;font-weight:800;border:none;border-radius:8px;cursor:pointer;margin-top:14px;font-family:inherit}
button:active{opacity:.85}
.hint{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:8px;font-size:11px;color:#9a3412;margin-top:10px;font-weight:700;line-height:1.7}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;text-align:center}
.stat .n{font-size:20px;font-weight:900;color:#ea580c}
.stat .l{font-size:10px;color:#64748b;font-weight:700;margin-top:3px}
.msg{display:none;padding:10px;border-radius:8px;font-size:12px;font-weight:700;margin-top:10px}
.msg.ok{display:block;background:#f0fdf4;color:#16a34a;border:1px solid #86efac}
.msg.err{display:block;background:#fef2f2;color:#dc2626;border:1px solid #fca5a5}
</style>
</head>
<body>

<div class="card">
  <h1>📝 ڈیٹا انٹری — نیوز / الرٹ</h1>

  <label>قسم منتخب کریں</label>
  <select id="type">
    <option value="news">📰 News (خبر)</option>
    <option value="alert">🚨 Alert (الرٹ)</option>
    <option value="complaint">⏰ Time Alert (مقررہ وقت)</option>
  </select>

  <label>متن لکھیں</label>
  <input type="text" id="content" placeholder="یہاں لکھیں...">

  <div id="timeWrap" style="display:none;">
    <label>وقت منتخب کریں</label>
    <input type="time" id="fireTime" value="09:00">
    <div class="hint">⏰ یہ الرٹ اس وقت پر چلے گا — اور ہر 10 منٹ بعد دوبارہ</div>
  </div>

  <button onclick="saveItem()">💾 محفوظ کریں</button>
  <div class="msg" id="msg"></div>

  <div class="stats">
    <div class="stat"><div class="n" id="cNews">0</div><div class="l">📰 News</div></div>
    <div class="stat"><div class="n" id="cAlert">0</div><div class="l">🚨 Alert</div></div>
    <div class="stat"><div class="n" id="cComp">0</div><div class="l">⏰ Time</div></div>
  </div>
</div>

<script>
const KEY = 'sec10_news_alerts_data';
const $ = id => document.getElementById(id);

function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { return []; } }
function save(a) { localStorage.setItem(KEY, JSON.stringify(a)); }

function updateStats() {
  const all = load();
  $('cNews').textContent = all.filter(x => x.type === 'news').length;
  $('cAlert').textContent = all.filter(x => x.type === 'alert').length;
  $('cComp').textContent = all.filter(x => x.type === 'complaint').length;
}

$('type').onchange = function() {
  $('timeWrap').style.display = this.value === 'complaint' ? 'block' : 'none';
};

function showMsg(text, type) {
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
  setTimeout(() => { m.className = 'msg'; }, 2500);
}

function saveItem() {
  const type = $('type').value;
  const content = $('content').value.trim();
  if (!content) { showMsg('⚠️ متن لکھیں', 'err'); return; }

  let fireTime = null;
  if (type === 'complaint') {
    fireTime = $('fireTime').value;
    if (!fireTime) { showMsg('⚠️ وقت منتخب کریں', 'err'); return; }
  }

  const items = load();
  items.unshift({
    id: Date.now(),
    type: type,
    content: content,
    fireTime: fireTime,
    fired: false,
    timestamp: Date.now()
  });
  save(items);

  $('content').value = '';
  showMsg('✅ محفوظ ہو گیا — ڈیش بورڈ پر دیکھیں', 'ok');
  updateStats();
}

updateStats();
</script>

</body>
</html>
