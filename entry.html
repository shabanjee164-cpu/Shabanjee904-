<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Manager — Entry</title>
<style>
:root{--primary:#1e293b;--accent:#2563eb;--danger:#ef4444;--golden:#d97706;--success:#10b981;--bg:#f8fafc;--border:#e2e8f0;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;padding:12px;padding-bottom:20px;color:#334155;direction:rtl}
.container{max-width:750px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.app-header{background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;text-align:center;padding:14px 8px;border-radius:10px;font-size:16px;font-weight:bold;border-bottom:4px solid var(--accent)}

/* SECTION CARD */
.section-card{background:#fff;padding:16px;border-radius:12px;border:2px solid #cbd5e1;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:12px}
.section-header{font-weight:bold;color:var(--primary);font-size:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #e2e8f0;padding-bottom:10px}
.section-header button{background:#f8fafc;border:1px solid #cbd5e1;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}

/* SETTINGS PANEL */
.settings-panel{display:none;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:10px;grid-template-columns:repeat(2,1fr);gap:6px}
.settings-panel.open{display:grid}
.settings-panel button{padding:8px;font-size:11px;font-weight:bold;border-radius:6px;border:1px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer;font-family:inherit;text-align:right}
.settings-panel button:hover{background:#e2e8f0}
.settings-panel button.del{color:#ef4444;border-color:#fca5a5;background:#fef2f2}
.settings-panel button.active-mode{background:#10b981;color:#fff;border-color:#10b981}

/* EK LINE ROW */
.compact-row{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:nowrap;overflow-x:auto;padding:2px}
.compact-row input,.compact-row select{padding:7px 6px;border:1px solid #cbd5e1;border-radius:6px;font-size:11px;text-align:center;font-family:inherit;outline:none;min-width:0;flex:1 1 auto}
.compact-row input{flex:2 1 80px}
.compact-row .btn{padding:7px 10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-family:inherit;font-size:12px;flex:0 0 auto}
.btn-add{background:var(--success);color:#fff}
.btn-edit{background:#dbeafe;color:#1e40af}
.btn-del{background:#fee2e2;color:#991b1b}

/* ASSIGN ROW */
.assign-row{display:flex;gap:6px;align-items:center;justify-content:center}
.assign-row select{padding:8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;text-align:center;font-family:inherit;outline:none;flex:1;max-width:180px}
.assign-row .btn{padding:8px 14px;background:var(--success);color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-family:inherit;font-size:13px}

/* DARK DUTY PANEL */
.duty-panel{
  background:linear-gradient(135deg,#1e293b,#0f172a);
  border:2px solid var(--golden);
  border-radius:14px;
  padding:16px;
  color:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.duty-panel-title{text-align:center;font-size:14px;font-weight:bold;color:#fbbf24;margin-bottom:12px;letter-spacing:1px}
.duty-members{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.duty-member-box{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;
  padding:12px 8px;
  text-align:center;
}
.duty-member-box .role{font-size:11px;color:#94a3b8;margin-bottom:4px;font-weight:600}
.duty-member-box .name{font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.duty-member-box.senior{border-color:#60a5fa}
.duty-member-box.junior{border-color:#34d399}
.duty-timer{
  text-align:center;
  font-size:28px;
  font-weight:900;
  color:#fbbf24;
  background:rgba(0,0,0,.4);
  padding:10px;
  border-radius:10px;
  letter-spacing:3px;
  text-shadow:0 0 20px rgba(251,191,36,.6);
  margin-bottom:12px;
}
.duty-end-btn{
  display:block;
  width:100%;
  padding:12px;
  background:linear-gradient(135deg,#dc2626,#991b1b);
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  font-family:inherit;
  box-shadow:0 4px 12px rgba(220,38,38,.4);
  transition:.2s;
  letter-spacing:1px;
}
.duty-end-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(220,38,38,.6)}
.duty-end-btn:active{transform:translateY(1px)}

/* 3-COLUMN RECORD */
.scroll-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.btn-close{background:#64748b;color:#fff;border:none;padding:4px 8px;border-radius:5px;font-size:11px;font-weight:bold;cursor:pointer;font-family:inherit}
.record-3cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.rec-col{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:8px;
  padding:6px;
  max-height:220px;
  overflow-y:auto;
  font-size:11px;
}
.rec-col.active-col{background:#f0fdf4;border-color:#86efac}
.rec-col.done-col{background:#eff6ff;border-color:#bfdbfe}
.rec-col.leave-col{background:#fef2f2;border-color:#fca5a5}
.rec-col h4{font-size:10px;margin-bottom:5px;text-align:center;color:#475569;padding-bottom:4px;border-bottom:1px dashed #cbd5e1}
.rec-item{padding:5px 3px;border-bottom:1px dotted #e2e8f0;text-align:center}
.rec-item:last-child{border-bottom:none}
.rec-item .n{font-size:11px;font-weight:bold;color:#0f172a}
.rec-item .d{font-size:9px;color:#64748b;margin-top:2px}
.rec-item .s-active{color:#059669;font-weight:bold}
.rec-item .s-done{color:#2563eb;font-size:9px}
.rec-item .s-leave{color:#dc2626;font-weight:bold}

/* STATE PATTI */
.state-patti{display:flex;justify-content:space-around;align-items:center;gap:4px;padding:8px 6px;border-radius:8px;margin-top:10px;background:#f8fafc;border:1px solid #e2e8f0}
.state-item{flex:1;text-align:center;padding:4px 2px;border-radius:5px;font-size:10px;font-weight:800}
.state-item .val{font-size:13px;font-weight:900;display:block;margin-top:2px}
.state-item:nth-child(1){background:#ecfdf5;color:#059669;border:1px solid #10b981}
.state-item:nth-child(2){background:#fffbeb;color:#d97706;border:1px solid #f59e0b}
.state-item:nth-child(3){background:#eff6ff;color:#2563eb;border:1px solid #3b82f6}

/* INLINE MSG */
.inline-msg{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2e8b57;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:9999;display:none;font-family:inherit}
.inline-msg.show{display:block}

/* DARK MODE */
.dark-mode{background:#0f172a!important;color:#e2e8f0!important}
.dark-mode .section-card{background:#1e293b;border-color:#334155}
.dark-mode .section-header{color:#e2e8f0;border-color:#334155}
.dark-mode .compact-row input,.dark-mode .compact-row select,.dark-mode .assign-row select{background:#0f172a;color:#e2e8f0;border-color:#334155}
.dark-mode .rec-col{background:#1e293b;border-color:#334155}
.dark-mode .rec-col.active-col{background:#134e4a;border-color:#10b981}
.dark-mode .rec-col.done-col{background:#1e3a8a;border-color:#3b82f6}
.dark-mode .rec-col.leave-col{background:#7f1d1d;border-color:#ef4444}
.dark-mode .rec-item .n{color:#f1f5f9}

@media(max-width:480px){
  .duty-members{grid-template-columns:1fr}
  .record-3cols{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="container">
  <div class="app-header">🏥 Smart Manager & Health Tracker</div>

  <!-- SECTION 1: DUTY MANAGER -->
  <div class="section-card">
    <div class="section-header">
      <span>👮 ڈیوٹی مینیجر (Member Add)</span>
      <button onclick="toggleSettings('dutySettings')">⚙️</button>
    </div>

    <div class="settings-panel" id="dutySettings">
      <button onclick="toggleSelectMode('duty')" id="dutySelBtn">☑️ Select Mode</button>
      <button onclick="allSelect('duty')">✅ All Select</button>
      <button onclick="editSelected('duty')">✏️ Edit</button>
      <button class="del" onclick="deleteSelected('duty')">🗑️ Delete</button>
      <button class="del" onclick="deleteAllSelected('duty')">❌ Delete All</button>
      <button class="del" onclick="clearRecord('duty')">🧹 Clear</button>
      <button onclick="moveOrder('duty',-1)">🔼 Oper</button>
      <button onclick="moveOrder('duty',1)">🔽 Nichy</button>
      <button onclick="setPassword('duty')">🔑 Password</button>
      <button onclick="toggleDark('duty')" id="dutyDarkBtn">🌙 Dark Mode</button>
      <button onclick="dashShow('duty')">📊 Dash Show</button>
      <button onclick="dashHide('duty')">📊 Dash Hide</button>
      <button onclick="toggleSettings('dutySettings')">⬇️ Close</button>
    </div>

    <!-- Member Add + Edit/Delete (EK LINE) -->
    <div class="compact-row">
      <input type="text" id="newMemName" placeholder="نام...">
      <select id="newMemRank">
        <option value="Senior">🟢</option>
        <option value="Junior">🔵</option>
      </select>
      <button class="btn btn-add" onclick="addMember()">➕</button>
      <select id="editMemSelect"><option value="">ممبر</option></select>
      <button class="btn btn-edit" onclick="editMember()">✏️</button>
      <button class="btn btn-del" onclick="deleteMember()">🗑️</button>
    </div>

    <!-- Duty Assign -->
    <div class="assign-row">
      <select id="assignSenior"><option value="">🟢 سینئر...</option></select>
      <select id="assignJunior"><option value="">🔵 جونیئر...</option></select>
      <button onclick="assignDuty()">✅</button>
    </div>

    <!-- DARK PANEL -->
    <div class="duty-panel">
      <div class="duty-panel-title">⏱️ آج کی ڈیوٹی</div>
      <div class="duty-members">
        <div class="duty-member-box senior">
          <div class="role">🟢 سینئر</div>
          <div class="name" id="dashSenior">—</div>
        </div>
        <div class="duty-member-box junior">
          <div class="role">🔵 جونیئر</div>
          <div class="name" id="dashJunior">—</div>
        </div>
      </div>
      <div class="duty-timer" id="dashTimer">00:00:00</div>
      <button class="duty-end-btn" onclick="endAllDuty()">⏹️ ڈیوٹی ختم کریں</button>
    </div>

    <!-- Record 3-Column -->
    <div class="scroll-head">
      <span style="font-size:12px;font-weight:bold;color:#475569;">📋 مکمل ریکارڈ:</span>
      <button class="btn-close" onclick="toggleClose('record3Cols')">⬇️ Close</button>
    </div>
    <div class="record-3cols" id="record3Cols">
      <div class="rec-col active-col">
        <h4>🟢 ایکٹو</h4>
        <div id="colActiveList"></div>
      </div>
      <div class="rec-col done-col">
        <h4>✅ ڈیوٹی ہو</h4>
        <div id="colDoneList"></div>
      </div>
      <div class="rec-col leave-col">
        <h4>🏖️ چھٹی</h4>
        <div id="colLeaveList"></div>
      </div>
    </div>

    <!-- State -->
    <div class="state-patti">
      <div class="state-item">👤 Members<span class="val" id="dutyMembers">0</span></div>
      <div class="state-item">🟢 Active<span class="val" id="dutyActive">0</span></div>
      <div class="state-item">🏖️ Leave<span class="val" id="dutyLeave">0</span></div>
    </div>
  </div>
</div>

<div class="inline-msg" id="inlineMsg"></div>

<script>
var DUTY_KEY='sec4_duty_manager_data_v4';
function $(id){return document.getElementById(id);}
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function pad(n){return String(n).padStart(2,'0');}
function fmtTimer(ms){var s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor((s%3600)/60))+':'+pad(s%60);}
function getMembers(){return ls(DUTY_KEY,[]);}
function showMsg(t,s){var el=$('inlineMsg');el.textContent=t;el.style.background=s?'#2e8b57':'#c0392b';el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2500);}
function toggleSettings(id){var el=$(id);if(el)el.classList.toggle('open');}
function toggleClose(id){var el=$(id);if(el)el.style.display=el.style.display==='none'?'block':'none';}

var selectedRecords={duty:{}};
var selectMode={duty:false};
var darkMode={duty:false};

// ========== SETTINGS ==========
function toggleSelectMode(section){
  selectMode[section]=!selectMode[section];
  var btn=$(section+'SelBtn');
  if(btn){btn.textContent=selectMode[section]?'✅ Select Mode ON':'☑️ Select Mode';btn.classList.toggle('active-mode',selectMode[section]);}
  showMsg(selectMode[section]?'✅ Select Mode ON':'☑️ Select Mode OFF',true);
  renderDuty();
}
function selectRecord(section,id){
  if(!selectedRecords[section])selectedRecords[section]={};
  selectedRecords[section][id]=!selectedRecords[section][id];
  renderDuty();
}
function allSelect(section){
  getMembers().forEach(function(x){selectedRecords.duty[x.id]=true;});
  showMsg('✅ All Select',true);
  renderDuty();
}
function editSelected(section){
  var ids=Object.keys(selectedRecords[section]||{}).filter(function(k){return selectedRecords[section][k];});
  if(!ids.length){showMsg('پہلے ریکارڈ select کریں');return;}
  var m=getMembers();
  var t=m.find(function(x){return String(x.id)===ids[0];});
  if(!t)return;
  var nn=prompt('نیا نام:',t.name);
  if(nn&&nn.trim()){
    t.name=nn.trim();
    var nr=prompt('Rank (Senior/Junior):',t.rank);
    if(nr==='Senior'||nr==='Junior')t.rank=nr;
    lss(DUTY_KEY,m);
    selectedRecords.duty={};
    renderDuty();
    showMsg('✅ اپڈیٹ',true);
  }
}
function deleteSelected(section){
  var ids=Object.keys(selectedRecords[section]||{}).filter(function(k){return selectedRecords[section][k];});
  if(!ids.length){showMsg('پہلے ریکارڈ select کریں');return;}
  lss(DUTY_KEY,getMembers().filter(function(x){return ids.indexOf(String(x.id))===-1;}));
  selectedRecords.duty={};
  showMsg('✅ '+ids.length+' delete',true);
  renderDuty();
}
function deleteAllSelected(section){
  lss(DUTY_KEY,[]);
  selectedRecords.duty={};
  showMsg('❌ Delete All',true);
  renderDuty();
}
function clearRecord(section){
  lss(DUTY_KEY,[]);
  selectedRecords.duty={};
  showMsg('🧹 Clear',true);
  renderDuty();
}
function moveOrder(section,dir){
  var ids=Object.keys(selectedRecords[section]||{}).filter(function(k){return selectedRecords[section][k];});
  if(!ids.length){showMsg('پہلے ریکارڈ select کریں');return;}
  var m=getMembers();
  var id=ids[0];
  var idx=m.findIndex(function(x){return String(x.id)===id;});
  if(idx===-1)return;
  var ni=idx+dir;
  if(ni<0||ni>=m.length)return;
  var tmp=m[idx];m[idx]=m[ni];m[ni]=tmp;
  lss(DUTY_KEY,m);
  selectedRecords.duty={};
  renderDuty();
  showMsg(dir===-1?'🔼 Oper':'🔽 Nichy',true);
}
function setPassword(section){
  var p=prompt('پاس ورڈ سیٹ کریں (خالی = ہٹائیں):');
  if(p===null)return;
  lss('duty_pwd',{pwd:p});
  showMsg(p?'✅ پاس ورڈ سیٹ':'✅ ہٹا دیا',true);
}
function toggleDark(section){
  darkMode[section]=!darkMode[section];
  var btn=$('dutyDarkBtn');
  if(btn)btn.classList.toggle('active-mode',darkMode[section]);
  document.body.classList.toggle('dark-mode',darkMode[section]);
  showMsg(darkMode[section]?'🌙 Dark Mode ON':'☀️ Light Mode',true);
}
function dashShow(section){lss('duty_dash_show',true);showMsg('📊 Dash Show ON',true);}
function dashHide(section){lss('duty_dash_show',false);showMsg('📊 Dash Hide OFF',true);}

// ========== MEMBER FUNCTIONS ==========
function addMember(){
  var name=$('newMemName').value.trim();
  var rank=$('newMemRank').value;
  if(!name){showMsg('نام لکھیں');return;}
  var m=getMembers();
  if(m.some(function(x){return x.name.toLowerCase()===name.toLowerCase();})){showMsg('ممبر موجود ہے');return;}
  m.push({id:Date.now(),name:name,rank:rank,onDuty:false,onLeave:false,dutyCount:0,dutyStart:null,dutyEndedAt:null});
  lss(DUTY_KEY,m);
  $('newMemName').value='';
  renderDuty();
  showMsg('✅ شامل',true);
}
function editMember(){
  var id=$('editMemSelect').value;
  if(!id){showMsg('ممبر منتخب کریں');return;}
  var m=getMembers();
  var mem=m.find(function(x){return String(x.id)===String(id);});
  if(!mem)return;
  var nn=prompt('نیا نام:',mem.name);
  if(nn&&nn.trim()){
    mem.name=nn.trim();
    var nr=prompt('Rank (Senior/Junior):',mem.rank);
    if(nr==='Senior'||nr==='Junior')mem.rank=nr;
    lss(DUTY_KEY,m);
    renderDuty();
    showMsg('✅ اپڈیٹ',true);
  }
}
function deleteMember(){
  var id=$('editMemSelect').value;
  if(!id){showMsg('ممبر منتخب کریں');return;}
  if(!confirm('ڈیلیٹ کریں؟'))return;
  lss(DUTY_KEY,getMembers().filter(function(x){return String(x.id)!==String(id);}));
  renderDuty();
  showMsg('✅ ڈیلیٹ',true);
}
function assignDuty(){
  var sid=$('assignSenior').value;
  var jid=$('assignJunior').value;
  if(!sid&&!jid){showMsg('ممبر منتخب کریں');return;}
  var m=getMembers(),now=Date.now(),changed=false;
  [sid,jid].forEach(function(id){
    if(!id)return;
    var t=m.find(function(x){return String(x.id)===id;});
    if(!t)return;
    if(t.onDuty){showMsg(t.name+' پہلے سے ڈیوٹی پر');return;}
    t.onDuty=true;t.onLeave=false;t.dutyCount++;t.dutyStart=now;t.dutyEndedAt=null;
    changed=true;
  });
  if(changed){
    lss(DUTY_KEY,m);
    renderDuty();
    showMsg('✅ تفویض',true);
  }
}
function endAllDuty(){
  var m=getMembers();
  var active=m.filter(function(x){return x.onDuty;});
  if(!active.length){showMsg('کوئی ڈیوٹی پر نہیں');return;}
  active.forEach(function(x){x.onDuty=false;x.dutyStart=null;x.dutyEndedAt=Date.now();});
  lss(DUTY_KEY,m);
  renderDuty();
  showMsg('✅ ڈیوٹی ختم',true);
}

// ========== RENDER ==========
function populateDropdowns(){
  var m=getMembers();
  var eSel=$('editMemSelect');
  if(eSel){
    var cur=eSel.value;
    eSel.innerHTML='<option value="">ممبر</option>';
    m.forEach(function(x){eSel.innerHTML+='<option value="'+x.id+'">'+esc(x.name)+'</option>';});
    if(cur)eSel.value=cur;
  }
  var sSel=$('assignSenior'),jSel=$('assignJunior');
  if(sSel&&jSel){
    sSel.innerHTML='<option value="">🟢 سینئر...</option>';
    jSel.innerHTML='<option value="">🔵 جونیئر...</option>';
    m.filter(function(x){return !x.onLeave&&!x.onDuty;}).forEach(function(x){
      if(x.rank==='Senior')sSel.innerHTML+='<option value="'+x.id+'">'+esc(x.name)+'</option>';
      if(x.rank==='Junior')jSel.innerHTML+='<option value="'+x.id+'">'+esc(x.name)+'</option>';
    });
  }
}

function renderDuty(){
  var m=getMembers();
  populateDropdowns();

  var active=m.filter(function(x){return x.onDuty;});
  var done=m.filter(function(x){return !x.onDuty&&!x.onLeave&&x.dutyEndedAt;});
  var leave=m.filter(function(x){return x.onLeave;});

  // Panel
  var s=m.find(function(x){return x.onDuty&&x.rank==='Senior';});
  var j=m.find(function(x){return x.onDuty&&x.rank==='Junior';});
  if($('dashSenior'))$('dashSenior').textContent=s?s.name:'—';
  if($('dashJunior'))$('dashJunior').textContent=j?j.name:'—';
  var activeMem=s||j;
  if(activeMem&&activeMem.dutyStart&&$('dashTimer'))$('dashTimer').textContent=fmtTimer(Date.now()-activeMem.dutyStart);
  else if($('dashTimer'))$('dashTimer').textContent='00:00:00';

  // 3-Column Render
  if($('colActiveList')){
    $('colActiveList').innerHTML=active.length?active.map(function(x,i){
      var chk=selectMode.duty?'<input type="checkbox" onchange="selectRecord(\'duty\','+x.id+')"> ':'';
      return '<div class="rec-item">'+chk+'<div class="n">'+(i+1)+'️⃣ '+esc(x.name)+'</div><div class="d">('+x.rank+')</div><div class="d s-active">🟢 ایکٹو</div></div>';
    }).join(''):'<div style="text-align:center;color:#94a3b8;padding:8px;">کوئی نہیں</div>';
  }
  if($('colDoneList')){
    $('colDoneList').innerHTML=done.length?done.map(function(x,i){
      var chk=selectMode.duty?'<input type="checkbox" onchange="selectRecord(\'duty\','+x.id+')"> ':'';
      return '<div class="rec-item">'+chk+'<div class="n">'+(i+1)+'️⃣ '+esc(x.name)+'</div><div class="d">('+x.rank+')</div><div class="d s-done">✅ مکمل</div></div>';
    }).join(''):'<div style="text-align:center;color:#94a3b8;padding:8px;">کوئی نہیں</div>';
  }
  if($('colLeaveList')){
    $('colLeaveList').innerHTML=leave.length?leave.map(function(x,i){
      var chk=selectMode.duty?'<input type="checkbox" onchange="selectRecord(\'duty\','+x.id+')"> ':'';
      return '<div class="rec-item">'+chk+'<div class="n">'+(i+1)+'️⃣ '+esc(x.name)+'</div><div class="d">('+x.rank+')</div><div class="d s-leave">🏖️ چھٹی</div></div>';
    }).join(''):'<div style="text-align:center;color:#94a3b8;padding:8px;">کوئی نہیں</div>';
  }

  // State
  if($('dutyMembers'))$('dutyMembers').textContent=m.length;
  if($('dutyActive'))$('dutyActive').textContent=active.length;
  if($('dutyLeave'))$('dutyLeave').textContent=leave.length;
}

document.addEventListener('DOMContentLoaded',function(){
  renderDuty();
  setInterval(function(){
    var m=getMembers();
    var active=m.find(function(x){return x.onDuty&&x.dutyStart;});
    if(active&&$('dashTimer'))$('dashTimer').textContent=fmtTimer(Date.now()-active.dutyStart);
  },1000);
});
</script>
</body>
</html>
