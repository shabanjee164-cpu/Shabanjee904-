<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard</title>
<style>
:root{--primary:#1e293b;--accent:#2563eb;--danger:#ef4444;--success:#10b981;--golden:#d97706;--bg:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;padding:12px;color:#334155;direction:rtl}
.container{max-width:750px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

/* NEWS TICKER */
.ticker-bar{background:#fffbeb;border:1px solid #fde68a;color:#d97706;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;min-height:38px;display:flex;align-items:center}
.ticker-text{display:inline-block;animation:customTickerRight var(--news-dur,35s) linear infinite;padding-right:100%}
@keyframes customTickerRight{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ALERT TICKER */
.alert-ticker-bar{background:#fef2f2;border:1px solid #fecaca;color:#ef4444;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:bold;display:none;justify-content:space-between;align-items:center;transition:all .3s;min-height:38px}
.alert-ticker-bar.active{display:flex}
.alert-ticker-bar.blink{animation:fastBlink 0.8s infinite alternate}
@keyframes fastBlink{0%{opacity:1}100%{opacity:.35;background-color:#ef4444;color:white}}
.alert-skip-btn{background:#ef4444;color:#fff;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:bold;font-family:inherit}
</style>
</head>
<body>

<div class="container">

  <!-- NEWS TICKER -->
  <div class="ticker-bar" id="newsTickerBar">
    <div class="ticker-text" id="newsBar">📰 لوڈ ہو رہا ہے...</div>
  </div>

  <!-- ALERT TICKER -->
  <div class="alert-ticker-bar" id="alertBar" style="display:none">
    <span id="alertMsg">🚨 اہم الرٹ...</span>
    <button class="alert-skip-btn" onclick="skipAlert()">اسکیپ ❌</button>
  </div>

</div>

<script>
function $(id){return document.getElementById(id)}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

/* ========== KEYS ========== */
var NEWS_KEY='sec10_news_alerts_data';
var NA1_SET_KEY='ns_modular_settings_v1';
var NA1_AUD_KEY='ns_modular_audio_v1';
var MAN_KEY='a2_manual_sel';

var _ctx=null;
function getCtx(){if(!_ctx){try{_ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(_ctx&&_ctx.state==='suspended')_ctx.resume();return _ctx}

var NEWS_TUNES=[
  {n:"نیوز بیپ 1",p:[[780,180]]},{n:"نیوز ڈبل 2",p:[[780,130],[0,50],[920,150]]},
  {n:"نرم گھنٹی 3",p:[[1100,250],[850,180]]},{n:"صبح بخیر 4",p:[[523,160],[659,160],[784,220]]},
  {n:"پرندہ سر 5",p:[[1400,90],[1850,90],[1400,90]]},{n:"پانی قطرہ 6",p:[[600,220],[450,180]]},
  {n:"پیانو نوٹ 7",p:[[523,200],[659,200],[784,200],[1046,260]]},{n:"گٹار تار 8",p:[[330,280],[440,280]]},
  {n:"بانسری دھن 9",p:[[620,420]]},{n:"میٹھی ٹون 10",p:[[880,140],[1046,180]]},
  {n:"ہلکی دستک 11",p:[[500,100],[0,60],[500,100]]},{n:"چاندنی 12",p:[[659,240],[587,240],[523,300]]},
  {n:"ستارہ 13",p:[[988,120],[1175,120],[1318,180]]},{n:"نسیم 14",p:[[440,300],[554,300]]},
  {n:"ترنگ 15",p:[[700,120],[900,120],[1100,150]]},{n:"کلاک ٹک 16",p:[[1200,80],[0,90],[1200,80]]},
  {n:"موج 17",p:[[400,220],[600,220],[500,220]]},{n:"روشنی 18",p:[[800,150],[1000,150],[1200,200]]},
  {n:"پیغام 19",p:[[660,140],[880,200]]},{n:"خبر نامہ 20",p:[[587,150],[784,150],[988,200]]},
  {n:"سُر تال 21",p:[[523,140],[587,140],[659,140],[784,200]]},{n:"نغمہ 22",p:[[740,220],[880,260]]},
  {n:"گونج 23",p:[[480,350]]},{n:"اشارہ 24",p:[[950,120],[0,50],[950,120]]},
  {n:"نیوز کلاسک 25",p:[[659,160],[784,160],[659,160],[1046,250]]}
];

var ALERT_TUNES=[
  {n:"الارم تیز 1",p:[[1000,180],[0,80],[1000,180],[0,80],[1000,220]]},
  {n:"خطرہ بیپ 2",p:[[1200,250],[600,250]]},{n:"سائرن 3",p:[[700,220],[1100,220],[700,220],[1100,220]]},
  {n:"ہنگامی 4",p:[[1400,120],[0,60],[1400,120],[0,60],[1400,120],[0,60],[1400,200]]},
  {n:"وارننگ 5",p:[[900,300],[0,100],[900,300]]},{n:"ہارن 6",p:[[320,400],[420,400]]},
  {n:"بجلی جھٹکا 7",p:[[180,250],[320,250],[180,250]]},{n:"ڈھول الرٹ 8",p:[[140,120],[0,50],[140,120],[0,50],[200,220]]},
  {n:"زنگ الرٹ 9",p:[[420,650]]},{n:"تیز گھنٹی 10",p:[[1300,150],[900,150],[1300,150],[900,150]]},
  {n:"فوری توجہ 11",p:[[1100,100],[0,50],[1100,100],[0,50],[1500,250]]},
  {n:"الارم کلاک 12",p:[[1250,90],[0,70],[1250,90],[0,70],[1250,90],[0,70],[1250,90]]},
  {n:"ڈبل وارننگ 13",p:[[850,220],[0,80],[1150,260]]},{n:"گہرا الرٹ 14",p:[[300,300],[0,80],[300,350]]},
  {n:"ہائی الرٹ 15",p:[[1500,180],[1200,180],[1500,220]]},{n:"بزر 16",p:[[240,500]]},
  {n:"نبض 17",p:[[800,120],[0,120],[800,120],[0,120],[800,120]]},
  {n:"چوکنا 18",p:[[950,150],[1250,150],[950,150],[1250,200]]},{n:"ریڈ الرٹ 19",p:[[1050,200],[520,200],[1050,250]]},{n:"فائنل الارم 20",p:[[1200,160],[0,60],[1200,160],[0,60],[800,320]]}
];

/* ========== NEWS / ALERT TICKERS (CONNECTED TO NA1 & NA3) ========== */
var newsIndex=0, newsTimer=null, currentNewsItem=null;
var alertIndex=0, alertTimer=null, currentAlertItem=null;
var lastNewsSig='', lastAlertSig='';

function getNa1Cfg(){
  var c=lsGet(NA1_SET_KEY,{});
  return {
    newsOn:c.allOpts?c.allOpts.newsOn!==false:true,
    alertOn:c.allOpts?c.allOpts.alertOn!==false:true,
    soundsOn:c.allOpts?c.allOpts.soundsOn!==false:true,
    vib:c.allOpts?c.allOpts.vibrate!==false:true,
    voice:c.allOpts?c.allOpts.voice!==false:true,
    newsSpeed:c.newsPatti?(parseInt(c.newsPatti.speed)||5):5,
    newsSec:c.newsPatti?(parseInt(c.newsPatti.seconds)||3):3,
    alertSec:c.alertPatti?(parseInt(c.alertPatti.seconds)||4):4,
    newsTune:c.newsPatti?(parseInt(c.newsPatti.tuneIdx)||0):0,
    alertTune:c.alertPatti?(parseInt(c.alertPatti.tuneIdx)||0):0,
    newsVol:c.newsPatti?(parseInt(c.newsPatti.volume)||70):70,
    alertVol:c.alertPatti?(parseInt(c.alertPatti.volume)||85):85
  };
}

function markForNa3History(itemId){
  if(!itemId)return;
  var all=lsGet(NEWS_KEY,[]);
  var changed=false;
  all.forEach(function(r){
    if(String(r.id)===String(itemId)){
      r.dashShown=true;
      r.historyReady=true;
      r.completedAt=Date.now();
      changed=true;
    }
  });
  if(changed)lsSet(NEWS_KEY,all);
}

function playNa1Feedback(type,text,cfg){
  if(cfg.soundsOn){
    var aud=lsGet(NA1_AUD_KEY,{news:null,alert:null});
    var vol=(type==='alert'?cfg.alertVol:cfg.newsVol)/100;
    if(aud[type]){
      try{var a=new Audio(aud[type]);a.volume=Math.min(1,Math.max(0,vol));a.play().catch(function(){})}catch(e){}
    } else {
      var tune=(type==='alert'?ALERT_TUNES:NEWS_TUNES)[type==='alert'?cfg.alertTune:cfg.newsTune]||NEWS_TUNES[0];
      var ctx=getCtx();
      if(ctx){
        try{
          var t=ctx.currentTime;
          tune.p.forEach(function(n){
            var freq=n[0],dur=n[1]/1000;
            if(freq>0){
              var o=ctx.createOscillator(),g=ctx.createGain();
              o.connect(g);g.connect(ctx.destination);
              o.frequency.value=freq;
              g.gain.setValueAtTime(Math.max(0.01,vol),t);
              g.gain.exponentialRampToValueAtTime(0.001,t+dur);
              o.start(t);o.stop(t+dur);
            }
            t+=dur+0.04;
          });
        }catch(e){}
      }
    }
  }
  if(cfg.vib && navigator.vibrate)navigator.vibrate([200,100,200]);
  if(cfg.voice && ('speechSynthesis' in window)){
    try{
      window.speechSynthesis.cancel();
      var prefix=(type==='alert')?'Alert. ':'News. ';
      var u=new SpeechSynthesisUtterance(prefix+text);
      u.lang='ur-PK';
      u.volume=Math.min(1,Math.max(0,((type==='alert'?cfg.alertVol:cfg.newsVol)||70)/100));
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
}

function renderNewsAlert(){
  var visible=lsGet('ns_dash_visible',null);
  if(visible===false){
    clearTimeout(newsTimer);
    clearTimeout(alertTimer);
    if($('newsBar')){$('newsBar').textContent='📰 ڈیش بورڈ Hide ہے';$('newsBar').style.animation='none'}
    if($('alertBar')){$('alertBar').style.display='none';$('alertBar').classList.remove('blink')}
    lastNewsSig='hidden';
    lastAlertSig='hidden';
    return;
  }

  var cfg=getNa1Cfg();
  var items=lsGet(NEWS_KEY,[]).filter(function(x){return !x.deleted && !x.skipped});
  var man=lsGet(MAN_KEY,{});
  var selIds=Object.keys(man).filter(function(k){return man[k]});
  if(selIds.length){
    items=items.filter(function(x){return selIds.indexOf(String(x.id))!==-1});
  }

  var news=cfg.newsOn?items.filter(function(x){return x.type==='news'}):[];
  var alerts=cfg.alertOn?items.filter(function(x){return x.type==='alert'}):[];

  var nSig=news.map(function(x){return x.id+':'+x.content}).join('|')+'|'+cfg.newsSpeed+'|'+cfg.newsSec;
  var aSig=alerts.map(function(x){return x.id+':'+x.content}).join('|')+'|'+cfg.alertSec;

  /* NEWS TICKER */
  if($('newsBar') && nSig!==lastNewsSig){
    lastNewsSig=nSig;
    clearTimeout(newsTimer);
    if(news.length){
      newsIndex=0;
      var showNews=function(){
        var n=news[newsIndex%news.length];
        currentNewsItem=n;
        var el=$('newsBar');
        var dur=Math.max(8,55-(cfg.newsSpeed*3));
        el.style.setProperty('--news-dur',dur+'s');
        el.textContent='📰 '+n.content;
        el.style.animation='none';
        void el.offsetWidth;
        el.style.animation='customTickerRight '+dur+'s linear infinite';
        playNa1Feedback('news',n.content,cfg);
        newsTimer=setTimeout(function(){
          markForNa3History(n.id);
          newsIndex++;
          showNews();
        },Math.max(cfg.newsSec,2)*1000);
      };
      showNews();
    } else {
      currentNewsItem=null;
      $('newsBar').textContent='📰 کوئی نیوز نہیں';
      $('newsBar').style.animation='none';
    }
  }

  /* ALERT TICKER */
  if($('alertBar') && aSig!==lastAlertSig){
    lastAlertSig=aSig;
    clearTimeout(alertTimer);
    if(alerts.length){
      alertIndex=0;
      var showAlert=function(){
        var a=alerts[alertIndex%alerts.length];
        currentAlertItem=a;
        $('alertBar').style.display='flex';
        $('alertBar').classList.add('active');
        $('alertBar').classList.add('blink');
        $('alertMsg').textContent='🚨 '+a.content;
        playNa1Feedback('alert',a.content,cfg);
        alertTimer=setTimeout(function(){
          markForNa3History(a.id);
          alertIndex++;
          showAlert();
        },Math.max(cfg.alertSec,2)*1000);
      };
      showAlert();
    } else {
      currentAlertItem=null;
      $('alertBar').style.display='none';
      $('alertBar').classList.remove('active');
      $('alertBar').classList.remove('blink');
    }
  }
}

function skipAlert(){
  clearTimeout(alertTimer);
  if(currentAlertItem){
    markForNa3History(currentAlertItem.id);
    currentAlertItem=null;
  }
  var ab=$('alertBar');
  if(ab){ab.style.display='none';ab.classList.remove('active');ab.classList.remove('blink')}
  lastAlertSig='';
  renderNewsAlert();
}

/* ========== INIT ========== */
document.addEventListener('DOMContentLoaded',function(){
  renderNewsAlert();
  setInterval(function(){
    if(document.visibilityState==='visible')renderNewsAlert();
  },2000);
});
</script>
</body>
</html>
