<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — Duty Section</title>
<style>
:root{--primary:#1e293b;--accent:#2563eb;--danger:#ef4444;--success:#10b981;--golden:#d97706;--bg:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;padding:12px;color:#334155;direction:rtl}
.container{max-width:750px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.section-card{background:#fff;padding:10px;border-radius:10px;border:1px solid #cbd5e1;box-shadow:0 2px 4px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px}
.section-header{font-weight:bold;color:var(--primary);font-size:13px;display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid #e2e8f0}
.section-header .hdr-left{display:flex;align-items:center;gap:6px}
.section-header button{background:#f8fafc;border:1px solid #cbd5e1;width:22px;height:22px;border-radius:5px;cursor:pointer;font-size:10px;font-family:inherit;color:#64748b;opacity:.5}
.section-header button:hover{opacity:1}

/* DUTY PANEL */
.duty-panel{background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid var(--golden);border-radius:12px;padding:12px;color:#fff}
.duty-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.duty-col{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:10px 6px;text-align:center;position:relative}
.duty-col.senior{border-right:3px solid #60a5fa}
.duty-col.junior{border-left:3px solid #34d399}
.duty-col .role{font-size:10px;color:#94a3b8;margin-bottom:3px;font-weight:700}
.duty-col .name{font-size:14px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
.duty-col .end-btn{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;width:100%}
.duty-col .end-btn:active{transform:scale(.96)}
.duty-col .end-btn:disabled{background:#64748b;opacity:.5;cursor:not-allowed}
.big-timer{text-align:center;font-size:26px;font-weight:900;color:#fbbf24;background:rgba(0,0,0,.4);padding:10px;border-radius:10px;letter-spacing:3px;text-shadow:0 0 15px rgba(251,191,36,.6);border:2px solid #fbbf24}
.big-timer.senior-only{border-color:#60a5fa;color:#60a5fa;text-shadow:0 0 15px rgba(96,165,250,.6)}
.big-timer.junior-on{border-color:#34d399;color:#34d399;text-shadow:0 0 15px rgba(52,211,153,.6)}
.big-timer.stopped{color:#94a3b8;border-color:#475569;text-shadow:none}

/* LEAVE SUBMIT */
.leave-submit{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:6px;display:flex;gap:4px;align-items:center;flex-wrap:nowrap;overflow-x:auto}
.leave-submit select,.leave-submit input{padding:7px 6px;border:1px solid #cbd5e1;border-radius:6px;font-size:11px;text-align:center;font-family:inherit;outline:none;background:#fff;min-width:0}
.leave-submit select{flex:1;max-width:100px}
.leave-submit input.reason{flex:2 1 100px}
.leave-submit input.dur{flex:0 0 50px;max-width:50px}
.leave-submit button{flex:0 0 auto;padding:7px 10px;background:#16a34a;color:#fff;border:none;border-radius:6px;font-weight:800;cursor:pointer;font-family:inherit;font-size:12px}

/* LEAVE RECORD — سادہ لسٹ (entry history جیسا) */
.leave-list{max-height:220px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px;padding:5px;background:#fafafa;font-size:11px}
.leave-item{padding:7px 6px;border-bottom:1px dotted #e2e8f0;display:flex;align-items:flex-start;gap:6px}
.leave-item:last-child{border-bottom:none}
.leave-item .chk{width:15px;height:15px;flex-shrink:0;accent-color:var(--accent);cursor:pointer;margin-top:2px}
.leave-item .body{flex:1;min-width:0}
.leave-item .nm{font-size:11px;font-weight:800;color:#0f172a;margin-bottom:2px}
.leave-item .reason{font-size:10px;color:#dc2626;font-weight:700;margin-bottom:2px}
.leave-item .meta{font-size:9.5px;color:#64748b;font-weight:600}
.leave-empty{text-align:center;color:#94a3b8;font-size:11px;padding:12px;font-weight:700}

/* STATE */
.state-patti{display:flex;justify-content:space-around;gap:4px;padding:8px 4px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;margin-top:6px}
.state-item{flex:1;text-align:center;padding:6px 2px;border-radius:4px;font-size:10px;font-weight:800}
.state-item .val{font-size:16px;font-weight:900;display:block;margin-top:1px}
.state-item:nth-child(1){background:#ecfdf5;color:#059669;border:1px solid #10b981}
.state-item:nth-child(2){background:#fef2f2;color:#dc2626;border:1px solid #ef4444}
.state-item:nth-child(3){background:#fffbeb;color:#d97706;border:1px solid #f59e0b}

/* HEAD */
.scroll-head{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.scroll-head span{font-size:11px;font-weight:bold;color:#475569}
.btn-close{background:#64748b;color:#fff;border:none;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:bold;cursor:pointer;font-family:inherit}

/* SETTINGS */
.ns-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:9999;align-items:center;justify-content:center;padding:16px}
.ns-overlay.active{display:flex}
.ns-box{background:#2c3e50;border-radius:12px;max-width:320px;width:100%;padding:10px}
.ns-box-title{color:#fbbf24;font-size:12px;font-weight:800;text-align:center;margin-bottom:8px}
.ns-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.ns-grid button{padding:10px 4px;font-size:10px;font-weight:bold;border-radius:6px;border:1px solid #34495e;background:#34495e;color:#fff;cursor:pointer;font-family:inherit}
.ns-grid button.active{background:#10b981;border-color:#10b981}
.ns-grid button.del{color:#ff9999}
.ns-grid button.full{grid-column:span 2}
.ns-close{margin-top:8px;width:100%;padding:8px;background:#1a252f;border:1px solid #34495e;color:#fff;border-radius:6px;font-weight:800;cursor:pointer;font-family:inherit;font-size:11px}

/* MSG */
.inline-msg{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2e8b57;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:99999;display:none;font-family:inherit}
.inline-msg.show{display:block}
.inline-msg.error{background:#c0392b}

/* MODAL */
.ns-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:16px}
.ns-modal.active{display:flex}
.ns-modal-box{background:#fff;border-radius:12px;max-width:320px;width:100%}
.ns-modal-h{padding:12px;background:#2563eb;color:#fff;font-size:13px;font-weight:800;border-radius:12px 12px 0 0;text-align:center}
.ns-modal-b{padding:14px;font-size:12px;color:#334155;line-height:1.6;font-weight:600;text-align:center}
.ns-modal-f{display:flex;gap:8px;padding:0 14px 14px}
.ns-modal-f button{flex:1;padding:10px;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div class="container">
  <div class="section-card" id="dutySectionCard">
    <div class="section-header">
      <div class="hdr-left"><span>👮 آج کی ڈیوٹی</span></div>
      <button onclick="openSettings()">⚙</button>
    </div>

    <div class="duty-panel">
      <div class="duty-cols">
        <div class="duty-col senior">
          <div class="role">🟢 سینئر</div>
          <div class="name" id="dashSenior">—</div>
          <button class="end-btn" id="endSeniorBtn" onclick="endDuty('Senior')" disabled>⏹️ ختم</button>
        </div>
        <div class="duty-col junior">
          <div class="role">🔵 جونیئر</div>
          <div class="name" id="dashJunior">—</div>
          <button class="end-btn" id="endJuniorBtn" onclick="endDuty('Junior')" disabled>⏹️ ختم</button>
        </div>
      </div>
      <div class="big-timer stopped" id="bigTimer">00:00:00</div>
    </div>

    <!-- LEAVE SUBMIT -->
    <div class="scroll-head">
      <span>🏖️ چھٹی دیں:</span>
    </div>
    <div class="leave-submit">
      <select id="leaveMember"><option value="">ممبر...</option></select>
      <input type="text" id="leaveReason" class="reason" placeholder="وجہ...">
      <input type="number" id="leaveDuration" class="dur" placeholder="دن" value="1" min="1">
      <button onclick="submitLeave()">✅</button>
    </div>

    <!-- LEAVE RECORD — سادہ لسٹ -->
    <div class="scroll-head">
      <span>📋 چھٹی ریکارڈ:</span>
      <button class="btn-close" onclick="toggleClose('leaveRecordBox')">⬇️ Close</button>
    </div>
    <div class="leave-list" id="leaveRecordBox"></div>

    <!-- STATE -->
    <div class="state-patti">
      <div class="state-item">👤 Members<span class="val" id="stateMembers">0</span></div>
      <div class="state-item">🟢 Active<span class="val" id="stateActive">0</span></div>
      <div class="state-item">🏖️ Leave<span class="val" id="stateLeave">0</span></div>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div class="ns-overlay" id="nsOverlay">
  <div class="ns-box">
    <div class="ns-box-title">⚙️ چھٹی سیٹنگز</div>
    <div class="ns-grid">
      <button onclick="toggleSelectMode()" id="selModeBtn">☑️ Select</button>
      <button onclick="editSelected()">✏️ Edit</button>
      <button class="del" onclick="deleteSelected()">🗑️ Delete</button>
      <button class="del" onclick="clearAll()">🧹 Clear</button>
      <button class="full" onclick="closeSection()">⬇️ Close Section</button>
    </div>
    <button class="ns-close" onclick="closeSettings()">✕ بند</button>
  </div>
</div>

<!-- MODAL -->
<div class="ns-modal" id="nsModal">
  <div class="ns-modal-box">
    <div class="ns-modal-h" id="modalTitle">تصدیق</div>
    <div class="ns-modal-b" id="modalBody">—</div>
    <div class="ns-modal-f">
      <button onclick="modalClose()" style="background:#e2e8f0;color:#64748b">✕ بند</button>
      <button onclick="modalConfirm()" style="background:#dc2626;color:#fff">✓ ہاں</button>
    </div>
  </div>
</div>

<div class="inline-msg" id="inlineMsg"></div>

<script>
function $(id){return document.getElementById(id)}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function pad(n){return String(n).padStart(2,'0')}
function fmtTimer(ms){var s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor((s%3600)/60))+':'+pad(s%60)}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayTs(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function toggleClose(id){var el=$(id);if(el)el.style.display=el.style.display==='none'?'block':'none'}
function showMsg(t,err){var el=$('inlineMsg');el.textContent=t;el.style.background=err?'#c0392b':'#2e8b57';el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},2500)}

var DUTY_KEY='sec4_duty_manager_data_v4';
var LEAVE_KEY='sec4_duty_leaves_data_v4';
var REC_KEY='sec12_task_records';
var TASK_KEY='sec3_task_and_point_manager_data';
var HIST_LOG_KEY='duty_history_logs_v1';

var selectMode=false,selectedIds={};
var _modalCb=null;
var currentTimerStart=null,timerRunning=false;

function getMembers(){return lsGet(DUTY_KEY,[])}
function setMembers(m){lsSet(DUTY_KEY,m)}
function getLeaves(){return lsGet(LEAVE_KEY,[])}
function setLeaves(l){lsSet(LEAVE_KEY,l)}
function getHistLogs(){return lsGet(HIST_LOG_KEY,[])}

function populateLeaveMembers(){
  var sel=$('leaveMember');if(!sel)return;
  var cur=sel.value;
  var m=getMembers().filter(function(x){return !x.deleted && !x.onLeave && !x.onDuty});
  sel.innerHTML='<option value="">ممبر...</option>';
  m.forEach(function(x){sel.innerHTML+='<option value="'+x.id+'">'+esc(x.name)+' ('+x.rank+')</option>'});
  if(cur)sel.value=cur;
}

function submitLeave(){
  var memberId=$('leaveMember').value;
  var reason=$('leaveReason').value.trim();
  var duration=parseInt($('leaveDuration').value)||1;
  if(!memberId){showMsg('ممبر منتخب کریں',true);return}
  if(!reason){showMsg('وجہ لکھیں',true);return}
  var m=getMembers();
  var mem=m.find(function(x){return String(x.id)===memberId});
  if(!mem){showMsg('ممبر نہیں ملا',true);return}
  var leaves=getLeaves();
  var d=new Date();
  leaves.unshift({
    id:Date.now(),name:mem.name,rank:mem.rank,reason:reason,duration:duration,
    date:todayStr(),time:pad(d.getHours())+':'+pad(d.getMinutes()),timestamp:Date.now()
  });
  setLeaves(leaves);
  mem.onLeave=true;mem.onDuty=false;mem.dutyStart=null;
  mem.leaveCount=(mem.leaveCount||0)+1;
  mem.currentLeaveReason=reason;
  mem.leaveStart=Date.now();
  setMembers(m);
  $('leaveMember').value='';
  $('leaveReason').value='';
  $('leaveDuration').value='1';
  renderAll();
  showMsg('✅ چھٹی دی گئی');
}

function areAllDailyComplete(memberName){
  var tasks=lsGet(TASK_KEY,[]);
  var dailyTasks=tasks.filter(function(t){return t.type==='Daily'});
  if(!dailyTasks.length)return false;
  var recs=lsGet(REC_KEY,[]);
  var today=todayStr();
  var todayRecs=recs.filter(function(r){
    if(r.member!==memberName)return false;
    if(r.date===today)return true;
    if(r.dateStr && r.dateStr.indexOf(pad(new Date().getDate())+'/'+pad(new Date().getMonth()+1))===0)return true;
    return false;
  });
  var doneTitles={};
  todayRecs.forEach(function(r){if(r.status==='done')doneTitles[r.task]=true});
  return dailyTasks.every(function(t){return doneTitles[t.title]});
}

function getTaskPoints(memberName){
  var recs=lsGet(REC_KEY,[]);
  var total=0;
  recs.forEach(function(r){if(r.member===memberName && r.status==='done'){total+=(r.points||0)}});
  return total;
}

function countTodayTasks(memberName){
  var recs=lsGet(REC_KEY,[]);
  var today=todayStr();
  return recs.filter(function(r){
    if(r.member!==memberName||r.status!=='done')return false;
    if(r.date===today)return true;
    if(r.dateStr && r.dateStr.indexOf(pad(new Date().getDate())+'/'+pad(new Date().getMonth()+1))===0)return true;
    return false;
  }).length;
}

function endDuty(rank){
  var m=getMembers();
  var active=m.find(function(x){return x.onDuty && x.rank===rank && !x.deleted});
  if(!active){showMsg('کوئی ڈیوٹی پر نہیں',true);return}
  var taskDone=areAllDailyComplete(active.name);
  if(!taskDone && !active.partialMarked){
    active.partialMarked=true;setMembers(m);renderAll();
    showMsg('⚠️ ادھوری — دوبارہ دبائیں');return;
  }
  var now=Date.now();
  var pts=getTaskPoints(active.name);
  var hist=getHistLogs();
  var d=new Date();
  hist.unshift({
    id:Date.now(),memberName:active.name,rank:active.rank,
    status:taskDone?'done':'partial',points:taskDone?pts:0,
    taskCount:taskDone?countTodayTasks(active.name):0,
    timestamp:now,date:todayStr(),
    dateOnly:pad(d.getDate())+'/'+pad(d.getMonth()+1)
  });
  hist=hist.filter(function(h){return h.timestamp>=Date.now()-7*86400000});
  lsSet(HIST_LOG_KEY,hist);
  active.onDuty=false;active.dutyStart=null;active.dutyEndedAt=now;active.partialMarked=false;
  setMembers(m);
  var stillActive=m.some(function(x){return x.onDuty && !x.deleted});
  if(!stillActive){timerRunning=false;currentTimerStart=null}
  renderAll();
  showMsg(taskDone?'✅ ڈیوٹی مکمل':'❌ ادھوری');
}

function updateTimer(){
  var m=getMembers();
  var senior=m.find(function(x){return x.onDuty && x.rank==='Senior' && !x.deleted});
  var junior=m.find(function(x){return x.onDuty && x.rank==='Junior' && !x.deleted});
  var bigTimer=$('bigTimer');if(!bigTimer)return;
  if(timerRunning && currentTimerStart){
    bigTimer.textContent=fmtTimer(Date.now()-currentTimerStart);
    bigTimer.classList.remove('stopped');
    if(junior){bigTimer.classList.add('junior-on');bigTimer.classList.remove('senior-only')}
    else if(senior){bigTimer.classList.add('senior-only');bigTimer.classList.remove('junior-on')}
    else{bigTimer.classList.remove('junior-on','senior-only')}
  } else {
    bigTimer.textContent='00:00:00';
    bigTimer.classList.add('stopped');
    bigTimer.classList.remove('junior-on','senior-only');
  }
}

function renderAll(){
  var m=getMembers().filter(function(x){return !x.deleted});
  populateLeaveMembers();
  renderDutyPanel(m);
  renderLeaveRecord();
  renderState(m);
  updateTimer();
}

function renderDutyPanel(m){
  var s=m.find(function(x){return x.onDuty&&x.rank==='Senior'});
  var j=m.find(function(x){return x.onDuty&&x.rank==='Junior'});
  $('dashSenior').textContent=s?s.name:'—';
  $('dashJunior').textContent=j?j.name:'—';
  $('endSeniorBtn').disabled=!s;
  $('endJuniorBtn').disabled=!j;
}

/* ✅ چھٹی ریکارڈ — سادہ لسٹ (entry history جیسا) */
function renderLeaveRecord(){
  var leaves=getLeaves();
  var today=todayStr();
  var recent=leaves.filter(function(l){
    return l.date===today || (l.timestamp && l.timestamp>=Date.now()-7*86400000);
  }).sort(function(a,b){return (b.timestamp||0)-(a.timestamp||0)}).slice(0,15);
  var box=$('leaveRecordBox');
  if(!recent.length){
    box.innerHTML='<div class="leave-empty">📭 کوئی چھٹی نہیں</div>';
    return;
  }
  box.innerHTML=recent.map(function(l,i){
    var chk=selectMode?'<input type="checkbox" class="chk" '+(selectedIds['lv_'+l.id]?'checked':'')+' onchange="toggleSel(\'lv_'+l.id+'\')">':'';
    var d=new Date(l.timestamp||Date.now());
    var dtStr=pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    return '<div class="leave-item">'
      +chk
      +'<div class="body">'
      +'<div class="nm">'+(i+1)+'️⃣ 👤 '+esc(l.name)+' ('+l.rank+')</div>'
      +'<div class="reason">🏖️ "'+esc(l.reason||'—')+'"</div>'
      +'<div class="meta">⏱️ '+(l.duration||1)+' دن · 📅 '+dtStr+'</div>'
      +'</div>'
      +'</div>';
  }).join('');
}

function renderState(m){
  var active=m.filter(function(x){return x.onDuty}).length;
  var leave=m.filter(function(x){return x.onLeave}).length;
  $('stateMembers').textContent=m.length;
  $('stateActive').textContent=active;
  $('stateLeave').textContent=leave;
}

function toggleSelectMode(){
  selectMode=!selectMode;
  $('selModeBtn').classList.toggle('active',selectMode);
  if(!selectMode)selectedIds={};
  renderAll();
  showMsg(selectMode?'✅ Select ON':'☑️ OFF');
}
function toggleSel(key){selectedIds[key]=!selectedIds[key];renderAll()}

function editSelected(){
  var ids=Object.keys(selectedIds).filter(function(k){return selectedIds[k]&&k.indexOf('lv_')===0});
  if(!ids.length){showMsg('چھٹی منتخب کریں',true);return}
  if(ids.length>1){showMsg('ایک وقت میں ایک',true);return}
  var id=ids[0].replace('lv_','');
  var leaves=getLeaves();
  var idx=leaves.findIndex(function(l){return String(l.id)===id});
  if(idx===-1)return;
  var nr=prompt('نیا وجہ:',leaves[idx].reason);
  if(nr&&nr.trim()){
    leaves[idx].reason=nr.trim();
    setLeaves(leaves);
    selectedIds={};
    renderAll();
    showMsg('✅ اپڈیٹ');
  }
}

function deleteSelected(){
  var ids=Object.keys(selectedIds).filter(function(k){return selectedIds[k]&&k.indexOf('lv_')===0}).map(function(k){return k.replace('lv_','')});
  if(!ids.length){showMsg('چھٹی منتخب کریں',true);return}
  showConfirm('ڈیلیٹ',ids.length+' چھٹی ڈیلیٹ؟',function(){
    var leaves=getLeaves().filter(function(l){return ids.indexOf(String(l.id))===-1});
    setLeaves(leaves);
    var m=getMembers();
    m.forEach(function(mem){
      var stillOnLeave=leaves.some(function(l){
        return l.name===mem.name && (l.date===todayStr()||(l.timestamp && l.timestamp>=todayTs()))
      });
      if(!stillOnLeave && mem.onLeave){mem.onLeave=false;mem.currentLeaveReason=null;mem.leaveStart=null}
    });
    setMembers(m);
    selectedIds={};
    renderAll();
    showMsg('✅ ڈیلیٹ');
  });
}

function clearAll(){
  showConfirm('صاف','تمام چھٹی ریکارڈ صاف؟',function(){
    setLeaves([]);
    var m=getMembers();
    m.forEach(function(mem){mem.onLeave=false;mem.currentLeaveReason=null;mem.leaveStart=null});
    setMembers(m);
    selectedIds={};
    renderAll();
    showMsg('🧹 صاف');
  });
}

function openSettings(){$('nsOverlay').classList.add('active')}
function closeSettings(){$('nsOverlay').classList.remove('active')}
function closeSection(){
  closeSettings();
  $('dutySectionCard').style.display='none';
  showMsg('✅ سیکشن بند');
}

function showConfirm(title,body,cb){
  $('modalTitle').textContent=title;
  $('modalBody').textContent=body;
  _modalCb=cb;
  $('nsModal').classList.add('active');
}
function modalClose(){$('nsModal').classList.remove('active');_modalCb=null}
function modalConfirm(){var cb=_modalCb;modalClose();if(cb)cb()}

setInterval(updateTimer,1000);

document.addEventListener('DOMContentLoaded',function(){
  var m=getMembers();
  var anyActive=m.some(function(x){return x.onDuty&&!x.deleted});
  if(anyActive){
    var activeMem=m.find(function(x){return x.onDuty&&x.dutyStart});
    if(activeMem){currentTimerStart=activeMem.dutyStart;timerRunning=true}
  }
  renderAll();
});
</script>
</body>
</html>
