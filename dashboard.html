<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ڈیش بورڈ</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#eef2f6; font-family:system-ui,sans-serif; direction:rtl;
       display:flex; justify-content:center; min-height:100vh; padding:10px; }
.card { background:#fff; border-radius:14px; width:100%; max-width:600px;
        padding:14px 12px; border:1px solid #cbd5e1; border-right:5px solid #d97706;
        box-shadow:0 8px 18px rgba(0,0,0,.06); }
.hd { padding-bottom:8px; margin-bottom:12px; border-bottom:2px solid #f1f5f9; }
.ti { font-size:16px; font-weight:700; color:#d97706; }
.sub { font-size:12px; font-weight:700; color:#d97706; margin:12px 0 6px;
       padding-bottom:4px; border-bottom:2px dashed #fde68a;
       display:flex; justify-content:space-between; align-items:center; }
.cnt { background:#d97706; color:#fff; font-size:10px; padding:2px 8px; border-radius:20px; }
.list { max-height:320px; overflow-y:auto; border:2px solid #fcd34d;
        border-radius:8px; padding:6px; background:#fffbeb; min-height:60px; }
.row { display:flex; align-items:center; gap:8px; background:#fff;
       border:2px solid #e2e8f0; border-radius:6px; padding:10px;
       margin-bottom:5px; cursor:pointer; user-select:none; }
.row.sel { border-color:#16a34a; background:#f0fdf4; }
.row input { width:18px; height:18px; accent-color:#16a34a; cursor:pointer; flex-shrink:0; }
.row .nm { flex:1; font-size:13px; font-weight:700; color:#1e293b; }
.row .qt { background:#fef3c7; color:#92400e; font-size:10px;
           font-weight:800; padding:2px 10px; border-radius:20px; }
.live { max-height:180px; overflow-y:auto; border:2px solid #16a34a;
        border-radius:8px; padding:6px; background:#f0fdf4; }
.live .lr { display:flex; justify-content:space-between; background:#fff;
            border:1px solid #86efac; border-radius:6px; padding:7px 10px;
            margin-bottom:4px; font-size:12px; font-weight:700; }
.live .lr .q { color:#d97706; background:#fef3c7; padding:2px 8px;
               border-radius:20px; font-size:10px; }
.empty { text-align:center; color:#94a3b8; font-size:12px; padding:30px 10px; }
.empty i { font-size:40px; display:block; margin-bottom:8px; opacity:.5; font-style:normal; }
.empty small { font-size:10px; opacity:.8; }
.acts { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:10px 0; }
.acts button { padding:9px; font-size:12px; font-weight:700; border:none;
               border-radius:6px; cursor:pointer; }
.btn-s { background:#cbd5e1; color:#334155; }
.btn-u { background:#fef3c7; color:#92400e; }
.save { width:100%; padding:12px; background:#16a34a; color:#fff;
        font-size:14px; font-weight:800; border:none; border-radius:8px;
        cursor:pointer; margin-top:10px; }
.save:disabled { background:#94a3b8; cursor:not-allowed; }
.save:active { opacity:.85; }
.note { background:#fef3c7; border:1px solid #fcd34d; padding:10px;
        border-radius:8px; font-size:12px; color:#92400e; margin-top:10px;
        text-align:center; font-weight:700; }
.stat { background:#fffbeb; border:1px solid #fcd34d; padding:10px;
        border-radius:8px; margin-top:10px; text-align:center;
        font-size:13px; font-weight:700; color:#92400e; }
.stat b { color:#d97706; font-size:16px; }
</style>
</head>
<body>

<div class="card">
  <div class="hd"><div class="ti">🛒 ڈیش بورڈ</div></div>

  <div class="sub">
    <span>📋 انٹری سے آئے آٹمز</span>
    <span class="cnt" id="cnt">0</span>
  </div>

  <div class="list" id="list"></div>

  <div class="acts">
    <button class="btn-s" onclick="selAll()">✅ تمام سلیکٹ</button>
    <button class="btn-u" onclick="unselAll()">⬜ سلیکشن ہٹائیں</button>
  </div>

  <div class="sub">
    <span>📝 سلیکٹڈ (لائیو)</span>
    <span class="cnt" id="liveCnt">0</span>
  </div>

  <div class="live" id="live">
    <div class="empty" style="padding:15px">✨ کچھ سلیکٹ نہیں کیا</div>
  </div>

  <button class="save" id="saveBtn" onclick="saveToHistory()" disabled>💾 سیو کریں → ہسٹری</button>

  <div class="stat" id="stat">📋 ہسٹری میں <b>0</b> ریکارڈ</div>

  <div class="note">💡 آٹم سلیکٹ کریں اور سیو دبائیں — ہسٹری میں چلا جائے گا</div>
</div>

<script>
var ITEMS_KEY = "rashan_live_items";
var RECS_KEY = "rashan_live_records";
var SEL_KEY = "rashan_live_selection";

var selected = {};

function loadItems() {
  try { return JSON.parse(localStorage.getItem(ITEMS_KEY) || '[]'); } catch(e) { return []; }
}
function loadRecs() {
  try { return JSON.parse(localStorage.getItem(RECS_KEY) || '[]'); } catch(e) { return []; }
}
function loadSel() {
  try { return JSON.parse(localStorage.getItem(SEL_KEY) || '{}'); } catch(e) { return {}; }
}
function saveSel() {
  try { localStorage.setItem(SEL_KEY, JSON.stringify(selected)); } catch(e) {}
}
function esc(s) {
  var d = document.createElement("div");
  d.textContent = String(s);
  return d.innerHTML;
}

function render() {
  var items = loadItems();
  var recs = loadRecs();

  document.getElementById("cnt").textContent = items.length;
  document.getElementById("stat").innerHTML = "📋 ہسٹری میں <b>" + recs.length + "</b> ریکارڈ";

  // Purane selected IDs hata dein jo items mein nahi hain
  var ids = {};
  items.forEach(function(it) { ids[it.id] = true; });
  Object.keys(selected).forEach(function(k) {
    if (!ids[k]) delete selected[k];
  });

  var list = document.getElementById("list");
  if (!items.length) {
    list.innerHTML = '<div class="empty"><i>📝</i>ابھی کوئی آٹم نہیں<br><small>پہلے انٹری میں جا کر آٹم ایڈ کریں</small></div>';
    renderLive([]);
    return;
  }

  list.innerHTML = items.map(function(it) {
    var isSel = !!selected[it.id];
    return '<div class="row' + (isSel ? ' sel' : '') + '" onclick="tog(' + it.id + ')">' +
      '<input type="checkbox" ' + (isSel ? 'checked' : '') + ' onclick="event.stopPropagation(); tog(' + it.id + ')">' +
      '<span class="nm">' + esc(it.name) + '</span>' +
      '<span class="qt">' + esc(it.qty) + '</span>' +
      '</div>';
  }).join('');

  var selItems = items.filter(function(it) { return selected[it.id]; });
  renderLive(selItems);
}

function renderLive(selItems) {
  document.getElementById("liveCnt").textContent = selItems.length;
  var box = document.getElementById("live");
  var btn = document.getElementById("saveBtn");
  if (!selItems.length) {
    box.innerHTML = '<div class="empty" style="padding:15px">✨ کچھ سلیکٹ نہیں کیا</div>';
    btn.disabled = true;
    return;
  }
  btn.disabled = false;
  box.innerHTML = selItems.map(function(it) {
    return '<div class="lr"><span>' + esc(it.name) + '</span><span class="q">' + esc(it.qty) + '</span></div>';
  }).join('');
}

function tog(id) {
  if (selected[id]) delete selected[id];
  else selected[id] = true;
  saveSel();
  render();
}

function selAll() {
  loadItems().forEach(function(it) { selected[it.id] = true; });
  saveSel();
  render();
}
function unselAll() {
  selected = {};
  saveSel();
  render();
}

function saveToHistory() {
  var items = loadItems().filter(function(it) { return selected[it.id]; });
  if (!items.length) { alert("کچھ سلیکٹ کریں"); return; }

  var recs = loadRecs();
  recs.unshift({
    id: Date.now(),
    timestamp: Date.now(),
    items: items.map(function(it) {
      return { name: it.name, qty: it.qty };
    })
  });
  try { localStorage.setItem(RECS_KEY, JSON.stringify(recs)); } catch(e) {}

  selected = {};
  saveSel();
  alert("✅ " + items.length + " آٹم ہسٹری میں سیو ہو گئے!");
  render();
}

selected = loadSel();
render();

window.addEventListener('storage', function(e) {
  if (e.key === ITEMS_KEY || e.key === RECS_KEY) render();
});
setInterval(render, 1500);
</script>

</body>
</html>
