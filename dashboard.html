<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ڈیش بورڈ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f6;font-family:system-ui,sans-serif;direction:rtl;padding:10px}
.wrap{max-width:700px;margin:0 auto}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:10px}
.card h2{font-size:14px;color:#1e293b;margin-bottom:10px;padding-bottom:8px;border-bottom:2px dashed #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .mini-timer{font-size:11px;font-weight:800;color:#6d28d9;background:#ede9fe;padding:3px 10px;border-radius:20px}
.card.task h2{color:#16a34a}

/* Task Tracker */
.task-select{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;margin-bottom:10px}
.task-select label{font-size:11px;font-weight:800;color:#15803d;display:block;margin-bottom:6px}
.task-select select{width:100%;padding:9px 10px;border:1px solid #86efac;border-radius:6px;font-size:13px;font-weight:700;font-family:inherit;background:#fff;outline:none}
.task-current{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border:2px solid #86efac;border-radius:10px;padding:14px;text-align:center;margin-bottom:10px}
.task-current .lbl{font-size:10px;font-weight:800;color:#15803d;margin-bottom:6px}
.task-current .nm{font-size:18px;font-weight:900;color:#166534;line-height:1.3}
.task-current .pts{display:inline-block;background:#16a34a;color:#fff;font-size:12px;font-weight:800;padding:3px 12px;border-radius:20px;margin-top:8px}
.task-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.task-btns button{padding:11px 4px;font-size:12px;font-weight:800;border:none;border-radius:8px;cursor:pointer;font-family:inherit;color:#fff}
.task-btns .done{background:#16a34a}
.task-btns .notdone{background:#dc2626}
.task-btns .skip{background:#64748b}
.task-score{background:#1e293b;color:#fff;border-radius:8px;padding:10px 14px;text-align:center;font-size:13px;font-weight:800}
.task-score b{font-size:18px;color:#facc15}
.task-history{max-height:180px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:6px;background:#fafafa;margin-top:10px}
.task-history .row{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:7px 10px;margin-bottom:4px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
.task-history .row .st{padding:2px 8px;border-radius:20px;font-size:9px;font-weight:800}
.task-history .row .st.done{background:#dcfce7;color:#15803d}
.task-history .row .st.notdone{background:#fee2e2;color:#991b1b}
.task-history .row .st.skip{background:#f1f5f9;color:#475569}
.empty-note{text-align:center;color:#94a3b8;font-size:11px;padding:14px;font-weight:600}
</style>
</head>
<body>

<div class="wrap">

  <!-- TASK TRACKER -->
  <div class="card task">
    <h2><span>📋 ٹاسک ٹریکر</span></h2>

    <div class="task-select">
      <label>ممبر منتخب کریں</label>
      <select id="taskMemberSel" onchange="onTaskMemberChange()">
        <option value="">-- ممبر منتخب کریں --</option>
      </select>
    </div>

    <div class="task-current" id="taskCurrent">
      <div class="lbl">📌 موجودہ ٹاسک</div>
      <div class="nm">پہلے ممبر منتخب کریں</div>
      <div class="pts">0 Points</div>
    </div>

    <div class="task-btns">
      <button class="done" onclick="taskSubmit('done')">✅ ہو گیا</button>
      <button class="notdone" onclick="taskSubmit('notdone')">❌ نہیں ہوا</button>
      <button class="skip" onclick="taskSubmit('skip')">⚪ کرنا نہیں تھا</button>
    </div>

    <div class="task-score">🏆 ٹوٹل پوائنٹس: <b id="totalPoints">0</b></div>

    <div style="font-size:11px;font-weight:800;color:#475569;margin-top:14px;margin-bottom:6px;">📜 حالیہ ٹاسک</div>
    <div class="task-history" id="taskHistList">
      <div class="empty-note">کوئی ریکارڈ نہیں</div>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════ */
var TASK_KEY = 'sec3_task_and_point_manager_data';
var DUTY_KEY = 'sec4_duty_manager_data_v4';
var REC_KEY = 'sec12_task_records';
var SKIP_KEY = 'sec4_duty_skipped_data';

function $(id){return document.getElementById(id);}
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function pad(n){return String(n).padStart(2,'0');}

var currentMember='';
var currentTaskIndex=0;

/* ═══ LOAD ═══ */
function getMembers(){
  var m=ls(DUTY_KEY,[]);
  if(!Array.isArray(m)) m=[];
  return m;
}
function getTasks(){
  var t=ls(TASK_KEY,[]);
  if(!Array.isArray(t)) t=[];
  return t;
}
function getRecords(){
  var r=ls(REC_KEY,[]);
  if(!Array.isArray(r)) r=[];
  return r;
}
function saveRecords(r){lss(REC_KEY,r);}
function getSkipped(){
  var s=ls(SKIP_KEY,[]);
  if(!Array.isArray(s)) s=[];
  return s;
}
function saveSkipped(s){lss(SKIP_KEY,s);}

/* ═══ RENDER DROPDOWN ═══ */
function populateMemberSelect(){
  var sel=$('taskMemberSel');
  if(!sel) return;
  var cur=sel.value;
  var m=getMembers();
  sel.innerHTML='<option value="">-- ممبر منتخب کریں --</option>';
  m.filter(function(x){return !x.onLeave;}).forEach(function(x){
    sel.appendChild(new Option(x.name+' ('+(x.rank==='Senior'?'سینئر':'جونیئر')+')',x.name));
  });
  if(cur) sel.value=cur;
}

/* ═══ MEMBER CHANGE ═══ */
window.onTaskMemberChange = function(){
  currentMember=$('taskMemberSel').value;
  currentTaskIndex=0;
  renderCurrentTask();
  renderTaskHistory();
  renderTotalPoints();
};

/* ═══ CURRENT TASK ═══ */
function getCurrentTask(){
  var tasks=getTasks();
  if(currentTaskIndex>=tasks.length) currentTaskIndex=0;
  return tasks[currentTaskIndex];
}

function renderCurrentTask(){
  var el=$('taskCurrent');
  if(!currentMember){
    el.innerHTML='<div class="lbl">📌 موجودہ ٹاسک</div><div class="nm">پہلے ممبر منتخب کریں</div><div class="pts">0 Points</div>';
    return;
  }
  var tasks=getTasks();
  if(!tasks.length){
    el.innerHTML='<div class="lbl">📌 موجودہ ٹاسک</div><div class="nm">کوئی ٹاسک نہیں — Entry سے ایڈ کریں</div><div class="pts">0 Points</div>';
    return;
  }
  var t=getCurrentTask();
  el.innerHTML='<div class="lbl">📌 موجودہ ٹاسک</div><div class="nm">'+esc(t.title)+'</div><div class="pts">🏆 '+t.points+' Points</div>';
}

/* ═══ SUBMIT ═══ */
window.taskSubmit = function(status){
  if(!currentMember){alert('پہلے ممبر منتخب کریں');return;}
  var tasks=getTasks();
  if(!tasks.length){alert('کوئی ٹاسک نہیں');return;}

  var t=getCurrentTask();
  var recs=getRecords();
  var pointsEarned = (status==='done') ? (parseInt(t.points,10)||0) : 0;

  var now=new Date();
  var rec={
    id:Date.now(),
    member:currentMember,
    task:t.title,
    type:t.type,
    points:pointsEarned,
    status:status,
    timestamp:now.getTime(),
    dateStr: pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear(),
    timeStr: pad(now.getHours())+':'+pad(now.getMinutes())
  };
  recs.unshift(rec);
  if(recs.length>500) recs=recs.slice(0,500);
  saveRecords(recs);

  if(status==='notdone'){
    var sk=getSkipped();
    sk.unshift({
      id:Date.now(),
      member:currentMember,
      task:t.title,
      reason:'',
      hasReason:false,
      timestamp:Date.now()
    });
    saveSkipped(sk);
  }

  currentTaskIndex++;
  renderCurrentTask();
  renderTaskHistory();
  renderTotalPoints();
};

/* ═══ HISTORY ═══ */
function renderTaskHistory(){
  var box=$('taskHistList');
  if(!box) return;
  if(!currentMember){
    box.innerHTML='<div class="empty-note">ممبر منتخب کریں</div>';
    return;
  }
  var recs=getRecords().filter(function(r){return r.member===currentMember;});
  if(!recs.length){
    box.innerHTML='<div class="empty-note">کوئی ریکارڈ نہیں</div>';
    return;
  }
  box.innerHTML=recs.slice(0,20).map(function(r){
    var stLbl = r.status==='done'?'✅ ہو گیا':(r.status==='notdone'?'❌ نہیں ہوا':'⚪ چھوڑا');
    var stCls = r.status==='done'?'done':(r.status==='notdone'?'notdone':'skip');
    return '<div class="row"><div style="flex:1;min-width:0;">'+
      '<div>'+esc(r.task)+'</div>'+
      '<div style="font-size:9px;color:#64748b;margin-top:2px;">'+esc(r.dateStr)+' '+esc(r.timeStr)+'</div>'+
      '</div>'+
      '<span class="st '+stCls+'">'+stLbl+'</span></div>';
  }).join('');
}

function renderTotalPoints(){
  var b=$('totalPoints');
  if(!b) return;
  if(!currentMember){b.textContent='0';return;}
  var recs=getRecords().filter(function(r){return r.member===currentMember;});
  var total=0;
  recs.forEach(function(r){total+=(r.points||0);});
  b.textContent=total;
}

/* ═══ INIT ═══ */
populateMemberSelect();
renderCurrentTask();
renderTaskHistory();
renderTotalPoints();

window.addEventListener('storage',function(e){
  if(e.key===DUTY_KEY){populateMemberSelect();renderTaskHistory();renderTotalPoints();}
  if(e.key===TASK_KEY){renderCurrentTask();}
  if(e.key===REC_KEY){renderTaskHistory();renderTotalPoints();}
});
setInterval(function(){
  populateMemberSelect();
  renderCurrentTask();
  renderTaskHistory();
  renderTotalPoints();
},3000);
</script>
</body>
</html>
