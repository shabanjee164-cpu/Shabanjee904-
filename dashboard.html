<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — News/Alert Patties</title>
<style>
:root{--bg:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;padding:12px;color:#334155;direction:rtl}
.container{max-width:750px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* NEWS TICKER */
.ticker-bar{background:#fffbeb;border:1px solid #fde68a;color:#d97706;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:700;overflow:hidden;white-space:nowrap;min-height:42px;display:flex;align-items:center}
.ticker-text{display:inline-block;animation:customTickerRight 35s linear infinite;padding-right:100%}
@keyframes customTickerRight{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ALERT TICKER */
.alert-ticker-bar{background:#fef2f2;border:1px solid #fecaca;color:#ef4444;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:all .3s;min-height:42px}
.alert-ticker-bar.blink{animation:fastBlink 0.8s infinite alternate}
@keyframes fastBlink{0%{opacity:1}100%{opacity:.35;background-color:#ef4444;color:white}}
.alert-skip-btn{background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:800;font-family:inherit;flex-shrink:0}
.alert-skip-btn:active{transform:scale(.95)}
</style>
</head>
<body>

<div class="container">

  <!-- NEWS TICKER -->
  <div class="ticker-bar" id="newsTickerBar">
    <div class="ticker-text" id="newsBar">📰 لوڈ ہو رہا ہے...</div>
  </div>

  <!-- ALERT TICKER -->
  <div class="alert-ticker-bar" id="alertBar" style="display:none">
    <span id="alertMsg">🚨 اہم الرٹ...</span>
    <button class="alert-skip-btn" onclick="skipAlert()">اسکیپ ❌</button>
  </div>

</div>

<script>
/* ============ HELPERS ============ */
function $(id){return document.getElementById(id)}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}

/* ============ KEY ============ */
var NEWS_KEY='sec10_news_alerts_data';

/* ============ RENDER NEWS/ALERT ============ */
var newsIndex=0,newsTimer=null;

function renderNewsAlert(){
  var items=lsGet(NEWS_KEY,[]);
  var news=items.filter(function(x){return x.type==='news' && !x.deleted;});
  var alerts=items.filter(function(x){return x.type==='alert' && !x.deleted;});

  // ========== NEWS BAR ==========
  if($('newsBar')){
    if(news.length){
      if(newsIndex>=news.length)newsIndex=0;
      function showNews(){
        var n=news[newsIndex % news.length];
        var el=$('newsBar');
        el.textContent='📰 '+n.content;
        el.style.animation='none';
        void el.offsetWidth;
        el.style.animation='customTickerRight 35s linear infinite';
        newsIndex++;
      }
      showNews();
      if(newsTimer)clearInterval(newsTimer);
      newsTimer=setInterval(showNews,40000);
    } else {
      var el=$('newsBar');
      el.textContent='📰 کوئی نیوز نہیں';
      el.style.animation='none';
    }
  }

  // ========== ALERT BAR ==========
  if($('alertBar')){
    if(alerts.length){
      $('alertBar').style.display='flex';
      $('alertBar').classList.add('blink');
      $('alertMsg').textContent='🚨 '+alerts[Math.floor(Math.random()*alerts.length)].content;
    } else {
      $('alertBar').style.display='none';
      $('alertBar').classList.remove('blink');
    }
  }
}

/* ============ SKIP ALERT ============ */
function skipAlert(){
  var ab=$('alertBar');
  if(ab){
    ab.style.display='none';
    ab.classList.remove('blink');
  }
}

/* ============ INIT ============ */
document.addEventListener('DOMContentLoaded',function(){
  renderNewsAlert();
  // Refresh every 30 seconds (in case data changed)
  setInterval(renderNewsAlert,30000);
});
</script>
</body>
</html>
