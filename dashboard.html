<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Manager — Dashboard</title>
<style>
:root{--primary:#1e293b;--accent:#2563eb;--danger:#ef4444;--golden:#d97706;--success:#10b981;--bg:#f8fafc;--border:#e2e8f0;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;padding:12px;padding-bottom:20px;color:#334155;direction:rtl}
.container{max-width:750px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.app-header{background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;text-align:center;padding:12px 8px;border-radius:10px;font-size:15px;font-weight:bold;border-bottom:3px solid var(--accent)}

/* NEWS TICKER */
.ticker-bar{background:#fffbeb;border:1px solid #fde68a;color:var(--golden);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap}
.ticker-text{display:inline-block;animation:customTickerRight 35s linear infinite;padding-right:100%}
@keyframes customTickerRight{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ALERT TICKER */
.alert-ticker-bar{background:#fef2f2;border:1px solid #fecaca;color:var(--danger);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;transition:all .3s}
.alert-ticker-bar.blink{animation:fastBlink 0.8s infinite alternate}
@keyframes fastBlink{0%{opacity:1}100%{opacity:.35;background-color:#ef4444;color:white}}
.alert-skip-btn{background:var(--danger);color:#fff;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:bold;font-family:inherit}

/* SECTION CARD — THIN */
.section-card{background:#fff;padding:10px;border-radius:10px;border:1px solid #cbd5e1;box-shadow:0 2px 4px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px}
.section-header{font-weight:bold;color:var(--primary);font-size:13px;display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid #e2e8f0}
.section-header button{background:#f8fafc;border:1px solid #cbd5e1;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}

/* SETTINGS — 5 buttons */
.settings-panel{display:none;background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:6px;grid-template-columns:repeat(2,1fr);gap:4px}
.settings-panel.open{display:grid}
.settings-panel button{padding:6px 4px;font-size:10px;font-weight:bold;border-radius:5px;border:1px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer;font-family:inherit;text-align:center}
.settings-panel button:hover{background:#e2e8f0}
.settings-panel button.del{color:#ef4444;border-color:#fca5a5;background:#fef2f2}
.settings-panel button.active-mode{background:#10b981;color:#fff;border-color:#10b981}

/* DARK DUTY PANEL */
.duty-panel{
  background:linear-gradient(135deg,#1e293b,#0f172a);
  border:1.5px solid var(--golden);
  border-radius:10px;
  padding:10px;
  color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.duty-panel-title{text-align:center;font-size:11px;font-weight:bold;color:#fbbf24;margin-bottom:8px;letter-spacing:.5px}

/* COLUMN LAYOUT — Senior LEFT, Junior RIGHT */
.duty-cols{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:8px;
}
.duty-col{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:8px;
  padding:8px 6px;
  text-align:center;
}
.duty-col.senior{border-right:3px solid #60a5fa}
.duty-col.junior{border-left:3px solid #34d399}
.duty-col .role{font-size:10px;color:#94a3b8;margin-bottom:3px;font-weight:600}
.duty-col .name{font-size:15px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* TIMER */
.duty-timer{
  text-align:center;
  font-size:20px;
  font-weight:900;
  color:#fbbf24;
  background:rgba(0,0,0,.4);
  padding:6px;
  border-radius:8px;
  letter-spacing:2px;
  text-shadow:0 0 15px rgba(251,191,36,.5);
}

/* LEAVE FORM — ek line */
.leave-form{background:#fffbe6;border:1px solid #ffe58f;padding:8px;border-radius:8px}
.leave-form label{font-size:11px;font-weight:bold;color:#854d0e;display:block;margin-bottom:5px}
.leave-row{display:flex;gap:4px;align-items:center}
.leave-row select,.leave-row input{flex:1;padding:7px;border:1px solid #cbd5e1;border-radius:5px;font-size:11px;text-align:center;font-family:inherit;outline:none;min-width:0}
.leave-row .save-btn{background:var(--golden);color:#fff;padding:7px 12px;border:none;border-radius:5px;font-size:12px;font-weight:bold;cursor:pointer;font-family:inherit;flex:0 0 auto}

/* RECORD 3-COLUMN SCROLL */
.scroll-head{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.scroll-head span{font-size:11px;font-weight:bold;color:#475569}
.btn-close{background:#64748b;color:#fff;border:none;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:bold;cursor:pointer;font-family:inherit}

.record-3cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;max-height:160px}
.rec-col{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:5px;overflow-y:auto;font-size:10px}
.rec-col.active-col{background:#f0fdf4;border-color:#86efac}
.rec-col.done-col{background:#eff6ff;border-color:#bfdbfe}
.rec-col.leave-col{background:#fef2f2;border-color:#fca5a5}
.rec-col h4{font-size:10px;margin-bottom:4px;text-align:center;color:#475569;padding-bottom:3px;border-bottom:1px dashed #cbd5e1;position:sticky;top:0;background:inherit}
.rec-item{padding:4px 2px;border-bottom:1px dotted #e2e8f0;text-align:center}
.rec-item:last-child{border-bottom:none}
.rec-item .n{font-size:10px;font-weight:bold;color:#0f172a}
.rec-item .d{font-size:9px;color:#64748b;margin-top:1px}

/* STATE PATTI */
.state-patti{display:flex;justify-content:space-around;align-items:center;gap:4px;padding:6px 4px;border-radius:6px;margin-top:6px;background:#f8fafc;border:1px solid #e2e8f0}
.state-item{flex:1;text-align:center;padding:3px 2px;border-radius:4px;font-size:9px;font-weight:800}
.state-item .val{font-size:12px;font-weight:900;display:block;margin-top:1px}
.state-item:nth-child(1){background:#ecfdf5;color:#059669;border:1px solid #10b981}
.state-item:nth-child(2){background:#fffbeb;color:#d97706;border:1px solid #f59e0b}
.state-item:nth-child(3){background:#eff6ff;color:#2563eb;border:1px solid #3b82f6}

/* INLINE MSG */
.inline-msg{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2e8b57;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:9999;display:none;font-family:inherit}
.inline-msg.show{display:block}

@media(max-width:480px){
  .record-3cols{grid-template-columns:1fr;max-height:none}
  .rec-col{max-height:120px}
}
</style>
</head>
<body>

<div class="container">
  <div class="app-header">🏥 Smart Manager & Health Tracker</div>

  <!-- NEWS TICKER -->
  <div class="ticker-bar"><div class="ticker-text" id="newsBar">📰 لوڈ ہو رہا ہے...</div></div>

  <!-- ALERT TICKER -->
  <div class="alert-ticker-bar" id="alertBar">
    <span id="alertMsg">🚨 اہم الرٹ...</span>
    <button class="alert-skip-btn" onclick="skipAlert()">اسکیپ ❌</button>
  </div>

  <!-- DUTY SECTION -->
  <div class="section-card">
    <div class="section-header">
      <span>👮 آج کی ڈیوٹی</span>
      <button onclick="toggleSettings('dutySettings')">⚙️</button>
    </div>

    <div class="settings-panel" id="dutySettings">
      <button onclick="toggleSelectMode()" id="dutySelBtn">☑️ Select Mode</button>
      <button onclick="editSelected()">✏️ Edit</button>
      <button class="del" onclick="deleteSelected()">🗑️ Delete</button>
      <button class="del" onclick="clearRecord()">🧹 Clear</button>
      <button onclick="toggleSettings('dutySettings')">⬇️ Close</button>
    </div>

    <!-- DARK PANEL -->
    <div class="duty-panel">
      <div class="duty-panel-title">⏱️ آج کی ڈیوٹی</div>
      <div class="duty-cols">
        <div class="duty-col senior">
          <div class="role">🟢 سینئر</div>
          <div class="name" id="dashSenior">—</div>
        </div>
        <div class="duty-col junior">
          <div class="role">🔵 جونیئر</div>
          <div class="name" id="dashJunior">—</div>
        </div>
      </div>
      <div class="duty-timer" id="dashTimer">00:00:00</div>
    </div>

    <!-- LEAVE FORM -->
    <div class="leave-form">
      <label>🏖️ چھٹی سبمٹ کریں:</label>
      <div class="leave-row">
        <select id="dashLeaveSelect"><option value="">ممبر</option></select>
        <input type="text" id="dashLeaveReason" placeholder="وجہ...">
        <button class="save-btn" onclick="submitDashLeave()">✅</button>
      </div>
    </div>

    <!-- RECORD 3-COLUMN -->
    <div class="scroll-head">
      <span>📋 چھٹی ریکارڈ</span>
      <button class="btn-close" onclick="toggleClose('record3Cols')">⬇️ Close</button>
    </div>
    <div class="record-3cols" id="record3Cols">
      <div class="rec-col active-col">
        <h4>🟢 ایکٹو</h4>
        <div id="colActiveList"></div>
      </div>
      <div class="rec-col done-col">
        <h4>✅ ڈیوٹی ہو</h4>
        <div id="colDoneList"></div>
      </div>
      <div class="rec-col leave-col">
        <h4>🏖️ چھٹی</h4>
        <div id="colLeaveList"></div>
      </div>
    </div>

    <!-- STATE -->
    <div class="state-patti">
      <div class="state-item">👤 Members<span class="val" id="dutyMembers">0</span></div>
      <div class="state-item">🏖️ Leave<span class="val" id="dutyLeave">0</span></div>
      <div class="state-item">✅ On Duty<span class="val" id="dutyOn">0</span></div>
    </div>
  </div>
</div>

<div class="inline-msg" id="inlineMsg"></div>

<script>
var DUTY_KEY='sec4_duty_manager_data_v4';
var LEAVE_KEY='sec4_duty_leaves_data_v4';
var NEWS_KEY='sec10_news_alerts_data';

function $(id){return document.getElementById(id);}
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function pad(n){return String(n).padStart(2,'0');}
function fmtTimer(ms){var s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor((s%3600)/60))+':'+pad(s%60);}
function todayStr(){var d=new Date();return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function getMembers(){return ls(DUTY_KEY,[]);}
function showMsg(t,s){var el=$('inlineMsg');el.textContent=t;el.style.background=s?'#2e8b57':'#c0392b';el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2500);}
function toggleSettings(id){var el=$(id);if(el)el.classList.toggle('open');}
function toggleClose(id){var el=$(id);if(el)el.style.display=el.style.display==='none'?'block':'none';}

var selectedRecords={};
var selectMode=false;

// ========== SETTINGS ==========
function toggleSelectMode(){
  selectMode=!selectMode;
  var btn=$('dutySelBtn');
  if(btn){btn.textContent=selectMode?'✅ Select Mode ON':'☑️ Select Mode';btn.classList.toggle('active-mode',selectMode);}
  showMsg(selectMode?'✅ Select Mode ON':'☑️ OFF',true);
  renderDuty();
}
function selectRecord(id){
  selectedRecords[id]=!selectedRecords[id];
}
function editSelected(){
  var ids=Object.keys(selectedRecords).filter(function(k){return selectedRecords[k];});
  if(!ids.length){showMsg('پہلے ریکارڈ select کریں');return;}
  showMsg('✏️ Edit: '+ids.length+' record(s)',true);
}
function deleteSelected(){
  var ids=Object.keys(selectedRecords).filter(function(k){return selectedRecords[k];});
  if(!ids.length){showMsg('پہلے ریکارڈ select کریں');return;}
  lss(LEAVE_KEY,ls(LEAVE_KEY,[]).filter(function(x){return ids.indexOf(String(x.id))===-1;}));
  selectedRecords={};
  showMsg('✅ '+ids.length+' delete',true);
  renderDuty();
}
function clearRecord(){
  lss(LEAVE_KEY,[]);
  selectedRecords={};
  showMsg('🧹 Clear',true);
  renderDuty();
}

// ========== DUTY ==========
function updateDashDuty(){
  var m=getMembers();
  var s=m.find(function(x){return x.onDuty&&x.rank==='Senior';});
  var j=m.find(function(x){return x.onDuty&&x.rank==='Junior';});
  if($('dashSenior'))$('dashSenior').textContent=s?s.name:'—';
  if($('dashJunior'))$('dashJunior').textContent=j?j.name:'—';
  var active=s||j;
  if(active&&active.dutyStart&&$('dashTimer'))$('dashTimer').textContent=fmtTimer(Date.now()-active.dutyStart);
  else if($('dashTimer'))$('dashTimer').textContent='00:00:00';
  if($('dutyMembers'))$('dutyMembers').textContent=m.length;
  if($('dutyLeave'))$('dutyLeave').textContent=m.filter(function(x){return x.onLeave;}).length;
  if($('dutyOn'))$('dutyOn').textContent=m.filter(function(x){return x.onDuty;}).length;
}

function populateLeaveDropdown(){
  var sel=$('dashLeaveSelect');
  if(!sel)return;
  var m=getMembers();
  var cur=sel.value;
  sel.innerHTML='<option value="">ممبر</option>';
  m.filter(function(x){return !x.onLeave;}).forEach(function(x){
    sel.innerHTML+='<option value="'+x.id+'">'+esc(x.name)+' ('+x.rank+')</option>';
  });
  if(cur)sel.value=cur;
}

function submitDashLeave(){
  var id=$('dashLeaveSelect').value;
  var reason=$('dashLeaveReason').value.trim();
  if(!id||!reason){showMsg('ممبر اور وجہ دونوں لکھیں');return;}
  var m=getMembers();
  var t=m.find(function(x){return String(x.id)===String(id);});
  if(!t)return;
  t.onLeave=true;
  t.leaveCount=(t.leaveCount||0)+1;
  var leaves=ls(LEAVE_KEY,[]);
  leaves.push({id:Date.now(),name:t.name,rank:t.rank,reason:reason,date:todayStr(),time:pad(new Date().getHours())+':'+pad(new Date().getMinutes()),timestamp:Date.now()});
  lss(LEAVE_KEY,leaves);
  if(t.onDuty){
    t.onDuty=false;t.dutyStart=null;t.dutyEndedAt=Date.now();
    var pool=m.filter(function(x){return x.rank===t.rank&&!x.onLeave&&!x.onDuty;});
    if(pool.length){
      pool.sort(function(a,b){return (a.leaveCount||0)-(b.leaveCount||0);});
      pool[0].onDuty=true;pool[0].dutyStart=Date.now();
    }
  }
  lss(DUTY_KEY,m);
  $('dashLeaveReason').value='';
  updateDashDuty();
  populateLeaveDropdown();
  renderDuty();
  showMsg('✅ چھٹی محفوظ',true);
}

function renderDuty(){
  var m=getMembers();
  populateLeaveDropdown();

  var active=m.filter(function(x){return x.onDuty;});
  var done=m.filter(function(x){return !x.onDuty&&!x.onLeave&&x.dutyEndedAt;});
  var leaves=ls(LEAVE_KEY,[]);

  if($('colActiveList')){
    $('colActiveList').innerHTML=active.length?active.map(function(x,i){
      var chk=selectMode?'<input type="checkbox" onchange="selectRecord('+x.id+')"> ':'';
      return '<div class="rec-item">'+chk+'<div class="n">'+(i+1)+'️⃣ '+esc(x.name)+'</div><div class="d">'+x.rank+'</div><div class="d" style="color:#059669;">🟢 ایکٹو</div></div>';
    }).join(''):'<div style="text-align:center;color:#94a3b8;padding:6px;font-size:9px;">کوئی نہیں</div>';
  }

  if($('colDoneList')){
    $('colDoneList').innerHTML=done.length?done.map(function(x,i){
      var chk=selectMode?'<input type="checkbox" onchange="selectRecord('+x.id+')"> ':'';
      return '<div class="rec-item">'+chk+'<div class="n">'+(i+1)+'️⃣ '+esc(x.name)+'</div><div class="d">'+x.rank+'</div><div class="d" style="color:#2563eb;">✅ مکمل</div></div>';
    }).join(''):'<div style="text-align:center;color:#94a3b8;padding:6px;font-size:9px;">کوئی نہیں</div>';
  }

  if($('colLeaveList')){
    $('colLeaveList').innerHTML=leaves.length?leaves.slice(-15).reverse().map(function(x,i){
      var chk=selectMode?'<input type="checkbox" onchange="selectRecord('+x.id+')"> ':'';
      return '<div class="rec-item">'+chk+'<div class="n">'+(i+1)+'️⃣ '+esc(x.name)+'</div><div class="d" style="color:#dc2626;">🏖️ '+esc(x.reason)+'</div></div>';
    }).join(''):'<div style="text-align:center;color:#94a3b8;padding:6px;font-size:9px;">کوئی نہیں</div>';
  }

  updateDashDuty();
}

// ========== NEWS/ALERT ==========
var newsIndex=0,newsTimer=null;

function renderNewsAlert(){
  var items=ls(NEWS_KEY,[]);
  var news=items.filter(function(x){return x.type==='news';});
  var alerts=items.filter(function(x){return x.type==='alert';});

  if($('newsBar')){
    if(news.length){
      newsIndex=0;
      if(newsTimer)clearInterval(newsTimer);
      function showNews(){
        var n=news[newsIndex%news.length];
        $('newsBar').textContent='📰 '+n.content;
        $('newsBar').style.animation='none';
        void $('newsBar').offsetWidth;
        $('newsBar').style.animation='customTickerRight 35s linear infinite';
        newsIndex++;
      }
      showNews();
      newsTimer=setInterval(showNews,40000);
    } else {
      $('newsBar').textContent='📰 کوئی نیوز نہیں';
    }
  }

  if($('alertBar')){
    if(alerts.length){
      $('alertBar').style.display='flex';
      $('alertBar').classList.add('blink');
      $('alertMsg').textContent='🚨 '+alerts[Math.floor(Math.random()*alerts.length)].content;
    } else {
      $('alertBar').style.display='none';
    }
  }
}

function skipAlert(){
  var ab=$('alertBar');
  if(ab){ab.style.display='none';ab.classList.remove('blink');}
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded',function(){
  updateDashDuty();
  populateLeaveDropdown();
  renderDuty();
  renderNewsAlert();
  setInterval(updateDashDuty,1000);
});
</script>
</body>
</html>
