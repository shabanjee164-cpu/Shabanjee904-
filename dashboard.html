<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Management And Life Tracker</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --purple: #8b5cf6;
            --golden: #d97706;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --radius: 10px;
        }

        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); padding: 10px; line-height: 1.4; font-size: 13px; }

        .container { max-width: 750px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

        /* ہیڈر سائز ایڈجسٹمنٹ */
        .app-header {
            background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff;
            text-align: center; padding: 10px 5px; border-radius: var(--radius);
            font-size: 14px; font-weight: bold; border-bottom: 3px solid var(--accent);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* نیوز پٹی */
        .ticker-bar {
            background: #fffbeb; border: 1px solid #fde68a; color: var(--golden);
            padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
            overflow: hidden; white-space: nowrap; display: none; align-items: center;
        }
        .ticker-bar.show { display: flex; }
        .ticker-text {
            display: inline-block;
            animation: customTickerRight var(--news-dur, 35s) linear infinite;
            padding-right: 100%;
        }

        @keyframes customTickerRight {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* الرٹ پٹی */
        .alert-ticker-bar {
            background: #fef2f2; border: 1px solid #fecaca; color: var(--danger);
            padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
            overflow: hidden; display: none; justify-content: space-between; align-items: center; gap: 8px;
        }
        .alert-ticker-bar.show { display: flex; }
        .alert-ticker-bar.blink { animation: alertBlink 0.8s infinite alternate; }
        @keyframes alertBlink {
            0% { opacity: 1; }
            100% { opacity: 0.35; background: #ef4444; color: #fff; }
        }
        .alert-text {
            display: inline-block;
            white-space: nowrap;
            animation: customTickerRight var(--alert-dur, 25s) linear infinite;
            padding-right: 100%;
        }
        .alert-skip-btn {
            background: var(--danger); color: #fff; border: none;
            padding: 4px 10px; border-radius: 6px; cursor: pointer;
            font-size: 11px; font-weight: bold; flex-shrink: 0;
        }

        /* اضافی اثرات (NA1 سیٹنگز کے مطابق) */
        .eff-static { animation: none !important; white-space: normal !important; padding-right: 0 !important; }
        .eff-reverse { animation-direction: reverse !important; }
        .eff-fade { animation: effFade 1.4s ease-in-out infinite alternate !important; white-space: normal !important; padding-right: 0 !important; }
        .eff-slide { animation: effSlide 0.8s ease-out !important; white-space: normal !important; padding-right: 0 !important; }
        .eff-blink { animation: effBlink 0.9s step-end infinite !important; white-space: normal !important; padding-right: 0 !important; }
        .eff-blur { animation: effBlur 1.5s ease-out !important; white-space: normal !important; padding-right: 0 !important; }
        .eff-bounce { animation: effBounce 1s ease-in-out infinite !important; white-space: normal !important; padding-right: 0 !important; }
        .eff-glow { text-shadow: 0 0 8px rgba(220,38,38,.45); animation: effGlow 1.1s ease-in-out infinite alternate !important; white-space: normal !important; padding-right: 0 !important; }

        @keyframes effFade { 0% { opacity: .25; } 100% { opacity: 1; } }
        @keyframes effSlide { 0% { transform: translateX(35px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes effBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes effBlur { 0% { filter: blur(6px); opacity: .3; } 100% { filter: blur(0); opacity: 1; } }
        @keyframes effBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes effGlow { 0% { transform: scale(.98); } 100% { transform: scale(1.02); } }
    </style>
</head>
<body>

    <div class="container">

        <!-- ہیڈر -->
        <div class="app-header">⚡ Smart Management And Life Tracker</div>

        <!-- نیوز پٹی (NA1 سے کنٹرول) -->
        <div class="ticker-bar" id="newsPattiBox">
            <div class="ticker-text" id="newsPattiText"></div>
        </div>

        <!-- الرٹ پٹی (NA1 سے کنٹرول) -->
        <div class="alert-ticker-bar" id="alertPattiBox">
            <span class="alert-text" id="alertPattiText"></span>
            <button class="alert-skip-btn" onclick="skipAlertItem()">اسکیپ ❌</button>
        </div>

    </div>

    <script>
        function $(id) { return document.getElementById(id); }
        function lsGet(k, d) {
            try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
            catch (e) { return d; }
        }
        function lsSet(k, v) {
            try { localStorage.setItem(k, JSON.stringify(v)); return true; }
            catch (e) { return false; }
        }

        var NEWS_KEY = 'sec10_news_alerts_data';
        var NA1_SET_KEY = 'ns_modular_settings_v1';
        var NA1_AUD_KEY = 'ns_modular_audio_v1';
        var MAN_KEY = 'a2_manual_sel';

        var _ctx = null;
        function getCtx() {
            if (!_ctx) {
                try { _ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
            }
            if (_ctx && _ctx.state === 'suspended') _ctx.resume();
            return _ctx;
        }

        var NEWS_TUNES = [
            {n:"نیوز بیپ 1",p:[[780,180]]},{n:"نیوز ڈبل 2",p:[[780,130],[0,50],[920,150]]},
            {n:"نرم گھنٹی 3",p:[[1100,250],[850,180]]},{n:"صبح بخیر 4",p:[[523,160],[659,160],[784,220]]},
            {n:"پرندہ سر 5",p:[[1400,90],[1850,90],[1400,90]]},{n:"پانی قطرہ 6",p:[[600,220],[450,180]]},
            {n:"پیانو نوٹ 7",p:[[523,200],[659,200],[784,200],[1046,260]]},{n:"گٹار تار 8",p:[[330,280],[440,280]]},
            {n:"بانسری دھن 9",p:[[620,420]]},{n:"میٹھی ٹون 10",p:[[880,140],[1046,180]]},
            {n:"ہلکی دستک 11",p:[[500,100],[0,60],[500,100]]},{n:"چاندنی 12",p:[[659,240],[587,240],[523,300]]},
            {n:"ستارہ 13",p:[[988,120],[1175,120],[1318,180]]},{n:"نسیم 14",p:[[440,300],[554,300]]},
            {n:"ترنگ 15",p:[[700,120],[900,120],[1100,150]]},{n:"کلاک ٹک 16",p:[[1200,80],[0,90],[1200,80]]},
            {n:"موج 17",p:[[400,220],[600,220],[500,220]]},{n:"روشنی 18",p:[[800,150],[1000,150],[1200,200]]},
            {n:"پیغام 19",p:[[660,140],[880,200]]},{n:"خبر نامہ 20",p:[[587,150],[784,150],[988,200]]},
            {n:"سُر تال 21",p:[[523,140],[587,140],[659,140],[784,200]]},{n:"نغمہ 22",p:[[740,220],[880,260]]},
            {n:"گونج 23",p:[[480,350]]},{n:"اشارہ 24",p:[[950,120],[0,50],[950,120]]},
            {n:"نیوز کلاسک 25",p:[[659,160],[784,160],[659,160],[1046,250]]}
        ];

        var ALERT_TUNES = [
            {n:"الارم تیز 1",p:[[1000,180],[0,80],[1000,180],[0,80],[1000,220]]},
            {n:"خطرہ بیپ 2",p:[[1200,250],[600,250]]},{n:"سائرن 3",p:[[700,220],[1100,220],[700,220],[1100,220]]},
            {n:"ہنگامی 4",p:[[1400,120],[0,60],[1400,120],[0,60],[1400,120],[0,60],[1400,200]]},
            {n:"وارننگ 5",p:[[900,300],[0,100],[900,300]]},{n:"ہارن 6",p:[[320,400],[420,400]]},
            {n:"بجلی جھٹکا 7",p:[[180,250],[320,250],[180,250]]},{n:"ڈھول الرٹ 8",p:[[140,120],[0,50],[140,120],[0,50],[200,220]]},
            {n:"زنگ الرٹ 9",p:[[420,650]]},{n:"تیز گھنٹی 10",p:[[1300,150],[900,150],[1300,150],[900,150]]},
            {n:"فوری توجہ 11",p:[[1100,100],[0,50],[1100,100],[0,50],[1500,250]]},
            {n:"الارم کلاک 12",p:[[1250,90],[0,70],[1250,90],[0,70],[1250,90],[0,70],[1250,90]]},
            {n:"ڈبل وارننگ 13",p:[[850,220],[0,80],[1150,260]]},{n:"گہرا الرٹ 14",p:[[300,300],[0,80],[300,350]]},
            {n:"ہائی الرٹ 15",p:[[1500,180],[1200,180],[1500,220]]},{n:"بزر 16",p:[[240,500]]},
            {n:"نبض 17",p:[[800,120],[0,120],[800,120],[0,120],[800,120]]},
            {n:"چوکنا 18",p:[[950,150],[1250,150],[950,150],[1250,200]]},{n:"ریڈ الرٹ 19",p:[[1050,200],[520,200],[1050,250]]},{n:"فائنل الارم 20",p:[[1200,160],[0,60],[1200,160],[0,60],[800,320]]}
        ];

        var newsQueue = [], newsIdx = 0, newsTimer = null, activeNewsItem = null;
        var alertQueue = [], alertIdx = 0, alertTimer = null, activeAlertItem = null;
        var lastNewsSig = '', lastAlertSig = '';

        function getNa1Config() {
            var c = lsGet(NA1_SET_KEY, {});
            return {
                newsOn: c.allOpts ? c.allOpts.newsOn !== false : true,
                alertOn: c.allOpts ? c.allOpts.alertOn !== false : true,
                soundsOn: c.allOpts ? c.allOpts.soundsOn !== false : true,
                vib: c.allOpts ? c.allOpts.vibrate !== false : true,
                voice: c.allOpts ? c.allOpts.voice !== false : true,
                newsSpeed: c.newsPatti ? (parseInt(c.newsPatti.speed) || 5) : 5,
                alertSpeed: c.alertPatti ? (parseInt(c.alertPatti.speed) || 6) : 6,
                newsSec: c.newsPatti ? (parseInt(c.newsPatti.seconds) || 3) : 3,
                alertSec: c.alertPatti ? (parseInt(c.alertPatti.seconds) || 4) : 4,
                newsEffects: c.newsPatti && Array.isArray(c.newsPatti.effects) ? c.newsPatti.effects : [],
                alertEffects: c.alertPatti && Array.isArray(c.alertPatti.effects) ? c.alertPatti.effects : [],
                newsTune: c.newsPatti ? (parseInt(c.newsPatti.tuneIdx) || 0) : 0,
                alertTune: c.alertPatti ? (parseInt(c.alertPatti.tuneIdx) || 0) : 0,
                newsVol: c.newsPatti ? (parseInt(c.newsPatti.volume) || 70) : 70,
                alertVol: c.alertPatti ? (parseInt(c.alertPatti.volume) || 85) : 85
            };
        }

        function getEffectClass(type, cfg) {
            var arr = type === 'alert' ? cfg.alertEffects : cfg.newsEffects;
            var idx = arr.findIndex(function(v) { return !!v; });
            if (idx === -1) return '';
            if (type === 'news') {
                var nMap = ['eff-static', '', 'eff-static', 'eff-fade', 'eff-reverse', 'eff-blink', 'eff-fade', 'eff-slide', '', 'eff-fade'];
                return nMap[idx] || '';
            } else {
                var aMap = ['eff-glow', 'eff-blur', 'eff-blink', 'eff-static', 'eff-slide', '', 'eff-glow', 'eff-bounce', 'eff-fade', 'eff-glow'];
                return aMap[idx] || '';
            }
        }

        function markHistoryReady(id) {
            if (!id) return;
            var all = lsGet(NEWS_KEY, []);
            var changed = false;
            all.forEach(function(r) {
                if (String(r.id) === String(id)) {
                    r.dashShown = true;
                    r.historyReady = true;
                    r.completedAt = Date.now();
                    changed = true;
                }
            });
            if (changed) lsSet(NEWS_KEY, all);
        }

        function playNa1Feedback(type, text, cfg) {
            if (cfg.soundsOn) {
                var aud = lsGet(NA1_AUD_KEY, { news: null, alert: null });
                var vol = (type === 'alert' ? cfg.alertVol : cfg.newsVol) / 100;
                if (aud[type]) {
                    try {
                        var a = new Audio(aud[type]);
                        a.volume = Math.min(1, Math.max(0, vol));
                        a.play().catch(function() {});
                    } catch (e) {}
                } else {
                    var tune = (type === 'alert' ? ALERT_TUNES : NEWS_TUNES)[type === 'alert' ? cfg.alertTune : cfg.newsTune] || NEWS_TUNES[0];
                    var ctx = getCtx();
                    if (ctx) {
                        try {
                            var t = ctx.currentTime;
                            tune.p.forEach(function(n) {
                                var freq = n[0], dur = n[1] / 1000;
                                if (freq > 0) {
                                    var o = ctx.createOscillator(), g = ctx.createGain();
                                    o.connect(g); g.connect(ctx.destination);
                                    o.frequency.value = freq;
                                    g.gain.setValueAtTime(Math.max(0.01, vol), t);
                                    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                                    o.start(t); o.stop(t + dur);
                                }
                                t += dur + 0.04;
                            });
                        } catch (e) {}
                    }
                }
            }
            if (cfg.vib && navigator.vibrate) navigator.vibrate([200, 100, 200]);
            if (cfg.voice && ('speechSynthesis' in window)) {
                try {
                    window.speechSynthesis.cancel();
                    var prefix = (type === 'alert') ? 'Alert. ' : 'News. ';
                    var u = new SpeechSynthesisUtterance(prefix + text);
                    u.lang = 'ur-PK';
                    u.volume = Math.min(1, Math.max(0, ((type === 'alert' ? cfg.alertVol : cfg.newsVol) || 70) / 100));
                    window.speechSynthesis.speak(u);
                } catch (e) {}
            }
        }

        function nextNewsStep() {
            var cfg = getNa1Config();
            if (!cfg.newsOn || !newsQueue.length) {
                $('newsPattiBox').classList.remove('show');
                activeNewsItem = null;
                return;
            }
            var item = newsQueue[newsIdx % newsQueue.length];
            newsIdx++;
            activeNewsItem = item;

            var box = $('newsPattiBox'), el = $('newsPattiText');
            box.classList.add('show');
            var dur = Math.max(10, 75 - (cfg.newsSpeed * 4));
            el.style.setProperty('--news-dur', dur + 's');
            el.textContent = '📰 ' + item.content;
            el.className = 'ticker-text ' + getEffectClass('news', cfg);
            el.style.animation = 'none';
            void el.offsetWidth;
            el.style.animation = '';

            playNa1Feedback('news', item.content, cfg);

            clearTimeout(newsTimer);
            newsTimer = setTimeout(function() {
                markHistoryReady(item.id);
                nextNewsStep();
            }, Math.max(cfg.newsSec, 2) * 1000);
        }

        function nextAlertStep() {
            var cfg = getNa1Config();
            if (!cfg.alertOn || !alertQueue.length) {
                $('alertPattiBox').classList.remove('show', 'blink');
                activeAlertItem = null;
                return;
            }
            var item = alertQueue[alertIdx % alertQueue.length];
            alertIdx++;
            activeAlertItem = item;

            var box = $('alertPattiBox'), el = $('alertPattiText');
            box.classList.add('show');
            var effCls = getEffectClass('alert', cfg);
            if (!effCls || effCls === 'eff-blink') box.classList.add('blink');
            else box.classList.remove('blink');

            var dur = Math.max(8, 55 - (cfg.alertSpeed * 3.5));
            el.style.setProperty('--alert-dur', dur + 's');
            el.textContent = '🚨 ' + item.content;
            el.className = 'alert-text ' + effCls;
            el.style.animation = 'none';
            void el.offsetWidth;
            el.style.animation = '';

            playNa1Feedback('alert', item.content, cfg);

            clearTimeout(alertTimer);
            alertTimer = setTimeout(function() {
                markHistoryReady(item.id);
                nextAlertStep();
            }, Math.max(cfg.alertSec, 2) * 1000);
        }

        function skipAlertItem() {
            clearTimeout(alertTimer);
            if (activeAlertItem) {
                markHistoryReady(activeAlertItem.id);
                activeAlertItem = null;
            }
            $('alertPattiBox').classList.remove('show', 'blink');
            lastAlertSig = '';
            syncWithNa1();
        }

        function syncWithNa1() {
            if (lsGet('ns_dash_visible', null) === false) {
                clearTimeout(newsTimer);
                clearTimeout(alertTimer);
                $('newsPattiBox').classList.remove('show');
                $('alertPattiBox').classList.remove('show', 'blink');
                lastNewsSig = 'hidden';
                lastAlertSig = 'hidden';
                return;
            }

            var cfg = getNa1Config();
            var items = lsGet(NEWS_KEY, []).filter(function(x) { return !x.deleted && !x.skipped; });
            var man = lsGet(MAN_KEY, {});
            var selIds = Object.keys(man).filter(function(k) { return man[k]; });
            if (selIds.length) {
                items = items.filter(function(x) { return selIds.indexOf(String(x.id)) !== -1; });
            }

            var nextNews = cfg.newsOn ? items.filter(function(x) { return x.type === 'news'; }) : [];
            var nextAlerts = cfg.alertOn ? items.filter(function(x) { return x.type === 'alert'; }) : [];

            var nSig = nextNews.map(function(x) { return x.id + ':' + x.content; }).join('|') + '|' + cfg.newsSpeed + '|' + cfg.newsSec + '|' + JSON.stringify(cfg.newsEffects);
            var aSig = nextAlerts.map(function(x) { return x.id + ':' + x.content; }).join('|') + '|' + cfg.alertSpeed + '|' + cfg.alertSec + '|' + JSON.stringify(cfg.alertEffects);

            if (nSig !== lastNewsSig) {
                lastNewsSig = nSig;
                newsQueue = nextNews;
                newsIdx = 0;
                clearTimeout(newsTimer);
                nextNewsStep();
            }
            if (aSig !== lastAlertSig) {
                lastAlertSig = aSig;
                alertQueue = nextAlerts;
                alertIdx = 0;
                clearTimeout(alertTimer);
                nextAlertStep();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            syncWithNa1();
            setInterval(function() {
                if (document.visibilityState === 'visible') syncWithNa1();
            }, 1500);
        });
    </script>

</body>
</html>
