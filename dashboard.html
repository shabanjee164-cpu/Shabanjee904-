<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
/* Purana CSS waisa hi rahega, maine sirf zaroori cheezein update ki hain */
:root{--primary:#1e293b;--accent:#7c3aed;--success:#10b981;--golden:#d97706;--danger:#ef4444;--bg:#eef2f6;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:system-ui,sans-serif;padding:12px;direction:rtl;color:#334155;padding-bottom:80px;}
.container{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.app-header{background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;text-align:center;padding:16px;border-radius:12px;font-size:16px;font-weight:800;}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.05);}

/* Duty Card (Dashboard) */
.duty-active-box{background:linear-gradient(135deg,#ede9fe,#ddd6fe);border:1px solid #c4b5fd;border-radius:10px;padding:12px;margin-bottom:12px;}
.duty-active-row{display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:#4c1d95;}
.duty-timer{text-align:center;font-size:16px;font-weight:900;color:#6d28d9;background:#fff;padding:8px;border-radius:6px;margin-top:8px;}
.leave-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px;}
.leave-box label{font-size:11px;font-weight:800;color:#92400e;margin-bottom:4px;display:block;}
.leave-box select,.leave-box input{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;margin-bottom:6px;font-size:12px;font-weight:700;outline:none;}
.leave-box button{width:100%;padding:10px;background:var(--golden);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:800;cursor:pointer;}

/* News/Alert (Dashboard) */
.news-bar{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;margin-bottom:10px;}
.news-text{display:inline-block;animation:tickerMove 60s linear infinite;padding-right:100%}
@keyframes tickerMove{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.alert-bar{background:#fef2f2;border:1px solid #fecaca;color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:all .3s}
.alert-bar.blink{animation:alertBlink .8s infinite alternate}
@keyframes alertBlink{0%{opacity:1}100%{opacity:.35;background:#ef4444;color:#fff}}
.alert-bar button{background:var(--danger);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit}

/* Fixed Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;padding:10px;z-index:1000;}
.nav-item{text-decoration:none;color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:5px;width:23%;}
.nav-item.active{color:var(--accent);}
.nav-icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<div class="container">
    <div class="app-header">⚡ ڈیش بورڈ</div>

    <!-- 1. News / Alert (Top) -->
    <div class="news-bar"><div class="news-text" id="newsText">📰 لوڈ ہو رہا ہے...</div></div>
    <div class="alert-bar" id="alertBar"><span id="alertMsg">🚨 اہم الرٹ: <b id="alertTimer">25</b> سیکنڈ کا ٹائمر جاری ہے...</span><button onclick="skipAlert()">اسکیپ ❌</button></div>

    <!-- 2. Duty Manager Card -->
    <div class="card">
        <h3 style="font-size:14px;margin-bottom:10px;color:var(--accent);">👮 آج کی ڈیوٹی</h3>
        <div class="duty-active-box">
            <div class="duty-active-row">
                <span>🟢 سینئر: <span id="dashSenior">—</span></span>
                <span>🔵 جونیئر: <span id="dashJunior">—</span></span>
            </div>
            <div class="duty-timer">⏱️ <span id="dashTimer">00:00:00</span></div>
        </div>
        <div class="leave-box">
            <label>🏖️ چھٹی کے لیے ممبر منتخب کریں:</label>
            <select id="dashLeaveSelect"><option value="">ممبر منتخب کریں...</option></select>
            <input type="text" id="dashLeaveReason" placeholder="وجہ لکھیں...">
            <button onclick="submitDashLeave()">✅ چھٹی سبمٹ کریں</button>
        </div>
    </div>

    <!-- Baqi sections (Task, Skip etc) aapke purane code ke mutabiq yahan aayenge. 
         Humne sirf Duty aur News/Alert ko final kiya hai. -->
</div>

<!-- Fixed Bottom Nav -->
<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>ڈیش بورڈ</a>
    <a href="entry.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>انٹری</a>
    <a href="history.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>ہسٹری</a>
    <a href="manager.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>مینیجر</a>
</nav>

<script>
// ========== DUTY LOGIC ==========
function getMembers() { return JSON.parse(localStorage.getItem('sec4_duty_manager_data_v4') || '[]'); }
function saveMembers(m) { localStorage.setItem('sec4_duty_manager_data_v4', JSON.stringify(m)); }

function updateDashDuty() {
    var m = getMembers();
    var s = m.find(x => x.onDuty && x.rank === 'Senior');
    var j = m.find(x => x.onDuty && x.rank === 'Junior');
    document.getElementById('dashSenior').textContent = s ? s.name : '—';
    document.getElementById('dashJunior').textContent = j ? j.name : '—';
    
    var active = s || j;
    if (active && active.dutyStart) {
        var el = Math.floor((Date.now() - active.dutyStart) / 1000);
        document.getElementById('dashTimer').textContent = String(Math.floor(el/3600)).padStart(2,'0') + ':' + String(Math.floor((el%3600)/60)).padStart(2,'0') + ':' + String(el%60).padStart(2,'0');
    } else { document.getElementById('dashTimer').textContent = '00:00:00'; }

    var sel = document.getElementById('dashLeaveSelect');
    if (sel.options.length <= 1) {
        m.filter(x => !x.onLeave).forEach(x => { sel.innerHTML += `<option value="${x.id}">${x.name} (${x.rank})</option>`; });
    }
}

function submitDashLeave() {
    var id = document.getElementById('dashLeaveSelect').value;
    var reason = document.getElementById('dashLeaveReason').value.trim();
    if (!id) { alert('ممبر منتخب کریں'); return; }
    if (!reason) { alert('وجہ لکھیں'); return; }
    
    var m = getMembers();
    var t = m.find(x => String(x.id) === String(id));
    if (t) {
        t.onLeave = true;
        t.leaveCount = (t.leaveCount || 0) + 1;
        
        var leaves = JSON.parse(localStorage.getItem('sec4_duty_leaves_data_v4') || '[]');
        leaves.push({ name: t.name, rank: t.rank, reason: reason, date: new Date().toLocaleString('ur-PK') });
        localStorage.setItem('sec4_duty_leaves_data_v4', JSON.stringify(leaves));
        
        if (t.onDuty) {
            t.onDuty = false; t.dutyStart = null;
            var pool = m.filter(x => x.rank === t.rank && !x.onLeave && !x.onDuty);
            if (pool.length > 0) {
                pool.sort((a,b) => (a.leaveCount || 0) - (b.leaveCount || 0));
                var next = pool[0]; next.onDuty = true; next.dutyStart = Date.now();
            }
        }
        saveMembers(m);
        document.getElementById('dashLeaveReason').value = '';
        updateDashDuty();
        alert('✅ چھٹی محفوظ');
    }
}

// ========== NEWS / ALERT LOGIC ==========
var NEWS_KEY = 'sec10_news_alerts_data';
function renderNewsAlert() {
    var items = JSON.parse(localStorage.getItem(NEWS_KEY) || '[]');
    var news = items.filter(x => x.type === 'news' && x.enabled);
    var alert = items.filter(x => x.type === 'alert' && x.enabled);
    
    // News Ticker
    if (news.length > 0) {
        document.getElementById('newsText').textContent = '📰 ' + news[0].content;
    } else {
        document.getElementById('newsText').textContent = '📰 کوئی نیوز نہیں';
    }
    
    // Alert Bar
    if (alert.length > 0) {
        document.getElementById('alertBar').style.display = 'flex';
        document.getElementById('alertMsg').innerHTML = '🚨 الرٹ: ' + alert[0].content;
    } else {
        document.getElementById('alertBar').style.display = 'none';
    }
}

function skipAlert() { document.getElementById('alertBar').style.display = 'none'; }

setInterval(updateDashDuty, 1000);
document.addEventListener('DOMContentLoaded', () => {
    updateDashDuty();
    renderNewsAlert();
});
</script>
</body>
</html>
