<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ڈیش بورڈ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f6;font-family:system-ui,sans-serif;direction:rtl;padding:10px}
.wrap{max-width:700px;margin:0 auto}
h1{font-size:16px;color:#2563eb;margin-bottom:10px;text-align:center}

/* ═══ NEWS BAR (scrolling) ═══ */
.news-bar{
  background:#fffbeb;border:1px solid #fde68a;
  color:#92400e;padding:11px 14px;border-radius:10px;
  font-size:13px;font-weight:700;overflow:hidden;
  white-space:nowrap;margin-bottom:10px;
}
.news-text{
  display:inline-block;
  animation:ticker 40s linear infinite;
  padding-right:100%;
}
.news-text.slow{animation-duration:60s}
@keyframes ticker{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}

/* ═══ ALERT BAR ═══ */
.alert-bar{
  display:none;
  background:#fef2f2;border:2px solid #fca5a5;
  color:#dc2626;padding:12px 14px;border-radius:10px;
  font-size:14px;font-weight:800;
  justify-content:space-between;align-items:center;
  gap:10px;transition:all .3s;margin-bottom:10px;
}
.alert-bar.show{display:flex}
.alert-bar.blink{animation:blink .8s infinite alternate}
@keyframes blink{
  0%{background:#fef2f2;color:#dc2626}
  100%{background:#dc2626;color:#fff}
}
.alert-bar .txt{flex:1;line-height:1.5}
.alert-bar .skip{
  background:#dc2626;color:#fff;border:none;
  padding:9px 14px;border-radius:8px;cursor:pointer;
  font-size:12px;font-weight:800;font-family:inherit;
  white-space:nowrap;flex-shrink:0;
}
.alert-bar.blink .skip{background:#fff;color:#dc2626}

/* ═══ INFO CARD ═══ */
.info{background:#fff;border:1px solid #e2e8f0;border-radius:12px;
      padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.05);text-align:center}
.info .big{font-size:60px;margin-bottom:10px;opacity:.6}
.info h2{font-size:15px;color:#1e293b;margin-bottom:8px}
.info p{font-size:12px;color:#64748b;line-height:1.8;font-weight:600}
</style>
</head>
<body>

<div class="wrap">

  <!-- NEWS BAR -->
  <div class="news-bar">
    <div class="news-text slow" id="newsText">📰 لوڈ ہو رہا ہے...</div>
  </div>

  <!-- ALERT BAR -->
  <div class="alert-bar" id="alertBar">
    <span class="txt" id="alertTxt">—</span>
    <button class="skip" onclick="skipAlert()">اسکیپ ❌</button>
  </div>

  <!-- INFO -->
  <div class="info">
    <div class="big">📊</div>
    <h2>ڈیش بورڈ</h2>
    <p>
      یہاں نیوز بار (اوپر) اور الرٹ بار دکھتی ہے۔<br>
      نیوز چلتی رہے گی — نیا آئے تو بیل بجے گی۔<br>
      الرٹ ایک ایک کر کے آئے گا — بیل + وائبریٹ + آواز۔<br>
      Skip دبائیں تو رک جائے گا — اگلا لوڈ پر آئے گا۔
    </p>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   LIVE SYSTEM — sec10_news_alerts_data se juda hua
   ═══════════════════════════════════════════════════════════════ */
const KEY = 'sec10_news_alerts_data';
const IDX_KEY = 'sec10_alert_index';
const LAST_NEWS = 'sec10_last_news_ids';
const FIRED_KEY = 'sec10_complaint_fired';

let bellLoop = null;
let vibrateLoop = null;
let voiceToggle = 0;

/* ─── Data ─── */
function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { return []; } }
function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

/* ─── BELL (Full Volume) ─── */
function playBell() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    [0, 0.35, 0.7].forEach(delay => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.value = 1000;
      const t = ctx.currentTime + delay;
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(1.0, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.start(t); o.stop(t + 0.5);
    });
  } catch(e) {}
}

/* ─── VOICE (Male/Female Alternate) ─── */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ur-PK';
    u.rate = 0.9;
    u.pitch = (voiceToggle % 2 === 0) ? 1.3 : 0.8;
    u.volume = 1.0;
    window.speechSynthesis.speak(u);
    voiceToggle++;
  } catch(e) {}
}

/* ─── VIBRATE LOOP ─── */
function startVibrate() {
  if (!navigator.vibrate) return;
  try { navigator.vibrate([400, 200, 400, 200, 400]); } catch(e) {}
  if (vibrateLoop) clearInterval(vibrateLoop);
  vibrateLoop = setInterval(() => {
    if (navigator.vibrate) try { navigator.vibrate([400, 200, 400]); } catch(e) {}
  }, 2500);
}

/* ─── STOP ALL ─── */
function stopAll() {
  if (bellLoop) { clearInterval(bellLoop); bellLoop = null; }
  if (vibrateLoop) { clearInterval(vibrateLoop); vibrateLoop = null; }
  if (navigator.vibrate) try { navigator.vibrate(0); } catch(e) {}
  if (window.speechSynthesis) try { window.speechSynthesis.cancel(); } catch(e) {}
}

/* ─── SHOW ALERT ─── */
function showAlert(idx) {
  const all = load();
  const alerts = all.filter(x => x.type === 'alert')
                    .sort((a, b) => b.timestamp - a.timestamp);
  const bar = document.getElementById('alertBar');
  const txt = document.getElementById('alertTxt');

  if (!alerts.length) { bar.classList.remove('show'); return; }
  if (idx >= alerts.length) idx = 0;

  const a = alerts[idx];
  bar.classList.add('show', 'blink');
  txt.innerHTML = '🚨 ' + (idx + 1) + '/' + alerts.length + ' — ' + esc(a.content);

  playBell();
  bellLoop = setInterval(playBell, 1200);
  startVibrate();
  speak(a.content);
}

/* ─── SKIP ─── */
window.skipAlert = function() {
  stopAll();
  const bar = document.getElementById('alertBar');
  bar.classList.remove('show', 'blink');

  const all = load();
  const alerts = all.filter(x => x.type === 'alert');
  let idx = parseInt(localStorage.getItem(IDX_KEY) || '0', 10);
  idx++;
  if (idx >= alerts.length) idx = 0;
  localStorage.setItem(IDX_KEY, String(idx));
};

/* ─── NEWS BAR ─── */
function updateNewsBar() {
  const all = load();
  const news = all.filter(x => x.type === 'news');
  const el = document.getElementById('newsText');
  if (!news.length) {
    el.textContent = '📢 کوئی نیوز موجود نہیں — ڈیٹا انٹری سے ایڈ کریں';
    return;
  }
  el.textContent = news.map(n => '📰 ' + n.content).join('   •   ') + '   •   ';
}

/* ─── NEW NEWS CHECK ─── */
function checkNewNews() {
  const all = load();
  const news = all.filter(x => x.type === 'news');
  const ids = news.map(n => n.id).join(',');
  const last = localStorage.getItem(LAST_NEWS) || '';
  if (last && ids !== last && news.length) {
    playBell();
    speak(news[0].content);
  }
  localStorage.setItem(LAST_NEWS, ids);
}

/* ─── COMPLAINTS (Time Alerts) ─── */
function checkComplaints() {
  const all = load();
  const comps = all.filter(x => x.type === 'complaint' && x.fireTime);
  if (!comps.length) return;

  const now = new Date();
  const nowStr = String(now.getHours()).padStart(2, '0') + ':' +
                 String(now.getMinutes()).padStart(2, '0');
  const today = now.toDateString();

  let fired = {};
  try { fired = JSON.parse(localStorage.getItem(FIRED_KEY) || '{}'); } catch(e) {}

  comps.forEach(c => {
    if (c.fireTime !== nowStr) return;
    const k = c.id + '_' + today;
    const last = fired[k] || 0;
    if (Date.now() - last < 10 * 60 * 1000) return;

    const bar = document.getElementById('alertBar');
    const txt = document.getElementById('alertTxt');
    stopAll();
    bar.classList.add('show', 'blink');
    txt.innerHTML = '⏰ ' + esc(c.fireTime) + ' — ' + esc(c.content);

    playBell();
    bellLoop = setInterval(playBell, 1200);
    startVibrate();
    speak(c.content);

    fired[k] = Date.now();
  });

  localStorage.setItem(FIRED_KEY, JSON.stringify(fired));
}

/* ─── BOOT ─── */
function boot() {
  updateNewsBar();
  checkNewNews();

  setTimeout(() => {
    const idx = parseInt(localStorage.getItem(IDX_KEY) || '0', 10);
    showAlert(idx);
  }, 1200);

  window.addEventListener('storage', e => {
    if (e.key === KEY) { updateNewsBar(); checkNewNews(); }
  });

  setInterval(() => { updateNewsBar(); checkNewNews(); }, 3000);
  setInterval(checkComplaints, 20000);
  checkComplaints();
}

/* Audio unlock on first tap */
document.addEventListener('click', function unlock() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    if (c.state === 'suspended') c.resume();
  } catch(e) {}
  document.removeEventListener('click', unlock);
}, { once: true });

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>

</body>
</html>
