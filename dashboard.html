<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ڈیش بورڈ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f6;font-family:system-ui,sans-serif;direction:rtl;padding:10px}
.wrap{max-width:700px;margin:0 auto}

/* News Bar */
.news-bar{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:700;overflow:hidden;margin-bottom:10px;min-height:44px;display:flex;align-items:center}
.news-text{display:inline-block;white-space:nowrap;animation:ticker 60s linear infinite;padding-right:100%;font-weight:800}
@keyframes ticker{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* Alert Bar */
.alert-bar{display:none;background:#fef2f2;border:2px solid #fca5a5;color:#dc2626;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:800;justify-content:space-between;align-items:center;gap:10px;transition:all .3s;margin-bottom:10px}
.alert-bar.show{display:flex}
.alert-bar.blink{animation:bl .8s infinite alternate}
@keyframes bl{0%{background:#fef2f2;color:#dc2626}100%{background:#dc2626;color:#fff}}
.alert-bar .txt{flex:1;line-height:1.5}
.alert-bar .skip{background:#dc2626;color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:800;font-family:inherit;white-space:nowrap}
.alert-bar.blink .skip{background:#fff;color:#dc2626}

/* Card */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:10px}
.card h2{font-size:14px;color:#1e293b;margin-bottom:10px;padding-bottom:8px;border-bottom:2px dashed #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .mini-timer{font-size:11px;font-weight:800;color:#6d28d9;background:#ede9fe;padding:3px 10px;border-radius:20px}
.card.task h2{color:#16a34a;border-color:#bbf7d0}
.card.skip h2{color:#dc2626;border-color:#fecaca}

/* Duty */
.duty-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duty-box{background:#ede9fe;border:1px solid #c4b5fd;border-radius:8px;padding:10px}
.duty-box .lbl{font-size:10px;font-weight:800;color:#6d28d9;margin-bottom:4px}
.duty-box .nm{font-size:15px;font-weight:900;color:#4c1d95;word-break:break-word}

/* Leave Submit */
.leave-submit-box{background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:10px;margin-top:12px}
.leave-submit-box label{font-size:11px;font-weight:800;color:#92400e;display:block;margin-bottom:6px}
.leave-submit-box select,.leave-submit-box input{width:100%;padding:9px 10px;border:1px solid #fdba74;border-radius:6px;font-size:12px;font-weight:700;font-family:inherit;background:#fff;outline:none;margin-bottom:6px}
.leave-submit-box button{width:100%;padding:10px;background:#ea580c;color:#fff;font-size:13px;font-weight:800;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
.leave-list{background:#fff;border:1px solid #fdba74;border-radius:6px;padding:6px;max-height:150px;overflow-y:auto;min-height:40px;margin-top:8px}
.leave-item{background:#fff7ed;border:1px solid #fed7aa;border-radius:5px;padding:6px 9px;margin-bottom:4px;font-size:11px;font-weight:700;color:#9a3412;display:flex;justify-content:space-between;gap:6px}

/* Task Tracker */
.task-member-sel{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;margin-bottom:10px}
.task-member-sel label{font-size:11px;font-weight:800;color:#15803d;display:block;margin-bottom:6px}
.task-member-sel select{width:100%;padding:9px 10px;border:1px solid #86efac;border-radius:6px;font-size:13px;font-weight:700;font-family:inherit;background:#fff;outline:none}
.task-current{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border:2px solid #86efac;border-radius:10px;padding:14px;text-align:center;margin-bottom:10px}
.task-current .lbl{font-size:10px;font-weight:800;color:#15803d;margin-bottom:6px}
.task-current .nm{font-size:18px;font-weight:900;color:#166534;line-height:1.3}
.task-current .pts{display:inline-block;background:#16a34a;color:#fff;font-size:12px;font-weight:800;padding:3px 12px;border-radius:20px;margin-top:8px}
.task-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.task-btns button{padding:11px 4px;font-size:12px;font-weight:800;border:none;border-radius:8px;cursor:pointer;font-family:inherit;color:#fff}
.task-btns .done{background:#16a34a}
.task-btns .notdone{background:#dc2626}
.task-btns .skip{background:#64748b}
.task-score{background:#1e293b;color:#fff;border-radius:8px;padding:10px 14px;text-align:center;font-size:13px;font-weight:800}
.task-score b{font-size:18px;color:#facc15}
.task-history{max-height:180px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:6px;background:#fafafa;margin-top:10px}
.task-history .row{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:7px 10px;margin-bottom:4px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
.task-history .row .st{padding:2px 8px;border-radius:20px;font-size:9px;font-weight:800}
.task-history .row .st.done{background:#dcfce7;color:#15803d}
.task-history .row .st.notdone{background:#fee2e2;color:#991b1b}
.task-history .row .st.skip{background:#f1f5f9;color:#475569}

/* Skip Section */
.skip-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.skip-col{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px}
.skip-col.junior{background:#dbeafe;border-color:#93c5fd}
.skip-col .hd{font-size:11px;font-weight:800;color:#991b1b;margin-bottom:6px;text-align:center}
.skip-col.junior .hd{color:#1e40af}
.skip-list{max-height:200px;overflow-y:auto}
.skip-item{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:7px 9px;margin-bottom:4px;font-size:10px;font-weight:700}
.skip-item.pending{border-right:3px solid #f59e0b;background:#fffbeb}
.skip-item.done{border-right:3px solid #16a34a;background:#f0fdf4}
.skip-item .nm{color:#1e293b;font-weight:800;font-size:11px;margin-bottom:2px}
.skip-item .task{color:#334155;font-size:10px;margin-bottom:3px}
.skip-item .reason{color:#15803d;background:#fff;padding:3px 6px;border-radius:4px;font-size:10px;border:1px solid #86efac;display:inline-block;margin-top:3px}
.skip-item .warn{color:#d97706;font-size:9px;font-weight:800}
.skip-item .date{color:#94a3b8;font-size:8px;margin-top:2px;display:block}

.skip-form{background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:10px}
.skip-form .ttl{font-size:11px;font-weight:800;color:#92400e;margin-bottom:8px;text-align:center}
.skip-form select,.skip-form input{width:100%;padding:8px;border:1px solid #fdba74;border-radius:6px;font-size:12px;font-weight:700;font-family:inherit;background:#fff;margin-bottom:6px;outline:none}
.skip-form button{width:100%;padding:10px;background:#ea580c;color:#fff;font-size:13px;font-weight:800;border:none;border-radius:6px;cursor:pointer;font-family:inherit}

.empty-note{text-align:center;color:#94a3b8;font-size:11px;padding:14px;font-weight:600}
</style>
</head>
<body>

<div class="wrap">

  <!-- NEWS BAR -->
  <div class="news-bar"><div class="news-text" id="newsText">📰 لوڈ ہو رہا ہے...</div></div>

  <!-- ALERT BAR -->
  <div class="alert-bar" id="alertBar">
    <span class="txt" id="alertTxt">—</span>
    <button class="skip" onclick="skipAlert()">اسکیپ ❌</button>
  </div>

  <!-- DUTY CARD -->
  <div class="card">
    <h2>
      <span>👮 آج کی ڈیوٹی ممبران</span>
      <span class="mini-timer" id="dutyMiniTimer">⏱️ 00:00:00</span>
    </h2>
    <div class="duty-grid">
      <div class="duty-box"><div class="lbl">🟢 سینئر ممبر</div><div class="nm" id="seniorNm">—</div></div>
      <div class="duty-box"><div class="lbl">🔵 جونیئر ممبر</div><div class="nm" id="juniorNm">—</div></div>
    </div>
    <div class="leave-submit-box">
      <label>🏖️ چھٹی سبمٹ کریں</label>
      <select id="leaveMemberSel"><option value="">ممبر منتخب کریں...</option></select>
      <input type="text" id="leaveReason" placeholder="وجہ لکھیں...">
      <button onclick="submitLeave()">✅ چھٹی سبمٹ کریں</button>
      <div class="leave-list" id="todayLeavesList"><div class="empty-note">آج کوئی چھٹی نہیں</div></div>
    </div>
  </div>

  <!-- TASK TRACKER -->
  <div class="card task">
    <h2><span>📋 ٹاسک ٹریکر</span></h2>
    <div class="task-member-sel">
      <label>ممبر منتخب کریں</label>
      <select id="taskMemberSel" onchange="onTaskMemberChange()">
        <option value="">-- ممبر منتخب کریں --</option>
      </select>
    </div>
    <div class="task-current" id="taskCurrent">
      <div class="lbl">📌 موجودہ ٹاسک</div>
      <div class="nm">پہلے ممبر منتخب کریں</div>
      <div class="pts">0 Points</div>
    </div>
    <div class="task-btns">
      <button class="done" onclick="taskSubmit('done')">✅ ہو گیا</button>
      <button class="notdone" onclick="taskSubmit('notdone')">❌ نہیں ہوا</button>
      <button class="skip" onclick="taskSubmit('skip')">⚪ کرنا نہیں تھا</button>
    </div>
    <div class="task-score">🏆 ٹوٹل پوائنٹس: <b id="totalPoints">0</b></div>
    <div style="font-size:11px;font-weight:800;color:#475569;margin-top:14px;margin-bottom:6px;">📜 حالیہ ٹاسک</div>
    <div class="task-history" id="taskHistList">
      <div class="empty-note">کوئی ریکارڈ نہیں</div>
    </div>
  </div>

  <!-- SKIP SECTION -->
  <div class="card skip">
    <h2><span>⛔ چھوڑے ہوئے کام</span></h2>
    <div class="skip-2col">
      <div class="skip-col">
        <div class="hd">🟢 سینئر</div>
        <div class="skip-list" id="skipSeniorList"><div class="empty-note">کوئی نہیں</div></div>
      </div>
      <div class="skip-col junior">
        <div class="hd">🔵 جونیئر</div>
        <div class="skip-list" id="skipJuniorList"><div class="empty-note">کوئی نہیں</div></div>
      </div>
    </div>
    <div class="skip-form">
      <div class="ttl">📝 چھوڑے ہوئے کام کی وجہ دیں</div>
      <select id="skipMemberSel" onchange="updateSkipTasks()"><option value="">ممبر منتخب کریں...</option></select>
      <select id="skipTaskSel"><option value="">کام منتخب کریں...</option></select>
      <input type="text" id="skipReasonInput" placeholder="وجہ لکھیں...">
      <button onclick="submitSkipReason()">✅ وجہ سبمٹ کریں</button>
    </div>
  </div>

</div>

<script>
/* ═══ KEYS ═══ */
var DUTY_KEY='sec4_duty_manager_data_v4';
var LEAVE_KEY='sec4_duty_leaves_data_v4';
var HIST_KEY='sec4_duty_history_data_v4';
var NEWS_KEY='sec10_news_alerts_data';
var TASK_KEY='sec3_task_and_point_manager_data';
var REC_KEY='sec12_task_records';
var SKIP_KEY='sec4_duty_skipped_data';
var IDX_KEY='sec10_alert_index';
var NEWS_IDX_KEY='sec10_news_index';
var LAST_NEWS_KEY='sec10_last_news_ids';
var FIRED_KEY='sec10_complaint_fired';
var SETTINGS_KEY='sec10_app_settings';

function $(id){return document.getElementById(id);}
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function pad(n){return String(n).padStart(2,'0');}
function getDayName(dt){var days=['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];return days[dt.getDay()]||'';}

/* ═══ BELL / VOICE / VIBRATE ═══ */
var bellLoop=null, vibrateLoop=null, voiceToggle=0, newsTimer=null;

function playBell(){
  try{
    var s=ls(SETTINGS_KEY,{});
    var vol=(s.vol!=null?s.vol:100)/100;
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    [0,0.35,0.7].forEach(function(delay){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=1000;
      var t=ctx.currentTime+delay;
      g.gain.setValueAtTime(0.001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      o.start(t);o.stop(t+0.5);
    });
  }catch(e){}
}
function speak(text){
  var s=ls(SETTINGS_KEY,{});
  if(s.voice===false) return;
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ur-PK';u.rate=0.9;
    u.pitch=(voiceToggle%2===0)?1.3:0.8;
    u.volume=1.0;
    window.speechSynthesis.speak(u);
    voiceToggle++;
  }catch(e){}
}
function startVibrate(){
  var s=ls(SETTINGS_KEY,{});
  if(s.vib===false) return;
  if(!navigator.vibrate) return;
  try{navigator.vibrate([400,200,400,200,400]);}catch(e){}
  if(vibrateLoop) clearInterval(vibrateLoop);
  vibrateLoop=setInterval(function(){if(navigator.vibrate)try{navigator.vibrate([400,200,400]);}catch(e){}},2500);
}
function stopAll(){
  if(bellLoop){clearInterval(bellLoop);bellLoop=null;}
  if(vibrateLoop){clearInterval(vibrateLoop);vibrateLoop=null;}
  if(navigator.vibrate) try{navigator.vibrate(0);}catch(e){}
  if(window.speechSynthesis) try{window.speechSynthesis.cancel();}catch(e){}
}

/* ═══ NEWS ═══ */
function updateNews(){
  var s=ls(SETTINGS_KEY,{});
  if(s.news===false){$('newsText').textContent='📰 News Patty بند ہے';$('newsText').style.animation='none';return;}
  var all=ls(NEWS_KEY,[]);if(!Array.isArray(all)) all=[];
  var news=all.filter(function(x){return x.type==='news'&&x.enabled===true;});
  var el=$('newsText');
  if(!news.length){el.textContent='📰 کوئی نیوز موجود نہیں';return;}
  el.textContent=news.map(function(n){return '📰 '+n.content;}).join('   •   ')+'   •   ';
}
function checkNewNews(){
  var all=ls(NEWS_KEY,[]);if(!Array.isArray(all)) all=[];
  var news=all.filter(function(x){return x.type==='news';});
  var ids=news.map(function(n){return n.id;}).join(',');
  var last=localStorage.getItem(LAST_NEWS_KEY)||'';
  if(last&&ids!==last&&news.length){playBell();speak(news[0].content);}
  localStorage.setItem(LAST_NEWS_KEY,ids);
}

/* ═══ ALERT ═══ */
function showAlert(){
  var s=ls(SETTINGS_KEY,{});
  if(s.alert===false){$('alertBar').classList.remove('show');return;}
  var all=ls(NEWS_KEY,[]);if(!Array.isArray(all)) all=[];
  var alerts=all.filter(function(x){return x.type==='alert'&&x.enabled===true;})
                .sort(function(a,b){return b.timestamp-a.timestamp;});
  var bar=$('alertBar');
  if(!alerts.length){bar.classList.remove('show');return;}
  var idx=parseInt(localStorage.getItem(IDX_KEY)||'0',10);
  if(idx>=alerts.length) idx=0;
  var a=alerts[idx];
  bar.className='alert-bar show blink';
  $('alertTxt').innerHTML='🚨 '+(idx+1)+'/'+alerts.length+': '+esc(a.content);
  stopAll();
  playBell();bellLoop=setInterval(playBell,1200);
  startVibrate();speak(a.content);
}
window.skipAlert=function(){
  stopAll();
  var bar=$('alertBar');bar.className='alert-bar';
  var all=ls(NEWS_KEY,[]);if(!Array.isArray(all)) all=[];
  var alerts=all.filter(function(x){return x.type==='alert';});
  var idx=parseInt(localStorage.getItem(IDX_KEY)||'0',10);
  idx++;if(idx>=alerts.length) idx=0;
  localStorage.setItem(IDX_KEY,String(idx));
};

/* ═══ COMPLAINTS ═══ */
function checkComplaints(){
  var all=ls(NEWS_KEY,[]);if(!Array.isArray(all)) all=[];
  var comps=all.filter(function(x){return x.type==='complaint'&&x.fireTime&&x.enabled===true;});
  if(!comps.length) return;
  var now=new Date();
  var nowStr=pad(now.getHours())+':'+pad(now.getMinutes());
  var today=now.toDateString();
  var fired=ls(FIRED_KEY,{});if(typeof fired!=='object'||fired===null) fired={};
  var s=ls(SETTINGS_KEY,{});
  var gap=(s.alertGap||10)*60*1000;
  comps.forEach(function(c){
    if(c.fireTime!==nowStr) return;
    var k=c.id+'_'+today;
    if(Date.now()-(fired[k]||0)<gap) return;
    stopAll();
    var bar=$('alertBar');
    bar.className='alert-bar show blink';
    $('alertTxt').innerHTML='⏰ '+esc(c.fireTime)+' — '+esc(c.content);
    playBell();bellLoop=setInterval(playBell,1200);
    startVibrate();speak(c.content);
    fired[k]=Date.now();
  });
  lss(FIRED_KEY,fired);
}

/* ═══ DUTY ═══ */
function getMembers(){var m=ls(DUTY_KEY,[]);return Array.isArray(m)?m:[];}
function updateDuty(){
  var m=getMembers();
  var s=m.find(function(x){return x.onDuty&&x.rank==='Senior';});
  var j=m.find(function(x){return x.onDuty&&x.rank==='Junior';});
  $('seniorNm').textContent=s?s.name:'—';
  $('juniorNm').textContent=j?j.name:'—';
  var active=s||j;
  if(active&&active.dutyStart){
    var el=Math.floor((Date.now()-active.dutyStart)/1000);
    $('dutyMiniTimer').textContent='⏱️ '+pad(Math.floor(el/3600))+':'+pad(Math.floor((el%3600)/60))+':'+pad(el%60);
  } else {
    $('dutyMiniTimer').textContent='⏱️ 00:00:00';
  }
}
function populateLeaveDropdown(){
  var sel=$('leaveMemberSel');if(!sel) return;
  var cur=sel.value;
  var m=getMembers();
  sel.innerHTML='<option value="">ممبر منتخب کریں...</option>';
  m.filter(function(x){return !x.onLeave;}).forEach(function(x){
    sel.appendChild(new Option(x.name+' ('+(x.rank==='Senior'?'سینئر':'جونیئر')+')',x.id));
  });
  if(cur) sel.value=cur;
}
window.submitLeave=function(){
  var id=$('leaveMemberSel').value;
  var reason=$('leaveReason').value.trim();
  if(!id){alert('ممبر منتخب کریں');return;}
  if(!reason){alert('وجہ لکھیں');return;}
  var m=getMembers();
  var t=m.find(function(x){return String(x.id)===String(id);});
  if(!t) return;
  if(t.onLeave){alert('پہلے ہی چھٹی پر ہے');return;}
  t.onLeave=true;t.leaveCount=(t.leaveCount||0)+1;
  if(t.onDuty){
    if(t.dutyStart){
      var h=ls(HIST_KEY,[]);if(!Array.isArray(h)) h=[];
      var s=new Date(t.dutyStart),e=new Date();
      h.push({name:t.name,rank:t.rank,start:pad(s.getHours())+':'+pad(s.getMinutes()),end:pad(e.getHours())+':'+pad(e.getMinutes()),reason:'leave'});
      if(h.length>100) h=h.slice(-100);
      lss(HIST_KEY,h);
    }
    t.onDuty=false;t.dutyStart=null;
  }
  var l=ls(LEAVE_KEY,[]);if(!Array.isArray(l)) l=[];
  var d=new Date();
  l.push({id:Date.now(),name:t.name,rank:t.rank,date:pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes()),day:getDayName(d),reason:reason,status:'leave',ts:d.getTime()});
  lss(LEAVE_KEY,l);lss(DUTY_KEY,m);
  var next=m.filter(function(x){return x.rank==='Junior'&&!x.onLeave&&!x.onDuty;});
  if(!next.length) next=m.filter(function(x){return x.rank==='Senior'&&!x.onLeave&&!x.onDuty;});
  if(next.length&&t.rank==='Junior'){
    next.sort(function(a,b){return (a.dutyCount||0)-(b.dutyCount||0);});
    var n=next[0];n.onDuty=true;n.dutyStart=Date.now();n.dutyCount=(n.dutyCount||0)+1;
    lss(DUTY_KEY,m);
  }
  $('leaveMemberSel').value='';$('leaveReason').value='';
  updateDuty();populateLeaveDropdown();renderTodayLeaves();
};
function renderTodayLeaves(){
  var box=$('todayLeavesList');if(!box) return;
  var l=ls(LEAVE_KEY,[]);if(!Array.isArray(l)) l=[];
  var d=new Date();
  var todayPrefix=pad(d.getDate())+'/'+pad(d.getMonth()+1);
  var todayL=l.filter(function(x){var s=String(x.date||'');return s.indexOf(todayPrefix)===0;});
  if(!todayL.length){box.innerHTML='<div class="empty-note">آج کوئی چھٹی نہیں</div>';return;}
  box.innerHTML=todayL.map(function(x){
    return '<div class="leave-item"><span>🏖️ '+esc(x.name)+'</span>'+(x.reason?'<span style="color:#dc2626;font-size:10px;">'+esc(x.reason)+'</span>':'')+'</div>';
  }).join('');
}

/* ═══ TASK ═══ */
var currentMember='', currentTaskIndex=0;
function getTasks(){var t=ls(TASK_KEY,[]);return Array.isArray(t)?t:[];}
function getRecords(){var r=ls(REC_KEY,[]);return Array.isArray(r)?r:[];}
function saveRecords(r){lss(REC_KEY,r);}
function getSkipped(){var s=ls(SKIP_KEY,[]);return Array.isArray(s)?s:[];}
function saveSkipped(s){lss(SKIP_KEY,s);}

function populateTaskMembers(){
  var sel=$('taskMemberSel');if(!sel) return;
  var cur=sel.value;
  var m=getMembers();
  sel.innerHTML='<option value="">-- ممبر منتخب کریں --</option>';
  m.filter(function(x){return !x.onLeave;}).forEach(function(x){
    sel.appendChild(new Option(x.name+' ('+(x.rank==='Senior'?'سینئر':'جونیئر')+')',x.name));
  });
  if(cur) sel.value=cur;
}
window.onTaskMemberChange=function(){
  currentMember=$('taskMemberSel').value;
  currentTaskIndex=0;
  renderCurrentTask();renderTaskHistory();renderTotalPoints();
};
function getCurrentTask(){
  var t=getTasks();
  if(currentTaskIndex>=t.length) currentTaskIndex=0;
  return t[currentTaskIndex];
}
function renderCurrentTask(){
  var el=$('taskCurrent');
  if(!currentMember){el.innerHTML='<div class="lbl">📌 موجودہ ٹاسک</div><div class="nm">پہلے ممبر منتخب کریں</div><div class="pts">0 Points</div>';return;}
  var t=getTasks();
  if(!t.length){el.innerHTML='<div class="lbl">📌 موجودہ ٹاسک</div><div class="nm">کوئی ٹاسک نہیں</div><div class="pts">0 Points</div>';return;}
  var c=getCurrentTask();
  el.innerHTML='<div class="lbl">📌 موجودہ ٹاسک</div><div class="nm">'+esc(c.title)+'</div><div class="pts">🏆 '+c.points+' Points</div>';
}
window.taskSubmit=function(status){
  if(!currentMember){alert('پہلے ممبر منتخب کریں');return;}
  var t=getTasks();
  if(!t.length){alert('کوئی ٹاسک نہیں');return;}
  var c=getCurrentTask();
  var recs=getRecords();
  var pts=(status==='done')?(parseInt(c.points,10)||0):0;
  var now=new Date();
  recs.unshift({
    id:Date.now(),member:currentMember,task:c.title,type:c.type,
    points:pts,status:status,timestamp:now.getTime(),
    dateStr:pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear(),
    timeStr:pad(now.getHours())+':'+pad(now.getMinutes())
  });
  if(recs.length>500) recs=recs.slice(0,500);
  saveRecords(recs);
  if(status==='notdone'){
    var sk=getSkipped();
    sk.unshift({id:Date.now(),member:currentMember,task:c.title,reason:'',hasReason:false,timestamp:Date.now()});
    saveSkipped(sk);
  }
  currentTaskIndex++;
  renderCurrentTask();renderTaskHistory();renderTotalPoints();renderSkip();
};
function renderTaskHistory(){
  var box=$('taskHistList');if(!box) return;
  if(!currentMember){box.innerHTML='<div class="empty-note">ممبر منتخب کریں</div>';return;}
  var r=getRecords().filter(function(x){return x.member===currentMember;});
  if(!r.length){box.innerHTML='<div class="empty-note">کوئی ریکارڈ نہیں</div>';return;}
  box.innerHTML=r.slice(0,20).map(function(x){
    var stLbl=x.status==='done'?'✅ ہو گیا':(x.status==='notdone'?'❌ نہیں ہوا':'⚪ چھوڑا');
    var stCls=x.status==='done'?'done':(x.status==='notdone'?'notdone':'skip');
    return '<div class="row"><div style="flex:1;min-width:0;"><div>'+esc(x.task)+'</div><div style="font-size:9px;color:#64748b;margin-top:2px;">'+esc(x.dateStr)+' '+esc(x.timeStr)+'</div></div><span class="st '+stCls+'">'+stLbl+'</span></div>';
  }).join('');
}
function renderTotalPoints(){
  if(!currentMember){$('totalPoints').textContent='0';return;}
  var r=getRecords().filter(function(x){return x.member===currentMember;});
  var t=0;r.forEach(function(x){t+=(x.points||0);});
  $('totalPoints').textContent=t;
}

/* ═══ SKIP ═══ */
function renderSkip(){
  var s=getSkipped();
  var d=new Date();
  var todayPrefix=pad(d.getDate())+'/'+pad(d.getMonth()+1);
  var today=s.filter(function(x){
    var t=new Date(x.timestamp);
    return (pad(t.getDate())+'/'+pad(t.getMonth()+1))===todayPrefix;
  });
  var seniorL=[],juniorL=[];
  var m=getMembers();
  today.forEach(function(item){
    var f=m.find(function(x){return x.name===item.member;});
    var rank=f?f.rank:'Junior';
    if(rank==='Senior') seniorL.push(item);else juniorL.push(item);
  });
  renderSkipList('skipSeniorList',seniorL);
  renderSkipList('skipJuniorList',juniorL);
}
function renderSkipList(elId,list){
  var el=$(elId);if(!el) return;
  if(!list.length){el.innerHTML='<div class="empty-note">کوئی نہیں</div>';return;}
  el.innerHTML=list.map(function(x){
    var d=new Date(x.timestamp);
    var ds=pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    if(x.hasReason){
      return '<div class="skip-item done"><div class="nm">📌 '+esc(x.member)+'</div><div class="task">'+esc(x.task)+'</div><div class="reason">✅ '+esc(x.reason)+'</div><div class="date">'+ds+'</div></div>';
    }
    return '<div class="skip-item pending"><div class="nm">📌 '+esc(x.member)+'</div><div class="task">'+esc(x.task)+'</div><div class="warn">⚠️ وجہ نہیں دی</div><div class="date">'+ds+'</div></div>';
  }).join('');
}
function populateSkipMembers(){
  var sel=$('skipMemberSel');if(!sel) return;
  var cur=sel.value;
  var m=getMembers();
  sel.innerHTML='<option value="">ممبر منتخب کریں...</option>';
  m.forEach(function(x){sel.appendChild(new Option(x.name+' ('+(x.rank==='Senior'?'سینئر':'جونیئر')+')',x.name));});
  if(cur) sel.value=cur;
}
window.updateSkipTasks=function(){
  var mn=$('skipMemberSel').value;
  var sel=$('skipTaskSel');
  sel.innerHTML='<option value="">کام منتخب کریں...</option>';
  if(!mn) return;
  var s=getSkipped().filter(function(x){return x.member===mn&&!x.hasReason;});
  if(!s.length){sel.innerHTML='<option value="">کوئی کام وجہ کے منتظر نہیں</option>';return;}
  s.forEach(function(x){sel.appendChild(new Option(x.task,x.id));});
};
window.submitSkipReason=function(){
  var id=parseInt($('skipTaskSel').value,10);
  var reason=$('skipReasonInput').value.trim();
  if(!id){alert('کام منتخب کریں');return;}
  if(!reason){alert('وجہ لکھیں');return;}
  var s=getSkipped();
  var r=s.find(function(x){return x.id===id;});
  if(!r) return;
  r.reason=reason;r.hasReason=true;
  saveSkipped(s);
  $('skipReasonInput').value='';$('skipMemberSel').value='';
  $('skipTaskSel').innerHTML='<option value="">کام منتخب کریں...</option>';
  renderSkip();
};

/* ═══ BOOT ═══ */
function boot(){
  updateNews();checkNewNews();updateDuty();populateLeaveDropdown();renderTodayLeaves();
  populateTaskMembers();renderCurrentTask();renderTaskHistory();renderTotalPoints();
  renderSkip();populateSkipMembers();
  setTimeout(showAlert,1200);
  window.addEventListener('storage',function(e){
    if(e.key===NEWS_KEY){updateNews();checkNewNews();}
    if(e.key===DUTY_KEY||e.key===LEAVE_KEY){updateDuty();populateLeaveDropdown();renderTodayLeaves();populateTaskMembers();renderSkip();populateSkipMembers();}
    if(e.key===REC_KEY){renderTaskHistory();renderTotalPoints();}
    if(e.key===SKIP_KEY){renderSkip();}
  });
  setInterval(function(){updateNews();checkNewNews();},5000);
  setInterval(updateDuty,1000);
  setInterval(function(){populateLeaveDropdown();renderTodayLeaves();populateTaskMembers();populateSkipMembers();},5000);
  setInterval(function(){renderCurrentTask();renderTaskHistory();renderTotalPoints();renderSkip();},3000);
  setInterval(checkComplaints,20000);
  checkComplaints();
}

document.addEventListener('click',function unlock(){
  try{var c=new (window.AudioContext||window.webkitAudioContext)();if(c.state==='suspended')c.resume();}catch(e){}
  document.removeEventListener('click',unlock);
},{once:true});

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
