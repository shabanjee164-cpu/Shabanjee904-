<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NA2 — Dashboard Ticker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#f8fafc;font-family:'Segoe UI',Tahoma,sans-serif;padding:12px;color:#334155;direction:rtl}
#main{max-width:750px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ticker-wrap{background:#fff;border:2px solid #059669;border-radius:10px;padding:10px 12px;overflow:hidden;position:relative;min-height:50px;display:none;align-items:center;gap:8px;transition:.3s}
.ticker-wrap.active{display:flex}
.ticker-wrap.news-mode{border-color:#059669;background:#f0fdf4}
.ticker-wrap.alert-mode{border-color:#dc2626;background:#fef2f2}
.ticker-badge{font-size:12px;font-weight:800;padding:5px 10px;border-radius:12px;flex-shrink:0;background:#059669;color:#fff}
.ticker-badge.alert{background:#dc2626}
.ticker-content{flex:1;overflow:hidden;position:relative;height:28px;display:flex;align-items:center}
.ticker-item{position:absolute;white-space:nowrap;font-weight:800;font-size:14px;line-height:28px;color:#0f172a;right:0}
.ticker-empty{text-align:center;color:#94a3b8;font-size:12px;font-weight:700;flex:1}

/* 10 EFFECTS ANIMATIONS */
.ticker-item.eff-move{animation:effMove var(--dur,18s) linear infinite}
@keyframes effMove{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}

.ticker-item.eff-reverse{animation:effReverse var(--dur,18s) linear infinite}
@keyframes effReverse{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.ticker-item.eff-fade{position:static;white-space:normal;animation:effFade 1.4s ease-in-out infinite alternate}
@keyframes effFade{0%{opacity:.2}100%{opacity:1}}

.ticker-item.eff-slide{position:static;white-space:normal;animation:effSlide .8s ease-out}
@keyframes effSlide{0%{transform:translateX(40px);opacity:0}100%{transform:translateX(0);opacity:1}}

.ticker-item.eff-blink{position:static;white-space:normal;animation:effBlink .9s step-end infinite}
@keyframes effBlink{0%,100%{opacity:1}50%{opacity:0}}

.ticker-item.eff-blur{position:static;white-space:normal;animation:effBlur 1.5s ease-out}
@keyframes effBlur{0%{filter:blur(6px);opacity:.3}100%{filter:blur(0);opacity:1}}

.ticker-item.eff-bounce{position:static;white-space:normal;animation:effBounce 1s ease-in-out infinite}
@keyframes effBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.ticker-item.eff-glow{position:static;white-space:normal;color:#b91c1c;text-shadow:0 0 8px rgba(220,38,38,.45);animation:effGlow 1.1s ease-in-out infinite alternate}
@keyframes effGlow{0%{transform:scale(.98)}100%{transform:scale(1.02)}}

.ticker-item.eff-static{position:static;white-space:normal}

.dashboard-body{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:24px;text-align:center;color:#94a3b8;font-size:12px;font-weight:700;line-height:1.6}
.inline-bar{display:none;gap:6px;padding:8px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.inline-bar.show{display:flex}
.inline-bar input{flex:1;padding:7px 9px;border:1px solid #cbd5e1;border-radius:6px;font-size:11.5px;font-family:inherit;outline:none;min-width:140px}
.inline-bar button{padding:7px 12px;border:none;border-radius:6px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}

.pwd-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99999;align-items:center;justify-content:center;padding:16px}
.pwd-modal.active{display:flex}
.pwd-box{background:#fff;border-radius:12px;max-width:340px;width:100%;overflow:hidden}
.pwd-h{padding:14px;background:#2563eb;color:#fff;font-size:14px;font-weight:800;text-align:center}
.pwd-body{padding:14px;display:flex;flex-direction:column;gap:8px}
.pwd-body input{padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;font-family:inherit;outline:none;width:100%}
.pwd-body label{font-size:11px;font-weight:700;color:#475569}
.pwd-body .link{background:none;border:none;color:#2563eb;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;text-align:right;padding:4px 0;text-decoration:underline}
.pwd-foot{display:flex;gap:6px;padding:0 14px 14px}
.pwd-foot button{flex:1;padding:10px;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;background:#e2e8f0;color:#64748b}
.pwd-foot .ok{background:#16a34a;color:#fff}

.inline-msg{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2e8b57;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:99999;display:none;font-family:inherit}
.inline-msg.show{display:block}
</style>
</head>
<body>

<div id="main">
  <div class="inline-bar" id="na2InlineBar">
    <span id="na2InlineLabel" style="font-size:11px;font-weight:800;color:#1e40af;width:100%"></span>
    <input type="text" id="na2InlineInput" placeholder="متن لکھیں...">
    <button style="background:#16a34a;color:#fff" id="na2InlineOk" onclick="confirmNa2Inline()">✓</button>
    <button style="background:#64748b;color:#fff" onclick="cancelNa2Inline()">✕</button>
  </div>

  <div class="ticker-wrap" id="tickerWrap">
    <span class="ticker-badge" id="badge">📰</span>
    <div class="ticker-content">
      <div class="ticker-item" id="item"></div>
      <div class="ticker-empty" id="empty">کوئی پیغام نہیں</div>
    </div>
  </div>

  <div class="dashboard-body">
    Dashboard Content<br>
    (NA1 سے Show دبانے پر منتخب ریکارڈ یہاں چلے گا — مکمل ہونے پر History میں جائے گا)
  </div>
</div>

<div class="pwd-modal" id="pwdLockModal">
  <div class="pwd-box">
    <div class="pwd-h">🔒 NA2 Locked</div>
    <div class="pwd-body">
      <label>پاس ورڈ درج کریں</label>
      <input type="password" id="pwdLockInput" placeholder="••••••">
      <button class="link" onclick="showForgot()">پاس ورڈ بھول گئے؟</button>
    </div>
    <div class="pwd-foot"><button class="ok" onclick="tryUnlock()">🔓 Unlock</button></div>
  </div>
</div>

<div class="pwd-modal" id="pwdForgotModal">
  <div class="pwd-box">
    <div class="pwd-h">🔐 Forgot Password</div>
    <div class="pwd-body">
      <label id="forgotQLabel">سوال</label>
      <input type="text" id="forgotA" placeholder="جواب">
      <div id="forgotNewWrap" style="display:none">
        <input type="password" id="forgotNew" placeholder="نیا پاس ورڈ">
      </div>
    </div>
    <div class="pwd-foot">
      <button onclick="closeForgot()">✕</button>
      <button class="ok" id="forgotOkBtn" onclick="checkForgot()">✓</button>
    </div>
  </div>
</div>

<div class="inline-msg" id="msg"></div>

<script>
function $(id){return document.getElementById(id)}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function pad(n){return String(n).padStart(2,'0')}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function msg(t,err){var el=$('msg');el.textContent=t;el.style.background=err?'#c0392b':'#2e8b57';el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},2200)}

var REC_KEY='sec10_news_alerts_data';
var NA1_SET_KEY='ns_modular_settings_v1';
var NA1_AUD_KEY='ns_modular_audio_v1';
var MAN_KEY='a2_manual_sel';
var PWD_K='a2_pwd',PWD_ON='a2_pwd_on',PWD_Q='a2_pwd_q',PWD_A='a2_pwd_a';

var _ctx=null;
function getCtx(){if(!_ctx){try{_ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(_ctx&&_ctx.state==='suspended')_ctx.resume();return _ctx}

  {n:"پیغام 19",p:[[660,140],[880,200]]},{n:"خبر نامہ 20",p:[[587,150],[784,150],[988,200]]},
  {n:"سُر تال 21",p:[[523,140],[587,140],[659,140],[784,200]]},{n:"نغمہ 22",p:[[740,220],[880,260]]},
  {n:"گونج 23",p:[[480,350]]},{n:"اشارہ 24",p:[[950,120],[0,50],[950,120]]},
  {n:"نیوز کلاسک 25",p:[[659,160],[784,160],[659,160],[1046,250]]}
];

var ALERT_TUNES=[
  {n:"الارم تیز 1",p:[[1000,180],[0,80],[1000,180],[0,80],[1000,220]]},
  {n:"خطرہ بیپ 2",p:[[1200,250],[600,250]]},{n:"سائرن 3",p:[[700,220],[1100,220],[700,220],[1100,220]]},
  {n:"ہنگامی 4",p:[[1400,120],[0,60],[1400,120],[0,60],[1400,120],[0,60],[1400,200]]},
  {n:"وارننگ 5",p:[[900,300],[0,100],[900,300]]},{n:"ہارن 6",p:[[320,400],[420,400]]},
  {n:"بجلی جھٹکا 7",p:[[180,250],[320,250],[180,250]]},{n:"ڈھول الرٹ 8",p:[[140,120],[0,50],[140,120],[0,50],[200,220]]},
  {n:"زنگ الرٹ 9",p:[[420,650]]},{n:"تیز گھنٹی 10",p:[[1300,150],[900,150],[1300,150],[900,150]]},
  {n:"فوری توجہ 11",p:[[1100,100],[0,50],[1100,100],[0,50],[1500,250]]},
  {n:"الارم کلاک 12",p:[[1250,90],[0,70],[1250,90],[0,70],[1250,90],[0,70],[1250,90]]},
  {n:"ڈبل وارننگ 13",p:[[850,220],[0,80],[1150,260]]},{n:"گہرا الرٹ 14",p:[[300,300],[0,80],[300,350]]},
  {n:"ہائی الرٹ 15",p:[[1500,180],[1200,180],[1500,220]]},{n:"بزر 16",p:[[240,500]]},
  {n:"نبض 17",p:[[800,120],[0,120],[800,120],[0,120],[800,120]]},
  {n:"چوکنا 18",p:[[950,150],[1250,150],[950,150],[1250,200]]},
  {n:"ریڈ الرٹ 19",p:[[1050,200],[520,200],[1050,250]]},{n:"فائنل الارم 20",p:[[1200,160],[0,60],[1200,160],[0,60],[800,320]]}
];

var queue=[], qIdx=0, running=false, timer=null;
var _inlineAction=null;

function isDashVisible(){
  var v=lsGet('ns_dash_visible',null);
  return v===true;
}

function openNa2Inline(label,val,okText,cb){
  $('na2InlineLabel').textContent=label;
  $('na2InlineInput').value=val||'';
  $('na2InlineOk').textContent=okText||'✓';
  _inlineAction=cb;
  $('na2InlineBar').classList.add('show');
  $('na2InlineInput').focus();
}
function confirmNa2Inline(){
  var cb=_inlineAction,val=$('na2InlineInput').value;
  cancelNa2Inline();
  if(cb)cb(val);
}
function cancelNa2Inline(){
  _inlineAction=null;
  $('na2InlineBar').classList.remove('show');
}

/* 5 ESSENTIAL FEATURES FOR NA2 */
function na2SelectMode(enable){
  var man=lsGet(MAN_KEY,{});
  var items=lsGet(REC_KEY,[]).filter(function(x){return !x.deleted});
  if(enable){
    items.forEach(function(x){man[x.id]=true});
    lsSet(MAN_KEY,man);
    msg('✅ Select Mode ON');
  } else {
    lsSet(MAN_KEY,{});
    msg('☑️ Select Mode OFF');
  }
  restartTicker();
}
function na2EditItem(id){
  var items=lsGet(REC_KEY,[]);
  var item=items.find(function(x){return String(x.id)===String(id)});
  if(!item)return;
  openNa2Inline('ریکارڈ ایڈٹ کریں:',item.content,'سیو',function(nn){
    if(nn&&nn.trim()){
      item.content=nn.trim();
      lsSet(REC_KEY,items);
      restartTicker();
      msg('✅ اپڈیٹ ہو گیا');
    }
  });
}
function na2DeleteItem(id){
  var items=lsGet(REC_KEY,[]);
  items.forEach(function(x){if(String(x.id)===String(id)){x.deleted=true;x.deletedAt=Date.now()}});
  lsSet(REC_KEY,items);
  restartTicker();
  msg('🗑️ ڈیلیٹ ہو گیا');
}
function na2ClearAll(){
  lsSet(REC_KEY,[]);
  lsSet(MAN_KEY,{});
  stopTicker();
  msg('🧹 صاف ہو گیا');
}
function na2CloseSection(){
  lsSet('ns_dash_visible',false);
  stopTicker();
  msg('⬇️ سیکشن بند');
}

function pwdIsOn(){return localStorage.getItem(PWD_ON)==='1'&&!!localStorage.getItem(PWD_K)}
function pwdSet(p){localStorage.setItem(PWD_K,p);localStorage.setItem(PWD_ON,'1')}
function tryLockOnBoot(){
  if(!pwdIsOn())return false;
  if(sessionStorage.getItem('a2_unlocked')==='1')return false;
  $('main').style.display='none';
  $('pwdLockModal').classList.add('active');
  return true;
}
function tryUnlock(){
  var v=$('pwdLockInput').value;
  if(v===localStorage.getItem(PWD_K)){
    sessionStorage.setItem('a2_unlocked','1');
    $('pwdLockModal').classList.remove('active');
    $('main').style.display='flex';
    msg('🔓 کھل گیا');
    startTicker();
  } else msg('❌ غلط',true);
}
function showForgot(){
  var q=localStorage.getItem(PWD_Q);
  if(!q){msg('سیکیورٹی سوال سیٹ نہیں',true);return}
  $('forgotQLabel').textContent='سوال: '+q;
  $('forgotA').value='';$('forgotNew').value='';
  $('forgotNewWrap').style.display='none';
  $('forgotOkBtn').textContent='✓ جواب';
  $('pwdForgotModal').setAttribute('data-step','1');
  $('pwdForgotModal').classList.add('active');
}
function closeForgot(){$('pwdForgotModal').classList.remove('active')}
function checkForgot(){
  var step=$('pwdForgotModal').getAttribute('data-step')||'1';
  if(step==='1'){
    var a=$('forgotA').value.trim(),r=localStorage.getItem(PWD_A);
    if(!r||!a||a.toLowerCase()!==r.toLowerCase()){msg('❌ غلط',true);return}
    $('forgotNewWrap').style.display='block';$('forgotOkBtn').textContent='💾 سیٹ';
    $('pwdForgotModal').setAttribute('data-step','2');
  } else {
    var np=$('forgotNew').value.trim();
    if(!np){msg('نیا پاس ورڈ',true);return}
    pwdSet(np);sessionStorage.setItem('a2_unlocked','1');closeForgot();
    $('pwdLockModal').classList.remove('active');$('main').style.display='flex';
    msg('✅ نیا پاس ورڈ');startTicker();
  }
}

function getEffectiveConfig(){
  var c=lsGet(NA1_SET_KEY,{});
  return {
    newsOn:c.allOpts?c.allOpts.newsOn!==false:true,
    alertOn:c.allOpts?c.allOpts.alertOn!==false:true,
    soundsOn:c.allOpts?c.allOpts.soundsOn!==false:true,
    vib:c.allOpts?c.allOpts.vibrate!==false:true,
    voice:c.allOpts?c.allOpts.voice!==false:true,
    newsSpeed:c.newsPatti?(parseInt(c.newsPatti.speed)||5):5,
    alertSpeed:c.alertPatti?(parseInt(c.alertPatti.speed)||6):6,
    newsSec:c.newsPatti?(parseInt(c.newsPatti.seconds)||3):3,
    alertSec:c.alertPatti?(parseInt(c.alertPatti.seconds)||4):4,
    newsEffects:c.newsPatti&&Array.isArray(c.newsPatti.effects)?c.newsPatti.effects:[],
    alertEffects:c.alertPatti&&Array.isArray(c.alertPatti.effects)?c.alertPatti.effects:[],
    newsTune:c.newsPatti?(parseInt(c.newsPatti.tuneIdx)||0):0,
    alertTune:c.alertPatti?(parseInt(c.alertPatti.tuneIdx)||0):0,
    newsVol:c.newsPatti?(parseInt(c.newsPatti.volume)||70):70,
    alertVol:c.alertPatti?(parseInt(c.alertPatti.volume)||85):85
  };
}

function getFirstEffectClass(type,cfg){
  var arr=type==='alert'?cfg.alertEffects:cfg.newsEffects;
  var idx=arr.findIndex(function(v){return !!v});
  if(idx===-1)return 'eff-move';
  if(type==='news'){
    var map=['eff-static','eff-move','eff-static','eff-fade','eff-reverse','eff-blink','eff-fade','eff-slide','eff-move','eff-fade'];
    return map[idx]||'eff-move';
  } else {
    var amap=['eff-glow','eff-blur','eff-blink','eff-static','eff-slide','eff-move','eff-glow','eff-bounce','eff-fade','eff-glow'];
    return amap[idx]||'eff-glow';
  }
}

function buildQueue(cfg){
  if(!isDashVisible())return [];
  var man=lsGet(MAN_KEY,{});
  var selectedIds=Object.keys(man).filter(function(k){return man[k]});
  if(!selectedIds.length)return [];

  var items=lsGet(REC_KEY,[]).filter(function(x){
    return !x.deleted && !x.skipped && selectedIds.indexOf(String(x.id))!==-1;
  });
  if(!cfg.newsOn)items=items.filter(function(x){return x.type!=='news'});
  if(!cfg.alertOn)items=items.filter(function(x){return x.type!=='alert'});
  return items;
}

function markCompletedInHistory(itemId){
  var all=lsGet(REC_KEY,[]);
  var changed=false;
  all.forEach(function(r){
    if(String(r.id)===String(itemId)){
      r.dashShown=true;
      r.historyReady=true;
      r.completedAt=Date.now();
      changed=true;
    }
  });
  if(changed)lsSet(REC_KEY,all);
}

function startTicker(){
  if(pwdIsOn()&&sessionStorage.getItem('a2_unlocked')!=='1')return;
  var cfg=getEffectiveConfig();
  queue=buildQueue(cfg);
  qIdx=0;
  running=true;
  if(!queue.length){$('tickerWrap').classList.remove('active');return}
  $('tickerWrap').classList.add('active');
  playNext();
}
function restartTicker(){running=false;clearTimeout(timer);startTicker()}
function stopTicker(){running=false;clearTimeout(timer);$('tickerWrap').classList.remove('active')}

function playNext(){
  if(!running)return;
  if(qIdx>=queue.length){
    stopTicker();
    return;
  }
  var item=queue[qIdx++];
  displayItem(item);
}

function displayItem(item){
  var cfg=getEffectiveConfig();
  var wrap=$('tickerWrap'),badge=$('badge'),el=$('item'),emp=$('empty');
  wrap.classList.remove('news-mode','alert-mode');
  wrap.classList.add(item.type==='alert'?'alert-mode':'news-mode');
  badge.className='ticker-badge'+(item.type==='alert'?' alert':'');
  badge.textContent=item.type==='alert'?'🚨':'📰';
  emp.style.display='none';
  el.style.display='block';
  el.textContent=item.content;

  var spd=item.type==='alert'?cfg.alertSpeed:cfg.newsSpeed;
  var dur=Math.max(4,24-(spd*1.8));
  el.style.setProperty('--dur',dur+'s');
  el.className='ticker-item '+getFirstEffectClass(item.type,cfg);
  void el.offsetWidth;

  if(cfg.soundsOn)playPattiAudio(item.type,cfg);
  if(cfg.vib && navigator.vibrate)navigator.vibrate([200,100,200]);
  if(cfg.voice)speakItem(item.type,item.content,item.type==='alert'?cfg.alertVol:cfg.newsVol);

  var sec=item.type==='alert'?cfg.alertSec:cfg.newsSec;
  var waitMs=Math.max(sec,2)*1000;
  clearTimeout(timer);
  timer=setTimeout(function(){
    markCompletedInHistory(item.id);
    playNext();
  },waitMs);
}

function playPattiAudio(type,cfg){
  var aud=lsGet(NA1_AUD_KEY,{news:null,alert:null});
  var vol=(type==='alert'?cfg.alertVol:cfg.newsVol)/100;
  if(aud[type]){
    try{var a=new Audio(aud[type]);a.volume=Math.min(1,Math.max(0,vol));a.play().catch(function(){})}catch(e){}
    return;
  }
  var tune=(type==='alert'?ALERT_TUNES:NEWS_TUNES)[type==='alert'?cfg.alertTune:cfg.newsTune]||NEWS_TUNES[0];
  var ctx=getCtx();if(!ctx)return;
  try{
    var t=ctx.currentTime;
    tune.p.forEach(function(n){
      var freq=n[0],dur=n[1]/1000;
      if(freq>0){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.frequency.value=freq;
        g.gain.setValueAtTime(Math.max(0.01,vol),t);
        g.gain.exponentialRampToValueAtTime(0.001,t+dur);
        o.start(t);o.stop(t+dur);
      }
      t+=dur+0.04;
    });
  }catch(e){}
}

function speakItem(type,text,vol){
  if(!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    var prefix=(type==='alert')?'Alert. ':'News. ';
    var u=new SpeechSynthesisUtterance(prefix+text);
    u.lang='ur-PK';
    u.volume=Math.min(1,Math.max(0,(vol||70)/100));
    window.speechSynthesis.speak(u);
  }catch(e){}
}

document.addEventListener('DOMContentLoaded',function(){
  if(!tryLockOnBoot()){$('main').style.display='flex';startTicker()}
  setInterval(function(){
    if(document.visibilityState==='visible'){
      var vis=isDashVisible();
      if(!vis && running)stopTicker();
      else if(vis && !running)startTicker();
    }
  },2000);
});
</script>
