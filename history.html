<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Member Duty History</title>
<style>
:root{--primary:#1e293b;--accent:#2563eb;--danger:#ef4444;--success:#10b981;--golden:#d97706;--bg:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;padding:12px;color:#334155;direction:rtl}
.container{max-width:750px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.section-card{background:#fff;padding:10px;border-radius:10px;border:1px solid #cbd5e1;box-shadow:0 2px 4px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px}
.section-header{font-weight:bold;color:var(--primary);font-size:13px;display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid #e2e8f0}
.section-header button{background:#f8fafc;border:1px solid #cbd5e1;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}

/* FILTER */
.filter-row{display:flex;gap:4px}
.filter-row select{padding:7px 6px;border:1px solid #cbd5e1;border-radius:6px;font-size:11px;font-family:inherit;outline:none;flex:1;text-align:center;font-weight:700;background:#fff}

/* SHARE/COPY ROW */
.action-row{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:4px}
.action-row span{font-size:11px;font-weight:bold;color:#475569}
.action-btns{display:flex;gap:3px}
.action-btns button{border:none;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-share{background:#dbeafe;color:#1e40af}
.btn-copy{background:#fef3c7;color:#92400e}
.btn-close{background:#64748b;color:#fff}

/* RECORD */
.record-list{max-height:400px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px;padding:5px;background:#fafafa;font-size:11px}
.member-block{padding:8px 6px;border-bottom:2px solid #cbd5e1;margin-bottom:4px}
.member-block:last-child{border-bottom:none;margin-bottom:0}
.member-hdr{display:flex;align-items:center;gap:4px;margin-bottom:6px;background:#eff6ff;padding:5px 6px;border-radius:5px}
.member-hdr .chk{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.member-hdr .nm{font-size:12px;font-weight:800;color:#1e40af;flex:1}
.member-hdr .rk{font-size:9.5px;color:#64748b;font-weight:700}
.event-item{padding:5px 8px;margin-bottom:3px;border-radius:5px;display:flex;align-items:flex-start;gap:4px;background:#fff;border-right:3px solid #94a3b8}
.event-item .chk{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:2px}
.event-item .body{flex:1;min-width:0}
.event-item .txt{font-size:10.5px;font-weight:700;color:#0f172a}
.event-item .extra{font-size:9.5px;color:#64748b;margin-top:2px}
.event-item .dt{font-size:9px;color:#94a3b8;margin-top:2px;font-weight:600}
/* Event colors */
.event-item.ev-done{border-right-color:#10b981;background:#f0fdf4}
.event-item.ev-partial{border-right-color:#dc2626;background:#fef2f2}
.event-item.ev-leave{border-right-color:#d97706;background:#fffbeb}
.event-item.ev-active{border-right-color:#2563eb;background:#eff6ff}
.event-item.ev-new{border-right-color:#8b5cf6;background:#f5f3ff}
.event-item.ev-change{border-right-color:#6b7280;background:#f9fafb}
.record-empty{text-align:center;color:#94a3b8;padding:16px;font-size:11px;font-weight:700}

/* STATE */
.state-patti{display:flex;justify-content:space-around;gap:4px;padding:6px 4px;border-radius:6px;background:#f8fafc;border:1px solid #e2e8f0;margin-top:6px}
.state-item{flex:1;text-align:center;padding:4px 2px;border-radius:4px;font-size:9.5px;font-weight:800}
.state-item .val{font-size:14px;font-weight:900;display:block;margin-top:1px}
.state-item:nth-child(1){background:#ecfdf5;color:#059669;border:1px solid #10b981}
.state-item:nth-child(2){background:#fef2f2;color:#dc2626;border:1px solid #ef4444}
.state-item:nth-child(3){background:#fffbeb;color:#d97706;border:1px solid #f59e0b}

/* SETTINGS */
.ns-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:9999;overflow-y:auto}
.ns-overlay.active{display:block}
.ns-box{max-width:520px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
.ns-head{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800}
.ns-head button{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.ns-body{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px}
.ns-old{background:#2c3e50;border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ns-old button{padding:8px 3px;font-size:9px;font-weight:bold;border-radius:5px;border:1px solid #34495e;background:#34495e;color:#fff;cursor:pointer;font-family:inherit}
.ns-old button.del{color:#ff9999}
.ns-old button.active{background:#10b981;border-color:#10b981}
.ns-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid #e2e8f0;padding:12px;display:flex;gap:8px}
.ns-foot button{flex:1;padding:12px;border:none;border-radius:8px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;background:#f1f5f9;color:#64748b}

/* MODAL */
.ns-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:16px}
.ns-modal.active{display:flex}
.ns-modal-box{background:#fff;border-radius:12px;max-width:340px;width:100%}
.ns-modal-h{padding:12px;background:#2563eb;color:#fff;font-size:13px;font-weight:800;border-radius:12px 12px 0 0;text-align:center}
.ns-modal-b{padding:14px;font-size:12px;color:#334155;line-height:1.6;font-weight:600;text-align:center}
.ns-modal-b input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;font-family:inherit;outline:none;margin-top:8px;text-align:center;font-weight:800}
.ns-modal-f{display:flex;gap:8px;padding:0 14px 14px}
.ns-modal-f button{flex:1;padding:10px;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}

/* MSG */
.inline-msg{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2e8b57;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:99999;display:none;font-family:inherit}
.inline-msg.show{display:block}
.inline-msg.error{background:#c0392b}

/* DARK */
body.dark{background:#0f172a;color:#e2e8f0}
body.dark .section-card{background:#1e293b;border-color:#334155}
body.dark .record-list{background:#0f172a}
body.dark .member-hdr{background:#1e3a5f}
body.dark .member-hdr .nm{color:#60a5fa}
body.dark .event-item{background:#1e293b;border-right-color:#475569}
body.dark .event-item .txt{color:#f1f5f9}
body.dark .event-item.ev-done{background:#064e3b}
body.dark .event-item.ev-partial{background:#7f1d1d}
body.dark .event-item.ev-leave{background:#78350f}
body.dark .event-item.ev-active{background:#1e3a8a}
body.dark .event-item.ev-new{background:#4c1d95}
body.dark .event-item.ev-change{background:#334155}
</style>
</head>
<body>

<div class="container">
  <div class="section-card">
    <div class="section-header">
      <span>👤 ممبر ڈیوٹی ہسٹری</span>
      <button onclick="openSettings()">⚙️</button>
    </div>

    <!-- FILTER -->
    <div class="filter-row">
      <select id="filterMember" onchange="renderHistory()">
        <option value="all">👤 تمام ممبران</option>
      </select>
      <select id="filterDate" onchange="renderHistory()">
        <option value="all">📅 تمام دن</option>
        <option value="today">📅 آج</option>
        <option value="yesterday">📅 کل</option>
        <option value="7days">📅 7 دن</option>
        <option value="30days">📅 30 دن</option>
      </select>
    </div>

    <!-- SHARE / COPY -->
    <div class="action-row">
      <span>📋 ریکارڈ: <span id="recCount">0</span></span>
      <div class="action-btns">
        <button class="btn-share" onclick="shareRecords()">📤 Share</button>
        <button class="btn-copy" onclick="copyRecords()">📋 Copy</button>
        <button class="btn-close" onclick="toggleClose('historyList')">⬇️</button>
      </div>
    </div>

    <!-- RECORD LIST -->
    <div class="record-list" id="historyList"></div>

    <!-- STATE -->
    <div class="state-patti">
      <div class="state-item">👤 Members<span class="val" id="stateMembers">0</span></div>
      <div class="state-item">✅ Done<span class="val" id="stateDone">0</span></div>
      <div class="state-item">🏖️ Leave<span class="val" id="stateLeave">0</span></div>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div class="ns-overlay" id="nsOverlay">
  <div class="ns-box">
    <div class="ns-head">
      <span>⚙️ سیٹنگز</span>
      <button onclick="closeSettings()">✕</button>
    </div>
    <div class="ns-body">
      <div class="ns-old">
        <button onclick="toggleSelectMode()" id="selModeBtn">☑️ Select</button>
        <button onclick="allSelect()">✅ All</button>
        <button onclick="editSelected()">✏️ Edit</button>
        <button class="del" onclick="deleteSelected()">🗑️ Delete</button>
        <button class="del" onclick="deleteAll()">❌ Del All</button>
        <button class="del" onclick="clearAll()">🧹 Clear</button>
        <button onclick="moveUp()">🔼 Oper</button>
        <button onclick="moveDown()">🔽 Nichy</button>
        <button onclick="setPassword()">🔑 Pass</button>
        <button onclick="toggleDark()" id="darkBtn">🌙 Dark</button>
      </div>
    </div>
    <div class="ns-foot"><button onclick="closeSettings()">✕ بند</button></div>
  </div>
</div>

<!-- MODAL -->
<div class="ns-modal" id="nsModal">
  <div class="ns-modal-box">
    <div class="ns-modal-h" id="modalTitle">تصدیق</div>
    <div class="ns-modal-b" id="modalBody">—</div>
    <div class="ns-modal-f">
      <button onclick="modalClose()" style="background:#e2e8f0;color:#64748b">✕ بند</button>
      <button onclick="modalConfirm()" style="background:#dc2626;color:#fff">✓ ہاں</button>
    </div>
  </div>
</div>

<div class="inline-msg" id="inlineMsg"></div>

<script>
function $(id){return document.getElementById(id)}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function pad(n){return String(n).padStart(2,'0')}
function fmtHourMin(ms){var s=Math.floor(ms/1000);var h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h+':'+pad(m)}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function yesterdayStr(){var d=new Date(Date.now()-86400000);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function toggleClose(id){var el=$(id);if(el)el.style.display=el.style.display==='none'?'block':'none'}
function showMsg(t,err){var el=$('inlineMsg');el.textContent=t;el.style.background=err?'#c0392b':'#2e8b57';el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},2500)}

/* ============ KEYS ============ */
var DUTY_KEY='sec4_duty_manager_data_v4';
var LEAVE_KEY='sec4_duty_leaves_data_v4';
var DUTY_LOG_KEY='sec4_duty_logs_v1';
var HIST_RECORDS='duty_history_records_v1';
var DS_KEY='duty_history_settings_v1';

/* ============ STATE ============ */
var selectMode=false,selectedIds={};
var _modalCb=null;
var historyRecords=[];

/* ============ BUILD RECORDS ============ */
function buildHistoryRecords(){
  var records=[];

  // 1. Duty logs (new, active, done, partial, change)
  var logs=lsGet(DUTY_LOG_KEY,[]);
  logs.forEach(function(l){
    var d=new Date(l.endTime||l.startTime||Date.now());
    var dateStr=pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    var txt,evClass,extra;
    if(l.status==='done'){
      txt='✅ اس ممبر نے آج ڈیوٹی پوری کی';
      evClass='ev-done';
      var pts=getTaskPoints(l.memberName);
      extra='⭐ '+pts+' پوائنٹس';
    } else if(l.status==='partial'){
      txt='❌ اس ممبر نے آج ڈیوٹی پوری نہیں کی';
      evClass='ev-partial';
      extra='';
    } else if(l.status==='active'){
      txt='🟢 ڈیوٹی جاری ہے';
      evClass='ev-active';
      extra='';
    } else if(l.status==='new'){
      txt='🆕 ڈیوٹی تفویض کی گئی';
      evClass='ev-new';
      extra='';
    } else {
      txt='⚪ ڈیوٹی ختم';
      evClass='ev-change';
      extra='';
    }
    records.push({
      id:'log_'+l.id,
      type:'log',
      memberName:l.memberName,
      rank:l.rank,
      text:txt,
      extra:extra,
      dateStr:dateStr,
      timestamp:l.endTime||l.startTime||Date.now(),
      evClass:evClass,
      original:l,
      source:'duty_log'
    });
  });

  // 2. Leaves
  var leaves=lsGet(LEAVE_KEY,[]);
  leaves.forEach(function(lv){
    var d=new Date(lv.timestamp||Date.now());
    var dateStr=pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    records.push({
      id:'leave_'+lv.id,
      type:'leave',
      memberName:lv.name,
      rank:lv.rank,
      text:'🏖️ اس ممبر نے آج چھٹی کی ہے',
      extra:'📝 وجہ: '+esc(lv.reason||'—')+' · ⏱️ '+(lv.duration||1)+' دن',
      dateStr:dateStr,
      timestamp:lv.timestamp||Date.now(),
      evClass:'ev-leave',
      original:lv,
      source:'leave'
    });
  });

  // 3. History events (junior change, senior return)
  var histEvents=lsGet('duty_history_events_v1',[]);
  histEvents.forEach(function(ev){
    var d=new Date(ev.timestamp||Date.now());
    var dateStr=pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    records.push({
      id:'ev_'+ev.id,
      type:'event',
      memberName:ev.memberName,
      rank:ev.rank||'',
      text:ev.text,
      extra:ev.extra||'',
      dateStr:dateStr,
      timestamp:ev.timestamp||Date.now(),
      evClass:'ev-change',
      original:ev,
      source:'event'
    });
  });

  // Sort by timestamp desc
  records.sort(function(a,b){return b.timestamp-a.timestamp});
  return records;
}

function getTaskPoints(memberName){
  var recs=lsGet('sec12_task_records',[]);
  var total=0;
  recs.forEach(function(r){if(r.member===memberName && r.status==='done'){total+=(r.points||0)}});
  return total;
}

/* ============ RENDER ============ */
function renderHistory(){
  var all=buildHistoryRecords();
  historyRecords=all;

  // Filter
  var fMember=$('filterMember').value;
  var fDate=$('filterDate').value;
  var today=todayStr();
  var yesterday=yesterdayStr();
  var weekAgo=Date.now()-7*86400000;
  var monthAgo=Date.now()-30*86400000;

  var filtered=all.filter(function(r){
    if(fMember!=='all' && r.memberName!==fMember)return false;
    if(fDate==='today' && r.dateStr.indexOf(pad(new Date().getDate())+'/'+pad(new Date().getMonth()+1))!==0)return false;
    if(fDate==='yesterday'){
      var yd=new Date(Date.now()-86400000);
      if(r.dateStr.indexOf(pad(yd.getDate())+'/'+pad(yd.getMonth()+1))!==0)return false;
    }
    if(fDate==='7days' && r.timestamp<weekAgo)return false;
    if(fDate==='30days' && r.timestamp<monthAgo)return false;
    return true;
  });

  // Group by member
  var grouped={};
  filtered.forEach(function(r){
    if(!grouped[r.memberName])grouped[r.memberName]={name:r.memberName,rank:r.rank,events:[]};
    grouped[r.memberName].events.push(r);
  });

  // Sort groups by total events count desc or member order
  var groupArr=Object.keys(grouped).map(function(k){return grouped[k]});

  var box=$('historyList');
  if(!groupArr.length){
    box.innerHTML='<div class="record-empty">📭 کوئی ریکارڈ نہیں</div>';
    $('recCount').textContent=0;
    renderState(filtered,groupArr);
    return;
  }

  box.innerHTML=groupArr.map(function(g,gi){
    var memberChk=selectMode?'<input type="checkbox" class="chk" '+(selectedIds['member_'+g.name]?'checked':'')+' onchange="toggleSel(\'member_'+g.name+'\')">':'';
    var eventsHtml=g.events.map(function(ev,ei){
      var chk=selectMode?'<input type="checkbox" class="chk" '+(selectedIds[ev.id]?'checked':'')+' onchange="toggleSel(\''+ev.id+'\')">':'';
      return '<div class="event-item '+ev.evClass+'">'+chk+'<div class="body">'
        +'<div class="txt">'+ev.text+'</div>'
        +(ev.extra?'<div class="extra">'+ev.extra+'</div>':'')
        +'<div class="dt">📅 '+ev.dateStr+'</div>'
        +'</div></div>';
    }).join('');
    return '<div class="member-block">'
      +'<div class="member-hdr">'+memberChk+'<span class="nm">'+(gi+1)+'️⃣ 👤 '+esc(g.name)+'</span><span class="rk">('+(g.rank||'')+')</span></div>'
      +eventsHtml
      +'</div>';
  }).join('');

  $('recCount').textContent=filtered.length;
  renderState(filtered,groupArr);
  populateMemberFilter(all);
}

function renderState(filtered,groups){
  $('stateMembers').textContent=groups.length;
  $('stateDone').textContent=filtered.filter(function(r){
    return r.text.indexOf('✅')!==-1;
  }).length;
  $('stateLeave').textContent=filtered.filter(function(r){
    return r.text.indexOf('🏖️')!==-1;
  }).length;
}

function populateMemberFilter(all){
  var sel=$('filterMember');
  var cur=sel.value;
  var members={};
  all.forEach(function(r){members[r.memberName]=r.rank});
  sel.innerHTML='<option value="all">👤 تمام ممبران</option>';
  Object.keys(members).forEach(function(name){
    sel.innerHTML+='<option value="'+esc(name)+'">'+esc(name)+' ('+members[name]+')</option>';
  });
  if(cur)sel.value=cur;
}

/* ============ SHARE / COPY ============ */
function getCurrentFiltered(){
  var fMember=$('filterMember').value;
  var fDate=$('filterDate').value;
  var weekAgo=Date.now()-7*86400000;
  var monthAgo=Date.now()-30*86400000;
  return historyRecords.filter(function(r){
    if(fMember!=='all' && r.memberName!==fMember)return false;
    if(fDate==='today' && r.dateStr.indexOf(pad(new Date().getDate())+'/'+pad(new Date().getMonth()+1))!==0)return false;
    if(fDate==='yesterday'){
      var yd=new Date(Date.now()-86400000);
      if(r.dateStr.indexOf(pad(yd.getDate())+'/'+pad(yd.getMonth()+1))!==0)return false;
    }
    if(fDate==='7days' && r.timestamp<weekAgo)return false;
    if(fDate==='30days' && r.timestamp<monthAgo)return false;
    return true;
  });
}

function buildTextReport(records){
  var grouped={};
  records.forEach(function(r){
    if(!grouped[r.memberName])grouped[r.memberName]={name:r.memberName,rank:r.rank,events:[]};
    grouped[r.memberName].events.push(r);
  });
  var txt='👤 ممبر ڈیوٹی ہسٹری\n';
  txt+='═══════════════════════\n';
  txt+='📅 '+new Date().toLocaleDateString('en-GB')+'\n';
  txt+='═══════════════════════\n\n';
  var i=1;
  Object.keys(grouped).forEach(function(name){
    var g=grouped[name];
    txt+=(i++)+'. 👤 '+g.name+' ('+g.rank+')\n';
    g.events.forEach(function(ev){
      txt+='   '+ev.text+'\n';
      if(ev.extra)txt+='   '+ev.extra+'\n';
      txt+='   📅 '+ev.dateStr+'\n';
      txt+='\n';
    });
    txt+='───────────────────────\n\n';
  });
  return txt.trim();
}

function shareRecords(){
  var recs=getCurrentFiltered();
  if(!recs.length){showMsg('کوئی ریکارڈ نہیں',true);return}
  // Selected only if any selected
  var selectedRecs=recs.filter(function(r){return selectedIds[r.id]});
  if(selectedRecs.length>0)recs=selectedRecs;
  var txt=buildTextReport(recs);
  if(navigator.share){
    navigator.share({title:'ممبر ڈیوٹی ہسٹری',text:txt}).catch(function(){});
  } else {
    copyToClipboard(txt);
    showMsg('✅ کاپی ہو گیا (Share نہیں)');
  }
}
