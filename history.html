<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A3 — News/Alert History</title>
<style>
:root{--primary:#1e293b;--accent:#2563eb;--danger:#ef4444;--success:#10b981;--golden:#d97706;--bg:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;padding:12px;color:#334155;direction:rtl}
.container{max-width:750px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.section-card{background:#fff;padding:10px;border-radius:10px;border:1px solid #cbd5e1;box-shadow:0 2px 4px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px}
.section-header{font-weight:bold;color:var(--primary);font-size:13px;display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid #e2e8f0}
.section-header button{background:#f8fafc;border:1px solid #cbd5e1;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}

/* FILTER */
.filter-row{display:flex;gap:4px}
.filter-row select{padding:7px 6px;border:1px solid #cbd5e1;border-radius:6px;font-size:11px;font-family:inherit;outline:none;flex:1;text-align:center;font-weight:700;background:#fff}

/* ACTION ROW */
.action-row{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:4px}
.action-row span{font-size:11px;font-weight:bold;color:#475569}
.action-btns{display:flex;gap:3px}
.action-btns button{border:none;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-share{background:#dbeafe;color:#1e40af}
.btn-copy{background:#fef3c7;color:#92400e}
.btn-close{background:#64748b;color:#fff}

/* RECORD LIST */
.record-list{max-height:420px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px;padding:5px;background:#fafafa;font-size:11px}
.record-item{padding:8px 6px;border-bottom:1px dotted #e2e8f0;display:flex;gap:6px;background:#fff;margin-bottom:4px;border-radius:5px;border-right:3px solid #94a3b8;align-items:flex-start}
.record-item.news{border-right-color:#059669;background:#f0fdf4}
.record-item.alert{border-right-color:#dc2626;background:#fef2f2}
.record-item.deleted{opacity:.5;background:#f8fafc;border-right-color:#64748b}
.record-item.deleted .line1{text-decoration:line-through}
.record-item.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.record-item .chk{width:15px;height:15px;flex-shrink:0;accent-color:var(--accent);cursor:pointer;margin-top:2px}
.record-item .body{flex:1;min-width:0}
.record-item .line1{font-size:11.5px;font-weight:800;color:#0f172a;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.record-item .line1 .type-tag{font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px}
.record-item .line1 .type-tag.news{background:#d1fae5;color:#059669}
.record-item .line1 .type-tag.alert{background:#fee2e2;color:#dc2626}
.record-item .line1 .auto-tag{font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:6px;background:#fef3c7;color:#92400e}
.record-item .meta{font-size:9.5px;color:#64748b;margin-top:3px;font-weight:600;display:flex;gap:4px;flex-wrap:wrap}
.record-item .meta .tag{background:#f1f5f9;padding:1px 6px;border-radius:3px}
.record-empty{text-align:center;color:#94a3b8;padding:16px;font-size:11px;font-weight:700}

/* STATE */
.state-patti{display:flex;justify-content:space-around;gap:4px;padding:6px 4px;border-radius:6px;background:#f8fafc;border:1px solid #e2e8f0;margin-top:6px}
.state-item{flex:1;text-align:center;padding:4px 2px;border-radius:4px;font-size:9.5px;font-weight:800}
.state-item .val{font-size:14px;font-weight:900;display:block;margin-top:1px}
.state-item:nth-child(1){background:#ecfdf5;color:#059669;border:1px solid #10b981}
.state-item:nth-child(2){background:#fef2f2;color:#dc2626;border:1px solid #ef4444}
.state-item:nth-child(3){background:#eff6ff;color:#2563eb;border:1px solid #3b82f6}

/* QUICK PANEL 180px */
.panel-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:9998;opacity:0;visibility:hidden;transition:.3s}
.panel-overlay.active{opacity:1;visibility:visible}
.quick-panel{position:fixed;top:0;right:0;width:180px;height:100vh;z-index:9999;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:8px 6px;gap:4px;overflow-y:auto;background:transparent}
.quick-panel.active{transform:translateX(0)}
.quick-panel .side-btn{width:100%;padding:10px 12px;background:#2c3e50;color:#fff;border:1px solid #1a252f;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center;text-align:right;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.15s;flex-shrink:0}
.quick-panel .side-btn:hover{background:#34495e;transform:translateX(-2px)}
.quick-panel .side-btn:active{transform:scale(.97)}
.quick-panel .side-btn.del{background:#7f1d1d;border-color:#991b1b}
.quick-panel .side-btn.del:hover{background:#991b1b}
.quick-panel .side-btn.active{background:#10b981;border-color:#059669}
.quick-panel .side-btn .lbl{flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px}
.quick-panel .side-btn .arrow{color:#94a3b8;flex-shrink:0;font-weight:400;font-size:13px}

/* MODAL */
.ns-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:16px}
.ns-modal.active{display:flex}
.ns-modal-box{background:#fff;border-radius:12px;max-width:340px;width:100%}
.ns-modal-h{padding:12px;background:#2563eb;color:#fff;font-size:13px;font-weight:800;border-radius:12px 12px 0 0;text-align:center}
.ns-modal-b{padding:14px;font-size:12px;color:#334155;line-height:1.6;font-weight:600;text-align:center}
.ns-modal-f{display:flex;gap:8px;padding:0 14px 14px}
.ns-modal-f button{flex:1;padding:10px;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}

/* MSG */
.inline-msg{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2e8b57;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:99999;display:none;font-family:inherit}
.inline-msg.show{display:block}
.inline-msg.error{background:#c0392b}

body.dark{background:#0f172a;color:#e2e8f0}
body.dark .section-card{background:#1e293b;border-color:#334155}
body.dark .record-list{background:#0f172a}
body.dark .record-item{background:#1e293b;color:#e2e8f0}
body.dark .record-item.news{background:#064e3b}
body.dark .record-item.alert{background:#7f1d1d}
body.dark .record-item .line1{color:#f1f5f9}
</style>
</head>
<body>

<div class="container">
  <div class="section-card" id="histSection">
    <div class="section-header">
      <span>📜 News/Alert History</span>
      <button onclick="openQuickPanel()">⚙️</button>
    </div>

    <div class="filter-row">
      <select id="filterType" onchange="renderHistory()">
        <option value="all">📰 سب</option>
        <option value="news">📰 News</option>
        <option value="alert">🚨 Alert</option>
      </select>
      <select id="filterDate" onchange="renderHistory()">
        <option value="today">📅 آج</option>
        <option value="yesterday">📅 کل</option>
        <option value="7days">📅 7 دن</option>
        <option value="30days">📅 30 دن</option>
        <option value="all">📅 سب</option>
      </select>
    </div>

    <div class="action-row">
      <span>📋 ریکارڈ: <span id="recCount">0</span></span>
      <div class="action-btns">
        <button class="btn-share" onclick="shareRecords()">📤 Share</button>
        <button class="btn-copy" onclick="copyRecords()">📋 Copy</button>
        <button class="btn-close" onclick="toggleClose('recordList')">⬇️ Close</button>
      </div>
    </div>

    <div class="record-list" id="recordList"></div>

    <div class="state-patti">
      <div class="state-item">📰 News<span class="val" id="stateNews">0</span></div>
      <div class="state-item">🚨 Alert<span class="val" id="stateAlert">0</span></div>
      <div class="state-item">📋 Total<span class="val" id="stateTotal">0</span></div>
    </div>
  </div>
</div>

<!-- QUICK SIDE PANEL -->
<div class="panel-overlay" id="qOverlay" onclick="closeQuickPanel()"></div>
<div class="quick-panel" id="qPanel">
  <button class="side-btn" onclick="toggleSelectMode()" id="selModeBtn"><span class="lbl">☑️ Select</span><span class="arrow">›</span></button>
  <button class="side-btn" onclick="allSelect()"><span class="lbl">✅ All</span><span class="arrow">›</span></button>
  <button class="side-btn" onclick="editSelected()"><span class="lbl">✏️ Edit</span><span class="arrow">›</span></button>
  <button class="side-btn del" onclick="deleteSelected()"><span class="lbl">🗑️ Delete</span><span class="arrow">›</span></button>
  <button class="side-btn del" onclick="deleteAll()"><span class="lbl">❌ Del All</span><span class="arrow">›</span></button>
  <button class="side-btn del" onclick="clearAll()"><span class="lbl">🧹 Clear</span><span class="arrow">›</span></button>
  <button class="side-btn" onclick="moveUp()"><span class="lbl">🔼 Oper</span><span class="arrow">›</span></button>
  <button class="side-btn" onclick="moveDown()"><span class="lbl">🔽 Nichy</span><span class="arrow">›</span></button>
  <button class="side-btn" onclick="setPassword()"><span class="lbl">🔑 Pass</span><span class="arrow">›</span></button>
  <button class="side-btn" onclick="toggleDark()" id="darkBtn"><span class="lbl">🌙 Dark</span><span class="arrow">›</span></button>
  <button class="side-btn" onclick="dashShow()"><span class="lbl">📊 Show</span><span class="arrow">›</span></button>
  <button class="side-btn" onclick="dashHide()"><span class="lbl">📊 Hide</span><span class="arrow">›</span></button>
  <button class="side-btn" onclick="closeSection()"><span class="lbl">⬇️ Close Section</span><span class="arrow">›</span></button>
</div>

<!-- MODAL -->
<div class="ns-modal" id="nsModal">
  <div class="ns-modal-box">
    <div class="ns-modal-h" id="modalTitle">تصدیق</div>
    <div class="ns-modal-b" id="modalBody">—</div>
    <div class="ns-modal-f">
      <button onclick="modalClose()" style="background:#e2e8f0;color:#64748b">✕ بند</button>
      <button onclick="modalConfirm()" style="background:#dc2626;color:#fff">✓ ہاں</button>
    </div>
  </div>
</div>

<div class="inline-msg" id="inlineMsg"></div>

<script>
function $(id){return document.getElementById(id)}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function pad(n){return String(n).padStart(2,'0')}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function yesterdayStr(){var d=new Date(Date.now()-86400000);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function toggleClose(id){var el=$(id);if(el)el.style.display=el.style.display==='none'?'block':'none'}
function showMsg(t,err){var el=$('inlineMsg');el.textContent=t;el.style.background=err?'#c0392b':'#2e8b57';el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},2500)}

/* ============ KEYS — Same as A1 ============ */
var NEWS_KEY='sec10_news_alerts_data';

var selectMode=false,selectedIds={};
var _modalCb=null;

/* ============ MODAL ============ */
function showConfirm(title,body,cb){
  $('modalTitle').textContent=title;
  $('modalBody').textContent=body;
  _modalCb=cb;
  $('nsModal').classList.add('active');
}
function modalClose(){$('nsModal').classList.remove('active');_modalCb=null}
function modalConfirm(){var cb=_modalCb;modalClose();if(cb)cb()}

/* ============ QUICK PANEL ============ */
function openQuickPanel(){
  if(localStorage.getItem('nh_pwd')){
    var p=prompt('🔑 پاس ورڈ:');
    if(p!==localStorage.getItem('nh_pwd')){showMsg('❌ غلط',true);return}
  }
  $('qOverlay').classList.add('active');
  $('qPanel').classList.add('active');
}
function closeQuickPanel(){
  $('qOverlay').classList.remove('active');
  $('qPanel').classList.remove('active');
}

/* ============ FILTER ============ */
function getFiltered(){
  var all=lsGet(NEWS_KEY,[]);
  var fType=$('filterType').value;
  var fDate=$('filterDate').value;
  var today=todayStr();
  var yesterday=yesterdayStr();
  var weekAgo=Date.now()-7*86400000;
  var monthAgo=Date.now()-30*86400000;

  return all.filter(function(r){
    if(fType!=='all' && r.type!==fType)return false;
    if(fDate==='today' && r.date!==today)return false;
    if(fDate==='yesterday' && r.date!==yesterday)return false;
    if(fDate==='7days' && r.timestamp<weekAgo)return false;
    if(fDate==='30days' && r.timestamp<monthAgo)return false;
    return true;
  });
}

/* ============ RENDER ============ */
function renderHistory(){
  var all=lsGet(NEWS_KEY,[]);
  var filtered=getFiltered();
  var box=$('recordList');
  if(!filtered.length){
    box.innerHTML='<div class="record-empty">📭 کوئی ریکارڈ نہیں</div>';
    $('recCount').textContent=0;
    $('stateNews').textContent=0;
    $('stateAlert').textContent=0;
    $('stateTotal').textContent=0;
    return;
  }
  box.innerHTML=filtered.map(function(r,i){
    var chk=selectMode?'<input type="checkbox" class="chk" '+(selectedIds[r.id]?'checked':'')+' onchange="toggleSel('+r.id+')">':'';
    var cls=r.type==='news'?'news':'alert';
    var icon=r.type==='news'?'📰':'🚨';
    var typeLabel=r.type==='news'?'News':'Alert';
    var delCls=r.deleted?' deleted':'';
    var selCls=selectedIds[r.id]?' sel':'';
    var autoTag=r.auto?'<span class="auto-tag">🤖 خودکار</span>':'';
    return '<div class="record-item '+cls+delCls+selCls+'">'+chk+'<div class="body">'
      +'<div class="line1">'
        +'<span>'+(i+1)+'.</span>'
        +'<span class="type-tag '+cls+'">'+icon+' '+typeLabel+'</span>'
        +'<span>'+esc(r.content)+'</span>'
        +autoTag
      +'</div>'
      +'<div class="meta"><span class="tag">📅 '+(r.dateStr||r.date||'')+'</span>'+(r.deleted?'<span class="tag" style="background:#fee2e2;color:#991b1b">🗑️ ڈیلیٹ</span>':'')+'</div>'
      +'</div></div>';
  }).join('');

  var newsCount=filtered.filter(function(r){return r.type==='news'&&!r.deleted}).length;
  var alertCount=filtered.filter(function(r){return r.type==='alert'&&!r.deleted}).length;
  $('recCount').textContent=filtered.length;
  $('stateNews').textContent=newsCount;
  $('stateAlert').textContent=alertCount;
  $('stateTotal').textContent=newsCount+alertCount;
}

/* ============ SELECT MODE ============ */
function toggleSelectMode(){
  selectMode=!selectMode;
  $('selModeBtn').classList.toggle('active',selectMode);
  if(!selectMode)selectedIds={};
  renderHistory();
  showMsg(selectMode?'✅ Select ON':'☑️ OFF');
}
function toggleSel(id){selectedIds[id]=!selectedIds[id];renderHistory()}
function getSelectedIds(){return Object.keys(selectedIds).filter(function(k){return selectedIds[k]})}

function allSelect(){
  if(!selectMode){showMsg('پہلے Select Mode',true);return}
  getFiltered().forEach(function(r){selectedIds[r.id]=true});
  renderHistory();
  showMsg('✅ سب');
}

/* ============ EDIT ============ */
function editSelected(){
  var ids=getSelectedIds();
  if(!ids.length){showMsg('منتخب کریں',true);return}
  if(ids.length>1){showMsg('ایک وقت میں ایک',true);return}
  var items=lsGet(NEWS_KEY,[]);
  var idx=items.findIndex(function(r){return String(r.id)===ids[0]});
  if(idx===-1)return;
  var nn=prompt('نیا متن:',items[idx].content);
  if(nn&&nn.trim()){
    items[idx].content=nn.trim();
    lsSet(NEWS_KEY,items);
    selectedIds={};
    renderHistory();
    showMsg('✅ اپڈیٹ');
  }
}

/* ============ DELETE ============ */
function deleteSelected(){
  var ids=getSelectedIds();
  if(!ids.length){showMsg('منتخب کریں',true);return}
  showConfirm('ڈیلیٹ',ids.length+' ریکارڈ ڈیلیٹ؟',function(){
    var items=lsGet(NEWS_KEY,[]);
    items.forEach(function(r){
      if(ids.indexOf(String(r.id))!==-1){r.deleted=true;r.deletedAt=Date.now()}
    });
    lsSet(NEWS_KEY,items);
    selectedIds={};
    renderHistory();
    showMsg('✅ '+ids.length+' ڈیلیٹ');
  });
}

function deleteAll(){
  var items=getFiltered();
  if(!items.length){showMsg('کوئی ریکارڈ نہیں',true);return}
  showConfirm('سب ڈیلیٹ',items.length+' ریکارڈ ڈیلیٹ؟',function(){
    var ids=items.map(function(r){return String(r.id)});
    var all=lsGet(NEWS_KEY,[]);
    all.forEach(function(r){if(ids.indexOf(String(r.id))!==-1){r.deleted=true;r.deletedAt=Date.now()}});
    lsSet(NEWS_KEY,all);
    selectedIds={};
    renderHistory();
    showMsg('✅ سب ڈیلیٹ');
  });
}

function clearAll(){
  showConfirm('مستقل صاف','تمام ریکارڈ مستقل صاف؟ واپس نہیں!',function(){
    lsSet(NEWS_KEY,[]);
    selectedIds={};
    renderHistory();
    showMsg('🧹 صاف');
  });
}

/* ============ MOVE ============ */
function moveUp(){
  var id=getSelectedIds()[0];
  if(!id){showMsg('منتخب کریں',true);return}
  var items=lsGet(NEWS_KEY,[]);
  var idx=items.findIndex(function(r){return String(r.id)===id});
  if(idx<=0)return;
  var t=items[idx];items[idx]=items[idx-1];items[idx-1]=t;
  lsSet(NEWS_KEY,items);
  selectedIds={};
  renderHistory();
  showMsg('🔼');
}

function moveDown(){
  var id=getSelectedIds()[0];
  if(!id){showMsg('منتخب کریں',true);return}
  var items=lsGet(NEWS_KEY,[]);
  var idx=items.findIndex(function(r){return String(r.id)===id});
  if(idx===-1||idx>=items.length-1)return;
  var t=items[idx];items[idx]=items[idx+1];items[idx+1]=t;
  lsSet(NEWS_KEY,items);
  selectedIds={};
  renderHistory();
  showMsg('🔽');
}

/* ============ PASSWORD / DARK ============ */
function setPassword(){
  var p=prompt('نیا پاس ورڈ (خالی=ہٹائیں):');
  if(p===null)return;
  if(p){localStorage.setItem('nh_pwd',p);showMsg('✅ پاس ورڈ')}
  else{localStorage.removeItem('nh_pwd');showMsg('✅ ہٹا')}
}

function toggleDark(){
  document.body.classList.toggle('dark');
  var on=document.body.classList.contains('dark');
  $('darkBtn').classList.toggle('active',on);
  lsSet('nh_dark',on);
}

/* ============ SHOW/HIDE/SECTION ============ */
function dashShow(){
  $('histSection').style.display='flex';
  showMsg('📊 Show');
}
function dashHide(){
  $('histSection').style.display='none';
  showMsg('📊 Hide');
}
function closeSection(){
  closeQuickPanel();
  $('histSection').style.display='none';
  showMsg('✅ سیکشن بند');
}

/* ============ SHARE / COPY ============ */
function buildReport(){
  var recs=getFiltered();
  var sel=recs.filter(function(r){return selectedIds[r.id]});
  if(sel.length>0)recs=sel;
  var txt='📜 News/Alert History\n';
  txt+='═══════════════════════\n';
  txt+='📅 '+new Date().toLocaleDateString('en-GB')+'\n';
  txt+='═══════════════════════\n\n';
  recs.forEach(function(r,i){
    var icon=r.type==='news'?'📰':'🚨';
    txt+=(i+1)+'. '+icon+' '+r.content+'\n';
    txt+='   📅 '+(r.dateStr||r.date)+' · '+(r.type==='news'?'News':'Alert')+(r.auto?' [خودکار]':'')+'\n\n';
  });
  var newsN=recs.filter(function(r){return r.type==='news'}).length;
  var alertN=recs.filter(function(r){return r.type==='alert'}).length;
  txt+='📊 News: '+newsN+' | Alert: '+alertN+' | Total: '+recs.length;
  return txt;
}

function shareRecords(){
  var txt=buildReport();
  if(navigator.share){
    navigator.share({title:'News/Alert History',text:txt}).catch(function(){});
  } else {
    copyToClipboard(txt);
    showMsg('✅ کاپی ہو گیا');
  }
}

function copyRecords(){
  copyToClipboard(buildReport());
  showMsg('✅ کاپی ہو گیا');
}

function copyToClipboard(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).catch(function(){fallbackCopy(txt)});
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
}

/* ============ INIT ============ */
document.addEventListener('DOMContentLoaded',function(){
  if(lsGet('nh_dark',false)){document.body.classList.add('dark');$('darkBtn').classList.add('active')}
  renderHistory();
});

setInterval(function(){
  if(document.visibilityState==='visible')renderHistory();
},5000);
</script>
</body>
