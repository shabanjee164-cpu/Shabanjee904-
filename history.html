<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ہسٹری</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f6;font-family:system-ui,sans-serif;direction:rtl;padding:12px}
.card{background:#fff;max-width:700px;margin:0 auto 14px;border-radius:14px;padding:14px;border:1px solid #cbd5e1;border-right:5px solid #2563eb;box-shadow:0 8px 18px rgba(0,0,0,.06)}
.card.task{border-right-color:#16a34a}
.card.skip{border-right-color:#dc2626}
.card.duty{border-right-color:#7c3aed}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:2px dashed #e2e8f0;gap:6px}
.card-hd h1{font-size:15px;color:#2563eb}
.card.task .card-hd h1{color:#16a34a;border-color:#bbf7d0}
.card.skip .card-hd h1{color:#dc2626}
.card.duty .card-hd h1{color:#7c3aed}
.ic-btn{background:#f1f5f9;border:1px solid #cbd5e1;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:inherit;opacity:.7}
.filter-row{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;position:relative}
.filter-icon{background:#f0fdf4;border:1px solid #86efac;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:800;color:#15803d;cursor:pointer;font-family:inherit}
.filter-menu{display:none;position:absolute;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:100;min-width:160px;overflow:hidden;top:100%;right:0;margin-top:4px}
.filter-menu.open{display:block}
.filter-menu button{width:100%;text-align:right;padding:10px 14px;font-size:12px;font-weight:700;background:#fff;border:none;cursor:pointer;font-family:inherit;color:#334155}
.filter-menu button.on{background:#16a34a;color:#fff}
.copy-share{display:flex;gap:6px;margin-right:auto}
.copy-share button{background:#f0fdf4;border:1px solid #86efac;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:800;color:#15803d;cursor:pointer;font-family:inherit}
.list{max-height:400px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:10px;padding:6px;background:#fafafa;min-height:80px}
.item{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:6px;font-size:12px;display:flex;gap:8px;align-items:flex-start;border-right:4px solid #2563eb}
.item.news{border-right-color:#2563eb}
.item.alert{border-right-color:#dc2626}
.item.complaint{border-right-color:#ea580c}
.item.done{border-right-color:#16a34a;background:#f0fdf4}
.item.notdone{border-right-color:#dc2626;background:#fef2f2}
.item.skip-item{border-right-color:#64748b;background:#f8fafc}
.item .cb{width:16px;height:16px;accent-color:#2563eb;cursor:pointer;flex-shrink:0;display:none;margin-top:2px}
.item.sel-on .cb{display:inline-block}
.item .info{flex:1;min-width:0}
.item .row1{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.item .member{font-weight:800;color:#1e293b;font-size:13px}
.item .badge{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:800}
.item .badge.news{background:#dbeafe;color:#1e40af}
.item .badge.alert{background:#fee2e2;color:#991b1b}
.item .badge.complaint{background:#ffedd5;color:#9a3412}
.item .badge.daily{background:#dbeafe;color:#1e40af}
.item .badge.occasional{background:#fef3c7;color:#92400e}
.item .st{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:800}
.item .st.done{background:#dcfce7;color:#15803d}
.item .st.notdone{background:#fee2e2;color:#991b1b}
.item .st.skip{background:#f1f5f9;color:#475569}
.item .detail{display:grid;gap:4px;font-size:11px;color:#334155;font-weight:700}
.item .detail .ln{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px dashed #e2e8f0}
.item .detail .ln:last-child{border-bottom:none}
.item .detail .ln .k{color:#64748b}
.item .detail .ln .v{color:#1e293b;font-weight:800}
.item .pts-big{background:#fef9c3;color:#854d0e;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:900;text-align:center;margin-top:6px;border:1px solid #fde047}
.empty{text-align:center;color:#94a3b8;font-size:12px;padding:30px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 4px;text-align:center}
.stat .n{font-size:16px;font-weight:900;color:#2563eb}
.stat .l{font-size:9px;color:#64748b;font-weight:700;margin-top:3px}
.settings-panel{display:none;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:8px;margin-bottom:12px;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:5px}
.settings-panel.open{display:grid}
.settings-panel button{padding:7px 4px;font-size:10px;font-weight:700;border-radius:6px;border:1px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer;font-family:inherit}
.settings-panel button.danger{color:#ef4444;border-color:#fca5a5;background:#fef2f2}
.settings-panel button.active{background:#2563eb;color:#fff;border-color:#2563eb}
</style>
</head>
<body>

<!-- NEWS & ALERTS HISTORY -->
<div class="card">
  <div class="card-hd"><h1>📰 News & Alerts History</h1><button class="ic-btn" onclick="toggleNewsHistSettings()">⚙️</button></div>
  <div class="settings-panel" id="newsHistSettings">
    <button id="nhSelBtn" onclick="nhToggleSel()">☑️ سلیکٹ موڈ</button>
    <button onclick="nhSelectAll(true)">✅ تمام</button>
    <button onclick="nhSelectAll(false)">⬜ ہٹائیں</button>
    <button onclick="nhEditSel()">✏️ ایڈٹ</button>
    <button class="danger" onclick="nhDeleteSel()">🗑️ ڈیلیٹ</button>
    <button class="danger" onclick="nhDeleteAll(this)">❌ سب صاف</button>
    <button onclick="toggleNewsHistSettings()">🚪 بند</button>
  </div>
  <div class="filter-row">
    <button class="filter-icon" onclick="toggleNHFilter(event)">🔍 <span id="nhFilterLabel">سب</span></button>
    <div class="filter-menu" id="nhFilterMenu">
      <button data-f="all" class="on" onclick="setNHFilter('all')">📋 سب</button>
      <button data-f="news" onclick="setNHFilter('news')">📰 News</button>
      <button data-f="alert" onclick="setNHFilter('alert')">🚨 Alert</button>
      <button data-f="complaint" onclick="setNHFilter('complaint')">⏰ Complaint</button>
    </div>
    <div class="copy-share"><button onclick="copyNH()">📋</button><button onclick="shareNHWA()">📱</button></div>
  </div>
  <div class="list" id="nhList"><div class="empty">کوئی ریکارڈ نہیں</div></div>
  <div class="stats">
    <div class="stat"><div class="n" id="nhTotal">0</div><div class="l">📋 کل</div></div>
    <div class="stat"><div class="n" id="nhNews">0</div><div class="l">📰 News</div></div>
    <div class="stat"><div class="n" id="nhAlert">0</div><div class="l">🚨 Alert</div></div>
    <div class="stat"><div class="n" id="nhComp">0</div><div class="l">⏰ Time</div></div>
  </div>
</div>

<!-- DUTY HISTORY -->
<div class="card duty">
  <div class="card-hd"><h1>👮 Duty History</h1><button class="ic-btn" onclick="toggleDutyHistSettings()">⚙️</button></div>
  <div class="settings-panel" id="dutyHistSettings">
    <button id="dhSelBtn" onclick="dhToggleSel()">☑️ سلیکٹ موڈ</button>
    <button onclick="dhSelectAll(true)">✅ تمام</button>
    <button onclick="dhSelectAll(false)">⬜ ہٹائیں</button>
    <button onclick="dhEditSel()">✏️ ایڈٹ</button>
    <button class="danger" onclick="dhDeleteSel()">🗑️ ڈیلیٹ</button>
    <button class="danger" onclick="dhDeleteAll(this)">❌ سب صاف</button>
    <button onclick="toggleDutyHistSettings()">🚪 بند</button>
  </div>
  <div style="background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:8px;margin-bottom:10px;">
    <select id="dhMemberFilter" onchange="renderDutyHist()" style="width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;font-weight:700;font-family:inherit;background:#fff;">
      <option value="">تمام ممبران</option>
    </select>
  </div>
  <div class="copy-share" style="margin-bottom:10px;">
    <button onclick="copyDH()" style="background:#ede9fe;border-color:#c4b5fd;color:#6d28d9;">📋</button>
    <button onclick="shareDHWA()" style="background:#ede9fe;border-color:#c4b5fd;color:#6d28d9;">📱</button>
  </div>
  <div class="list" id="dhList"><div class="empty">کوئی ڈیوٹی نہیں</div></div>
  <div class="stats">
    <div class="stat"><div class="n" id="dhTotal" style="color:#7c3aed;">0</div><div class="l">📋 کل</div></div>
    <div class="stat"><div class="n" id="dhMembers" style="color:#7c3aed;">0</div><div class="l">👥 ممبر</div></div>
    <div class="stat"><div class="n" id="dhAuto" style="color:#16a34a;">0</div><div class="l">🤖 آٹو</div></div>
    <div class="stat"><div class="n" id="dhManual" style="color:#ea580c;">0</div><div class="l">✋ مینوئل</div></div>
  </div>
</div>

<!-- TASK HISTORY -->
<div class="card task">
  <div class="card-hd"><h1>📋 Task History</h1><button class="ic-btn" onclick="toggleTaskHistSettings()">⚙️</button></div>
  <div class="settings-panel" id="taskHistSettings">
    <button id="thSelBtn" onclick="thToggleSel()">☑️ سلیکٹ موڈ</button>
    <button onclick="thSelectAll(true)">✅ تمام</button>
    <button onclick="thSelectAll(false)">⬜ ہٹائیں</button>
    <button onclick="thEditSel()">✏️ ایڈٹ</button>
    <button class="danger" onclick="thDeleteSel()">🗑️ ڈیلیٹ</button>
    <button class="danger" onclick="thDeleteAll(this)">❌ سب صاف</button>
    <button onclick="toggleTaskHistSettings()">🚪 بند</button>
  </div>
  <div class="filter-row">
    <button class="filter-icon" onclick="toggleTHFilter(event)">🔍 <span id="thFilterLabel">سب</span></button>
    <div class="filter-menu" id="thFilterMenu">
      <button data-f="all" class="on" onclick="setTHFilter('all')">📋 سب</button>
      <button data-f="today" onclick="setTHFilter('today')">📅 آج</button>
      <button data-f="done" onclick="setTHFilter('done')">✅ ہو گیا</button>
      <button data-f="notdone" onclick="setTHFilter('notdone')">❌ نہیں ہوا</button>
      <button data-f="skip" onclick="setTHFilter('skip')">⚪ چھوڑا</button>
    </div>
    <div class="copy-share"><button onclick="copyTH()">📋</button><button onclick="shareTHWA()">📱</button></div>
  </div>
  <div style="background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:8px;margin-bottom:10px;">
    <select id="thMemberFilter" onchange="renderTaskHist()" style="width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;font-weight:700;font-family:inherit;background:#fff;">
      <option value="">تمام ممبران</option>
    </select>
  </div>
  <div class="list" id="thList"><div class="empty">کوئی ریکارڈ نہیں</div></div>
  <div class="stats">
    <div class="stat"><div class="n" id="thTotal" style="color:#16a34a;">0</div><div class="l">📋 کل</div></div>
    <div class="stat"><div class="n" id="thDone" style="color:#16a34a;">0</div><div class="l">✅ ہو گیا</div></div>
    <div class="stat"><div class="n" id="thNotDone" style="color:#dc2626;">0</div><div class="l">❌ نہیں ہوا</div></div>
    <div class="stat"><div class="n" id="thPoints" style="color:#f59e0b;">0</div><div class="l">🏆 پوائنٹس</div></div>
  </div>
</div>

<!-- SKIP HISTORY -->
<div class="card skip">
  <div class="card-hd"><h1>⛔ Skip History</h1><button class="ic-btn" onclick="toggleSkipHistSettings()">⚙️</button></div>
  <div class="settings-panel" id="skipHistSettings">
    <button id="shSelBtn" onclick="shToggleSel()">☑️ سلیکٹ موڈ</button>
    <button onclick="shSelectAll(true)">✅ تمام</button>
    <button onclick="shSelectAll(false)">⬜ ہٹائیں</button>
    <button onclick="shEditSel()">✏️ ایڈٹ</button>
    <button class="danger" onclick="shDeleteSel()">🗑️ ڈیلیٹ</button>
    <button class="danger" onclick="shDeleteAll(this)">❌ سب صاف</button>
    <button onclick="toggleSkipHistSettings()">🚪 بند</button>
  </div>
  <div class="filter-row">
    <button class="filter-icon" onclick="toggleSHFilter(event)" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">🔍 <span id="shFilterLabel">سب</span></button>
    <div class="filter-menu" id="shFilterMenu">
      <button data-f="all" class="on" onclick="setSHFilter('all')">📋 سب</button>
      <button data-f="today" onclick="setSHFilter('today')">📅 آج</button>
      <button data-f="pending" onclick="setSHFilter('pending')">⏳ وجہ نہیں</button>
      <button data-f="done" onclick="setSHFilter('done')">✅ وجہ دی</button>
    </div>
    <div class="copy-share"><button onclick="copySH()" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">📋</button><button onclick="shareSHWA()" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">📱</button></div>
  </div>
  <div class="list" id="shList"><div class="empty">کوئی ریکارڈ نہیں</div></div>
  <div class="stats">
    <div class="stat"><div class="n" id="shTotal" style="color:#dc2626;">0</div><div class="l">📋 کل</div></div>
    <div class="stat"><div class="n" id="shPending" style="color:#ea580c;">0</div><div class="l">⏳ وجہ نہیں</div></div>
    <div class="stat"><div class="n" id="shDone" style="color:#16a34a;">0</div><div class="l">✅ وجہ دی</div></div>
    <div class="stat"><div class="n" id="shSenior" style="color:#7c3aed;">0</div><div class="l">🟢 سینئر</div></div>
  </div>
</div>

<script>
var NEWS_KEY='sec10_news_alerts_data';
var DUTY_HIST_KEY='sec4_duty_history_data_v4';
var REC_KEY='sec12_task_records';
var SKIP_KEY='sec4_duty_skipped_data';
var DUTY_KEY='sec4_duty_manager_data_v4';

function $(id){return document.getElementById(id);}
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function pad(n){return String(n).padStart(2,'0');}
function fmtDT(ts){var d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
document.addEventListener('click',function(){
  ['nhFilterMenu','dhFilterMenu','thFilterMenu','shFilterMenu'].forEach(function(id){
    var el=$(id);if(el) el.classList.remove('open');
  });
});

/* NEWS HISTORY */
var nhFilter='all', nhSelMode=false, nhSelected={}, nhDelP=false, nhOpen=false;
window.toggleNewsHistSettings=function(){nhOpen=!nhOpen;$('newsHistSettings').classList.toggle('open',nhOpen);};
window.toggleNHFilter=function(e){e.stopPropagation();$('nhFilterMenu').classList.toggle('open');};
window.setNHFilter=function(f){nhFilter=f;document.querySelectorAll('#nhFilterMenu button').forEach(function(b){b.classList.toggle('on',b.dataset.f===f);});var L={all:'سب',news:'News',alert:'Alert',complaint:'Complaint'};$('nhFilterLabel').textContent=L[f]||'سب';$('nhFilterMenu').classList.remove('open');renderNH();};
window.nhToggleSel=function(){nhSelMode=!nhSelMode;var b=$('nhSelBtn');if(b){b.textContent=nhSelMode?'✅ سلیکٹ آن':'☑️ سلیکٹ موڈ';b.classList.toggle('active',nhSelMode);}if(!nhSelMode) nhSelected={};renderNH();};
window.nhSelectAll=function(st){if(st&&!nhSelMode) nhToggleSel();nhSelected={};if(st) ls(NEWS_KEY,[]).forEach(function(x){nhSelected[x.id]=true;});renderNH();};
window.nhEditSel=function(){
  var ids=Object.keys(nhSelected).filter(function(k){return nhSelected[k];});
  if(ids.length!==1){alert('ایک منتخب کریں');return;}
  var id=parseInt(ids[0],10),items=ls(NEWS_KEY,[]);
  var rec=items.find(function(x){return x.id===id;});if(!rec) return;
  var nv=prompt('نیا متن:',rec.content);if(nv===null) return;
  rec.content=nv.trim();lss(NEWS_KEY,items);nhSelected={};renderNH();
};
window.nhDeleteSel=function(){
  var ids=Object.keys(nhSelected).filter(function(k){return nhSelected[k];});
  if(!ids.length){alert('کچھ منتخب کریں');return;}
  if(!confirm(ids.length+' ڈیلیٹ کریں؟')) return;
  lss(NEWS_KEY,ls(NEWS_KEY,[]).filter(function(x){return ids.indexOf(String(x.id))===-1;}));
  nhSelected={};renderNH();
};
window.nhDeleteAll=function(btn){
  if(!nhDelP){nhDelP=true;btn.textContent='⚠️ دوبارہ';btn.style.background='#dc2626';btn.style.color='#fff';
    setTimeout(function(){nhDelP=false;btn.textContent='❌ سب صاف';btn.style.background='';btn.style.color='';},2500);return;}
  lss(NEWS_KEY,[]);nhSelected={};nhDelP=false;btn.textContent='❌ سب صاف';btn.style.background='';btn.style.color='';renderNH();
};
function nhFiltered(){
  var items=ls(NEWS_KEY,[]);if(!Array.isArray(items)) items=[];
  if(nhFilter==='all') return items;
  return items.filter(function(x){return x.type===nhFilter;});
}
function renderNH(){
  var all=ls(NEWS_KEY,[]);if(!Array.isArray(all)) all=[];
  $('nhTotal').textContent=all.length;
  $('nhNews').textContent=all.filter(function(x){return x.type==='news';}).length;
  $('nhAlert').textContent=all.filter(function(x){return x.type==='alert';}).length;
  $('nhComp').textContent=all.filter(function(x){return x.type==='complaint';}).length;
  var list=nhFiltered();
  var box=$('nhList');
  if(!list.length){box.innerHTML='<div class="empty">کوئی ریکارڈ نہیں</div>';return;}
  box.innerHTML=list.map(function(x){
    var isSel=!!nhSelected[x.id];
    var label=x.type==='news'?'📰 News':(x.type==='alert'?'🚨 Alert':'⏰ Complaint');
    var tb=(x.type==='complaint'&&x.fireTime)?' <span class="badge complaint">⏰ '+esc(x.fireTime)+'</span>':'';
    var cb=nhSelMode?'<input type="checkbox" class="cb" '+(isSel?'checked':'')+' onchange="nhToggleOne('+x.id+')">':'';
    return '<div class="item '+x.type+(nhSelMode?' sel-on':'')+'" style="'+(isSel?'background:#fef3c7;':'')+'">'+cb+'<div class="info"><div class="row1"><span class="badge '+x.type+'">'+label+'</span>'+tb+'<span style="font-size:10px;color:#64748b;">'+fmtDT(x.timestamp)+'</span></div><div style="font-weight:800;color:#1e293b;">'+esc(x.content)+'</div></div></div>';
  }).join('');
}
window.nhToggleOne=function(id){if(nhSelected[id]) delete nhSelected[id];else nhSelected[id]=true;renderNH();};
window.copyNH=function(){
  var list=nhFiltered();
  var lines=['📰 News & Alerts History','━━━━━━━━━━━━━━━━━━'];
  list.slice(0,50).forEach(function(x){
    var lbl=x.type==='news'?'📰':(x.type==='alert'?'🚨':'⏰');
    lines.push(lbl+' '+x.content);
    lines.push('   '+fmtDT(x.timestamp));
  });
  lines.push('━━━━━━━━━━━━━━━━━━');lines.push('کل: '+list.length);
  copyTxt(lines.join('\n'));
};
window.shareNHWA=function(){
  var list=nhFiltered();
  var lines=['📰 News & Alerts History','━━━━━━━━━━━━━━━━━━'];
  list.slice(0,50).forEach(function(x){
    var lbl=x.type==='news'?'📰':(x.type==='alert'?'🚨':'⏰');
    lines.push(lbl+' '+x.content);
  });
  lines.push('━━━━━━━━━━━━━━━━━━');
  window.open('https://wa.me/?text='+encodeURIComponent(lines.join('\n')),'_blank');
};

/* DUTY HISTORY */
var dhSelMode=false, dhSelected={}, dhDelP=false, dhOpen=false, dhReversed=[];
window.toggleDutyHistSettings=function(){dhOpen=!dhOpen;$('dutyHistSettings').classList.toggle('open',dhOpen);};
window.dhToggleSel=function(){dhSelMode=!dhSelMode;var b=$('dhSelBtn');if(b){b.textContent=dhSelMode?'✅ سلیکٹ آن':'☑️ سلیکٹ موڈ';b.classList.toggle('active',dhSelMode);}if(!dhSelMode) dhSelected={};renderDutyHist();};
window.dhSelectAll=function(st){if(st&&!dhSelMode) dhToggleSel();dhSelected={};if(st) dhReversed.forEach(function(x,i){dhSelected[i]=true;});renderDutyHist();};
window.dhEditSel=function(){
  var ids=Object.keys(dhSelected).filter(function(k){return dhSelected[k];});
  if(ids.length!==1){alert('ایک منتخب کریں');return;}
  var i=parseInt(ids[0],10);
  var r=dhReversed[i];if(!r) return;
  var nv=prompt('نیا نام:',r.name);if(nv===null) return;
  var all=ls(DUTY_HIST_KEY,[]);
  var origIdx=all.length-1-i;
  if(all[origIdx]) all[origIdx].name=nv.trim();
  lss(DUTY_HIST_KEY,all);dhSelected={};renderDutyHist();
};
window.dhDeleteSel=function(){
  var ids=Object.keys(dhSelected).filter(function(k){return dhSelected[k];});
  if(!ids.length){alert('کچھ منتخب کریں');return;}
  if(!confirm(ids.length+' ڈیلیٹ کریں؟')) return;
  var all=ls(DUTY_HIST_KEY,[]);
  var rem=[];
  ids.forEach(function(id){rem.push(all.length-1-parseInt(id,10));});
  lss(DUTY_HIST_KEY,all.filter(function(x,i){return rem.indexOf(i)===-1;}));
  dhSelected={};renderDutyHist();
};
window.dhDeleteAll=function(btn){
  if(!dhDelP){dhDelP=true;btn.textContent='⚠️ دوبارہ';btn.style.background='#dc2626';btn.style.color='#fff';
    setTimeout(function(){dhDelP=false;btn.textContent='❌ سب صاف';btn.style.background='';btn.style.color='';},2500);return;}
  lss(DUTY_HIST_KEY,[]);dhSelected={};dhDelP=false;btn.textContent='❌ سب صاف';btn.style.background='';btn.style.color='';renderDutyHist();
};
window.dhToggleOne=function(i){if(dhSelected[i]) delete dhSelected[i];else dhSelected[i]=true;renderDutyHist();};
function renderDutyHist(){
  var all=ls(DUTY_HIST_KEY,[]);if(!Array.isArray(all)) all=[];
  dhReversed=all.slice().reverse().slice(0,50);
  $('dhTotal').textContent=all.length;
  var uniq={};all.forEach(function(x){uniq[x.name]=true;});
  $('dhMembers').textContent=Object.keys(uniq).length;
  $('dhAuto').textContent=all.filter(function(x){return x.reason==='auto';}).length;
  $('dhManual').textContent=all.filter(function(x){return x.reason==='manual';}).length;
  var mf=$('dhMemberFilter');
  if(mf){
    var cur=mf.value;
    mf.innerHTML='<option value="">تمام ممبران</option>';
    var names={};all.forEach(function(x){names[x.name]=true;});
    Object.keys(names).forEach(function(n){mf.appendChild(new Option(n,n));});
    if(cur) mf.value=cur;
  }
  var fname=mf?mf.value:'';
  var list=dhReversed;
  if(fname) list=list.filter(function(x){return x.name===fname;});
  var box=$('dhList');
  if(!list.length){box.innerHTML='<div class="empty">کوئی ڈیوٹی نہیں</div>';return;}
  box.innerHTML=list.map(function(x,i){
    var isSel=!!dhSelected[i];
    var rCls=x.reason==='auto'?'auto':(x.reason==='leave'?'leave':'manual');
    var rTxt=x.reason==='auto'?'آٹو':(x.reason==='leave'?'چھٹی':'مینوئل');
    var cb=dhSelMode?'<input type="checkbox" class="cb" '+(isSel?'checked':'')+' onchange="dhToggleOne('+i+')">':'';
    return '<div class="item duty'+(dhSelMode?' sel-on':'')+'" style="'+(isSel?'background:#fef3c7;':'')+'">'+cb+'<div class="info"><div class="row1"><span class="member">👤 '+esc(x.name)+'</span><span class="badge daily">'+(x.rank==='Senior'?'🟢 سینئر':'🔵 جونیئر')+'</span></div><div style="font-size:11px;font-weight:700;">⏱️ '+esc(x.start)+' → '+esc(x.end)+' <span class="st skip">'+rTxt+'</span></div></div></div>';
  }).join('');
}
window.copyDH=function(){
  var all=ls(DUTY_HIST_KEY,[]);if(!Array.isArray(all)) all=[];
  var lines=['👮 Duty History','━━━━━━━━━━━━━━━━━━'];
  all.slice().reverse().slice(0,50).forEach(function(x){
    lines.push('👤 '+x.name+' ('+(x.rank==='Senior'?'سینئر':'جونیئر')+')');
    lines.push('   '+x.start+' → '+x.end+' ('+x.reason+')');
  });
  lines.push('━━━━━━━━━━━━━━━━━━');lines.push('کل: '+all.length);
  copyTxt(lines.join('\n'));
};
window.shareDHWA=function(){
  var all=ls(DUTY_HIST_KEY,[]);if(!Array.isArray(all)) all=[];

/* TASK HISTORY */
var thFilter='all', thSelMode=false, thSelected={}, thDelP=false, thOpen=false;
function getRecs(){var r=ls(REC_KEY,[]);return Array.isArray(r)?r:[];}
function saveRecs(r){lss(REC_KEY,r);}
window.toggleTaskHistSettings=function(){thOpen=!thOpen;$('taskHistSettings').classList.toggle('open',thOpen);};
window.toggleTHFilter=function(e){e.stopPropagation();$('thFilterMenu').classList.toggle('open');};
window.setTHFilter=function(f){thFilter=f;document.querySelectorAll('#thFilterMenu button').forEach(function(b){b.classList.toggle('on',b.dataset.f===f);});var L={all:'سب',today:'آج',done:'ہو گیا',notdone:'نہیں ہوا',skip:'چھوڑا'};$('thFilterLabel').textContent=L[f]||'سب';$('thFilterMenu').classList.remove('open');renderTaskHist();};
window.thToggleSel=function(){thSelMode=!thSelMode;var b=$('thSelBtn');if(b){b.textContent=thSelMode?'✅ سلیکٹ آن':'☑️ سلیکٹ موڈ';b.classList.toggle('active',thSelMode);}if(!thSelMode) thSelected={};renderTaskHist();};
window.thSelectAll=function(st){if(st&&!thSelMode) thToggleSel();thSelected={};if(st) thFiltered().forEach(function(x){thSelected[x.id]=true;});renderTaskHist();};
window.thEditSel=function(){
  var ids=Object.keys(thSelected).filter(function(k){return thSelected[k];});
  if(ids.length!==1){alert('ایک منتخب کریں');return;}
  var id=parseInt(ids[0],10),r=getRecs();
  var rec=r.find(function(x){return x.id===id;});if(!rec) return;
  var nv=prompt('نیا کام:',rec.task);if(nv===null) return;
  rec.task=nv.trim();saveRecs(r);thSelected={};renderTaskHist();
};
window.thDeleteSel=function(){
  var ids=Object.keys(thSelected).filter(function(k){return thSelected[k];});
  if(!ids.length){alert('کچھ منتخب کریں');return;}
  if(!confirm(ids.length+' ڈیلیٹ کریں؟')) return;
  saveRecs(getRecs().filter(function(x){return ids.indexOf(String(x.id))===-1;}));
  thSelected={};renderTaskHist();
};
window.thDeleteAll=function(btn){
  if(!thDelP){thDelP=true;btn.textContent='⚠️ دوبارہ';btn.style.background='#dc2626';btn.style.color='#fff';
    setTimeout(function(){thDelP=false;btn.textContent='❌ سب صاف';btn.style.background='';btn.style.color='';},2500);return;}
  saveRecs([]);thSelected={};thDelP=false;btn.textContent='❌ سب صاف';btn.style.background='';btn.style.color='';renderTaskHist();
};
window.thToggleOne=function(id){if(thSelected[id]) delete thSelected[id];else thSelected[id]=true;renderTaskHist();};
function thFiltered(){
  var r=getRecs();
  var mf=$('thMemberFilter');
  var mn=mf?mf.value:'';
  if(mn) r=r.filter(function(x){return x.member===mn;});
  if(thFilter==='today'){
    var d=new Date();
    var today=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
    r=r.filter(function(x){return x.dateStr===today;});
  } else if(thFilter==='done') r=r.filter(function(x){return x.status==='done';});
  else if(thFilter==='notdone') r=r.filter(function(x){return x.status==='notdone';});
  else if(thFilter==='skip') r=r.filter(function(x){return x.status==='skip';});
  return r;
}
function renderTaskHist(){
  var all=getRecs();
  var list=thFiltered();
  $('thTotal').textContent=list.length;
  $('thDone').textContent=list.filter(function(x){return x.status==='done';}).length;
  $('thNotDone').textContent=list.filter(function(x){return x.status==='notdone';}).length;
  var pts=0;list.forEach(function(x){pts+=(x.points||0);});
  $('thPoints').textContent=pts;
  var mf=$('thMemberFilter');
  if(mf){
    var cur=mf.value;
    mf.innerHTML='<option value="">تمام ممبران</option>';
    var names={};all.forEach(function(x){names[x.member]=true;});
    Object.keys(names).forEach(function(n){mf.appendChild(new Option(n,n));});
    if(cur) mf.value=cur;
  }
  var box=$('thList');
  if(!list.length){box.innerHTML='<div class="empty">کوئی ریکارڈ نہیں</div>';return;}
  var memberTotals={};
  list.forEach(function(r){
    if(!memberTotals[r.member]) memberTotals[r.member]=0;
    memberTotals[r.member]+=(r.points||0);
  });
  box.innerHTML=list.map(function(r){
    var isSel=!!thSelected[r.id];
    var stLbl=r.status==='done'?'✅ ہو گیا':(r.status==='notdone'?'❌ نہیں ہوا':'⚪ چھوڑا');
    var stCls=r.status==='done'?'done':(r.status==='notdone'?'notdone':'skip');
    var typeLbl=r.type==='Daily'?'📅 روزانہ':'⭐ کبھی کبھی';
    var typeCls=r.type==='Daily'?'daily':'occasional';
    var cb=thSelMode?'<input type="checkbox" class="cb" '+(isSel?'checked':'')+' onchange="thToggleOne('+r.id+')">':'';
    return '<div class="item '+stCls+(thSelMode?' sel-on':'')+'" style="'+(isSel?'background:#fef3c7;':'')+'">'+cb+'<div class="info"><div class="row1"><span class="member">👤 '+esc(r.member)+'</span><span class="badge '+typeCls+'">'+typeLbl+'</span><span class="st '+stCls+'">'+stLbl+'</span></div><div class="detail"><div class="ln"><span class="k">📌 کام:</span><span class="v">'+esc(r.task)+'</span></div><div class="ln"><span class="k">🏆 پوائنٹ:</span><span class="v">'+(r.points||0)+'</span></div><div class="ln"><span class="k">📅 تاریخ:</span><span class="v">'+esc(r.dateStr)+' '+esc(r.timeStr)+'</span></div></div><div class="pts-big">🏆 '+(memberTotals[r.member]||0)+' پوائنٹس ('+esc(r.member)+')</div></div></div>';
  }).join('');
}
window.copyTH=function(){
  var list=thFiltered();
  var lines=['📋 Task History','━━━━━━━━━━━━━━━━━━'];
  list.slice(0,50).forEach(function(r){
    var st=r.status==='done'?'✅':(r.status==='notdone'?'❌':'⚪');
    lines.push(st+' '+r.member+' — '+r.task+' ('+(r.points||0)+')');
    lines.push('   '+r.dateStr+' '+r.timeStr);
  });
  lines.push('━━━━━━━━━━━━━━━━━━');
  var pts=0;list.forEach(function(r){pts+=(r.points||0);});
  lines.push('کل: '+list.length+' | پوائنٹس: '+pts);
  copyTxt(lines.join('\n'));
};
window.shareTHWA=function(){
  var list=thFiltered();
  var lines=['📋 Task History','━━━━━━━━━━━━━━━━━━'];
  list.slice(0,50).forEach(function(r){
    var st=r.status==='done'?'✅':(r.status==='notdone'?'❌':'⚪');
    lines.push(st+' '+r.member+' — '+r.task+' ('+(r.points||0)+')');
  });
  lines.push('━━━━━━━━━━━━━━━━━━');
  window.open('https://wa.me/?text='+encodeURIComponent(lines.join('\n')),'_blank');
};

/* SKIP HISTORY */
var shFilter='all', shSelMode=false, shSelected={}, shDelP=false, shOpen=false;
window.toggleSkipHistSettings=function(){shOpen=!shOpen;$('skipHistSettings').classList.toggle('open',shOpen);};
window.toggleSHFilter=function(e){e.stopPropagation();$('shFilterMenu').classList.toggle('open');};
window.setSHFilter=function(f){shFilter=f;document.querySelectorAll('#shFilterMenu button').forEach(function(b){b.classList.toggle('on',b.dataset.f===f);});var L={all:'سب',today:'آج',pending:'وجہ نہیں',done:'وجہ دی'};$('shFilterLabel').textContent=L[f]||'سب';$('shFilterMenu').classList.remove('open');renderSH();};
window.shToggleSel=function(){shSelMode=!shSelMode;var b=$('shSelBtn');if(b){b.textContent=shSelMode?'✅ سلیکٹ آن':'☑️ سلیکٹ موڈ';b.classList.toggle('active',shSelMode);}if(!shSelMode) shSelected={};renderSH();};
window.shSelectAll=function(st){if(st&&!shSelMode) shToggleSel();shSelected={};if(st) shFiltered().forEach(function(x){shSelected[x.id]=true;});renderSH();};
window.shEditSel=function(){
  var ids=Object.keys(shSelected).filter(function(k){return shSelected[k];});
  if(ids.length!==1){alert('ایک منتخب کریں');return;}
  var id=parseInt(ids[0],10),s=ls(SKIP_KEY,[]);
  var r=s.find(function(x){return x.id===id;});if(!r) return;
  var nv=prompt('نئی وجہ:',r.reason||'');if(nv===null) return;
  r.reason=nv.trim();r.hasReason=!!nv.trim();lss(SKIP_KEY,s);shSelected={};renderSH();
};
window.shDeleteSel=function(){
  var ids=Object.keys(shSelected).filter(function(k){return shSelected[k];});
  if(!ids.length){alert('کچھ منتخب کریں');return;}
  if(!confirm(ids.length+' ڈیلیٹ کریں؟')) return;
  lss(SKIP_KEY,ls(SKIP_KEY,[]).filter(function(x){return ids.indexOf(String(x.id))===-1;}));
  shSelected={};renderSH();
};
window.shDeleteAll=function(btn){
  if(!shDelP){shDelP=true;btn.textContent='⚠️ دوبارہ';btn.style.background='#dc2626';btn.style.color='#fff';
    setTimeout(function(){shDelP=false;btn.textContent='❌ سب صاف';btn.style.background='';btn.style.color='';},2500);return;}
  lss(SKIP_KEY,[]);shSelected={};shDelP=false;btn.textContent='❌ سب صاف';btn.style.background='';btn.style.color='';renderSH();
};
window.shToggleOne=function(id){if(shSelected[id]) delete shSelected[id];else shSelected[id]=true;renderSH();};
function getMemberRank(name){
  var m=ls(DUTY_KEY,[]);var f=m.find(function(x){return x.name===name;});
  return f?f.rank:'Junior';
}
function shFiltered(){
  var s=ls(SKIP_KEY,[]);if(!Array.isArray(s)) s=[];
  if(shFilter==='today'){
    var d=new Date();var tp=pad(d.getDate())+'/'+pad(d.getMonth()+1);
    s=s.filter(function(x){var t=new Date(x.timestamp);return (pad(t.getDate())+'/'+pad(t.getMonth()+1))===tp;});
  } else if(shFilter==='pending') s=s.filter(function(x){return !x.hasReason;});
  else if(shFilter==='done') s=s.filter(function(x){return x.hasReason;});
  return s;
}
function renderSH(){
  var all=ls(SKIP_KEY,[]);if(!Array.isArray(all)) all=[];
  var list=shFiltered();
  $('shTotal').textContent=list.length;
  $('shPending').textContent=list.filter(function(x){return !x.hasReason;}).length;
  $('shDone').textContent=list.filter(function(x){return x.hasReason;}).length;
  $('shSenior').textContent=list.filter(function(x){return getMemberRank(x.member)==='Senior';}).length;
  var box=$('shList');
  if(!list.length){box.innerHTML='<div class="empty">کوئی ریکارڈ نہیں</div>';return;}
  box.innerHTML=list.map(function(x){
    var isSel=!!shSelected[x.id];
    var rank=getMemberRank(x.member);
    var stLbl=x.hasReason?'✅ وجہ دی':'⏳ وجہ نہیں';
    var stCls=x.hasReason?'done':'notdone';
    var cb=shSelMode?'<input type="checkbox" class="cb" '+(isSel?'checked':'')+' onchange="shToggleOne('+x.id+')">':'';
    return '<div class="item skip-item '+stCls+(shSelMode?' sel-on':'')+'" style="'+(isSel?'background:#fef3c7;':'')+'">'+cb+'<div class="info"><div class="row1"><span class="member">👤 '+esc(x.member)+'</span><span class="badge '+(rank==='Senior'?'daily':'occasional')+'">'+(rank==='Senior'?'🟢 سینئر':'🔵 جونیئر')+'</span><span class="st '+stCls+'">'+stLbl+'</span></div><div class="detail"><div class="ln"><span class="k">📌 کام:</span><span class="v">'+esc(x.task)+'</span></div><div class="ln"><span class="k">📝 وجہ:</span><span class="v">'+(x.reason?esc(x.reason):'—')+'</span></div><div class="ln"><span class="k">📅:</span><span class="v">'+fmtDT(x.timestamp)+'</span></div></div></div></div>';
  }).join('');
}
window.copySH=function(){
  var list=shFiltered();
  var lines=['⛔ Skip History','━━━━━━━━━━━━━━━━━━'];
  list.slice(0,50).forEach(function(x){
    var st=x.hasReason?'✅':'⏳';
    lines.push(st+' '+x.member+' — '+x.task);
    if(x.reason) lines.push('   وجہ: '+x.reason);
  });
  lines.push('━━━━━━━━━━━━━━━━━━');lines.push('کل: '+list.length);
  copyTxt(lines.join('\n'));
};
window.shareSHWA=function(){
  var list=shFiltered();
  var lines=['⛔ Skip History','━━━━━━━━━━━━━━━━━━'];
  list.slice(0,50).forEach(function(x){
    var st=x.hasReason?'✅':'⏳';
    lines.push(st+' '+x.member+' — '+x.task);
    if(x.reason) lines.push('   وجہ: '+x.reason);
  });
  lines.push('━━━━━━━━━━━━━━━━━━');
  window.open('https://wa.me/?text='+encodeURIComponent(lines.join('\n')),'_blank');
};

function copyTxt(txt){
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){alert('✅ کاپی');});}
  else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('✅ کاپی');}
}

function boot(){
  renderNH();renderDutyHist();renderTaskHist();renderSH();
  setInterval(function(){renderNH();renderDutyHist();renderTaskHist();renderSH();},2500);
  window.addEventListener('storage',function(e){
    if(e.key===NEWS_KEY) renderNH();
    if(e.key===DUTY_HIST_KEY) renderDutyHist();
    if(e.key===REC_KEY) renderTaskHist();
    if(e.key===SKIP_KEY) renderSH();
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
</script>
