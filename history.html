<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History - Records</title>
<style>
:root{--primary:#1e293b;--accent:#2563eb;--success:#10b981;--danger:#ef4444;--golden:#d97706;--bg:#eef2f6;--card:#fff;--border:#e2e8f0;--text:#334155;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:system-ui,sans-serif;padding:12px;direction:rtl;color:var(--text);display:flex;justify-content:center;padding-bottom:80px;}
.container{width:100%;max-width:600px;display:flex;flex-direction:column;gap:14px;}

/* Card Base */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.05);position:relative;overflow:hidden;}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:2px dashed #f1f5f9;}
.card-title{font-size:15px;font-weight:800;color:var(--primary);display:flex;align-items:center;gap:6px;}
.card-btns{display:flex;gap:6px;}
.card-btns button{background:#f8fafc;border:1px solid #cbd5e1;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.card-btns button:hover{background:#e2e8f0;}

/* Hidden Settings */
.settings-panel{display:none;position:absolute;top:50px;left:10px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:6px;box-shadow:0 8px 20px rgba(0,0,0,.15);z-index:100;min-width:160px;}
.settings-panel.open{display:block;}
.settings-panel button{display:block;width:100%;padding:8px;font-size:11px;font-weight:700;border:none;border-radius:6px;cursor:pointer;text-align:right;margin-bottom:4px;background:#f8fafc;color:#334155;font-family:inherit;}
.settings-panel button:hover{background:#e2e8f0;}
.settings-panel button.del{color:var(--danger);}

/* Filter Row */
.filter-row{display:flex;gap:6px;margin-bottom:10px;align-items:center;background:#f8fafc;padding:8px;border-radius:8px;border:1px solid #e2e8f0;flex-wrap:wrap;}
.filter-row select{flex:1;padding:8px;border:1px solid #cbd5e1;border-radius:6px;font-size:11px;font-weight:700;outline:none;min-width:80px;}
.filter-row button{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:800;cursor:pointer;}
.filter-row button.green{background:#f0fdf4;color:#16a34a;border-color:#86efac;}
.filter-row button.orange{background:#fff7ed;color:#ea580c;border-color:#fdba74;}

/* List */
.list-box{max-height:300px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:6px;background:#fafafa;}
.list-item{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:10px;margin-bottom:6px;font-size:12px;font-weight:700;}
.list-item .name{font-size:14px;font-weight:900;color:var(--primary);margin-bottom:4px;}
.list-item .detail{font-size:11px;color:#475569;margin-bottom:2px;}
.list-item .date{font-size:10px;color:#94a3b8;margin-top:4px;}

/* Percentage Box */
.percent-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.p-box{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px;text-align:center;}
.p-box .lbl{font-size:10px;font-weight:700;color:#64748b;margin-bottom:2px;}
.p-box .val{font-size:16px;font-weight:900;}
.p-box.good .val{color:var(--success);}
.p-box.junk .val{color:var(--danger);}
.p-box.total .val{color:var(--golden);}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;padding:10px;z-index:1000;}
.nav-item{text-decoration:none;color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:5px;width:23%;}
.nav-item.active{color:var(--accent);}
.nav-icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>

<div class="container">

    <!-- 1. DUTY HISTORY -->
    <div class="card">
        <div class="card-head"><div class="card-title">👮 ڈیوٹی ہسٹری</div><div class="card-btns"><button onclick="toggleSettings('dutySettings')" style="opacity:0.1;">⚙️</button><button onclick="toggleBody('dutyBody')">⬇️</button></div></div>

    <!-- 2. TASK HISTORY -->
    <div class="card">

        <div class="settings-panel" id="taskSettings"><button onclick="alert('ایڈٹ')">✏️ Edit</button><button class="del" onclick="alert('ڈیلیٹ')">🗑️ Delete</button><button class="del" onclick="alert('صاف')">🧹 Clear</button></div>
        <div id="taskBody">
            <div class="filter-row">

                <select id="taskFilterTime"><option value="all">تمام وقت</option><option value="today">آج</option><option value="week">7 دن</option><option value="month">30 دن</option></select>
                <button onclick="copyTaskHistory()">📋</button>

    <!-- 3. SKIP HISTORY -->
    <div class="card">

        <div class="settings-panel" id="skipSettings"><button onclick="alert('ایڈٹ')">✏️ Edit</button><button class="del" onclick="alert('ڈیلیٹ')">🗑️ Delete</button><button class="del" onclick="alert('صاف')">🧹 Clear</button></div>
        <div id="skipBody">
            <div class="filter-row">
                <select id="skipFilterMember"><option value="all">تمام ممبران</option></select>
                <select id="skipFilterTime"><option value="all">تمام وقت</option><option value="today">آج</option><option value="week">7 دن</option><option value="month">30 دن</option></select>
                <button onclick="copySkipHistory()">📋</button>
                <button class="green" onclick="shareSkipHistory()">📱</button>
            </div>
            <div class="list-box" id="skipHistoryList"></div>
        </div>
    </div>

    <!-- 4. NEWS & ALERT HISTORY -->
    <div class="card">
        <div class="card-head"><div class="card-title">📰 نیوز اور الرٹ ہسٹری</div><div class="card-btns"><button onclick="toggleSettings('newsSettings')" style="opacity:0.1;">⚙️</button><button onclick="toggleBody('newsBody')">⬇️</button></div></div>
        <div class="settings-panel" id="newsSettings"><button onclick="alert('ایڈٹ')">✏️ Edit</button><button class="del" onclick="alert('ڈیلیٹ')">🗑️ Delete</button><button class="del" onclick="alert('صاف')">🧹 Clear</button></div>
        <div id="newsBody">
            <div class="filter-row">
                <select id="newsFilterType"><option value="all">تمام</option><option value="news">📰 News</option><option value="alert">🚨 Alert</option><option value="complaint">⏰ Time</option></select>
                <button onclick="copyNewsHistory()">📋</button>
                <button class="green" onclick="shareNewsHistory()">📱</button>
            </div>
            <div class="list-box" id="newsHistoryList"></div>
        </div>
    </div>

    <!-- 5. ALAMAT HISTORY -->
    <div class="card">
        <div class="card-head"><div class="card-title">🩺 علامات ہسٹری</div><div class="card-btns"><button onclick="toggleSettings('alamatSettings')" style="opacity:0.1;">⚙️</button><button onclick="toggleBody('alamatBody')">⬇️</button></div></div>
        <div class="settings-panel" id="alamatSettings"><button onclick="alert('ایڈٹ')">✏️ Edit</button><button class="del" onclick="alert('ڈیلیٹ')">🗑️ Delete</button><button class="del" onclick="alert('صاف')">🧹 Clear</button></div>
        <div id="alamatBody">

            <div class="percent-grid">

                <div class="p-box junk"><div class="lbl">⚠️ مسئلہ</div><div class="val" id="alamatPctBad">0%</div></div>

    <!-- 6. DIET HISTORY -->
    <div class="card">
        <div class="card-head"><div class="card-title">🍽️ ڈائٹ ہسٹری</div><div class="card-btns"><button onclick="toggleSettings('dietSettings')" style="opacity:0.1;">⚙️</button><button onclick="toggleBody('dietBody')">⬇️</button></div></div>
        <div class="settings-panel" id="dietSettings"><button onclick="alert('ایڈٹ')">✏️ Edit</button><button class="del" onclick="alert('ڈیلیٹ')">🗑️ Delete</button><button class="del" onclick="alert('صاف')">🧹 Clear</button></div>
        <div id="dietBody">
            <div class="filter-row">
                <select id="dietFilterMember"><option value="all">تمام ممبران</option></select>

        <div class="settings-panel" id="rashanSettings"><button onclick="alert('ایڈٹ')">✏️ Edit</button><button class="del" onclick="alert('ڈیلیٹ')">🗑️ Delete</button><button class="del" onclick="alert('صاف')">🧹 Clear</button></div>
        <div id="rashanBody">

<script>
// ========== STORAGE KEYS ==========
var DUTY_KEY = 'sec4_duty_manager_data_v4';
var DUTY_HIST_KEY = 'sec4_duty_history_data_v4';
var LEAVE_KEY = 'sec4_duty_leaves_data_v4';
var TASK_KEY = 'sec12_task_records';
var SKIP_KEY = 'sec4_duty_skipped_data';
var NEWS_KEY = 'sec10_news_alerts_data';
var ALAMAT_KEY = 'symptoms';
var DIET_KEY = 'diets';
var RASHAN_ITEMS_KEY = 'sec11_rashan_data_v2';

// ========== UTILITIES ==========
function $(id) { return document.getElementById(id); }
function ls(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; } }
function lss(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function pad(n) { return String(n).padStart(2, '0'); }
function toggleSettings(id) { var el = $(id); if(el) el.classList.toggle('open'); }
function toggleBody(id) {
    var b = $(id);
    var btn = b.previousElementSibling.querySelector('.card-btns button:last-child');
    if (b.style.display === 'none') { b.style.display = 'block'; if(btn) btn.textContent = '⬇️'; }
    else { b.style.display = 'none'; if(btn) btn.textContent = '⬆️'; }
}
function copyText(txt) {
    navigator.clipboard.writeText(txt).then(function() { alert('✅ کاپی'); });
}
function shareWA(txt) {
    window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}

// Date Filter (Today, 7 Days, 30 Days)
function checkTimeFilter(ts, filter) {
    if (filter === 'all') return true;
    var now = new Date();
    var d = new Date(ts);
    if (filter === 'today') return d.toDateString() === now.toDateString();
    if (filter === 'week') { var diff = (now - d) / 86400000; return diff >= 0 && diff <= 7; }
    if (filter === 'month') { var diff = (now - d) / 86400000; return diff >= 0 && diff <= 30; }
    return true;
}

// ========== 1. DUTY HISTORY ==========
function renderDutyHistory() {
    var member = $('dutyFilterMember').value;
    var timeF = $('dutyFilterTime').value;
    var leaves = ls(LEAVE_KEY, []); // Chhuttiyan
    var hist = ls(DUTY_HIST_KEY, []); // Purani duties
    
    // Combine both for history
    var all = leaves.map(l => ({
        name: l.name, rank: l.rank, reason: l.reason,
        timestamp: new Date(l.date).getTime() || Date.now(),
        type: 'leave'
    })).concat(hist.map(h => ({
        name: h.name, rank: h.rank, reason: h.reason,
        timestamp: Date.now(), // Purani hist me timestamp nahi hota, isliye abhi ka dal rahe hain
        type: h.reason === 'auto' ? 'auto' : 'manual'
    })));

    var filtered = all.filter(x => {
        if (member !== 'all' && x.name !== member) return false;
        return checkTimeFilter(x.timestamp, timeF);
    });

    var box = $('dutyHistoryList');
    if (!filtered.length) { box.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:11px;padding:15px;">کوئی ریکارڈ نہیں</div>'; return; }

    box.innerHTML = filtered.map(x => {
        var d = new Date(x.timestamp);
        var ds = pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
        var typeText = x.type === 'leave' ? '🏖️ چھٹی' : (x.type === 'auto' ? '⚡ آٹو ڈیوٹی' : '✋ مینوئل ڈیوٹی');
        
        return `<div class="list-item">
            <div class="name">👤 ${esc(x.name)} (${x.rank})</div>
            <div class="detail">${typeText} ${x.reason ? ' — ' + esc(x.reason) : ''}</div>
            <div class="date">📅 ${ds}</div>
        </div>`;
    }).join('');
}

function copyDutyHistory() {
    var items = ls(LEAVE_KEY, []);
    var text = "👮 Duty History:\n";
    items.forEach(x => { text += "• " + x.name + " — " + x.reason + "\n"; });
    copyText(text);
}

function shareDutyHistory() {
    var items = ls(LEAVE_KEY, []);
    var text = "👮 Duty History:\n";
    items.forEach(x => { text += "• " + x.name + " — " + x.reason + "\n"; });
    shareWA(text);
}

// ========== 2. TASK HISTORY ==========
function renderTaskHistory() {
    var member = $('taskFilterMember').value;
    var timeF = $('taskFilterTime').value;
    var recs = ls(TASK_KEY, []);
    
    var filtered = recs.filter(x => {
        if (member !== 'all' && x.member !== member) return false;
        return checkTimeFilter(x.timestamp, timeF);
    });

    var box = $('taskHistoryList');
    if (!filtered.length) { box.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:11px;padding:15px;">کوئی ریکارڈ نہیں</div>'; return; }

    box.innerHTML = filtered.map(x => {
        var d = new Date(x.timestamp);
        var ds = pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
        var stText = x.status === 'done' ? '✅ ہو گیا' : (x.status === 'notdone' ? '❌ نہیں ہوا' : '⚪ چھوڑا');
        
        return `<div class="list-item">
            <div class="name">👤 ${esc(x.member)}</div>
            <div class="detail">📌 ${esc(x.task)} — ${stText} (${x.points} Points)</div>
            <div class="date">📅 ${ds}</div>
        </div>`;
    }).join('');
}

function copyTaskHistory() {
    var items = ls(TASK_KEY, []);
    var text = "📋 Task History:\n";
    items.forEach(x => { text += "• " + x.member + " — " + x.task + " (" + x.status + ")\n"; });
    copyText(text);
}

function shareTaskHistory() {
    var items = ls(TASK_KEY, []);
    var text = "📋 Task History:\n";
    items.forEach(x => { text += "• " + x.member + " — " + x.task + "\n"; });
    shareWA(text);
}

// ========== 3. SKIP HISTORY ==========
function renderSkipHistory() {
    var member = $('skipFilterMember').value;
    var timeF = $('skipFilterTime').value;
    var items = ls(SKIP_KEY, []);
    
    var filtered = items.filter(x => {
        if (member !== 'all' && x.member !== member) return false;
        return checkTimeFilter(x.timestamp, timeF);
    });

    var box = $('skipHistoryList');
    if (!filtered.length) { box.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:11px;padding:15px;">کوئی ریکارڈ نہیں</div>'; return; }

    box.innerHTML = filtered.map(x => {
        var d = new Date(x.timestamp);
        var ds = pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
        var rText = x.hasReason ? '✅ وجہ: ' + esc(x.reason) : '⏳ وجہ نہیں دی';
        
        return `<div class="list-item">
            <div class="name">👤 ${esc(x.member)}</div>
            <div class="detail">📌 ${esc(x.task)}</div>
            <div class="detail">${rText}</div>
            <div class="date">📅 ${ds}</div>
        </div>`;
    }).join('');
}

function copySkipHistory() {
    var items = ls(SKIP_KEY, []);
    var text = "⛔ Skip History:\n";
    items.forEach(x => { text += "• " + x.member + " — " + x.task + " (" + (x.reason||'وجہ نہیں') + ")\n"; });
    copyText(text);
}

function shareSkipHistory() {
    var items = ls(SKIP_KEY, []);
    var text = "⛔ Skip History:\n";
    items.forEach(x => { text += "• " + x.member + " — " + x.task + "\n"; });
    shareWA(text);
}

// ========== 4. NEWS & ALERT HISTORY ==========
function renderNewsHistory() {
    var type = $('newsFilterType').value;
    var items = ls(NEWS_KEY, []);
    
    var filtered = (type === 'all') ? items : items.filter(x => x.type === type);

    var box = $('newsHistoryList');
    if (!filtered.length) { box.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:11px;padding:15px;">کوئی ریکارڈ نہیں</div>'; return; }

    box.innerHTML = filtered.map(x => {
        var d = new Date(x.timestamp);
        var ds = pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
        var icons = { news: '📰', alert: '🚨', complaint: '⏰' };
        
        return `<div class="list-item">
            <div class="name">${icons[x.type]||''} ${esc(x.content)}</div>
            <div class="date">📅 ${ds}</div>
        </div>`;
    }).join('');
}

function copyNewsHistory() {
    var items = ls(NEWS_KEY, []);

// ========== 5. ALAMAT HISTORY ==========
function renderAlamatHistory() {
    var member = $('alamatFilterMember').value;
    var items = ls(ALAMAT_KEY, []);
    
    var filtered = (member === 'all') ? items : items.filter(x => x.member === member);

    var box = $('alamatHistoryList');
    if (!filtered.length) { box.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:11px;padding:15px;">کوئی ریکارڈ نہیں</div>'; } 
    else {
        box.innerHTML = filtered.map(x => {
            var d = new Date(x.timestamp);
            var ds = pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
            return `<div class="list-item">
                <div class="name">👤 ${esc(x.member)}</div>
                <div class="detail">🔍 ${esc(x.symptom)} — ${esc(x.state)}</div>
                <div class="date">📅 ${ds}</div>
            </div>`;
        }).join('');
    }

    // Percentages
    var total = filtered.length;
    var good = filtered.filter(x => x.positive).length;
    var bad = total - good;
    
    $('alamatPctGood').textContent = total ? Math.round((good/total)*100) + '%' : '0%';
    $('alamatPctBad').textContent = total ? Math.round((bad/total)*100) + '%' : '0%';
    $('alamatPctTotal').textContent = total ? Math.round((good/total)*100) + '%' : '0%';
}

// ========== POPULATE MEMBER DROPDOWNS ==========
function populateMemberFilters() {
    var members = ls(DUTY_KEY, []);
    var ids = ['dutyFilterMember', 'taskFilterMember', 'skipFilterMember', 'alamatFilterMember', 'dietFilterMember', 'rashanFilterMember'];
    
    ids.forEach(function(id) {
        var sel = $(id);
        if (!sel) return;
        sel.innerHTML = '<option value="all">تمام ممبران</option>';
        members.forEach(x => {
            sel.innerHTML += `<option value="${x.name}">${x.name}</option>`;
        });
    });
}

// ========== INIT ==========
function initHistory() {
    populateMemberFilters();
    
    renderDutyHistory();
    renderTaskHistory();
    renderSkipHistory();
    renderNewsHistory();
    renderAlamatHistory();
    renderDietHistory();
    renderRashanHistory();
    
    // Event Listeners
    $('dutyFilterMember').addEventListener('change', renderDutyHistory);
    $('dutyFilterTime').addEventListener('change', renderDutyHistory);
    $('taskFilterMember').addEventListener('change', renderTaskHistory);
    $('taskFilterTime').addEventListener('change', renderTaskHistory);
    $('skipFilterMember').addEventListener('change', renderSkipHistory);
    $('skipFilterTime').addEventListener('change', renderSkipHistory);
    $('newsFilterType').addEventListener('change', renderNewsHistory);
    $('alamatFilterMember').addEventListener('change', renderAlamatHistory);
    $('dietFilterMember').addEventListener('change', renderDietHistory);
    $('rashanFilterMember').addEventListener('change', renderRashanHistory);
}

document.addEventListener('DOMContentLoaded', initHistory);
</script>
