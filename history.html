<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>News/Alert — History</title>
<style>
:root{--primary:#1e293b;--accent:#2563eb;--danger:#ef4444;--success:#10b981;--bg:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;padding:12px;color:#334155;direction:rtl}
.container{max-width:750px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* SECTION */
.section-card{background:#fff;padding:10px;border-radius:10px;border:1px solid #cbd5e1;box-shadow:0 2px 4px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px}
.section-header{font-weight:bold;color:var(--primary);font-size:13px;display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid #e2e8f0}
.section-header button{background:#f8fafc;border:1px solid #cbd5e1;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}

/* FILTERS */
.filter-area{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.filter-row{display:flex;gap:4px;align-items:center}
.filter-row select{padding:7px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:11px;font-family:inherit;outline:none;background:#fff;flex:1;min-width:0;text-align:center;font-weight:700;color:#334155}
.filter-reset{background:#fee2e2;color:#991b1b;border:none;padding:7px 10px;border-radius:6px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;flex-shrink:0}
.filter-reset:active{transform:scale(.96)}

/* SCROLL */
.scroll-head{display:flex;justify-content:space-between;align-items:center}
.scroll-head span{font-size:11px;font-weight:bold;color:#475569}
.btn-close{background:#64748b;color:#fff;border:none;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:bold;cursor:pointer;font-family:inherit}
.scroll-list{max-height:320px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px;padding:5px;background:#fafafa;font-size:11px}
.record{padding:8px;border-bottom:1px dotted #e2e8f0;display:flex;align-items:flex-start;gap:6px;border-right:3px solid transparent}
.record:last-child{border-bottom:none}
.record.sel{background:#eff6ff;border-right-color:var(--accent)}
.record.news{border-right-color:#10b981;background:#f0fdf4}
.record.alert{border-right-color:#dc2626;background:#fef2f2}
.record.sel.news,.record.sel.alert{background:#eff6ff}
.record.deleted{opacity:.6;background:#fef2f2;border-right-color:#991b1b}
.record.skipped .txt{text-decoration:line-through;color:#94a3b8}
.record .chk{width:16px;height:16px;flex-shrink:0;cursor:pointer;accent-color:var(--accent);margin-top:3px}
.record .body{flex:1;min-width:0}
.record .txt{font-weight:700;font-size:11.5px;color:#0f172a;word-break:break-word}
.record .meta{font-size:9px;color:#64748b;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
.record .meta span{background:#f1f5f9;padding:1px 5px;border-radius:3px;font-weight:700}
.record .meta .auto-tag{background:#dbeafe;color:#1e40af}
.record .meta .manual-tag{background:#fef3c7;color:#92400e}
.record .meta .del-tag{background:#fee2e2;color:#991b1b}

/* STATE */
.state-patti{display:flex;justify-content:space-around;gap:4px;padding:6px 4px;border-radius:6px;background:#f8fafc;border:1px solid #e2e8f0}
.state-item{flex:1;text-align:center;padding:4px 2px;border-radius:4px;font-size:9px;font-weight:800}
.state-item .val{font-size:13px;font-weight:900;display:block;margin-top:1px}
.state-item:nth-child(1){background:#ecfdf5;color:#059669;border:1px solid #10b981}
.state-item:nth-child(2){background:#fef2f2;color:#dc2626;border:1px solid #ef4444}
.state-item:nth-child(3){background:#eff6ff;color:#2563eb;border:1px solid #3b82f6}

/* EMPTY */
.empty-box{text-align:center;color:#94a3b8;padding:20px 10px;font-size:11px;font-weight:700}
.empty-box .icon{font-size:32px;display:block;margin-bottom:8px;opacity:.5}

/* MSG */
.inline-msg{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2e8b57;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:99999;display:none;font-family:inherit}
.inline-msg.show{display:block}
.inline-msg.error{background:#c0392b}

/* DARK */
body.dark{background:#0f172a;color:#e2e8f0}
body.dark .section-card{background:#1e293b;border-color:#334155}
body.dark .scroll-list{background:#0f172a;color:#e2e8f0}
body.dark .record .txt{color:#f1f5f9}
body.dark .record .meta{color:#94a3b8}
body.dark .filter-area{background:#0f172a;border-color:#334155}
body.dark .filter-row select{background:#1e293b;color:#e2e8f0;border-color:#334155}
body.dark .record .meta span{background:#334155}
body.dark .state-patti{background:#0f172a;border-color:#334155}

/* OVERLAY */
.ns-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:9999;overflow-y:auto}
.ns-overlay.active{display:block}
.ns-box{max-width:520px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
.ns-head{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800}
.ns-head button{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.ns-body{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px}
.ns-old{background:#2c3e50;border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ns-old button{padding:8px 3px;font-size:9px;font-weight:bold;border-radius:5px;border:1px solid #34495e;background:#34495e;color:#fff;cursor:pointer;font-family:inherit}
.ns-old button.del{color:#ff9999}
.ns-old button.active{background:#10b981;border-color:#10b981}
.ns-toggle-new{background:#eff6ff;border:2px solid #bfdbfe;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:inherit;width:100%;text-align:right;color:#1e40af;font-weight:800;font-size:13px}
.ns-sub{background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:6px}
.ns-sub-h{background:#f8fafc;padding:10px 12px;font-size:12px;font-weight:800;color:#1e293b;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:inherit;width:100%;text-align:right;border:none}
.ns-sub-body{padding:10px 12px;display:none}
.ns-sub.open .ns-sub-body{display:block}
.ns-lbl{font-size:11px;font-weight:700;color:#64748b;display:block;margin:8px 0 4px}
.ns-inp{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;font-family:inherit;outline:none;background:#fff;font-weight:600;margin-bottom:6px}
.ns-btn{width:100%;padding:10px;background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;border-radius:8px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:5px}
.ns-btn.success{background:#ecfdf5;color:#059669;border-color:#a7f3d0}
.ns-btn.danger{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.ns-btn.warning{background:#fffbeb;color:#d97706;border-color:#fde68a}
.ns-stat-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:6px;text-align:center;font-size:11px;font-weight:700}
.ns-stat-box .big{font-size:20px;font-weight:900;color:#2563eb;display:block;margin-bottom:2px}
.ns-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid #e2e8f0;padding:12px;display:flex;gap:8px}
.ns-foot button{flex:1;padding:12px;border:none;border-radius:8px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;background:#f1f5f9;color:#64748b}

/* CONFIRM MODAL */
.ns-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:16px}
.ns-modal.active{display:flex}
.ns-modal-box{background:#fff;border-radius:12px;max-width:340px;width:100%}
.ns-modal-h{padding:12px;background:#2563eb;color:#fff;font-size:13px;font-weight:800;border-radius:12px 12px 0 0}
.ns-modal-b{padding:14px;font-size:12px;color:#334155;line-height:1.6;font-weight:600}
.ns-modal-b input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;font-family:inherit;outline:none;margin-top:8px}
.ns-modal-f{display:flex;gap:8px;padding:0 14px 14px}
.ns-modal-f button{flex:1;padding:10px;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div class="container">
  <div class="section-card">
    <div class="section-header">
      <span>📰 نیوز/الرٹ ہسٹری</span>
      <button onclick="openSettings()">⚙️</button>
    </div>

    <!-- FILTERS -->
    <div class="filter-area">
      <div class="filter-row">
        <select id="filterDate" onchange="renderList()">
          <option value="today">📅 آج</option>
          <option value="yesterday">📅 کل</option>
          <option value="7days">📅 7 دن</option>
          <option value="30days">📅 30 دن</option>
          <option value="all">📅 سب</option>
          <option value="deleted">🗑️ ڈیلیٹ شدہ</option>
        </select>
        <select id="filterType" onchange="renderList()">
          <option value="all">📰 سب</option>
          <option value="news">📰 News</option>
          <option value="alert">🚨 Alert</option>
        </select>
        <select id="filterMember" onchange="renderList()">
          <option value="all">👤 سب ممبران</option>
        </select>
      </div>
      <button class="filter-reset" onclick="resetFilters()">🔄 ری سیٹ</button>
    </div>

    <!-- LIST -->
    <div class="scroll-head">
      <span>📋 ریکارڈ (<span id="recCount">0</span>):</span>
      <button class="btn-close" onclick="toggleClose('recordList')">⬇️ Close</button>
    </div>
    <div class="scroll-list" id="recordList"></div>

    <!-- STATE -->
    <div class="state-patti">
      <div class="state-item">📰 News<span class="val" id="stateNews">0</span></div>
      <div class="state-item">🚨 Alert<span class="val" id="stateAlert">0</span></div>
      <div class="state-item">📋 Total<span class="val" id="stateTotal">0</span></div>
    </div>
  </div>
</div>

<!-- SETTINGS OVERLAY -->
<div class="ns-overlay" id="nsOverlay">
  <div class="ns-box">
    <div class="ns-head">
      <span>⚙️ ہسٹری سیٹنگز</span>
      <button onclick="closeSettings()">✕</button>
    </div>
    <div class="ns-body">

      <!-- 13 BUTTONS -->
      <div class="ns-old">
        <button onclick="toggleSelectMode()" id="selModeBtn">☑️ Select</button>
        <button onclick="allSelect()">✅ All</button>
        <button onclick="editSelected()">✏️ Edit</button>
        <button class="del" onclick="deleteSelected()">🗑️ Delete</button>
        <button class="del" onclick="deleteAll()">❌ Del All</button>
        <button class="del" onclick="clearAll()">🧹 Clear</button>
        <button onclick="moveUp()">🔼 Oper</button>
        <button onclick="moveDown()">🔽 Nichy</button>
        <button onclick="setPassword()">🔑 Pass</button>
        <button onclick="toggleDark()" id="darkBtn">🌙 Dark</button>
        <button onclick="restoreSelected()">♻️ Restore</button>
        <button onclick="permanentDelete()">🗑️ Perm Del</button>
        <button onclick="closeSettings()">⬇️ Close</button>
      </div>

      <button class="ns-toggle-new" onclick="toggleAdvanced()">⚙️ مزید آپشنز <span id="advArrow">▼</span></button>
      <div id="advWrap" style="display:none">

        <!-- REPORT -->
        <div class="ns-sub" data-sub="1">
          <button class="ns-sub-h" onclick="toggleSub(1)">📊 رپورٹ <span class="arrow">▶</span></button>
          <div class="ns-sub-body">
            <div class="ns-stat-box">
              <span class="big" id="reportTotal">0</span>
              کل ریکارڈز
            </div>
            <div class="ns-stat-box">
              آج: <span id="reportToday" style="color:#2563eb">0</span> |
              کل: <span id="reportYesterday" style="color:#059669">0</span> |
              ہفتہ: <span id="reportWeek" style="color:#d97706">0</span>
            </div>
            <button class="ns-btn success" onclick="downloadReport('today')">📈 آج کی رپورٹ</button>
            <button class="ns-btn success" onclick="downloadReport('week')">📈 ہفتے کی رپورٹ</button>
            <button class="ns-btn success" onclick="downloadReport('month')">📈 مہینے کی رپورٹ</button>
            <button class="ns-btn success" onclick="downloadReport('all')">📈 مکمل رپورٹ</button>
          </div>
        </div>

        <!-- SEARCH -->
        <div class="ns-sub" data-sub="2">
          <button class="ns-sub-h" onclick="toggleSub(2)">🔍 تلاش <span class="arrow">▶</span></button>
          <div class="ns-sub-body">
            <input type="text" id="searchBox" class="ns-inp" placeholder="متن تلاش کریں..." oninput="doSearch(this.value)">
            <div id="searchResults" style="font-size:11px;color:#64748b;font-weight:700;padding:4px"></div>
            <button class="ns-btn warning" onclick="clearSearch()">🔄 تلاش صاف</button>
          </div>
        </div>

        <!-- RECYCLE -->
        <div class="ns-sub" data-sub="3">
          <button class="ns-sub-h" onclick="toggleSub(3)">🗑️ ری سائیکل بن <span class="arrow">▶</span></button>
          <div class="ns-sub-body">
            <div class="ns-stat-box">
              <span class="big" id="recycleCount" style="color:#dc2626">0</span>
              ڈیلیٹ شدہ ریکارڈ
            </div>
            <button class="ns-btn success" onclick="restoreAll()">♻️ سب بحال کریں</button>
            <button class="ns-btn danger" onclick="emptyRecycle()">🗑️ بن خالی کریں (مستقل)</button>
          </div>
        </div>

        <!-- EXPORT -->
        <div class="ns-sub" data-sub="4">
          <button class="ns-sub-h" onclick="toggleSub(4)">💾 ایکسپورٹ <span class="arrow">▶</span></button>
          <div class="ns-sub-body">
            <button class="ns-btn" onclick="exportData('json')">📄 JSON</button>
            <button class="ns-btn" onclick="exportData('csv')">📊 CSV</button>
            <button class="ns-btn" onclick="exportData('txt')">📝 TXT</button>
          </div>
        </div>

        <!-- STATS -->
        <div class="ns-sub" data-sub="5">
          <button class="ns-sub-h" onclick="toggleSub(5)">📈 اعداد و شمار <span class="arrow">▶</span></button>
          <div class="ns-sub-body" id="statsBody"></div>
        </div>
      </div>
    </div>
    <div class="ns-foot"><button onclick="closeSettings()">✕ بند</button></div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="ns-modal" id="nsModal">
  <div class="ns-modal-box">
    <div class="ns-modal-h" id="modalTitle">تصدیق</div>
    <div class="ns-modal-b" id="modalBody">—</div>
    <div class="ns-modal-f">
      <button onclick="modalClose()" style="background:#e2e8f0;color:#64748b">✕ بند</button>
      <button onclick="modalConfirm()" id="modalConfirmBtn" style="background:#dc2626;color:#fff">✓ ہاں</button>
    </div>
  </div>
</div>

<div class="inline-msg" id="inlineMsg"></div>

<script>
/* ============ UTILS ============ */
function $(id){return document.getElementById(id)}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function pad(n){return String(n).padStart(2,'0')}
function toggleClose(id){var el=$(id);if(el)el.style.display=el.style.display==='none'?'block':'none'}
function showMsg(t,err){var el=$('inlineMsg');el.textContent=t;el.style.background=err?'#c0392b':'#2e8b57';el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},2500)}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayTs(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}

/* ============ KEYS ============ */
var NEWS_KEY='sec10_news_alerts_data';
var NS_KEY='ns_settings_v7';
var DUTY_KEY='sec4_duty_manager_data_v4';

/* ============ STATE ============ */
var selectMode=false,selectedIds={};
var searchQuery='';

/* ============ RENDER ============ */
function populateMembers(){
  var sel=$('filterMember');if(!sel)return;
  var cur=sel.value;
  var mem=lsGet(DUTY_KEY,[]);
  sel.innerHTML='<option value="all">👤 سب ممبران</option>';
  mem.forEach(function(m){sel.innerHTML+='<option value="'+esc(m.name)+'">'+esc(m.name)+'</option>'});
  if(cur)sel.value=cur;
}

function getFilteredRecords(){
  var all=lsGet(NEWS_KEY,[]);
  var filterDate=$('filterDate').value;
  var filterType=$('filterType').value;
  var filterMember=$('filterMember').value;
  var now=new Date();
  var today=todayStr();
  var yesterdayDate=new Date(now.getTime()-86400000);
  var yesterday=dateStr(yesterdayDate);
  var weekAgo=Date.now()-7*86400000;
  var monthAgo=Date.now()-30*86400000;

  var items=all.filter(function(x){
    // Date filter
    if(filterDate==='deleted'){
      if(!x.deleted)return false;
    } else {
      if(x.deleted)return false;
      if(filterDate==='today'&&x.date!==today)return false;
      if(filterDate==='yesterday'&&x.date!==yesterday)return false;
      if(filterDate==='7days'&&x.timestamp<weekAgo)return false;
      if(filterDate==='30days'&&x.timestamp<monthAgo)return false;
    }
    // Type filter
    if(filterType!=='all'&&x.type!==filterType)return false;
    // Member filter (matches text)
    if(filterMember!=='all'){
      if(x.content.indexOf(filterMember)===-1)return false;
    }
    // Search
    if(searchQuery&&x.content.toLowerCase().indexOf(searchQuery.toLowerCase())===-1)return false;
    return true;
  });
  return items;
}

function renderList(){
  var items=getFilteredRecords();
  var box=$('recordList');
  if(!items.length){
    box.innerHTML='<div class="empty-box"><span class="icon">📭</span>کوئی ریکارڈ نہیں</div>';
  } else {
    box.innerHTML=items.map(function(x,i){
      var icon=x.type==='news'?'📰':'🚨';
      var cls=x.type==='news'?'news':'alert';
      var selCls=selectedIds[x.id]?' sel':'';
      var delCls=x.deleted?' deleted':'';
      var skipCls=x.skipped?' skipped':'';
      var chk=selectMode?'<input type="checkbox" class="chk" '+(selectedIds[x.id]?'checked':'')+' onchange="toggleSelect('+x.id+')">':'';
      var autoTag=x.auto?'<span class="auto-tag">خودکار</span>':'<span class="manual-tag">دستی</span>';
      var delTag=x.deleted?'<span class="del-tag">🗑️ ڈیلیٹ</span>':'';
      var skipTag=x.skipped?'<span class="del-tag">❌ Skip</span>':'';
      return '<div class="record '+cls+selCls+delCls+skipCls+'">'+chk+'<div class="body"><div class="txt">'+icon+' '+esc(x.content)+'</div><div class="meta"><span>📅 '+(x.dateStr||'')+'</span>'+autoTag+delTag+skipTag+'</div></div></div>';
    }).join('');
  }
  $('recCount').textContent=items.length;

  // State
  var newsN=items.filter(function(x){return x.type==='news'}).length;
  var alertN=items.filter(function(x){return x.type==='alert'}).length;
  $('stateNews').textContent=newsN;
  $('stateAlert').textContent=alertN;
  $('stateTotal').textContent=items.length;

  // Recycle count
  var all=lsGet(NEWS_KEY,[]);
  var deletedCount=all.filter(function(x){return x.deleted}).length;
  if($('recycleCount'))$('recycleCount').textContent=deletedCount;

  // Reports
  var today=todayStr();
  var yesterdayDate=new Date(Date.now()-86400000);
  var yesterday=dateStr(yesterdayDate);
  var weekAgo=Date.now()-7*86400000;
  var active=all.filter(function(x){return !x.deleted});
  if($('reportTotal'))$('reportTotal').textContent=active.length;
  if($('reportToday'))$('reportToday').textContent=active.filter(function(x){return x.date===today}).length;
  if($('reportYesterday'))$('reportYesterday').textContent=active.filter(function(x){return x.date===yesterday}).length;
  if($('reportWeek'))$('reportWeek').textContent=active.filter(function(x){return x.timestamp>=weekAgo}).length;

  // Stats
  renderStats();
}

function renderStats(){
  var body=$('statsBody');if(!body)return;
  var all=lsGet(NEWS_KEY,[]).filter(function(x){return !x.deleted});
  var autoCount=all.filter(function(x){return x.auto}).length;
  var manualCount=all.filter(function(x){return !x.auto}).length;
  var skippedCount=all.filter(function(x){return x.skipped}).length;
  // Unique members from content
  var mem=lsGet(DUTY_KEY,[]);
  var memberStats={};
  mem.forEach(function(m){
    var cnt=all.filter(function(x){return x.content.indexOf(m.name)!==-1}).length;
    if(cnt>0)memberStats[m.name]=cnt;
  });
  var html='<div class="ns-stat-box">خودکار: <b>'+autoCount+'</b> | دستی: <b>'+manualCount+'</b> | Skip: <b>'+skippedCount+'</b></div>';
  if(Object.keys(memberStats).length){
    html+='<div style="font-size:11px;font-weight:800;color:#475569;margin:8px 0 4px">ممبران کے مطابق:</div>';
    Object.keys(memberStats).sort(function(a,b){return memberStats[b]-memberStats[a]}).forEach(function(name){
      html+='<div class="ns-limit-row"><label>'+esc(name)+'</label><span class="unit">'+memberStats[name]+'</span></div>';
    });
  }
  body.innerHTML=html;
}

/* ============ FILTER ============ */
function resetFilters(){
  $('filterDate').value='today';
  $('filterType').value='all';
  $('filterMember').value='all';
  searchQuery='';
  if($('searchBox'))$('searchBox').value='';
  selectedIds={};
  renderList();
  showMsg('🔄 فلٹر ری سیٹ');
}

function doSearch(q){
  searchQuery=q.trim();
  var items=getFilteredRecords();
  $('searchResults').textContent=items.length+' ریکارڈ ملے';
  renderList();
}

function clearSearch(){
  searchQuery='';
  if($('searchBox'))$('searchBox').value='';
  $('searchResults').textContent='';
  renderList();
}

/* ============ SELECT MODE ============ */
function toggleSelectMode(){
  selectMode=!selectMode;
  $('selModeBtn').classList.toggle('active',selectMode);
  if(!selectMode)selectedIds={};
  renderList();
  showMsg(selectMode?'✅ Select ON':'☑️ Select OFF');
}

function toggleSelect(id){
  selectedIds[id]=!selectedIds[id];
  renderList();
}

function allSelect(){
  if(!selectMode){showMsg('پہلے Select Mode آن کریں',true);return}
  var items=getFilteredRecords();
  items.forEach(function(x){selectedIds[x.id]=true});
  renderList();
  showMsg('✅ سب منتخب');
}

function getSelectedIds(){
  return Object.keys(selectedIds).filter(function(k){return selectedIds[k]});
}

/* ============ ACTIONS ============ */
function editSelected(){
  var ids=getSelectedIds();
  if(!ids.length){showMsg('پہلے منتخب کریں',true);return}
  if(ids.length>1){showMsg('ایک وقت میں ایک',true);return}
  var items=lsGet(NEWS_KEY,[]);
  var idx=items.findIndex(function(x){return String(x.id)===ids[0]});
  if(idx===-1)return;
  var nn=prompt('نیا متن:',items[idx].content);
  if(nn&&nn.trim()){
    items[idx].content=nn.trim();
    lsSet(NEWS_KEY,items);
    selectedIds={};
    renderList();
    showMsg('✅ اپڈیٹ');
  }
}

function deleteSelected(){
  var ids=getSelectedIds();
  if(!ids.length){showMsg('پہلے منتخب کریں',true);return}
  showConfirm('ڈیلیٹ',ids.length+' ریکارڈ ڈیلیٹ کریں؟ (بحال ہو سکتے)',function(){
    var items=lsGet(NEWS_KEY,[]);
    items.forEach(function(x){
      if(ids.indexOf(String(x.id))!==-1){x.deleted=true;x.deletedAt=Date.now()}
    });
    lsSet(NEWS_KEY,items);
    selectedIds={};
    renderList();
    showMsg('✅ '+ids.length+' ڈیلیٹ');
  });
}

function deleteAll(){
  var items=getFilteredRecords();
  if(!items.length){showMsg('کوئی ریکارڈ نہیں',true);return}
  showConfirm('سب ڈیلیٹ',items.length+' ریکارڈ ڈیلیٹ کریں؟ (بحال ہو سکتے)',function(){
    var all=lsGet(NEWS_KEY,[]);
    var ids=items.map(function(x){return x.id});
    all.forEach(function(x){
      if(ids.indexOf(x.id)!==-1){x.deleted=true;x.deletedAt=Date.now()}
    });
    lsSet(NEWS_KEY,all);
    selectedIds={};
    renderList();
    showMsg('✅ سب ڈیلیٹ');
  });
}

function clearAll(){
  showConfirm('مستقل صاف','تمام ریکارڈ مستقل حذف ہو جائیں گے! واپس نہیں آ سکیں گے!',function(){
    lsSet(NEWS_KEY,[]);
    selectedIds={};
    renderList();
    showMsg('🧹 سب صاف');
  });
}

function restoreSelected(){
  var ids=getSelectedIds();
  if(!ids.length){showMsg('پہلے منتخب کریں',true);return}
  var items=lsGet(NEWS_KEY,[]);
  items.forEach(function(x){
    if(ids.indexOf(String(x.id))!==-1){x.deleted=false;delete x.deletedAt}
  });
  lsSet(NEWS_KEY,items);
  selectedIds={};
  renderList();
  showMsg('♻️ بحال');
}

function permanentDelete(){
  var ids=getSelectedIds();
  if(!ids.length){showMsg('پہلے منتخب کریں',true);return}
  showConfirm('مستقل ڈیلیٹ',ids.length+' ریکارڈ مستقل حذف؟ واپس نہیں!',function(){
    lsSet(NEWS_KEY,lsGet(NEWS_KEY,[]).filter(function(x){return ids.indexOf(String(x.id))===-1}));
    selectedIds={};
    renderList();
    showMsg('🗑️ مستقل ڈیلیٹ');
  });
}

function restoreAll(){
  var items=lsGet(NEWS_KEY,[]);
  var cnt=0;
  items.forEach(function(x){if(x.deleted){x.deleted=false;delete x.deletedAt;cnt++}});
  lsSet(NEWS_KEY,items);
  renderList();
  showMsg('♻️ '+cnt+' بحال');
}

function emptyRecycle(){
  var all=lsGet(NEWS_KEY,[]);
  var cnt=all.filter(function(x){return x.deleted}).length;
  if(!cnt){showMsg('کوئی ڈیلیٹ شدہ نہیں',true);return}
  showConfirm('بن خالی',cnt+' ریکارڈ مستقل حذف؟ واپس نہیں!',function(){
    lsSet(NEWS_KEY,all.filter(function(x){return !x.deleted}));
    renderList();
    showMsg('🗑️ بن خالی');
  });
}

function moveUp(){
  var ids=getSelectedIds();
  if(!ids.length){showMsg('پہلے منتخب کریں',true);return}
  var items=lsGet(NEWS_KEY,[]);
  var idx=items.findIndex(function(x){return String(x.id)===ids[0]});
  if(idx<=0){showMsg('مزید اوپر نہیں',true);return}
  var t=items[idx];items[idx]=items[idx-1];items[idx-1]=t;
  lsSet(NEWS_KEY,items);
  selectedIds={};
  renderList();
  showMsg('🔼 اوپر');
}

function moveDown(){
  var ids=getSelectedIds();
  if(!ids.length){showMsg('پہلے منتخب کریں',true);return}
  var items=lsGet(NEWS_KEY,[]);
  var idx=items.findIndex(function(x){return String(x.id)===ids[0]});
  if(idx===-1||idx>=items.length-1){showMsg('مزید نیچے نہیں',true);return}
  var t=items[idx];items[idx]=items[idx+1];items[idx+1]=t;
  lsSet(NEWS_KEY,items);
  selectedIds={};
  renderList();
  showMsg('🔽 نیچے');
}

function setPassword(){
  var p=prompt('نیا پاس ورڈ (خالی=ہٹائیں):');
  if(p===null)return;
  if(p){localStorage.setItem('ns_pwd',p);showMsg('✅ پاس ورڈ سیٹ')}
  else{localStorage.removeItem('ns_pwd');showMsg('✅ ہٹا دیا')}
}

function toggleDark(){
  document.body.classList.toggle('dark');
  var on=document.body.classList.contains('dark');
  $('darkBtn').classList.toggle('active',on);
  lsSet('ns_dark',on);
}

/* ============ SETTINGS ============ */
function openSettings(){
  if(localStorage.getItem('ns_pwd')){
    var p=prompt('🔑 پاس ورڈ:');
    if(p!==localStorage.getItem('ns_pwd')){showMsg('❌ غلط پاس ورڈ',true);return}
  }
  renderList();
  $('nsOverlay').classList.add('active');
}

function closeSettings(){$('nsOverlay').classList.remove('active')}

function toggleAdvanced(){
  var w=$('advWrap'),a=$('advArrow');
  if(w.style.display==='none'){w.style.display='block';a.textContent='▲'}
  else{w.style.display='none';a.textContent='▼'}
}

function toggleSub(n){
  document.querySelectorAll('.ns-sub').forEach(function(el){
    if(el.getAttribute('data-sub')==String(n)){
      el.classList.toggle('open');
      var ar=el.querySelector('.arrow');
      ar.textContent=el.classList.contains('open')?'▼':'▶';
    } else {
      el.classList.remove('open');
      var ar2=el.querySelector('.arrow');
      if(ar2)ar2.textContent='▶';
    }
  });
}

/* ============ REPORT ============ */
function downloadReport(period){
  var all=lsGet(NEWS_KEY,[]).filter(function(x){return !x.deleted});
  var now=Date.now();
  var items;
  if(period==='today'){var t=todayStr();items=all.filter(function(x){return x.date===t})}
  else if(period==='week'){items=all.filter(function(x){return x.timestamp>=now-7*86400000})}
  else if(period==='month'){items=all.filter(function(x){return x.timestamp>=now-30*86400000})}
  else{items=all}

  var newsN=items.filter(function(x){return x.type==='news'}).length;
  var alertN=items.filter(function(x){return x.type==='alert'}).length;

  var report='📊 نیوز/الرٹ رپورٹ\n';
  report+='═════════════════\n';
  report+='دورانیہ: '+(period==='today'?'آج':period==='week'?'ہفتہ':period==='month'?'مہینہ':'سب')+'\n';
  report+='تاریخ: '+new Date().toLocaleString('ur-PK')+'\n';
  report+='═════════════════\n\n';
  report+='کل ریکارڈ: '+items.length+'\n';
  report+='📰 News: '+newsN+'\n';
  report+='🚨 Alert: '+alertN+'\n\n';
  report+='═════════════════\n';
  report+='تفصیلات:\n';
  report+='═════════════════\n';
  items.forEach(function(x,i){
    report+=(i+1)+'. '+(x.type==='news'?'📰':'🚨')+' '+x.content+'\n';
    report+='   📅 '+(x.dateStr||'')+(x.auto?' [خودکار]':' [دستی]')+'\n';
  });

  var blob=new Blob([report],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='report_'+period+'_'+Date.now()+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
  showMsg('📥 رپورٹ ڈاؤن لوڈ');
}

/* ============ EXPORT ============ */
function exportData(format){
  var items=lsGet(NEWS_KEY,[]).filter(function(x){return !x.deleted});
  if(!items.length){showMsg('کوئی ریکارڈ نہیں',true);return}

  var content,mime,ext;
  if(format==='json'){
    content=JSON.stringify(items,null,2);
    mime='application/json';ext='json';
  } else if(format==='csv'){
    content='Index,Type,Content,Date,Time,Auto,Skipped\n';
    items.forEach(function(x,i){
      content+=(i+1)+','+
        x.type+','+
        '"'+x.content.replace(/"/g,'""')+'",'+
        (x.date||'')+','+
        (x.dateStr||'')+','+
        (x.auto?'yes':'no')+','+
        (x.skipped?'yes':'no')+'\n';
    });
    mime='text/csv;charset=utf-8';ext='csv';
  } else {
    content='News/Alert Records\n';
    content+='===================\n';
    items.forEach(function(x,i){
      content+=(i+1)+'. '+(x.type==='news'?'📰':'🚨')+' '+x.content+'\n';
      content+='   '+(x.dateStr||'')+(x.auto?' [auto]':' [manual]')+'\n\n';
    });
    mime='text/plain;charset=utf-8';ext='txt';
  }

  var blob=new Blob([content],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='news_history_'+Date.now()+'.'+ext;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
  showMsg('📥 '+ext.toUpperCase()+' ڈاؤن لوڈ');
}

function showConfirm(title,body,cb){
  $('modalTitle').textContent=title;
  $('modalBody').textContent=body;
  _modalCb=cb;
  $('nsModal').classList.add('active');
}
function modalClose(){$('nsModal').classList.remove('active');_modalCb=null}
function modalConfirm(){var cb=_modalCb;modalClose();if(cb)cb()}

});
