<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ہسٹری</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f6;font-family:system-ui,sans-serif;direction:rtl;padding:12px}
.card{background:#fff;max-width:700px;margin:0 auto 14px;border-radius:14px;padding:14px;border:1px solid #cbd5e1;border-right:5px solid #16a34a;box-shadow:0 8px 18px rgba(0,0,0,.06)}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:2px dashed #bbf7d0;gap:6px}
.card-hd h1{font-size:16px;color:#16a34a}
.ic-btn{background:#f1f5f9;border:1px solid #cbd5e1;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:inherit;opacity:.7}
.ic-btn:hover{opacity:1}

/* Filter Dropdown */
.filter-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.filter-icon{background:#f0fdf4;border:1px solid #86efac;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:800;color:#15803d;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.filter-menu{display:none;position:absolute;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:100;min-width:160px;overflow:hidden}
.filter-menu.open{display:block}
.filter-menu button{width:100%;text-align:right;padding:10px 14px;font-size:12px;font-weight:700;background:#fff;border:none;cursor:pointer;font-family:inherit;color:#334155}
.filter-menu button:hover{background:#f0fdf4}
.filter-menu button.on{background:#16a34a;color:#fff}

/* Copy/Share */
.copy-share{display:flex;gap:6px;margin-left:auto}
.copy-share button{background:#f0fdf4;border:1px solid #86efac;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:800;color:#15803d;cursor:pointer;font-family:inherit}
.copy-share button:active{background:#dcfce7}

/* Member filter */
.member-filter{background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:8px;margin-bottom:10px}
.member-filter select{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;font-weight:700;font-family:inherit;background:#fff}

/* List */
.list{max-height:400px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:10px;padding:6px;background:#fafafa;min-height:80px}
.item{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
.item .cb{width:16px;height:16px;accent-color:#16a34a;cursor:pointer;flex-shrink:0;display:none;margin-top:2px}
.item.sel-on .cb{display:inline-block}
.item .info{flex:1;min-width:0}
.item .row1{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.item .member{font-weight:800;color:#1e293b}
.item .task{color:#334155;font-weight:700;margin-top:2px}
.item .st{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:800}
.item .st.done{background:#dcfce7;color:#15803d}
.item .st.notdone{background:#fee2e2;color:#991b1b}
.item .st.skip{background:#f1f5f9;color:#475569}
.item .meta{font-size:10px;color:#64748b;font-weight:600}
.item .pts{font-size:10px;padding:2px 8px;border-radius:20px;background:#fef9c3;color:#854d0e;font-weight:800}

.empty{text-align:center;color:#94a3b8;font-size:12px;padding:30px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;text-align:center}
.stat .n{font-size:18px;font-weight:900;color:#16a34a}
.stat .l{font-size:10px;color:#64748b;font-weight:700;margin-top:3px}

/* Settings */
.settings-panel{display:none;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:8px;margin-bottom:12px;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:5px}
.settings-panel.open{display:grid}
.settings-panel button{padding:7px 4px;font-size:10px;font-weight:700;border-radius:6px;border:1px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer;font-family:inherit}
.settings-panel button.danger{color:#ef4444;border-color:#fca5a5;background:#fef2f2}
.settings-panel button.active{background:#16a34a;color:#fff;border-color:#16a34a}
</style>
</head>
<body>

<div class="card">
  <div class="card-hd">
    <h1>📋 Task History</h1>
    <button class="ic-btn" onclick="toggleSettings()">⚙️</button>
  </div>

  <div class="settings-panel" id="settings">
    <button id="selBtn" onclick="toggleSelMode()">☑️ سلیکٹ موڈ</button>
    <button onclick="selectAll(true)">✅ تمام</button>
    <button onclick="selectAll(false)">⬜ ہٹائیں</button>
    <button onclick="editSel()">✏️ ایڈٹ</button>
    <button class="danger" onclick="deleteSel()">🗑️ ڈیلیٹ</button>
    <button class="danger" onclick="deleteAll(this)">❌ سب صاف</button>
    <button onclick="toggleSettings()">🚪 بند</button>
  </div>

  <div class="filter-row">
    <button class="filter-icon" onclick="toggleFilterMenu(event)">
      🔍 <span id="filterLabel">سب</span>
    </button>
    <div class="filter-menu" id="filterMenu">
      <button data-f="all" class="on" onclick="setFilter('all')">📋 سب</button>
      <button data-f="today" onclick="setFilter('today')">📅 آج</button>
      <button data-f="done" onclick="setFilter('done')">✅ ہو گیا</button>
      <button data-f="notdone" onclick="setFilter('notdone')">❌ نہیں ہوا</button>
      <button data-f="skip" onclick="setFilter('skip')">⚪ چھوڑا</button>
    </div>

    <div class="copy-share">
      <button onclick="copyAll()" title="کاپی">📋</button>
      <button onclick="shareWA()" title="واٹس ایپ">📱</button>
    </div>
  </div>

  <div class="member-filter">
    <select id="memberFilter" onchange="render()">
      <option value="">تمام ممبران</option>
    </select>
  </div>

  <div class="list" id="list">
    <div class="empty">کوئی ریکارڈ نہیں</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="sTotal">0</div><div class="l">📋 کل</div></div>
    <div class="stat"><div class="n" id="sDone">0</div><div class="l">✅ ہو گیا</div></div>
    <div class="stat"><div class="n" id="sPoints">0</div><div class="l">🏆 پوائنٹس</div></div>
  </div>
</div>

<script>
/* ═══ KEYS ═══ */
var REC_KEY = 'sec12_task_records';
var DUTY_KEY = 'sec4_duty_manager_data_v4';

function $(id){return document.getElementById(id);}
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function pad(n){return String(n).padStart(2,'0');}

var filter='all', selMode=false, selected={}, delPending=false, settingsOpen=false;

function getRecords(){
  var r=ls(REC_KEY,[]);
  if(!Array.isArray(r)) r=[];
  return r;
}
function saveRecords(r){lss(REC_KEY,r);}

/* ═══ SETTINGS ═══ */
window.toggleSettings = function(){
  settingsOpen=!settingsOpen;
  $('settings').classList.toggle('open',settingsOpen);
};
window.toggleSelMode = function(){
  selMode=!selMode;
  var b=$('selBtn');
  if(b){b.textContent=selMode?'✅ سلیکٹ آن':'☑️ سلیکٹ موڈ';b.classList.toggle('active',selMode);}
  if(!selMode) selected={};
  render();
};
window.selectAll = function(st){
  if(st && !selMode) toggleSelMode();
  selected={};
  if(st) getFiltered().forEach(function(x){selected[x.id]=true;});
  render();
};
window.editSel = function(){
  var ids=Object.keys(selected).filter(function(k){return selected[k];});
  if(ids.length!==1){alert('ایک ریکارڈ منتخب کریں');return;}
  var id=parseInt(ids[0],10);
  var r=getRecords();
  var rec=r.find(function(x){return x.id===id;});
  if(!rec) return;
  var nv=prompt('نیا ٹاسک نام:',rec.task);
  if(nv===null) return;
  nv=nv.trim(); if(!nv) return;
  rec.task=nv;
  saveRecords(r);
  selected={};
  render();
};
window.deleteSel = function(){
  var ids=Object.keys(selected).filter(function(k){return selected[k];});
  if(!ids.length){alert('کچھ منتخب کریں');return;}
  if(!confirm(ids.length+' ریکارڈ ڈیلیٹ کریں؟')) return;
  saveRecords(getRecords().filter(function(x){return ids.indexOf(String(x.id))===-1;}));
  selected={};
  render();
};
window.deleteAll = function(btn){
  if(!delPending){
    delPending=true;
    btn.textContent='⚠️ دوبارہ';
    btn.style.background='#dc2626';btn.style.color='#fff';
    setTimeout(function(){delPending=false;btn.textContent='❌ سب صاف';btn.style.background='';btn.style.color='';},2500);
    return;
  }
  saveRecords([]);
  selected={};
  delPending=false;
  btn.textContent='❌ سب صاف';btn.style.background='';btn.style.color='';
  render();
};

/* ═══ FILTER ═══ */
window.toggleFilterMenu = function(e){
  e.stopPropagation();
  $('filterMenu').classList.toggle('open');
};
document.addEventListener('click',function(){
  $('filterMenu').classList.remove('open');
});
window.setFilter = function(f){
  filter=f;
  document.querySelectorAll('#filterMenu button').forEach(function(b){
    b.classList.toggle('on',b.dataset.f===f);
  });
  var labels={all:'سب',today:'آج',done:'ہو گیا',notdone:'نہیں ہوا',skip:'چھوڑا'};
  $('filterLabel').textContent=labels[f]||'سب';
  $('filterMenu').classList.remove('open');
  render();
};

function getFiltered(){
  var recs=getRecords();
  var mf=$('memberFilter');
  var mname=mf?mf.value:'';
  if(mname) recs=recs.filter(function(r){return r.member===mname;});

  if(filter==='today'){
    var d=new Date();
    var today=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
    recs=recs.filter(function(r){return r.dateStr===today;});
  } else if(filter==='done'){
    recs=recs.filter(function(r){return r.status==='done';});
  } else if(filter==='notdone'){
    recs=recs.filter(function(r){return r.status==='notdone';});
  } else if(filter==='skip'){
    recs=recs.filter(function(r){return r.status==='skip';});
  }
  return recs;
}

/* ═══ RENDER ═══ */
function render(){
  var all=getRecords();
  var list=getFiltered();

  $('sTotal').textContent=list.length;
  $('sDone').textContent=list.filter(function(r){return r.status==='done';}).length;
  var pts=0;
  list.forEach(function(r){pts+=(r.points||0);});
  $('sPoints').textContent=pts;

  // populate member filter
  var mf=$('memberFilter');
  if(mf){
    var cur=mf.value;
    mf.innerHTML='<option value="">تمام ممبران</option>';
    var names={};
    all.forEach(function(r){names[r.member]=true;});
    Object.keys(names).forEach(function(n){mf.appendChild(new Option(n,n));});
    if(cur) mf.value=cur;
  }

  var box=$('list');
  if(!list.length){
    box.innerHTML='<div class="empty">اس فلٹر میں کوئی ریکارڈ نہیں</div>';
    return;
  }
  box.innerHTML=list.map(function(r){
    var isSel=!!selected[r.id];
    var stLbl = r.status==='done'?'✅ ہو گیا':(r.status==='notdone'?'❌ نہیں ہوا':'⚪ چھوڑا');
    var stCls = r.status==='done'?'done':(r.status==='notdone'?'notdone':'skip');
    var cb=selMode?'<input type="checkbox" class="cb" '+(isSel?'checked':'')+' onchange="toggleOne('+r.id+')">':'';
    var ptsBadge = r.points>0 ? '<span class="pts">🏆 '+r.points+'</span>' : '';
    return '<div class="item'+(selMode?' sel-on':'')+'" style="'+(isSel?'border-color:#16a34a;background:#f0fdf4;':'')+'">'+
      cb+
      '<div class="info">'+
        '<div class="row1"><span class="member">👤 '+esc(r.member)+'</span><span class="st '+stCls+'">'+stLbl+'</span>'+ptsBadge+'</div>'+
        '<div class="task">📌 '+esc(r.task)+'</div>'+
        '<div class="meta" style="margin-top:3px;">'+esc(r.dateStr)+' — '+esc(r.timeStr)+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}
window.toggleOne = function(id){
  if(selected[id]) delete selected[id];
  else selected[id]=true;
  render();
};

/* ═══ COPY / SHARE ═══ */
function getShareText(){
  var list=getFiltered();
  var lines=['📋 Task History','━━━━━━━━━━━━━━━━━━'];
  list.slice(0,30).forEach(function(r){
    var stLbl = r.status==='done'?'✅':(r.status==='notdone'?'❌':'⚪');
    lines.push(stLbl+' '+r.member+' — '+r.task+(r.points>0?' ('+r.points+')':''));
    lines.push(r.dateStr+' '+r.timeStr);
  });
  lines.push('━━━━━━━━━━━━━━━━━━');
  lines.push('کل: '+list.length+' ریکارڈ');
  return lines.join('\n');
}
window.copyAll = function(){
  var txt=getShareText();
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(function(){
      alert('✅ کاپی ہو گیا');
    });
  } else {
    var ta=document.createElement('textarea');
    ta.value=txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('✅ کاپی ہو گیا');
  }
};
window.shareWA = function(){
  var txt=getShareText();
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
};

/* ═══ INIT ═══ */
render();
setInterval(render,2500);
window.addEventListener('storage',function(e){
  if(e.key===REC_KEY) render();
});
</script>
</body>
</html>
