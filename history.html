<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ہسٹری</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f6;font-family:system-ui,sans-serif;direction:rtl;padding:12px}
.card{background:#fff;max-width:700px;margin:0 auto;border-radius:14px;padding:16px;border-right:5px solid #7c3aed;box-shadow:0 8px 18px rgba(0,0,0,.08)}
h1{font-size:18px;color:#7c3aed;margin-bottom:12px;padding-bottom:10px;border-bottom:2px dashed #ddd6fe}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.filters button{padding:9px 4px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.filters button.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
.list{border:1px solid #e2e8f0;border-radius:10px;padding:6px;background:#fafafa;min-height:80px;max-height:500px;overflow-y:auto}
.item{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin-bottom:6px;border-right:4px solid #7c3aed;font-size:12px}
.item.news{border-right-color:#2563eb}
.item.alert{border-right-color:#dc2626}
.item.complaint{border-right-color:#ea580c}
.item .row1{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:5px}
.item .badge{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:800}
.item .badge.news{background:#dbeafe;color:#1e40af}
.item .badge.alert{background:#fee2e2;color:#991b1b}
.item .badge.complaint{background:#ffedd5;color:#9a3412}
.item .time-badge{background:#fef3c7;color:#92400e;font-size:9px;padding:2px 8px;border-radius:20px;font-weight:800;border:1px solid #fcd34d}
.item .date{font-size:10px;color:#64748b;font-weight:600}
.item .content{color:#1e293b;font-weight:700;line-height:1.6;word-break:break-word}
.empty{text-align:center;color:#94a3b8;font-size:12px;padding:30px;font-weight:700}
.empty .ic{font-size:40px;display:block;margin-bottom:8px;opacity:.5}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;text-align:center}
.stat .n{font-size:20px;font-weight:900;color:#7c3aed}
.stat .l{font-size:10px;color:#64748b;font-weight:700;margin-top:3px}
</style>
</head>
<body>

<div class="card">
  <h1>📜 ہسٹری</h1>

  <div class="filters">
    <button class="on" id="fNews" onclick="setF('all')">📋 سب</button>
    <button id="fA" onclick="setF('news')">📰 News</button>
    <button id="fB" onclick="setF('alert')">🚨 Alert</button>
  </div>

  <div class="list" id="list">
    <div class="empty"><span class="ic">📋</span>کوئی ریکارڈ نہیں</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="sNews">0</div><div class="l">📰 News</div></div>
    <div class="stat"><div class="n" id="sAlert">0</div><div class="l">🚨 Alert</div></div>
    <div class="stat"><div class="n" id="sComp">0</div><div class="l">⏰ Time</div></div>
  </div>
</div>

<script>
const KEY = 'sec10_news_alerts_data';
const $ = id => document.getElementById(id);
let filter = 'all';

function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { return []; } }
function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}
function fmt(ts) {
  const d = new Date(ts);
  return String(d.getDate()).padStart(2, '0') + '/' +
         String(d.getMonth() + 1).padStart(2, '0') + '/' +
         d.getFullYear() + ' — ' +
         String(d.getHours()).padStart(2, '0') + ':' +
         String(d.getMinutes()).padStart(2, '0');
}

window.setF = function(f) {
  filter = f;
  $('fNews').classList.toggle('on', f === 'all');
  $('fA').classList.toggle('on', f === 'news');
  $('fB').classList.toggle('on', f === 'alert');
  render();
};

function render() {
  const all = load().sort((a, b) => b.timestamp - a.timestamp);

  $('sNews').textContent = all.filter(x => x.type === 'news').length;
  $('sAlert').textContent = all.filter(x => x.type === 'alert').length;
  $('sComp').textContent = all.filter(x => x.type === 'complaint').length;

  let items = all;
  if (filter === 'news') items = all.filter(x => x.type === 'news');
  else if (filter === 'alert') items = all.filter(x => x.type === 'alert' || x.type === 'complaint');

  const list = $('list');
  if (!items.length) {
    list.innerHTML = '<div class="empty"><span class="ic">📋</span>اس فلٹر میں کوئی ریکارڈ نہیں</div>';
    return;
  }

  list.innerHTML = items.map(it => {
    const cls = it.type;
    const label = it.type === 'news' ? '📰 نیوز' :
                  it.type === 'alert' ? '🚨 الرٹ' : '⏰ ٹائم';
    const timeBadge = (it.type === 'complaint' && it.fireTime)
      ? '<span class="time-badge">⏰ ' + esc(it.fireTime) + '</span>' : '';
    return '<div class="item ' + cls + '">' +
      '<div class="row1">' +
        '<span class="badge ' + cls + '">' + label + '</span>' +
        timeBadge +
        '<span class="date">' + fmt(it.timestamp) + '</span>' +
      '</div>' +
      '<div class="content">' + esc(it.content) + '</div>' +
    '</div>';
  }).join('');
}

render();
setInterval(render, 2000);
window.addEventListener('storage', e => { if (e.key === KEY) render(); });
</script>

</body>
</html>
